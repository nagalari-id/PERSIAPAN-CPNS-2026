..", "o": {"a": "Meminta semua anggota tim untuk bekerja secara individual agar dapat lebih fokus pada tugas masing-masing", "b": "Membagi tim menjadi kelompok-kelompok kecil berdasarkan keahlian masing-masing anggota tim dengan pembagian tugas yang adil", "c": "Mengadakan pertemuan tim untuk membahas preferensi kerja masing-masing anggota, lalu merancang strategi kerja yang sesuai", "d": "Menunjuk seorang pemimpin tim untuk setiap kelompok kecil agar pekerjaan dapat terkoordinasi dan terpantau dengan baik", "e": "Menerapkan sistem penilaian kinerja individu yang ketat untuk memotivasi anggota tim agar mereka bisa bekerja lebih produktif dan mandiri"}, "ans": "c", "ex": "Dengan diskusi, Andi dapat memahami kebutuhan dan preferensi mereka, serta merancang strategi kerja yang sesuai.", "sc": {"a": 1, "b": 3, "c": 5, "d": 4, "e": 2}}, {"n": 89, "sec": "TKP", "t": "Pelayanan Publik", "q": "Ratna, seorang pelatih tim renang, mendapati adanya keluhan dari orang tua atlet tentang kurangnya transparansi dan komunikasi selama program latihan. Orang tua tersebut merasa tidak terlibat dalam perkembangan anak mereka dan merasa kecewa dengan kurangnya informasi. Sikap Ratna seharusnya dalam menanggapi situasi tersebut adalah ....", "o": {"a": "Melanjutkan program latihan dan menganggap keluhan orang tua tidak relevan dengan pembinaan atlet", "b": "Menyampaikan kritik terhadap pengetahuan orang tua tentang program latihan renang dan menyatakan bahwa mereka tidak memahami sepenuhnya perjalanan atlet dalam mencapai prestasi", "c": "Menerima keluhan, meminta maaf, menjelaskan rencana perbaikan, dan meningkatkan komunikasi di masa depan", "d": "Memberikan jawaban defensif dan membela diri terhadap keluhan yang diterima dengan anggapan bahwa program latihan sudah optimal", "e": "Membantah keluhan mereka dan mempertahankan metode latihan yang telah dilakukan selama ini serta menegaskan bahwa pendekatan pelatihan tidak perlu diubah karena sudah terbukti berhasil"}, "ans": "c", "ex": "Opsi C mencerminkan sikap responsif, terbuka, dan proaktif dari seorang pelatih dalam menanggapi keluhan orang tua. Pendekatan tersebut tidak hanya memperbaiki ketidakpuasan yang dirasakan oleh orang tua, tetapi juga membangun kepercayaan dan keterbukaan dalam hubungan antara pelatih, atlet, dan orang tua, yang merupakan faktor penting dalam pembinaan dan pengembangan prestasi atlet.", "sc": {"a": 1, "b": 2, "c": 5, "d": 3, "e": 4}}, {"n": 90, "sec": "TKP", "q": "Bagaimana Anda mengatasi tumpukan kertas bekas di kantor?", "o": {"a": "Menggunakannya untuk keperluan internal", "b": "Membakarnya di tempat aman", "c": "Menyerahkan ke pihak yang dapat mendaur ulang", "d": "Membuangnya ke tempat sampah biasa", "e": "Menyimpan untuk penggunaan mendatang"}, "ans": "c", "ex": "Menyerahkan kertas bekas untuk didaur ulang adalah langkah terbaik untuk mengelola limbah dengan cara yang bertanggung jawab.", "sc": {"a": 4, "b": 1, "c": 5, "d": 2, "e": 3}}, {"n": 91, "sec": "TKP", "t": "Teknologi Informasi dan Komunikasi", "q": "Rini, seorang pekerja di perusahaan teknologi, menerima notifikasi bahwa sistem operasional perangkat lunak yang digunakan di departemennya telah diperbarui. Rini merasa canggung dan merasa tidak sepenuhnya memahami perubahan-perubahan baru dalam sistem tersebut. Rini tahu bahwa pembaruan tersebut penting untuk meningkatkan keamanan dan kinerja. Akan tetapi, dirinya tidak yakin bagaimana mengatasi tantangan yang muncul akibat pembaruan tersebut. Sikap yang dianggap paling tepat dari Rini adalah ....", "o": {"a": "Merencanakan waktu untuk mengikuti pelatihan internal yang disediakan oleh perusahaan terkait pembaruan perangkat lunak tersebut", "b": "Menyerahkan tanggung jawab untuk memahami pembaruan kepada rekan kerja yang dianggap memiliki pemahaman yang lebih baik", "c": "Mempertimbangkan untuk meminta divisi lain yang sudah terbiasa dengan sistem baru untuk memberikan bimbingan dan panduan", "d": "Memilih untuk tetap menggunakan versi lama karena merasa sistem sebelumnya sudah mencukupi kebutuhannya", "e": "Mencari panduan daring atau sumber daya lainnya untuk memahami cara melakukan pembaruan perangkat lunak secara otodidak"}, "ans": "a", "ex": "Dengan mengikuti pelatihan internal perusahaan, Rini dapat memahami dengan lebih baik perubahan dalam sistem dan bisa meningkatkan keterampilannya secara terarah.", "sc": {"a": 5, "b": 2, "c": 3, "d": 1, "e": 4}}, {"n": 92, "sec": "TKP", "t": "", "q": "Anda akan dimutasi ke anak perusahaan diluar kota. Setelah mencari informasi, anda baru tahu jika ternyata di unit tersebut memiliki beberapa aturan dan budaya kerja yang sedikit bertentangan dengan kepercayaan anda, atasan baru anda tidak mengetahui hal tersebut dan anda tidak dapat mengajukan permintaan mutasi ke unit yang lain. Yang akan anda lakukan ….", "o": {"a": "Bingung harus mengikuti aturan baru atau mengikuti kepercayaan Anda", "b": "Memberikan penjelasan dan pengertian kepada atasan unit baru, jika ada beberapa hal yang kurang sesuai dengan kepercayaan Anda", "c": "Dengan terpaksa mengikuti aturan yang ada di unit baru", "d": "Ikut serta karena atasan memintanya", "e": "Tidak mengikutinya karena sudah jelas tidak sesuai dengan kepercayaan anda"}, "ans": "b", "ex": "", "sc": {"a": 1, "b": 5, "c": 3, "d": 2, "e": 4}}, {"n": 93, "sec": "TKP", "t": "Jejaring Kerja", "q": "Suatu hari, dalam rapat tim proyek, terungkap bahwa ada kesalahan besar dalam penyusunan laporan akhir proyek yang seharusnya telah selesai minggu lalu. Semua anggota tim terlibat dalam penyusunan laporan tersebut. Namun, setelah dilakukan investigasi, diketahui bahwa salah satu anggota tim telah menyampaikan informasi yang salah kepada semua anggota tim. Sikap Anda sebagai anggota tim adalah ....", "o": {"a": "Menyarankan agar ia menyelesaikan laporan tersebut karena dirinya telah berbuat salah dalam menyampaikan informasi", "b": "Mengumpulkan anggota tim untuk membahas bersama penyebab kesalahan dan mencari solusi bersama-sama", "c": "Meminta maaf secara pribadi kepada atasan karena laporan terlambat akibat anggota tim yang telah memberikan informasi tidak benar", "d": "Membuat laporan sendiri dan mengabaikan kesalahan yang terjadi di dalam tim karena Anda hanya menginginkan bahwa laporan selesai tepat waktu", "e": "Meminta atasan untuk memberikan teguran kepada anggota tim yang memberikan informasi salah sebagai pelajaran bagi anggota tim yang lain"}, "ans": "b", "ex": "Jawaban yang paling tepat adalah B, karena mengumpulkan anggota tim untuk membahas bersama penyebab kesalahan dan mencari solusi bersama-sama mencerminkan sikap tanggung jawab dan kolaboratif dalam menyelesaikan masalah.", "sc": {"a": 2, "b": 5, "c": 3, "d": 1, "e": 4}}, {"n": 94, "sec": "TKP", "t": "Sosial Budaya", "q": "Bu Anna yang saat ini merupakan seorang warga di Desa Permai berencana untuk pergi liburan ke luar kota bersama beberapa teman akrabnya sekaligus warga di desa tersebut. Mereka berjanji untuk bertemu di depan kantor kepala desa pada pagi hari tepatnya pukul 08.00 WIB. Jika Bu Anna sudah menunggu di lokasi tersebut hingga pukul 08.15 WIB dan warga lain belum juga berkumpul, maka tindakan Bu Anna seharusnya adalah ....", "o": {"a": "Tetap menunggu dengan penuh kesabaran di depan kantor kepala desa hingga warga lainnya datang", "b": "Segera berangkat ke luar kota sendirian karena kedisiplinan adalah hal yang utama", "c": "Mengirim pesan singkat ke grup WA kelompoknya untuk meminta penjelasan tentang keterlambatan mereka", "d": "Menelepon warga-warga tersebut untuk menanyakan keberadaan mereka dan kejelasan rencana bepergian bersama tersebut", "e": "Meninggalkan kantor kepala desa, memutuskan untuk tidak pergi ke luar kota, dan keluar dari grup WA bersama"}, "ans": "d", "ex": "Melalui panggilan telepon, Bu Anna dapat memperoleh informasi langsung tentang alasan keterlambatan teman-temannya dan dapat merencanakan langkah selanjutnya dengan lebih baik. Tindakan ini mencerminkan pendekatan yang lebih efektif dalam menyelesaikan masalah daripada sekadar menunggu tanpa tindakan atau meninggalkan tempat dengan perasaan kecewa.", "sc": {"a": 2, "b": 3, "c": 4, "d": 5, "e": 1}}, {"n": 95, "sec": "TKP", "t": "Teknologi Informasi dan Komunikasi", "q": "Sebagai guru, Pak Dhedi ingin memanfaatkan teknologi pembelajaran di kelasnya. Saat ini, para siswa terlihat kurang antusias dalam mengikuti pelajaran yang bersifat teoritis. Jika Pak Dhedi memiliki akses ke berbagai perangkat teknologi seperti komputer, proyektor, dan aplikasi pembelajaran daring, maka sikap Pak Dhedi seharusnya adalah ....", "o": {"a": "Meminta semua siswa untuk menggunakan aplikasi pembelajaran <i>online</i> secara mandiri agar mereka bisa belajar dengan cara yang mereka sukai", "b": "Menggunakan proyektor untuk menampilkan materi berupa teks dari buku secara langsung ke layar, agar siswa dapat melihatnya dengan lebih jelas dan memahami isinya", "c": "Menggunakan aplikasi pembelajaran interaktif yang sesuai dengan mata pelajaran untuk membantu siswa memahami konsep secara visual dan praktis", "d": "Mengadakan kuis evaluasi <i>online</i> secara berkala dengan aplikasi CAT dan memberikan tugas lebih sering kepada siswa untuk meningkatkan disiplin", "e": "Fokus pada metode pengajaran tradisional, seperti ceramah dan diskusi langsung, karena siswa terlihat lebih terlibat ketika diajar secara konvensional"}, "ans": "c", "ex": "Penggunaan aplikasi interaktif yang relevan membantu siswa memahami konsep secara visual dan praktis sehingga meningkatkan antusiasme belajar.", "sc": {"a": 1, "b": 2, "c": 5, "d": 4, "e": 3}}, {"n": 96, "sec": "TKP", "t": "", "q": "Sintia adalah teman kamar satu kos anda. Suatu malam, ia terlihat sedang membaca sebuah diskusi yang seolah-olah terkesan meragukan ideologi negara. Anda, mulai curiga jika sintia bisa saja sedang mencari informasi tertentu mengenai hal-hal yang tidak sesuai dengan ideologi negara. Sebagai temannya, anda akan ….", "o": {"a": "Memberitahunya agar berhati-hati dalam membaca suatu berita", "b": "Menerangkan kepadanya bahwa hal itu salah dan kalau diteruskan dapat menyebabkannya menjadi orang yang radikal", "c": "Tidak memperdulikannya karena Sintia hanya sekadar membaca dan mempelajarinya", "d": "Mengingatkan Sintia untuk tidak lewat batas dalam artian tidak akan ikut dalam kegiatan diskusi tersebut", "e": "Langsung menasihati Sintia bahwa hal itu salah dan tidak diperkenankan untuk dilakukan"}, "ans": "d", "ex": "", "sc": {"a": 2, "b": 3, "c": 1, "d": 5, "e": 4}}, {"n": 97, "sec": "TKP", "t": "Jejaring Kerja", "q": "Dian, seorang manajer proyek di sebuah perusahaan teknologi, menghadapi situasi sulit setelah timnya mengalami kegagalan besar dalam mengimplementasikan proyek terbaru. Beberapa anggota tim merasa frustrasi dan kecewa, sedangkan beberapa pihak terkait proyek juga mengekspresikan ketidakpuasan mereka terhadap hasil akhir. Sikap Dian seharusnya adalah ....", "o": {"a": "Menyelenggarakan rapat darurat dengan tim dan memberikan peringatan kepada anggota yang dianggap bertanggung jawab atas kegagalan proyek", "b": "Menghindari konflik dan mencoba mengalihkan tanggung jawab kepada faktor eksternal untuk mengurangi tekanan kepada setiap anggota tim", "c": "Meninggalkan proyek untuk sementara waktu dan membiarkan tim secara mandiri menangani dampak kegagalan tersebut", "d": "Secara sukarela dan rendah hati mengusulkan pengunduran diri dari jabatan karena merasa tidak mampu memimpin tim dengan baik", "e": "Melakukan evaluasi menyeluruh untuk menemukan pemecahan masalah yang bisa diterapkan pada proyek yang akan datang"}, "ans": "e", "ex": "Melakukan evaluasi menyeluruh terhadap kegagalan proyek, mencari tahu penyebabnya, dan mengidentifikasi solusi untuk mencegah kegagalan di masa depan memungkinkan manajer, dalam hal ini Dian, untuk memahami aspek-aspek kritis yang menyebabkan ketidakberhasilan proyek. Dengan pemahaman tersebut, tim dapat mengambil tindakan korektif yang tepat dan mengimplementasikan perubahan yang diperlukan untuk meningkatkan kinerja di masa depan.", "sc": {"a": 4, "b": 2, "c": 3, "d": 1, "e": 5}}, {"n": 98, "sec": "TKP", "t": "Jejaring Kerja", "q": "Sebagai seorang pemimpin proyek, Rani mengamati bahwa salah satu anggota timnya, Budi, seringkali menyelesaikan tugasnya tepat waktu, namun kualitasnya kurang memuaskan. Sikap Rani seharusnya adalah ....", "o": {"a": "Memarahi Budi karena tidak bisa bekerja dengan baik dan meminta Budi untuk meningkatkan kualitas pekerjaannya", "b": "Mengirim Budi untuk mengikuti pelatihan tambahan agar meningkatkan kemampuannya", "c": "Membicarakan masalah tersebut secara pribadi dengan Budi, mencari tahu akar masalahnya, dan bersama-sama mencari solusi", "d": "Mengganti tugas Budi dengan tugas yang lebih sederhana agar ia tidak merasa terbebani", "e": "Meminta anggota tim lain untuk membantu Budi menyelesaikan tugasnya agar kualitas pekerjaan menjadi lebih baik"}, "ans": "c", "ex": "Membicarakan masalah secara pribadi adalah pendekatan yang paling tepat. Dengan mencari tahu akar masalahnya, Rani dapat memberikan solusi yang tepat dan membantu Budi untuk meningkatkan kualitas pekerjaannya.", "sc": {"a": 1, "b": 4, "c": 5, "d": 2, "e": 3}}, {"n": 99, "sec": "TKP", "t": "", "q": "Pada suatu ketika, anda mendapati salah seorang teman kerja anda berubah menjadi lebih pendiam, pasif dan tertutup. Ia menjadi enggan untuk berinteraksi dengan teman satu kerjaan. Ia mulai berfikir jika semua orang yang tidak sesuai dengan alirannya adalah golongan kafir yang harus dijauhi. Menghadapi teman anda yang tiba-tiba mengalami perubahan sikap tersebut sikap anda ….", "o": {"a": "Membiarkannya toh itu urusannya", "b": "Tidak melakukan apa-apa selama ia tidak mengganggu Anda", "c": "Mengajaknya berdiskusi dan meluruskan jika persepsinya salah", "d": "Melaporkan kepada atasan", "e": "Melaporkan kepada pihak berwajib"}, "ans": "d", "ex": "Karena berada di lingkungan tempat kerja, maka sikap yang tepat ialah melaporkan kepada atasan, agar atasan mengambil tindakan sebelum mempengaruhi dan mengganggu karyawan lain", "sc": {"a": 3, "b": 2, "c": 4, "d": 5, "e": 1}}, {"n": 100, "sec": "TKP", "t": "", "q": "Sebuah proyek pembangunan jalan raya di suatu kota dihadapi dengan resistensi dari sebagian warga yang merasa tidak dilibatkan dalam proses pengambilan keputusan. Mereka merasa bahwa proyek ini dapat berdampak buruk pada lingkungan dan kehidupan sehari-hari mereka. Bagaimana pemerintah setempat sebaiknya mengatasi ketidakpuasan ini dan meningkatkan keterlibatan masyarakat dalam proyek infrastruktur tersebut?", "o": {"a": "Mengabaikan keluhan warga dan melanjutkan proyek sesuai rencana semula.", "b": "Membentuk kelompok diskusi dengan warga setempat untuk mendengarkan kekhawatiran mereka dan mencari solusi bersama.", "c": "Memberlakukan tindakan keras terhadap warga yang menyuarakan ketidakpuasan mereka.", "d": "Menghentikan proyek tanpa mempertimbangkan konsekuensi dan kebutuhan infrastruktur.", "e": "Menggelar rapat publik untuk memberikan informasi dan mendengarkan pandangan serta saran warga sebelum melanjutkan proyek."}, "ans": "e", "ex": "", "sc": {"a": 2, "b": 4, "c": 1, "d": 3, "e": 5}}, {"n": 101, "sec": "TKP", "t": "Sosial Budaya", "q": "Anda merupakan salah satu karyawan senior yang menghadiri kegiatan kekeluargaan kantor di vila perusahaan. Namun, setelah tiba, Anda melihat pembagian kamar yang terasa tidak adil. Karyawan senior ditempatkan pada kamar-kamar yang memiliki fasilitas lengkap, sementara karyawan baru ditempatkan pada kamar komunal dengan fasilitas yang kurang memadai. Sebagai karyawan senior, sikap Anda untuk mengatasi kesenjangan tersebut adalah ....", "o": {"a": "Menghentikan kegiatan tersebut pada tahun berikutnya agar kesenjangan seperti yang sama tidak terulang kembali", "b": "Menyarankan untuk melakukan permainan tertentu untuk menentukan pembagian kamar yang adil sesuai dengan hasil dari permainan tersebut", "c": "Memberikan kamar yang Anda tempati untuk junior-junior yang kebagian kamar yang kurang layak", "d": "Membenarkan bahwa senior lebih berhak mendapatkan fasilitas yang lebih baik karena pengalaman yang dimiliki lebih banyak", "e": "Mengumpulkan panitia kegiatan untuk mengatur ulang pembagian kamar agar tidak terjadi kesenjangan yang menciptakan ketidaknyamanan di antara karyawan"}, "ans": "b", "ex": "Opsi B akan membantu menciptakan suasana keakraban yang adil dan menyenangkan untuk semua peserta tanpa membeda-bedakan senioritas.", "sc": {"a": 1, "b": 5, "c": 3, "d": 2, "e": 4}}, {"n": 102, "sec": "TKP", "t": "Anti-Radikalisme", "q": "Sebuah unjuk rasa mahasiswa menentang kenaikan biaya kuliah sedang berlangsung damai di kampus. Namun, di tengah aksi, sekelompok orang tak dikenal yang memiliki pandangan radikal tiba-tiba bergabung dan mulai memprovokasi peserta aksi dengan menyerukan tindakan kekerasan terhadap pihak universitas. Sebagai kepala keamanan kampus yang bertugas menjaga ketertiban, sikap Anda adalah ....", "o": {"a": "Meningkatkan jumlah petugas keamanan di sekitar lokasi unjuk rasa dan melakukan patroli untuk mencegah potensi tindakan anarkis", "b": "Membubarkan paksa seluruh aksi unjuk rasa untuk mencegah terjadinya kekerasan yang lebih besar", "c": "Mengisolasi kelompok radikal dan menangkap para provokator, kemudian melanjutkan unjuk rasa secara damai", "d": "Membuka dialog dengan perwakilan mahasiswa dan kelompok radikal secara terpisah untuk mencari solusi damai", "e": "Mengalihkan perhatian mahasiswa dengan isu lain yang tidak terkait, seperti program beasiswa atau fasilitas kampus baru"}, "ans": "c", "ex": "Mengisolasi kelompok radikal dan menangkap provokator adalah langkah paling efektif karena dapat mengatasi sumber masalah tanpa membatalkan hak mahasiswa untuk menyampaikan aspirasi secara damai.", "sc": {"a": 4, "b": 2, "c": 5, "d": 3, "e": 1}}, {"n": 103, "sec": "TKP", "t": "", "q": "Beberapa minggu terakhir, kerap kali terjadi konflik antar suku yaitu antara suku dalam dengan suku perbatasan. Konflik bermula saat suku dalam secara tidak sengaja merusak sesembahan milik suku perbatasan. Mengetahui hal tersebut, suku perbatasan sangat marah. Pertikaian dan peperangan antar suku pun terjadi. Upaya pemerintah yang tepat dalam menghadapi pertikaian tersebut ialah ….", "o": {"a": "Memupuk kesadaran akan toleransi antar suku", "b": "Mengadakan pertemuan untuk proses mediasi antara dua suku", "c": "Memberikan jaminan hukum yang pasti", "d": "Mencegah pertikaian kedua suku", "e": "Menangkap pelaku yang menjadi penyebab pertikaian"}, "ans": "b", "ex": "Karena konflik tengah berlangsung, salah satu upaya yang dapat pemerintah lakukan adalah dengan mengadakan pertemuan untuk proses mediasi antar kedua suku, agar kekacauan dan keributan tidak semakin parah dan meluas", "sc": {"a": 4, "b": 5, "c": 3, "d": 2, "e": 1}}, {"n": 104, "sec": "TKP", "t": "Sosial Budaya", "q": "Sebuah lembaga amal berupaya meningkatkan kesadaran masyarakat tentang isu lingkungan dan keberlanjutan. Upaya lembaga tersebut dalam memastikan bahwa pesan mereka menjangkau berbagai lapisan masyarakat adalah ....", "o": {"a": "Memilih berkomunikasi dengan kelompok yang sudah terlibat aktif dalam kampanye lingkungan", "b": "Menyebarluaskan pesan mereka melalui saluran televisi nasional", "c": "Melakukan pertemuan terbuka dengan komunitas lokal untuk mendengarkan masukan dan kekhawatiran mereka terkait isu lingkungan", "d": "Mengandalkan selebriti terkenal untuk menyuarakan pesan mereka tanpa mempertimbangkan keberagaman dan konteks sosial", "e": "Menyebarluaskan pesan secara seragam tanpa mempertimbangkan kekayaan budaya dan konteks lokal masing-masing komunitas"}, "ans": "c", "ex": "Melibatkan masyarakat secara langsung membantu memahami perspektif mereka dan menciptakan kampanye yang lebih relevan dengan konteks budaya lokal.", "sc": {"a": 2, "b": 1, "c": 5, "d": 3, "e": 4}}, {"n": 105, "sec": "TKP", "t": "", "q": "Ketua tim kerja mengalami kecelakaan dan dipastikan akan cuti untuk waktu yang cukup lama. Untuk memastikan tim tetap dapat bekerja secara optimal, sebagai pegawai yang paling senior maka saya perlu melakukan;", "o": {"a": "Mengambil alih posisi ketua.", "b": "Musyawarah darurat untuk menunjuk ketua tim sementara.", "c": "Melakukan pemilihan ketua tim yang baru.", "d": "Membuat kesepakatan pembagian beban kerja.", "e": "Menunjuk rekan dengan kinerja terbaik untuk menggantikan ketua sementara"}, "ans": "d", "ex": "Ini adalah langkah yang sangat penting untuk memastikan bahwa setiap anggota tim tahu tanggung jawab mereka dan dapat membantu mencegah kelebihan beban pada anggota tertentu.", "sc": {"a": 3, "b": 4, "c": 1, "d": 5, "e": 2}}, {"n": 106, "sec": "TKP", "t": "Jejaring Kerja", "q": "Sebagai seorang supervisor, Anda sedang menjalin kerja sama dengan mitra baru. Mitra tersebut menawarkan ide-ide yang berbeda dari cara kerja tim Anda saat ini. Tim Anda merasa ragu dan enggan menerima perubahan tersebut karena khawatir akan menurunkan efisiensi kerja. Namun, Anda menyadari bahwa ide dari mitra tersebut bisa membantu meningkatkan kualitas kerja di masa depan. Sikap Anda adalah ....", "o": {"a": "Mengajak mitra berdiskusi lebih dalam dan menjembatani komunikasi antara tim dan mitra agar keduanya merasa nyaman dengan perubahan", "b": "Menolak ide dari mitra karena tim merasa tidak nyaman dengan perubahan dan memilih untuk tetap dengan cara kerja yang sudah terbukti berhasil", "c": "Mendengarkan penjelasan mitra dan meminta tim untuk mencoba menerapkan idenya sambil tetap memantau kinerja tim", "d": "Membujuk tim untuk menerima ide dari mitra dan memaksakan penerapannya karena Anda yakin akan manfaatnya", "e": "Menunda keputusan sampai semua anggota tim setuju dengan penerapan ide baru dari mitra tersebut"}, "ans": "a", "ex": "Diskusi yang terbuka dan berusaha menjembatani kepentingan kedua belah pihak membantu menciptakan kerja sama yang harmonis dan produktif, serta memastikan semua pihak merasa dihargai.", "sc": {"a": 5, "b": 1, "c": 4, "d": 2, "e": 3}}, {"n": 107, "sec": "TKP", "t": "", "q": "Serangan cyber mengakibatkan sistem sebuah marketplace online mengalami gangguan hingga beberapa hari. Kelompok yang melakukan serangan mengaku telah berhasil mencuri data pribadi pengguna. Sebagai pimpinan marketplace saya akan;", "o": {"a": "Mengevaluasi sistem keamanan agar serangan serupa tidak terjadi.", "b": "Meminta maaf kepada para pengguna, menginformasikan data apa saja yang telah dicuri dan merekomendasikan pengguna memperbaharui data pribadi.", "c": "Menyembunyikan dan tidak mengakui bahwa data telah dicuri.", "d": "Menjelaskan kepada pengguna bahwa gangguan terjadi karena masalah teknis.", "e": "Berkomunikasi dengan penyerang dan meminta data dikembalikan."}, "ans": "b", "ex": "", "sc": {"a": 4, "b": 5, "c": 1, "d": 2, "e": 3}}, {"n": 108, "sec": "TKP", "t": "Teknologi Informasi dan Komunikasi", "q": "Anda adalah seorang pemimpin di sebuah perusahaan yang tengah menghadapi dampak positif dan negatif dari perkembangan teknologi informasi. Saat ini, Anda melihat bahwa penggunaan teknologi informasi oleh karyawan dapat memberikan manfaat besar dalam mempermudah penyampaian informasi di perusahaan, tetapi juga membawa risiko penyalahgunaan yang dapat merugikan perusahaan. Sikap Anda adalah ....", "o": {"a": "Membuat kebijakan dan batasan-batasan yang jelas terkait penggunaan teknologi informasi agar tidak disalahgunakan, kemudian menerapkan aturan tersebut secara ketat di perusahaan", "b": "Melakukan penelitian mendalam tentang cara penggunaan teknologi informasi, kemudian mengadakan pelatihan untuk seluruh karyawan agar dapat memahami dan menggunakan teknologi tersebut dengan etika yang benar", "c": "Mempelajari teknologi informasi secara mendalam dan menciptakan sistem keamanan yang kuat untuk melindungi perusahaan dari potensi penyalahgunaan, lalu menerapkan solusi tersebut", "d": "Akan mempelajari, membuat kebijakan, dan batasan-batasan terkait penggunaan teknologi informasi, serta melakukan evaluasi berkala untuk memastikan kebijakan tersebut tetap relevan", "e": "Mengimplementasikan teknologi informasi di perusahaan dengan tetap mempertimbangkan keamanan dan etika, sehingga dapat memudahkan komunikasi dan pertukaran informasi antardepartemen"}, "ans": "a", "ex": "Topik yang diangkat adalah kemampuan beradaptasi dengan perkembangan teknologi informasi dan perlunya mengatasi potensi penyalahgunaan. Opsi A menjadi pilihan terbaik karena mencakup pembuatan kebijakan dan batasan yang jelas serta penerapan aturan tersebut secara ketat, sehingga dapat menghindari risiko penyalahgunaan.", "sc": {"a": 5, "b": 4, "c": 2, "d": 3, "e": 1}}, {"n": 109, "sec": "TKP", "t": "", "q": "Dalam suatu kegiatan survei di Instansi saya, saya diberi tanggung jawab untuk memimpin tim di lapangan. Setelah tim saya memberikan laporan kerja akhir, ternyata kinerja kelompok kami sangat mengecewakan. Setelah mencari tahu lebih lanjut, ternyata situasi tersebut disebabkan oleh ketidakmampuan saya sebagai pemimpin tim untuk memberikan instruksi dengan jelas. Dalam menghadapi hal ini, sikap yang saya tunjukkan adalah...", "o": {"a": "Saya tidak merasa dapat disalahkan oleh siapapun dengan alasan apapun.", "b": "Saya merasa bersalah dan mengakui tanggung jawab, langkah yang saya ambil melibatkan evaluasi kinerja seluruh anggota tim, termasuk diri saya.", "c": "Situasi ini juga terjadi karena anggota tim enggan bertanya kepada saya ketika ada instruksi yang kurang dipahami, sehingga tidak sepenuhnya merupakan kesalahan saya.", "d": "Saya meminta maaf kepada anggota tim dan secara terbuka mengakui kesalahan saya.", "e": "Melakukan introspeksi diri tanpa memberi tahu anggota tim bahwa ini merupakan kesalahan saya."}, "ans": "d", "ex": "Pilihan D menjadi pilihan terbaik dalam situasi ini karena mencerminkan sikap tanggung jawab dan profesionalisme. Meminta maaf kepada anggota tim dan mengakui kesalahan sebagai pemimpin menunjukkan integritas dan kesiapan untuk belajar dan berkembang.", "sc": {"a": 1, "b": 4, "c": 2, "d": 5, "e": 3}}, {"n": 110, "sec": "TKP", "t": "Anti-Radikalisme", "q": "Sebuah organisasi mahasiswa mengadakan pelatihan kesadaran lingkungan untuk meningkatkan pemahaman anggotanya tentang pentingnya pelestarian alam. Salah satu anggota, Rizky, tidak sepenuhnya memahami konsep pelestarian alam dan merasa kurang tertarik selama pelatihan. Ia cenderung bersikap sinis dan tidak aktif saat rapat berlangsung. Sikap terbaik yang dapat dilakukan oleh Rizky adalah ....", "o": {"a": "Memilih untuk tidak mengikuti aktivitas tersebut karena faktor daya tarik rendah", "b": "Bertanya kepada pemateri atau rekan dalam organisasi tersebut tentang topik yang tidak dimengerti", "c": "Melakukan kegiatan lain selama pelatihan agar tidak merasa bosan", "d": "Ikut terjun ke pelatihan dengan harapan akan memperoleh rekan-rekan baru yang sefrekuensi", "e": "Menghubungi pimpinan organisasi dan mengutarakan isi hati serta berharap dirinya akan memakluminya"}, "ans": "b", "ex": "Rizky sebaiknya mengambil sikap yang konstruktif selama pelatihan kesadaran lingkungan. Opsi B merupakan langkah yang tepat untuk meningkatkan pemahamannya secara aktif.", "sc": {"a": 2, "b": 5, "c": 4, "d": 1, "e": 3}}]}, {"id": 3, "n": "Paket Soal 3", "qs": [{"n": 1, "sec": "TWK", "t": "", "q": "B.J. Habibie menunjukkan sikap bela negara dengan mengembangkan industri pesawat terbang di Indonesia melalui PT Dirgantara Indonesia (dahulu IPTN). Usahanya ini bertujuan untuk memajukan teknologi dan kemandirian bangsa dalam bidang industri penerbangan. Sikap bela negara tersebut dapat diteladani dalam kehidupan sehari-hari yaitu ....", "o": {"a": "Menggunakan maskapai penerbangan lokal", "b": "Membuat perusahaan penerbangan lokal", "c": "Sikap rela berkorban demi bangsa dan negara", "d": "Sikap cinta kepada tanah air", "e": "Mengembangkan keterampilan dan pengetahuan untuk kemajuan bangsa"}, "ans": "e", "ex": "Sikap bela negara yang ditunjukkan oleh B.J. Habibie dapat diteladani dalam kehidupan sehari-hari dengan mengembangkan keterampilan dan pengetahuan untuk kemajuan bangsa. Seperti Habibie yang terus belajar dan mengembangkan ilmunya di bidang teknologi, kita juga bisa berusaha untuk meningkatkan keterampilan dan pengetahuan kita dalam bidang yang kita tekuni. Ini bisa dilakukan melalui pendidikan formal, kursus, atau belajar mandiri. Dengan demikian, kita dapat berkontribusi pada kemajuan dan kemandirian bangsa dalam berbagai bidang."}, {"n": 2, "sec": "TWK", "t": "Bahasa Indonesia", "q": "Di bawah ini adalah penulisan serapan kata dari bahasa asing yang tidak tepat, <b>kecuali</b> ....", "o": {"a": "Penceramah kali ini adalah ustaz yang sangat terkenal", "b": "Keran air itu tiba-tiba rusak ketika ia sedang berwudhu", "c": "Bowo asik berdansa bersama teman-temannya", "d": "Wah, mobil itu bisa berjalan automatis", "e": "Setidaknya ia sudah memiliki itikad baik padaku"}, "ans": "a", "ex": "1. Kata <i>ustaz</i> diserap dari kata <i>ustāż</i> (huruf akhir adalah <i>zal</i>) dalam bahasa Arab, sehingga penulisannya sudah baku. 2. Opsi B salah, karena serapan yang benar adalah <i>wudu</i>. Kata asalnya adalah <i>wuḍū'</i> yang memiliki huruf hamzah di akhir kata, tetapi dihilangkan dan menjadi <i>wudu</i>. 3. Opsi C salah, karena serapan yang benar adalah <i>asyik</i>. Berasal dari kata <i>'āsyiq</i> dalam bahasa Arab yang menggunakan huruf <i>syin</i>, kata tersebut diserap ke dalam bahasa Indonesia menjadi <i>asyik</i>. 4. Opsi D salah, karena khusus untuk kata <i>otomatis</i>, unsur <i>au</i> dari kata bahasa Inggris <i>automatic</i> berubah menjadi <i>o</i>. Penulisan serapan yang benar adalah <i>otomatis</i>. 5. Opsi E salah, karena serapan yang benar adalah <i>iktikad</i>. Asalnya adalah kata <i>i'tiqād</i> dari bahasa Arab, yang kemudian diserap dan disesuaikan dengan kaidah bahasa Indonesia menjadi <i>iktikad</i>."}, {"n": 3, "sec": "TWK", "t": "", "q": "Paragraf di atas merupakan jenis paragraf ....", "o": {"a": "Argumentatif", "b": "Ekspositif", "c": "Persuasif", "d": "Deskriptif", "e": "Naratif"}, "ans": "b", "ex": "Paragraf ekspositif adalah jenis paragraf yang menampilkan kejadian suatu peristiwa dengan tujuan menceritakan kembali atau <i>reteller</i>. Teknik menulis paragraf ini yakni menyajikan peristiwa atau objek dengan cara menjelaskan, menerangkan, dan memberitahukan informasi tertentu agar pembaca mengetahuinya. Jenis paragraf ini mengandung unsur 5W+1H (<i>What, Who, When, Why,</i> dan <i>How</i>). Gaya penulisan pada jenis paragraf ekspositif bersifat informatif.", "p": "<i>\"Indonesia adalah negara kepulauan terbesar di dunia yang memiliki keanekaragaman hayati yang luar biasa. Dari Sabang sampai Merauke, Indonesia memiliki berbagai jenis flora dan fauna yang tidak ditemukan di tempat lain. Namun, keanekaragaman hayati ini terancam oleh berbagai faktor, seperti deforestasi, perburuan liar, dan perubahan iklim. Deforestasi yang tidak terkendali menyebabkan hilangnya habitat alami bagi banyak spesies. Perburuan liar juga menjadi ancaman serius bagi kelangsungan hidup satwa-satwa langka. Selain itu, perubahan iklim yang semakin ekstrem memperburuk kondisi lingkungan, sehingga banyak spesies yang tidak mampu beradaptasi dan akhirnya punah. Oleh karena itu, diperlukan upaya konservasi yang lebih intensif dan berkelanjutan untuk melindungi keanekaragaman hayati Indonesia. Pemerintah, masyarakat, dan berbagai organisasi harus bekerja sama untuk menjaga dan melestarikan kekayaan alam ini demi generasi mendatang.\"</i>"}, {"n": 4, "sec": "TWK", "t": "Pilar Negara", "q": "Dalam berbagai literatur sejarah, sejak merdeka hingga sekarang, negara Indonesia telah mengadopsi berbagai sistem ekonomi di berbagai negara, sehingga kalau ditanya tentang sistem ekonomi apa yang dianut Indonesia, maka jawabannya adalah \"sistem ekonomi campuran\". Namun, krisis moneter telah membangunkan bangsa Indonesia tentang pentingnya kembali menggali dan menumbuhkan sistem ekonomi sendiri berdasarkan ideologi khas Indonesia, Pancasila. Dengan dasar pemikiran tersebut, maka sistem ekonomi yang ingin kita bangun adalah sistem ekonomi Pancasila. Penerapan ekonomi Pancasila sesuai sila kelima adalah ....", "o": {"a": "Memberikan uang lembur kepada pekerja yang bekerja melebihi jam kerja", "b": "Sistem ekonomi berlandaskan asas persatuan dan patriotisme demi kepentingan seluruh masyarakat", "c": "Kegiatan ekonomi harus berlandaskan nilai spiritual, etika, dan moral", "d": "Pembangunan yang merata demi kemakmuran rakyat sebagai usaha bersama atas dasar asas kekeluargaan", "e": "Kegiatan ekonomi harus memperhatikan nilai-nilai kemanusiaan dan tidak saling menjatuhkan"}, "ans": "d", "ex": "Ekonomi Pancasila adalah pembangunan ekonomi yang dilandasi nilai-nilai yang terkandung dalam Pancasila. Pertanyaan di atas menanyakan penerapan ekonomi Pancasila yang sesuai dengan keadilan sosial bagi seluruh rakyat Indonesia (sila ke-5). Opsi A dan E sesuai dengan sila kedua, opsi B sesuai dengan sila ketiga, dan opsi C sesuai dengan sila kesatu."}, {"n": 5, "sec": "TWK", "q": "Istilah \"Nusantara\" diambil dari bahasa Jawa Kuno yang berarti...", "o": {"a": "Pulau-pulau", "b": "Lautan luas", "c": "Kepulauan luar", "d": "Negeri asing", "e": "Negeri sebelah"}, "ans": "c", "ex": "Istilah \"Nusantara\" diambil dari bahasa Jawa Kuno yang berarti \"kepulauan luar\"."}, {"n": 6, "sec": "TWK", "t": "", "q": "UUD NRI 1945 memberikan pengaturan kerangka kerja bagi sistem pemerintahan dan pembagian kekuasaan di Indonesia. Di dalam UUD NRI 1945, diatur tentang lembaga-lembaga pemerintahan seperti MPR, DPR, Komisi Yudisial, Mahkamah Agung, Mahkamah Konstitusi, dan Badan Pemeriksa Keuangan. Adapun maksud dari pengaturan tersebut adalah ....", "o": {"a": "Untuk mengawasi tindakan pemerintah dan memastikan bahwa tindakan tersebut sesuai dengan hukum dan aturan yang berlaku", "b": "Agar pemerintahan dapat berjalan sesuai dengan nilai-nilai Pancasila sebagai dasar negara", "c": "Agar segala perubahan hukum dan peraturan pemerintah dapat terlaksana secara sah sesuai dengan ketentuan UUD 1945 dan nilai dasar negara", "d": "Membantu memastikan bahwa hukum dan peraturan yang berlaku tidak bertentangan satu sama lain dan sesuai dengan prinsip-prinsip dasar yang tercantum dalam UUD 1945", "e": "Agar kebijakan pemerintah dapat terlaksana dengan baik tanpa mengurangi hak dan kewajiban warga negara"}, "ans": "a", "ex": "UUD 1945 memberikan kerangka kerja bagi sistem pemerintahan dan pembagian kekuasaan di Indonesia. Sebagai alat kontrol, UUD 1945 memungkinkan lembaga-lembaga pemerintah dan cabang-cabang kekuasaan untuk mengawasi tindakan pemerintah dan memastikan bahwa tindakan tersebut sesuai dengan hukum dan aturan yang berlaku. Hal ini mencegah penyalahgunaan kekuasaan oleh pemerintah."}, {"n": 7, "sec": "TWK", "t": "", "q": "Kemenangan tanpa syarat Jepang atas sekutu berakhir dengan adanya perjanjian kalijati yang diadakan di subang, Jawa Barat. Isi perjanjian tersebut adalah penyerahan hak atas tanah penjajahan Belanda di Indonesia kepada pemerintahan pendudukan Jepang. meskipun kedatangan jepang tersebut sama halnya dengan Belanda mempunyai tujuan untuk menjajah, namun Jepang pada awalnya diterima dan disambut baik oleh bangsa Indonesia. Di bawah ini yang bukan merupakan alasan diterimanya Jepang oleh bangsa Indonesia adalah ….", "o": {"a": "Semboyan Hakko ichiu , yakni dunia dalam satu keluarga dan Jepang adalah pemimpin keluarga tersebut yang berusaha menciptakan kemakmuran bersama", "b": "Perlakuan Jepang yang lebih baik dan humanis dibandingkan dengan penjajahan Belanda", "c": "Pernyataan Jepang bahwa kedatangannya bukan untuk menjajah, naun membebaskan dari penjajahan Belanda", "d": "Propaganda 3A Jepang cahaya asia, Jepang pelindung Asia dan Jepang pemimpin Asia", "e": "Pengakuan Jepang sebagai saudara tua bangsa Indonesia yang datang dengan maksud membebaskan rakyat"}, "ans": "b", "ex": "Pertanyaan yang tidak menunjukkan alasan diterimanya Jepang oleh bangsa Indonesia pada masa penjajahan adalah perlakuan Jepang yang lebih baik dan humanis. sebaliknya Jepang melakukan awal penjajahan dengan kejam dan ekstrim kepada Pribumi dengan kekerasan dan pemaksaan kaum kaum cendekiawan dan tokoh bangsa dibatasi ruang geraknya."}, {"n": 8, "sec": "TWK", "t": "Bela Negara", "q": "Tidak dapat diabaikan bahwa Indonesia terdiri dari berbagai Suku, Agama, Ras, dan Antargolongan (SARA). Dari sini, lahirlah Bhinneka Tunggal Ika sebagai salah satu pilar negara untuk mempersatukan keberagaman yang ada di Indonesia. Adapun keberagaman dalam konteks Bhinneka Tunggal Ika dipandang sebagai ....", "o": {"a": "Keberagaman memiliki sifat bisa memecahkan, oleh sebab itu perbedaan harus dihilangkan agar tercipta persatuan", "b": "Keberagaman dipandang sebagai sebuah tantangan dan ancaman bagi bangsa Indonesia yang harus dihadapi bersama-sama", "c": "Keberagaman tidak seharusnya dipertentangkan atau diadu antara satu dengan yang lain sehingga menyebabkan perpecahan", "d": "Keberagaman harus dipandang sebagai hal yang biasa di dalam negara yang berbentuk kepulauan seperti Indonesia", "e": "Keberagaman dan persatuan dipandang sebagai dua hal yang sama dan tidak bisa dipisahkan"}, "ans": "c", "ex": "Bhinneka Tunggal Ika (<i>Unity in Diversity</i>) bertekad untuk menghormati perbedaan atau keragaman, tetapi tetap bersatu sebagai bangsa Indonesia. Tidak dapat diabaikan bahwa Indonesia terdiri dari berbagai suku, agama, ras, dan antargolongan (SARA). Keberagaman ini harus dianggap sebagai kekayaan sosial dan budaya yang bersifat kodrati. Keberagaman tidak seharusnya dipertentangkan atau diadu antara satu dengan yang lain sehingga menyebabkan perpecahan. Oleh karena itu, Bhinneka Tunggal Ika harus menjadi semangat untuk mewujudkan persatuan dan kesatuan bangsa."}, {"n": 9, "sec": "TWK", "t": "", "q": "Hubungan kerja antara sesama anggota Badan Pemeriksa Keuangan (BPK) sesuai Undang-undang bersifat kolektif kolegial. Hal ini berarti bahwa ....", "o": {"a": "Setiap anggota BPK memiliki wewenang yang sama dalam pengambilan keputusan", "b": "Ketua BPK memiliki wewenang lebih besar dibandingkan anggota lainnya", "c": "Keputusan diambil berdasarkan suara terbanyak dari anggota BPK", "d": "Setiap anggota BPK bekerja secara mandiri tanpa koordinasi", "e": "Anggota BPK hanya mengikuti arahan dari Ketua BPK"}, "ans": "a", "ex": "Hubungan kerja antara sesama anggota BPK yang bersifat kolektif kolegial berarti bahwa setiap anggota memiliki kedudukan dan wewenang yang sama dalam pengambilan keputusan. Tidak ada satu anggota pun, termasuk Ketua BPK, yang memiliki wewenang lebih besar dibandingkan yang lain. Keputusan diambil secara bersama-sama melalui musyawarah untuk mencapai mufakat atau berdasarkan suara terbanyak jika diperlukan."}, {"n": 10, "sec": "TWK", "q": "Tokoh yang berpidato dalam sidang BPUPKI tanggal 29 Mei - 1 Juni 1945 mencetuskan wacana kemerdekaan dengan pidato", "o": {"a": "Panca Karsa", "b": "Pancasila", "c": "Pancakarsa", "d": "Pancanegara", "e": "Pancasama"}, "ans": "b", "ex": "Tokoh yang berpidato dalam sidang BPUPKI tanggal 29 Mei - 1 Juni 1945 mencetuskan wacana kemerdekaan dengan pidato Pancasila."}, {"n": 11, "sec": "TWK", "t": "Pilar Negara", "q": "Negara Indonesia adalah negara hukum. Demikian bunyi Pasal 1 Ayat 3 Undang-Undang Dasar (UUD) 1945. Adapun makna dari pasal tersebut adalah ....", "o": {"a": "Segala aspek kehidupan di NKRI didasarkan atas hukum sesuai dengan adat dan budaya daerah-daerah yang ada di Indonesia", "b": "Segala aspek kehidupan di wilayah NKRI berdasarkan Pancasila dan UUD 1945 tanpa terkecuali", "c": "Segala aspek kehidupan di wilayah NKRI didasarkan pada hukum dan peraturan perundang-undangan kecuali daerah yang terpencil dan sulit diakses", "d": "Segala aspek kehidupan di wilayah NKRI terikat oleh hukum di daerahnya masing-masing sesuai adat dan kebiasaan masyarakat", "e": "Segala aspek kehidupan di wilayah NKRI harus didasarkan pada hukum dan segala produk perundang-undangan serta turunannya yang berlaku di wilayah NKRI"}, "ans": "e", "ex": "Negara hukum adalah negara yang di dalamnya terdapat berbagai aspek peraturan-peraturan yang bersifat memaksa dan mempunyai sanksi tegas apabila dilanggar. Maka, arti Indonesia sebagai negara hukum adalah segala aspek kehidupan di wilayah Negara Kesatuan Republik Indonesia (NKRI) harus didasarkan pada hukum dan segala produk perundang-undangan serta turunannya yang berlaku di wilayah NKRI."}, {"n": 12, "sec": "TWK", "q": "Pemerintahan yang dipegang oleh golongan bangsawan atau keturunan bangsawan disebut...", "o": {"a": "Timokrasi", "b": "Aristokrasi", "c": "Oligarki", "d": "Tirani", "e": "Monarki"}, "ans": "b", "ex": "Aristokrasi adalah bentuk pemerintahan di mana kekuasaan dipegang oleh golongan bangsawan atau keturunan bangsawan."}, {"n": 13, "sec": "TWK", "t": "", "q": "(1) Pariwisata berkelanjutan semakin menjadi perhatian global dalam upaya melestarikan alam dan budaya. (2) GreenTour, sebuah agen perjalanan berkelanjutan, menjadi pilihan utama bagi wisatawan yang ingin menjelajahi destinasi dengan dampak lingkungan yang minim. (3) Menurut laporan dari SustainableTravel, GreenTour telah berhasil menjadi pelopor dalam industri pariwisata berkelanjutan. (4) Keberhasilan GreenTour dapat dilihat dari partisipasi masyarakat yang semakin meningkat dan dukungan terhadap proyek-proyek konservasi. (5) Dalam menggabungkan petualangan dan kepedulian lingkungan, GreenTour terus memimpin perjalanan menuju pariwisata yang berkelanjutan.", "o": {"a": "(1)", "b": "(2)", "c": "(3)", "d": "(4)", "e": "(5)"}, "ans": "e", "ex": "Kalimat utama dari paragraf tersebut terdapat pada kalimat nomor (5), yaitu: \"Dalam menggabungkan petualangan dan kepedulian lingkungan, GreenTour terus memimpin perjalanan menuju pariwisata yang berkelanjutan.\" Ini karena kalimat tersebut memberikan ide pokok dari paragraf, menyajikan informasi bahwa GreenTour terus memimpin perjalanan menuju pariwisata yang berkelanjutan dengan menggabungkan petualangan dan kepedulian lingkungan. Seluruh paragraf memberikan dukungan dan detail terkait pariwisata berkelanjutan dan keberhasilan GreenTour, tetapi kalimat tersebut membuka pembicaraan dan merangkum pokok dari paragraf tersebut, sehingga dianggap sebagai kalimat utama. 27. Jawaban D. Selamat-selamat Pembahasan: Kesalahan terletak pada kata \"selamat-selamat.\" Penggunaan kata ini tidak tepat karena seharusnya cukup menggunakan satu kali pengulangan kata \"selamat.\" Sehingga penulisan yang benar adalah \"pada hari ulang tahunnya yang ke-25, Joni menerima banyak ucapan selamat dari teman-temannya di media sosial.\""}, {"n": 14, "sec": "TWK", "t": "Integritas", "q": "Korupsi adalah perilaku tidak jujur yang umumnya dilakukan oleh seseorang yang memiliki kekuasaan, seperti kepala perusahaan atau pejabat pemerintahan. Korupsi dapat mencakup pemberian atau penerimaan suap atau hadiah yang tidak pantas, transaksi ganda, transaksi di bawah meja, manipulasi pemilihan, mengalihkan dana, mencuci uang, dan menipu investor. Berikut ini yang <b>bukan</b> merupakan faktor internal terjadinya korupsi adalah ....", "o": {"a": "Lemahnya moral dan spiritual sehingga mudah terpengaruh", "b": "Gaya hidup yang konsumtif", "c": "Ketamakan dan keserakahan", "d": "Lemahnya pengawasan dan pengendalian", "e": "Kesulitan ekonomi yang bisa terjadi sewaktu-waktu"}, "ans": "d", "ex": "Lemahnya pengawasan dan pengendalian merupakan faktor <b>eksternal</b> terjadinya korupsi. Contoh lemahnya pengawasan dan pengendalian adalah kebijakan yang tidak mendukung pemberantasan korupsi, sikap abai masyarakat terhadap kasus korupsi, dan kultur budaya organisasi yang kurang keteladanan dari pimpinan."}, {"n": 15, "sec": "TWK", "t": "Pilar Negara", "q": "Pasal 33 ayat (1) UUD NRI 1945 menegaskan bahwa <i>\"Perekonomian disusun sebagai usaha bersama berdasar atas asas kekeluargaan.\"</i> Makna dari pasal tersebut adalah ....", "o": {"a": "Sistem perekonomian yang digunakan dan dikembangkan seharusnya tidak menggunakan asas persaingan dan individualistik", "b": "Sistem perekonomian yang digunakan dan dikembangkan harus melihat nilai persatuan dan kesatuan", "c": "Sistem perekonomian yang digunakan dan dikembangkan seharusnya mampu menciptakan pembangunan yang merata", "d": "Sistem perekonomian sejatinya harus bertujuan untuk menciptakan persaingan yang sehat antarnegara", "e": "Sistem perekonomian yang digunakan dan dikembangkan seharusnya memberikan lapangan pekerjaan yang memadai bagi generasi muda"}, "ans": "a", "ex": "Dalam Pasal 33 ayat (1) disebutkan jika perekonomian disusun berdasarkan asas kekeluargaan. Artinya, sistem perekonomian yang digunakan dan dikembangkan seharusnya tidak menggunakan asas persaingan dan individualistik. Menurut Arif Firmansyah dalam jurnal <i>Penafsiran Pasal 33 UUD 1945 dalam Membangun Perekonomian Indonesia</i> (2012), Pasal 33 ayat (1) juga bisa dimaknai jika perekonomian disusun mulai dari tingkat nasional hingga ke berbagai daerah di Indonesia. Seluruh susunan perekonomian ini didasarkan pada asas kekeluargaan."}, {"n": 16, "sec": "TWK", "t": "Pilar Negara", "q": "Setiap orang pasti memiliki tujuan dalam hidupnya, dan demikian pula dengan sebuah negara. Secara umum, tujuan negara adalah pedoman yang mengarahkan semua kegiatan negara, mulai dari menyusun dan mengendalikan alat perlengkapan negara, hingga mengatur kehidupan rakyatnya. Berikut yang <b>bukan</b> merupakan tujuan nasional bangsa Indonesia jika ditinjau dari Pembukaan Undang-Undang Dasar 1945 adalah ....", "o": {"a": "Melindungi segenap bangsa Indonesia dan seluruh tumpah darah Indonesia", "b": "Menjadi negara yang berdaulat, adil, dan makmur", "c": "Memajukan kesejahteraan umum", "d": "Mencerdaskan kehidupan bangsa", "e": "Ikut melaksanakan ketertiban dunia"}, "ans": "b", "ex": "Menjadi negara yang berdaulat, adil, dan makmur bukan merupakan tujuan nasional (alinea ke-4), melainkan sebagai cita-cita nasional (alinea ke-2)."}, {"n": 17, "sec": "TWK", "t": "Bela Negara", "q": "Untuk melakukan upaya bela negara, perlu adanya motivasi yang tinggi sehingga setiap warga negara memahami kelemahan dan kelebihan bangsa Indonesia. Berikut ini yang <b>bukan</b> merupakan faktor yang memengaruhi motivasi bela negara di Indonesia adalah ....", "o": {"a": "Kurangnya kesadaran dalam berperan serta melakukan pembangunan nasional", "b": "Adanya kemungkinan ancaman baik militer maupun nirmiliter terhadap kelangsungan bangsa dan negara", "c": "Letak geografis Indonesia yang sangat strategis", "d": "Adanya pengalaman sejarah kehidupan bangsa Indonesia", "e": "Kemajuan ilmu pengetahuan dan teknologi"}, "ans": "a", "ex": "Motivasi setiap warga negara untuk ikut serta membela negara Indonesia dipengaruhi oleh berbagai faktor, antara lain: 1. Pengalaman sejarah perjuangan bangsa Indonesia 2. Letak geografis Indonesia yang strategis 3. Kekayaan sumber daya alam 4. Kemajuan ilmu pengetahuan dan teknologi 5. Keadaan penduduk yang besar 6. Kemungkinan timbulnya bencana perang Di samping itu, setiap warga negara hendaknya juga memahami kemungkinan adanya ancaman terhadap eksistensi bangsa dan negara Indonesia, baik yang datang dari dalam negeri maupun dari luar negeri yang masing-masing dapat berdiri sendiri atau saling memengaruhi."}, {"n": 18, "sec": "TWK", "t": "Integritas", "q": "Kasus korupsi yang kerap terjadi di kementerian atau lembaga pemerintah sejatinya bisa dicegah. Pencegahan bisa dilakukan dengan keteladanan pimpinan yang memiliki integritas yang tinggi. Di sisi lain, perlu juga dilakukan perbaikan sistem agar bisa mencegah terjadinya korupsi terutama dalam hal pelayanan publik yang masih berbelit, sehingga rentan terjadinya penyuapan. Adapun perbaikan sistem yang dimaksud bisa dilakukan dengan cara ....", "o": {"a": "Memberikan pendidikan dan penguatan antikorupsi kepada seluruh pegawai secara berkala", "b": "Melakukan pengawasan terhadap pegawai yang berhubungan langsung dengan layanan publik", "c": "Melakukan pelayanan publik di ruang yang tertutup dan tidak terlihat masyarakat", "d": "Menaikkan gaji pegawai dan pejabat pemerintah secara berkala dan berkesinambungan", "e": "Memberikan pelayanan publik berbasis informasi teknologi atau <i>online</i> agar lebih efektif dan transparan"}, "ans": "e", "ex": "Harus diakui masih banyak sistem di Indonesia yang membuka peluang terjadinya korupsi. Misalnya, rumitnya prosedur pelayanan publik atau berbelitnya proses perizinan, sehingga memicu terjadinya penyuapan dan penyalahgunaan kekuasaan. Di antara perbaikan yang bisa dilakukan misalnya, pelayanan publik yang dibuat transparan melalui sistem berbasis <i>online</i> atau sistem pengawasan terintegrasi."}, {"n": 19, "sec": "TWK", "q": "Di bawah ini yang bukan merupakan prinsip-prinsip nasionalisme Indonesia adalah...", "o": {"a": "Kesatuan Sejarah", "b": "Kesatuan Tradisi", "c": "Kesatuan Nasib", "d": "Kesatuan Kebudayaan", "e": "Kesatuan Asas Kerohanian"}, "ans": "b", "ex": "Kesatuan Tradisi tidak termasuk dalam prinsip-prinsip nasionalisme Indonesia (persatuan Indonesia) yang tersusun dalam kesatuan majemuk tunggal."}, {"n": 20, "sec": "TWK", "t": "", "q": "\"Meskipun masih muda, karya-karya Novel dianjurkan untuk dibaca semua orang.\" Kalimat tersebut dapat menjadi kalimat efektif yaitu…", "o": {"a": "Tidak ada yang perlu diperbaiki", "b": "Hilangkan kata \"meskipun\"", "c": "Ganti \"dianjurkan\" dengan \"rekomendasi\"", "d": "Tambahkan kata \"karena\" sebelum \"karya-karya\"", "e": "Tambahkan kata \"oleh para kritikus\" setelah \"dianjurkan\""}, "ans": "e", "ex": "Jawaban yang paling efektif adalah (E). Kata \"meskipun\" menunjukkan hubungan antara usia Novel yang masih muda dan karya-karyanya yang dianjurkan untuk dibaca semua orang. Oleh karena itu, kalimat tersebut dapat diperbaiki menjadi \"karya-karya Novel yang masih muda dianjurkan untuk dibaca semua orang.“ Sedangkan, pilihan (A), (B), (C), dan (D) tidak tepat karena memiliki beberapa permasalahan, yaitu : (A) tidak tepat karena kata kalimat tersebut belum efektif (B) tidak tepat karena kata \"meskipun\" penting untuk menunjukkan hubungan antara usia Novel yang masih muda dan karya-karyanya yang dianjurkan untuk dibaca semua orang. (C) tidak tepat karena kata \"dianjurkan\" sudah tepat dan tidak perlu diganti dengan \"rekomendasi\". (D) tidak tepat karena kata \"karena\" tidak diperlukan karena hubungan antara usia Novel yang masih muda dan karya-karyanya yang dianjurkan untuk dibaca semua orang sudah jelas."}, {"n": 21, "sec": "TWK", "t": "", "q": "Saat ini, kantor yang Anda pimpin sedang membutuhkan seseorang yang memiliki skill manajerial untuk mengelola satu divisi. Seseorang yang sudah mempunyai jabatan penting lantas mengusulkan keluarganya untuk menempati posisi strategis tersebut. Namun, ternyata yang direkomendasikan belum memiliki skill yang memadai, maka sikap Anda…", "o": {"a": "Menerima usulan tersebut namun dengan menetapkan masa probation untuk memastikan penilaian dari skill calon karyawan tersebut", "b": "Menjelaskan secara lugas bahwa hal tersebut tidak dapat diterima dan tetap membuka rekrutmen yang seharusnya", "c": "Mencoba untuk mempertimbangkan karena kurang etis jika langsung menolak usulannya secara langsung", "d": "Memberikan kesempatan kepada orang yang direkomendasikan tersebut untuk menunjukkan kemampuannya dalam bekerja", "e": "Menolak usulan tersebut secara tegas"}, "ans": "b", "ex": "Nepotisme menjadi salah satu bentuk kecurangan atau ketidakjujuran di lingkungan kerja, karena adanya conflict of interest para karyawan."}, {"n": 22, "sec": "TWK", "q": "Batas usia minimal untuk mengikuti Pemilihan Kepala Desa adalah", "o": {"a": "21 Tahun", "b": "25 Tahun", "c": "18 Tahun", "d": "35 Tahun", "e": "40 Tahun"}, "ans": "b", "ex": "Batas usia minimal untuk mengikuti Pemilihan Kepala Desa adalah 25 Tahun."}, {"n": 23, "sec": "TWK", "t": "", "q": "Pancasila berkedudukan sebagai pandangan hidup bangsa, artinya ....", "o": {"a": "Pancasila mendasari segala gerak langkah dan perilaku masyarakat dalam hidup berbangsa dan bernegara", "b": "Pancasila mengikuti segala gerak langkah dan perilaku masyarakat dalam hidup berbangsa dan bernegara", "c": "Pancasila memantau segala gerak langkah dan perilaku masyarakat dalam hidup berbangsa dan bernegara", "d": "Pancasila menuntun segala gerak langkah dan perilaku masyarakat dalam hidup berbangsa dan bernegara", "e": "Pancasila mengatur segala gerak langkah dan perilaku masyarakat dalam hidup berbangsa dan bernegara"}, "ans": "d", "ex": "Artinya, Pancasila menuntun segala gerak langkah dan perilaku masyarakat dalam hidup berbangsa dan bernegara."}, {"n": 24, "sec": "TWK", "q": "Undang-undang yang mengatur tentang pertahanan negara diatur dalam", "o": {"a": "UU No. 32 Tahun 2002", "b": "UU No. 3 Tahun 2004", "c": "UU No. 2 Tahun 2002", "d": "UU No. 3 Tahun 2002", "e": "UU No. 32 Tahun 2004"}, "ans": "d", "ex": "UU No. 3 Tahun 2002 mengatur tentang usaha pembelaan dan pertahanan negara."}, {"n": 25, "sec": "TWK", "t": "Bela Negara", "q": "Bupati Sukoharjo, Etik Suryani saat membuka Rumaket, mengatakan bahwa Rumaket (Rumah Pemuda Kreatif dan Inovatif) merupakan salah satu wadah yang dibentuk untuk melahirkan kreativitas dan inovasi pemuda-pemudi di Kabupaten Sukoharjo. Rumaket digelar dengan sejumlah agenda kegiatan yang menarik perhatian masyarakat. Salah satu tujuannya adalah untuk menampilkan hasil karya produk UMKM pemuda Kabupaten Sukoharjo seperti <i>handycraft</i>, fesyen, fotografi, kesenian, musik, batik, gamelan, mebel, dan lain-lain. Hal tersebut sejalan dengan program pemerintah pascapandemi terkait percepatan pemulihan ekonomi daerah. Implementasi bela negara yang terdapat dalam cerita tersebut adalah ....", "o": {"a": "Menampilkan produk-produk lokal agar dikenal dunia internasional", "b": "Program Rumaket melahirkan pemuda yang kreatif dan inovatif", "c": "Program Rumaket mampu menumbuhkan semangat berwirausaha generasi muda", "d": "Menumbuhkan sikap cinta tanah air melalui program usaha kecil yang kreatif dan inovatif", "e": "Meningkatkan kreativitas dan inovasi produk lokal untuk membantu pemulihan ekonomi negara pascapandemi"}, "ans": "e", "ex": "Salah satu unsur penting dalam hal bela negara adalah kesadaran berbangsa dan bernegara untuk ikut serta menjaga kelangsungan hidup serta memajukan bangsa dan negara dalam berbagai bidang sesuai kemampuan, keahlian, dan profesi masing-masing. Sesuai cerita, unsur menjaga kelangsungan hidup serta memajukan bangsa adalah bahwa program Rumaket senada dengan program pemerintah pascapandemi terkait percepatan pemulihan ekonomi daerah."}, {"n": 26, "sec": "TWK", "q": "Sikap cinta terhadap bangsa tercermin dalam perilaku", "o": {"a": "Mengutamakan penggunaan produk luar negeri", "b": "Menjaga kebersihan lingkungan sekitar", "c": "Meniru kebiasaan negara lain", "d": "Mengkritik pemerintah tanpa dasar", "e": "Mengabaikan produk dalam negeri"}, "ans": "b", "ex": "Menjaga kebersihan lingkungan sekitar adalah salah satu perilaku yang mencerminkan cinta terhadap bangsa."}, {"n": 27, "sec": "TWK", "q": "Hal berikut ini dapat mengurangi rasa nasionalisme, kecuali...", "o": {"a": "Fanatisme agama", "b": "Patriotisme", "c": "Diskriminasi ras", "d": "Chauvinisme", "e": "Nepotisme"}, "ans": "b", "ex": "Patriotisme adalah sikap cinta tanah air yang dapat meningkatkan rasa nasionalisme."}, {"n": 28, "sec": "TWK", "t": "", "q": "Ki Hadjar dikenal sebagai jurnalis dan penulis. Ia banyak mengkritik kebijakan-kebijakan Hindia Belanda yang menyengsarakan rakyat. Tulisannya yang terkenal berjudul <i>Seandainya Aku Seorang Belanda</i>. Isinya mengkritik pemerintah kolonial yang akan menyelenggarakan pesta 100 tahun Belanda terlepas dari penjajahan Prancis. <i>\"Pemerintah kolonial Belanda tersinggung dan murka. Akibatnya, pada 1913, Soewardi Soerjaningrat dibuang ke Belanda bersama Cipto Mangunkusumo dan Douwes Dekker,\"</i> tulis Suparto Rahardjo dalam bukunya <i>Ki Hajar Dewantara Biografi Singkat 1889–1959</i> (Garasi: 2012). Sikap integritas yang ditunjukkan Ki Hajar Dewantara tercermin dalam perilaku ....", "o": {"a": "Menggelorakan semangat perjuangan melalui tulisan-tulisan yang dibuat", "b": "Konsistensi Ki Hajar Dewantara dalam memperjuangkan kemerdekaan", "c": "Sikap tegas Ki Hajar Dewantara terhadap ketidakadilan Belanda kepada rakyat pribumi", "d": "Tanpa ragu menyuarakan keadilan dan kebenaran tanpa takut dengan segala risiko yang ada", "e": "Kejujuran dalam menulis sebagai bentuk perlawanan terhadap penjajah"}, "ans": "d", "ex": "Perilaku integritas yang tercermin dalam diri Ki Hajar Dewantara adalah sikap berani yang ditunjukkan dengan tanpa ragu mengkritik kebijakan melalui tulisan demi kebenaran dan keadilan meskipun harus menanggung risiko dibuang ke Belanda."}, {"n": 29, "sec": "TWK", "q": "Orde Baru menggantikan Orde Lama di Indonesia dan dimulai dengan dikeluarkannya Surat Perintah 11 Maret 1966. Tujuan utama dari Orde Baru adalah menegakkan kembali tatanan kehidupan berdasarkan Pancasila dan Undang-Undang Dasar 1945. Dilihat dari historis kelahirannya, Orde Baru merupakan upaya pemerintah menegakkan pemerintahan yang bersifat...", "o": {"a": "Demokratis Berkeadilan", "b": "Konstitusional demokratis", "c": "Dictator", "d": "Demokratis Pancasilais", "e": "Feudal oligarkis"}, "ans": "d", "ex": "Orde Baru bertujuan untuk menegakkan pemerintahan yang bersifat Demokratis Pancasilais, yang menjunjung tinggi nilai-nilai Pancasila dalam kehidupan berbangsa dan bernegara."}, {"n": 30, "sec": "TWK", "t": "Nasionalisme", "q": "Salah satu disintegrasi nasional yang masih berlanjut adalah konflik di Papua akibat adanya Organisasi Papua Merdeka. Dikutip dari website Binus, konflik Papua terus memanas sejak adanya serangan di Nduga pada akhir tahun 2018 dan unjuk rasa di Papua pada tahun 2019. Hingga kini, pemerintah terus melanjutkan pendekatan berbasis keamanan di Papua. Akar penyebab dari konflik Papua sendiri yaitu sengketa historis terkait integrasi Irian Barat ke Indonesia dan meningkatnya marginalisasi dan diskriminasi terhadap orang Papua yang masih belum terselesaikan. Berdasarkan narasi tersebut, penyebab terjadinya disintegrasi adalah ....", "o": {"a": "Perbedaan adat dan budaya antardaerah di Indonesia", "b": "Kurangnya penghargaan terhadap kemajemukan di Indonesia", "c": "Lemahnya pertahanan dan keamanan negara", "d": "Lemahnya sikap cinta tanah air dan patriotisme", "e": "Perbedaan nasib dan sejarah"}, "ans": "b", "ex": "Kata kunci di dalam soal adalah <i>meningkatnya marginalisasi dan diskriminasi terhadap orang Papua</i>. Marginalisasi dan diskriminasi sendiri terjadi karena kurangnya penghargaan terhadap perbedaan dan kemajemukan, seperti perbedaan warna kulit."}, {"n": 31, "sec": "TIU", "q": "MATAHARI : TERANG = MALAM :", "o": {"a": "Bulan", "b": "Gelap", "c": "Senja", "d": "Cahaya", "e": "Bintang"}, "ans": "b", "ex": "Matahari membuat terang sedangkan malam biasanya identik dengan gelap."}, {"n": 32, "sec": "TIU", "q": "8 - 9 - 10 - 8 - 9 - 10 - 11 - 8 - 9 - 10 - 11 - 12 - … - …", "o": {"a": "9 - 10", "b": "10 - 11", "c": "8 - 9", "d": "12 - 13", "e": "13 - 14"}, "ans": "c", "ex": "Tiap kelompok bertambah satu angka (8-9-10, 8-9-10-11, 8-9-10-11-12), kelompok berikutnya diawali 8 - 9."}, {"n": 33, "sec": "TIU", "q": "Diketahui lamanya belajar mandiri siswa sebanding dengan nilai ujian. Jika siswa dengan nilai ujian 75 melakukan belajar mandiri 15 jam/hari, maka lamanya belajar mandiri siswa dengan nilai 45 adalah", "o": {"a": "9 jam/hari", "b": "10 jam/hari", "c": "11 jam/hari", "d": "8 jam/hari", "e": "7 jam/hari"}, "ans": "a", "ex": "Jika lamanya belajar mandiri siswa sebanding dengan nilai ujian, maka perbandingannya adalah 75 : 15 = 45 : x. Sehingga, x = 45 × 15/75 = 9 jam/hari."}, {"n": 34, "sec": "TIU", "t": "", "q": "Saya membeli 3 kg rambutan dan 4 kg jeruk dengan harga Rp 75.000. Di waktu yang lain saya membeli 7 kg rambutan dan 9 kg jeruk dengan harga Rp 172.000. Hari ini, saya membeli 1 kg rambutan dan 1 kg jeruk yang dikemas dalam keranjang parcel dengan harga Rp 37.000. Berapakah harga keranjang parcel yang saya beli.", "o": {"a": "Rp8.000", "b": "Rp10.000", "c": "Rp12.000", "d": "Rp14.000", "e": "Rp15.000"}, "ans": "e", "ex": "● Rambutan (R), Jeruk (J) dan keranjang parsel (K) A; 3R + 4J = 75.000 B; 7R + 9J= 172.000 C; R + J + K = 37.000 ● 2A + C - B = 150.000 + 37.000 - 172.000 2[3R + 4J] + [R+J+K] - [7R + 9J] = 15.000 6R + 8J + R + J + K - 7R - 9J = 15.000 [6R + R - 7R] + [J + 8J - 9J] + K = 15.000 K = 15.000"}, {"n": 35, "sec": "TIU", "q": "Seekor kuda dapat menghabiskan rumput di lapangan A dalam waktu 5 minggu. Jika 2 ekor kuda lainnya ikut makan di lapangan yang sama, berapa lama waktu yang dibutuhkan untuk habisnya rumput?", "o": {"a": "1 minggu", "b": "1,67 minggu", "c": "2 minggu", "d": "2,5 minggu", "e": "3 minggu"}, "ans": "b", "ex": "3 ekor kuda menghabiskan rumput dalam 5/3 ≈ 1,67 minggu."}, {"n": 36, "sec": "TIU", "t": "Perbandingan &amp; Soal Cerita", "q": "Pak Basuki mendapat laporan dari karyawan bahwa dalam 4 hari, progres suatu pekerjaan mencapai 66,67%. Padahal, jumlah karyawan yang diturunkan hanya 6 orang saja. Jumlah karyawan yang perlu ditambahkan oleh Pak Basuki untuk menyelesaikan seluruh pekerjaan yang sama dalam waktu 4 hari adalah ....", "o": {"a": "1 orang", "b": "3 orang", "c": "5 orang", "d": "7 orang", "e": "9 orang"}, "ans": "b", "ex": "6 pekerja → 66,67% = 2/3 x pekerja → 100% = 1 6/x = 2/3/1 → 6/x = 2/3 → 3/x = 1/3 → x = 9 Sehingga tambahannya adalah 9 - 6 = 3 orang."}, {"n": 37, "sec": "TIU", "q": "0,5 × {(5 1/2 × 16) - (90 : 1 1/2 )} =", "o": {"a": "10,5", "b": "14", "c": "7", "d": "9", "e": "8,5"}, "ans": "b", "ex": "(11/2 × 16) − (90 ÷ 3/2) = 88 − 60 = 28; × 0,5 = 14."}, {"n": 38, "sec": "TIU", "t": "", "q": "Jika Ahay menang olimpiade fisika, maka ia mendapat hadiah dari ayah. Ahay menang olimpiade fisika.", "o": {"a": "Ahay tidak mendapat hadiah dari ayah.", "b": "Ahay adalah anak yang pintar.", "c": "Ahay tidak menang olimpiade fisika.", "d": "Ahay mendapat hadiah dari ayah.", "e": "Tidak dapat disimpulkan."}, "ans": "d", "ex": "Sola menggunakan modus ponens"}, {"n": 39, "sec": "TIU", "t": "Hitung Cepat", "q": "2/5 + 4 1/6 : 2 × 2/3 + 3,5 × 1 3/10 - sqrt{9} = …", "o": {"a": "5 1/40", "b": "5 7/40", "c": "2 3/40", "d": "5 3/40", "e": "2 7/40"}, "ans": "d", "ex": "begin{aligned} 2/5 + 4 1/6 : 2 × 2/3 + 3,5 × 1 3/10 - sqrt{9} &amp;= 2/5 + 25/6 : 4/3 + 35/10 × 13/10 - 3 &amp;= 2/5 + 25/6 × 3/4 + 7/2 × 13/10 - 3 &amp;= 2/5 + 25/8 + 91/20 - 3 &amp;= 16 + 125 + 182 - 120/40 &amp;= 203/40 = 5 3/40 end{aligned}"}, {"n": 40, "sec": "TIU", "t": "", "q": "Sebuah dadu dilambungkan sebanyak 60 kali. Berapa frekuensi harapan muncul angka prima ?", "o": {"a": "45", "b": "40", "c": "35", "d": "25", "e": "30"}, "ans": "e", "ex": "Angka Prima = 2,3,5 = 3 angka Peluang = 3/6 Frekuensi harapan = 3/6 x 60 = 30"}, {"n": 41, "sec": "TIU", "t": "Analogi", "q": "Hubungan objek pada kalimat <i>\"Fauzan menyiapkan printer dan tinta printer baru untuk menghadapi tugas skripsi\"</i> setara dengan ....", "o": {"a": "Ida membeli pulpen dan pensil baru di toko buku terdekat", "b": "Sekolah itu memiliki beberapa laptop dan komputer di ruangan kantor", "c": "Adinda mengoleksi kacamata dan lensa kontak model terkini", "d": "Ibu membutuhkan beberapa sikat gigi dan pasta gigi saat seluruh anggota keluarga mudik", "e": "Sesuai ketentuan, mobil Ratna hanya boleh diisi dengan bensin"}, "ans": "d", "ex": "Printer dan tinta printer termasuk barang komplementer, sebagaimana sikat gigi dan pasta gigi juga termasuk barang komplementer (yang saling melengkapi)."}, {"n": 42, "sec": "TIU", "q": "Dermawan &gt;&lt;", "o": {"a": "Pelit", "b": "Baik", "c": "Murah hati", "d": "Sopan", "e": "Kasih"}, "ans": "a", "ex": "Dermawan berarti suka memberi, sehingga antonimnya adalah pelit."}, {"n": 43, "sec": "TIU", "t": "Analogi", "q": "<i>Kakak sedang membaca novel detektif.</i><br>Kalimat yang berpolakan sama dengan pola tersebut adalah ....", "o": {"a": "Mereka mendiskusikan proyek", "b": "Paman memperbaiki komputer yang rusak", "c": "Ibu memasak dengan sangat hati-hati", "d": "Kakak menonton film di bioskop", "e": "Ayah bekerja sejak pagi"}, "ans": "a", "ex": "- <b>Soal:</b> Kakak (S) sedang membaca (P) novel detektif (O) - <b>A)</b> Mereka (S) mendiskusikan (P) proyek (O) - <b>B)</b> Paman (S) memperbaiki (P) komputer (O) yang rusak (Pel) - <b>C)</b> Ibu (S) memasak (P) dengan sangat hati-hati (K) - <b>D)</b> Kakak (S) menonton (P) film (O) di bioskop (K) - <b>E)</b> Ayah (S) bekerja (P) sejak pagi (K)"}, {"n": 44, "sec": "TIU", "t": "Perbandingan &amp; Soal Cerita", "q": "Mengisi akhir tahun, Zaki melakukan perjalanan mudik dengan sepeda motor ke rumah neneknya di puncak. Ia berangkat dari rumah pukul 06.45 WIB dengan kecepatan 60 km/jam sehingga untuk sampai ke puncak memerlukan waktu 6 jam. Jika Zaki meningkatkan kecepatan berkendara hingga 80 km/jam, maka ia akan tiba di puncak pada pukul ....", "o": {"a": "10.45 WIB", "b": "11.00 WIB", "c": "11.15 WIB", "d": "11.30 WIB", "e": "11.45 WIB"}, "ans": "c", "ex": "60 km/jam → 6 jam 80 km/jam → x jam (Perbandingan berbalik nilai) 60/80 = x/6 → 3/4 = x/6 → 4x = 18 → x = 4,5 jam = 4 jam 30 menit Waktu tiba = 06.45 + 04.30 = 11.15 WIB."}, {"n": 45, "sec": "TIU", "q": "Semua mahasiswa harus belajar untuk ujian. Sebagian mahasiswa tidak belajar. Kesimpulannya adalah", "o": {"a": "Semua mahasiswa tidak belajar", "b": "Sebagian mahasiswa belajar", "c": "Sebagian mahasiswa tidak mengikuti ujian", "d": "Semua mahasiswa belajar", "e": "Sebagian mahasiswa tidak belajar untuk ujian"}, "ans": "e", "ex": "Jika semua mahasiswa harus belajar tetapi sebagian tidak belajar, maka sebagian mahasiswa tidak belajar untuk ujian."}, {"n": 46, "sec": "TIU", "t": "Analogi", "q": "CERDAS : .... = MERDU : ....", "o": {"a": "Sastrawan - Lagu", "b": "Ilmuwan - Suara", "c": "Peneliti - Bunyi", "d": "Guru - Nada", "e": "Pemimpin - Irama"}, "ans": "b", "ex": "Cerdas adalah sifat dari ilmuwan, sebagaimana merdu adalah sifat dari suara."}, {"n": 47, "sec": "TIU", "t": "", "q": "Jika ada acara pesta ulang tahun, maka teman-teman akan datang. Jika teman-teman datang, maka ada musik dan tarian. Maka kesimpulan yang benar adalah...", "o": {"a": "Jika tidak ada acara pesta ulang tahun maka ada musik dan tarian", "b": "Jika tidak ada acara pesta ulang tahun maka tidak ada musik dan tarian", "c": "Ada acara pesta ulang tahun dan ada musik dan tarian", "d": "Jika tidak ada acara pesta ulang tahun maka ada musik dan tarian", "e": "Tidak ada acara pesta ulang tahun atau ada musik dan tarian"}, "ans": "e", "ex": "Perhatikan pengerjaan untuk soal berikut! P1 : Jika ada acara pesta ulang tahun, maka teman-teman akan datang. P2 : Jika teman-teman datang, maka ada musik dan tarian K : Jika ada acara pesta ulang tahun, maka ada musik dan tarian Jawabannya adalah diatas, namun karena dalam pilihan ganda tidak tersedia, teman-teman silahkan cari ekuivalen dari pernyataan tersebut dengan aturan : 1. Ekuivalen dari Jika P maka Q adalah -P atau Q ATAU Ekuivalen dari Jika P maka Q adalah Jika-Q maka -P Maka untuk jawaban yang tepat terhadap soal “Jika ada acara pesta ulang tahun, maka ada musik dan tarian” adalah Tidak ada acara pesta ulang tahun atau ada musik dan tarian"}, {"n": 48, "sec": "TIU", "t": "", "q": "Seorang pedagang baju sedang mengalami banjir pesanan untuk 500 produk daster. harga tiap daster dibanderol Rp 14.500. Di tengah proses produksi tiba-tiba harga kain naik, sehingga pedagang mengalami kerugian 2% per daster. Berapa kerugian yang ditanggung pedagang?", "o": {"a": "Rp114.000", "b": "Rp280.000", "c": "Rp145.000", "d": "Rp600.000", "e": "Rp950.000"}, "ans": "c", "ex": "Kerugian = 2% × Rp14.500 × 500 = Rp145.000."}, {"n": 49, "sec": "TIU", "t": "Perbandingan &amp; Soal Cerita", "q": "Perhatikan tabel berikut!<br>Nama &nbsp;|&nbsp; Nilai Ujian Sekolah &nbsp;|&nbsp; Penghasilan Orang Tua<br>Ayu &nbsp;|&nbsp; 84 &nbsp;|&nbsp; Rp1.225.000,00<br>Budi &nbsp;|&nbsp; 97 &nbsp;|&nbsp; Rp1.760.000,00<br>Caca &nbsp;|&nbsp; 86 &nbsp;|&nbsp; Rp1.745.000,0
