 0}, {"id": 13, "g": "TWK · Nasionalisme 1–2", "t": "13. Pasal-Pasal UUD 1945 Terkait Nasionalisme", "html": "<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Tema Nasionalisme</th>\n<th style=\"text-align: left;\">Pasal &amp; Ayat UUD 1945</th>\n<th style=\"text-align: left;\">Isi / Substansi Pasal</th>\n<th style=\"text-align: left;\">Kaitan dengan Nilai Nasionalisme</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Bentuk Negara</strong></td>\n<td style=\"text-align: left;\"><strong>Pasal 1 Ayat (1)</strong></td>\n<td style=\"text-align: left;\">Negara Indonesia ialah Negara Kesatuan, yang berbentuk Republik.</td>\n<td style=\"text-align: left;\">Menjaga keutuhan wilayah NKRI dan menolak separatisme.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Kedaulatan Rakyat</strong></td>\n<td style=\"text-align: left;\"><strong>Pasal 1 Ayat (2)</strong></td>\n<td style=\"text-align: left;\">Kedaulatan berada di tangan rakyat dan dilaksanakan menurut UUD.</td>\n<td style=\"text-align: left;\">Partisipasi aktif dalam demokrasi sebagai wujud kedaulatan rakyat.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Bela Negara</strong></td>\n<td style=\"text-align: left;\"><strong>Pasal 27 Ayat (3)</strong></td>\n<td style=\"text-align: left;\">Setiap warga negara berhak dan wajib ikut serta dalam upaya pembelaan negara.</td>\n<td style=\"text-align: left;\">Kesadaran warga negara untuk membela dan menjaga kedaulatan negara sesuai perannya.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Pertahanan &amp; Keamanan</strong></td>\n<td style=\"text-align: left;\"><strong>Pasal 30 Ayat (1)</strong></td>\n<td style=\"text-align: left;\">Tiap-tiap warga negara berhak dan wajib ikut serta dalam usaha pertahanan dan keamanan negara.</td>\n<td style=\"text-align: left;\">Kesiapsiagaan warga menghadapi ancaman terhadap keamanan negara.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Kebudayaan Nasional</strong></td>\n<td style=\"text-align: left;\"><strong>Pasal 32 Ayat (1)</strong></td>\n<td style=\"text-align: left;\">Negara memajukan kebudayaan nasional Indonesia di tengah peradaban dunia.</td>\n<td style=\"text-align: left;\">Kebanggaan dan pelestarian budaya sendiri di era globalisasi.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Bahasa Daerah</strong></td>\n<td style=\"text-align: left;\"><strong>Pasal 32 Ayat (2)</strong></td>\n<td style=\"text-align: left;\">Negara menghormati dan memelihara bahasa daerah sebagai kekayaan budaya nasional.</td>\n<td style=\"text-align: left;\">Menghargai keberagaman lokal sebagai bagian tak terpisahkan dari kekayaan nasional.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Kedaulatan Ekonomi</strong></td>\n<td style=\"text-align: left;\"><strong>Pasal 33 Ayat (3)</strong> <em>(dalam catatan tertulis Ayat 1)</em></td>\n<td style=\"text-align: left;\">Bumi dan air dan kekayaan alam yang terkandung di dalamnya dikuasai oleh negara dan dipergunakan untuk sebesar-besar kemakmuran rakyat.</td>\n<td style=\"text-align: left;\">Menjaga sumber daya alam agar tidak dikuasai asing demi kemandirian bangsa.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Bendera Negara</strong></td>\n<td style=\"text-align: left;\"><strong>Pasal 35</strong></td>\n<td style=\"text-align: left;\">Bendera Negara Indonesia ialah Sang Merah Putih.</td>\n<td style=\"text-align: left;\">Kebanggaan terhadap simbol pemersatu bangsa.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Bahasa Negara</strong></td>\n<td style=\"text-align: left;\"><strong>Pasal 36</strong></td>\n<td style=\"text-align: left;\">Bahasa Negara ialah Bahasa Indonesia.</td>\n<td style=\"text-align: left;\">Menggunakan bahasa nasional sebagai alat pemersatu bangsa.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Lambang &amp; Semboyan</strong></td>\n<td style=\"text-align: left;\"><strong>Pasal 36A</strong></td>\n<td style=\"text-align: left;\">Lambang Negara ialah Garuda Pancasila dengan semboyan <em>Bhinneka Tunggal Ika</em>.</td>\n<td style=\"text-align: left;\">Menjunjung tinggi persatuan di tengah keberagaman suku dan budaya.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Lagu Kebangsaan</strong></td>\n<td style=\"text-align: left;\"><strong>Pasal 36B</strong></td>\n<td style=\"text-align: left;\">Lagu Kebangsaan ialah Indonesia Raya.</td>\n<td style=\"text-align: left;\">Menghargai lagu kebangsaan dalam setiap upacara resmi.</td>\n</tr>\n</tbody>\n</table>", "min": 2, "nc": 0}, {"id": 14, "g": "TWK · Nasionalisme 1–2", "t": "14. Nasionalisme Masa Pergerakan hingga Orde Baru", "html": "<p>Munculnya pergerakan nasional di Indonesia sangat dipengaruhi oleh <strong>Politik Etis</strong> (edukasi, irigasi, emigrasi) yang melahirkan golongan intelektual pribumi untuk melawan penjajahan melalui jalur organisasi modern.</p>\n<h3>Tabel Kronologi Perkembangan Nasionalisme Indonesia (1908–1998)</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Periode Perkembangan</th>\n<th style=\"text-align: center;\">Estimasi Tahun</th>\n<th style=\"text-align: left;\">Karakteristik &amp; Fokus Gerakan</th>\n<th style=\"text-align: left;\">Strategi Perjuangan</th>\n<th style=\"text-align: left;\">Organisasi / Kelompok Dominan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Awal Perkembangan</strong></td>\n<td style=\"text-align: center;\">1908–1920</td>\n<td style=\"text-align: left;\">Fokus pada perbaikan sosial, ekonomi, pendidikan, dan budaya. Belum menuntut kemerdekaan politik secara langsung.</td>\n<td style=\"text-align: left;\">Kooperatif &amp; Moderat</td>\n<td style=\"text-align: left;\">Budi Utomo, Sarekat Dagang Islam (SDI) / Sarekat Islam (awal), Muhammadiyah.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Nasionalisme Politik</strong></td>\n<td style=\"text-align: center;\">1912–1925</td>\n<td style=\"text-align: left;\">Mulai menyuarakan isu politik dan menuntut kemandirian bangsa.</td>\n<td style=\"text-align: left;\">Moderat hingga Non-Kooperatif</td>\n<td style=\"text-align: left;\">Indische Partij, Perhimpunan Indonesia (di Belanda), Gerakan Pemuda.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Periode Radikal</strong></td>\n<td style=\"text-align: center;\">1925–1930</td>\n<td style=\"text-align: left;\">Menuntut kemerdekaan penuh secara tegas (<em>\"Indonesia Merdeka\"</em>) dan menolak keras pengaruh Belanda.</td>\n<td style=\"text-align: left;\">Non-Kooperatif</td>\n<td style=\"text-align: left;\">Partai Nasional Indonesia (PNI), PKI (1926), Partindo.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Periode Bertahan</strong></td>\n<td style=\"text-align: center;\">1930–1942</td>\n<td style=\"text-align: left;\">Mengubah taktik akibat tekanan, penangkapan, dan pembungkaman keras pemerintah kolonial agar organisasi tidak dibubarkan.</td>\n<td style=\"text-align: left;\">Kooperatif &amp; Moderat (Reaktif)</td>\n<td style=\"text-align: left;\">Parindra, Gerindo, GAPI (Gabungan Politik Indonesia).</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Pendudukan Jepang</strong></td>\n<td style=\"text-align: center;\">1942–1945</td>\n<td style=\"text-align: left;\">Pembungkaman organisasi politik independen; pematangan persiapan kemerdekaan secara taktis.</td>\n<td style=\"text-align: left;\">Kooperatif Taktis (resmi) &amp; Gerakan Bawah Tanah</td>\n<td style=\"text-align: left;\">PUTERA, Jawa Hokokai, BPUPKI, PPKI, Kelompok Bawah Tanah (Sjahrir, Sukarni, Amir Sjarifuddin).</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Revolusi Fisik / Mempertahankan Kemerdekaan</strong></td>\n<td style=\"text-align: center;\">1945–1949</td>\n<td style=\"text-align: left;\">Nasionalisme di titik puncak; seluruh elemen bangsa bersatu mempertahankan proklamasi dari Sekutu dan Belanda (NICA).</td>\n<td style=\"text-align: left;\">Konfrontasi Fisik (Militer) &amp; Diplomasi</td>\n<td style=\"text-align: left;\">BKR/TKR/TNI, Laskar Rakyat (Pesindo, Hizbullah), PNI, Masyumi, PSI, PKI.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Demokrasi Liberal / Parlementer</strong></td>\n<td style=\"text-align: center;\">1950–1959</td>\n<td style=\"text-align: left;\">Nasionalisme terpecah ke dalam ideologi partai politik; fokus pada pembangunan negara dan pengakuan internasional.</td>\n<td style=\"text-align: left;\">Konstitusional (Parlementer / Multipartai)</td>\n<td style=\"text-align: left;\">\"Empat Besar\" Pemilu 1955: PNI, Masyumi, Nahdlatul Ulama (NU), dan PKI.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Demokrasi Terpimpin</strong></td>\n<td style=\"text-align: center;\">1959–1965</td>\n<td style=\"text-align: left;\">Anti-imperialisme Barat yang radikal dan berpusat pada Bung Karno; muncul konsep <strong>Nasakom</strong> (Nasionalis, Agama, Komunis).</td>\n<td style=\"text-align: left;\">Politik Konfrontasi Massa Terpusat (<em>Berdikari</em>)</td>\n<td style=\"text-align: left;\">Front Nasional, PNI, NU, PKI (Masyumi &amp; PSI dibubarkan).</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Orde Baru</strong></td>\n<td style=\"text-align: center;\">1966–1998</td>\n<td style=\"text-align: left;\">Didefinisikan demi stabilitas politik dan pembangunan ekonomi; terjadi depolitisasi massa (<em>floating mass</em>) dan asas tunggal Pancasila.</td>\n<td style=\"text-align: left;\">Otoriter Konstitusional / Fusi Partai Politik</td>\n<td style=\"text-align: left;\">Golkar (mesin politik utama), PPP (fusi partai Islam), PDI (fusi partai nasionalis/non-Islam).</td>\n</tr>\n</tbody>\n</table>", "min": 2, "nc": 0}, {"id": 15, "g": "TWK · Nasionalisme 1–2", "t": "15. Profil Organisasi Pergerakan Awal (Penting untuk TWK!)", "html": "<h3>1. Budi Utomo (20 Mei 1908)</h3>\n<ul>\n<li><strong>Latar Belakang:</strong> Didirikan pada 20 Mei 1908 oleh sekelompok mahasiswa STOVIA (dr. Sutomo dkk. atas gagasan dr. Wahidin Sudirohusodo). Merupakan <strong>organisasi pergerakan nasional modern pertama</strong> di Indonesia yang menjadi tonggak Hari Kebangkitan Nasional.</li>\n<li><strong>Tujuan Budi Utomo:</strong><ol>\n<li><strong>Meningkatkan Pendidikan dan Kebudayaan:</strong> Mengembangkan pengajaran di kalangan masyarakat Jawa dan Madura/Bali serta memajukan kebudayaan lokal.</li>\n<li><strong>Mempersiapkan Masyarakat untuk Kemandirian:</strong> Membekali masyarakat melalui pendidikan dan keterampilan dalam menghadapi tantangan sosial-politik.</li>\n<li><strong>Memperjuangkan Kepentingan Lokal:</strong> Mengadvokasi perbaikan kondisi sosial dan ekonomi masyarakat dalam sistem kolonial.</li>\n<li><strong>Membangun Kesadaran Nasional:</strong> Menumbuhkan kesadaran awal akan pentingnya persatuan dan kebangsaan.</li>\n</ol>\n</li>\n</ul>\n<h3>2. Sarekat Dagang Islam / SDI (1911)</h3>\n<ul>\n<li><strong>Latar Belakang:</strong> Awalnya didirikan oleh H. Samanhudi di Solo pada 1905/1911 dan dikembangkan oleh <strong>H.O.S. Tjokroaminoto</strong> sebagai organisasi yang berfokus pada penguatan ekonomi pedagang Muslim pribumi agar mampu bersaing menghadapi monopoli pedagang asing/Tionghoa dan kebijakan kolonial yang tidak adil.</li>\n<li><strong>Tujuan SDI:</strong><ol>\n<li><strong>Meningkatkan Kesejahteraan Ekonomi Muslim:</strong> Memperkuat kegiatan perdagangan masyarakat Muslim.</li>\n<li><strong>Mengembangkan Solidaritas Sosial di Kalangan Pedagang:</strong> Membentuk jaringan kerja sama antarpedagang pribumi.</li>\n<li><strong>Mengadvokasi Kepentingan Pedagang Muslim:</strong> Memperjuangkan hak pedagang dalam sistem ekonomi kolonial yang diskriminatif.</li>\n<li><strong>Mempromosikan Nilai Islam dalam Perdagangan:</strong> Mendorong prinsip kejujuran dan keadilan dalam kegiatan ekonomi.</li>\n</ol>\n</li>\n</ul>\n<h3>3. Sarekat Islam / SI (1912)</h3>\n<ul>\n<li><strong>Latar Belakang:</strong> Transformasi dari SDI di bawah kepemimpinan <strong>H.O.S. Tjokroaminoto</strong> agar keanggotaannya tidak terbatas hanya pada kalangan pedagang, melainkan terbuka luas bagi seluruh rakyat Indonesia untuk perjuangan nasionalisme dan kemerdekaan.</li>\n<li><strong>Tujuan Sarekat Islam (SI):</strong><ol>\n<li><strong>Memperjuangkan Kemerdekaan Nasional:</strong> Menghilangkan dominasi kolonial Belanda dalam kehidupan politik dan sosial.</li>\n<li><strong>Mengembangkan Kesadaran Nasionalisme:</strong> Meningkatkan kesadaran masyarakat tentang pentingnya persatuan bangsa.</li>\n<li><strong>Memperbaiki Kesejahteraan Sosial dan Ekonomi:</strong> Membela masyarakat kecil yang miskin dan tertinggal.</li>\n<li><strong>Memperjuangkan Hak dan Kepentingan Rakyat:</strong> Mengadvokasi keadilan bagi rakyat pribumi di hadapan pemerintah kolonial.</li>\n<li><strong>Mendorong Persatuan Antarkomunitas:</strong> Menyatukan berbagai kelompok etnis, agama, dan lapisan sosial untuk melawan kolonialisme bersama.</li>\n</ol>\n</li>\n</ul>\n<blockquote>\n<p><strong>CATATAN TWK (JEBAKAN ORGANISASI)</strong>\n* <strong>Budi Utomo:</strong> Organisasi pergerakan nasional modern <strong>pertama</strong> (fokus awal sosial-budaya &amp; pendidikan).\n* <strong>SDI → SI:</strong> SDI fokus pada <strong>ekonomi pedagang Muslim</strong>, sedangkan setelah berubah menjadi <strong>SI</strong> fokusnya meluas ke <strong>perjuangan politik, kesejahteraan rakyat, dan kemerdekaan nasional</strong> (bukan sekadar organisasi dagang atau keagamaan sempit).</p>\n</blockquote>", "min": 2, "nc": 0}, {"id": 16, "g": "TWK · Nasionalisme 3", "t": "1. Muhammadiyah (1912)", "html": "<h3>Profil Singkat</h3>\n<p><strong>Muhammadiyah</strong> adalah salah satu organisasi Islam modern terbesar di Indonesia yang didirikan pada tahun <strong>1912</strong> oleh <strong>KH. Ahmad Dahlan</strong>. Organisasi ini memiliki peran signifikan dalam perkembangan nasionalisme dan reformasi sosial-keagamaan di Indonesia.</p>\n<h3>Tujuan Muhammadiyah dalam Perkembangan Nasionalisme</h3>\n<ol>\n<li><strong>Meningkatkan Pendidikan dan Kesejahteraan Sosial</strong>\n    Mengembangkan sistem pendidikan modern dan layanan sosial (sekolah, rumah sakit, panti asuhan) untuk meningkatkan kualitas hidup masyarakat serta mendorong pengetahuan dan keterampilan yang relevan dengan perkembangan zaman.</li>\n<li><strong>Memperkuat Identitas dan Kesadaran Islam</strong>\n    Memperkuat identitas Islam dan mengajarkan ajaran Islam yang murni sesuai prinsip pembaruan (reformasi), serta menanamkan kesadaran beragama yang kuat.</li>\n<li><strong>Mengadvokasi dan Berkontribusi dalam Perjuangan Kemerdekaan</strong>\n    Berpartisipasi dalam perjuangan kemerdekaan Indonesia sesuai dengan prinsip-prinsip Islam dan memberikan kontribusi nyata bagi kemajuan bangsa.</li>\n<li><strong>Reformasi Sosial dan Kultural</strong>\n    Melakukan pembaruan dalam berbagai aspek sosial dan kultural yang dianggap tidak selaras dengan ajaran Islam murni dan kemajuan zaman.</li>\n<li><strong>Mendorong Persatuan dan Solidaritas Nasional</strong>\n    Menggalang persatuan dan solidaritas di antara berbagai kelompok etnis, agama, dan lapisan sosial untuk mencapai kemerdekaan dan kesejahteraan bersama.</li>\n</ol>\n<blockquote>\n<p><strong>INGAT!</strong>\nMuhammadiyah berperan besar dalam mencerdaskan kehidupan bangsa dan memperkuat nasionalisme melalui <strong>pendidikan, reformasi sosial, dan persatuan</strong>.</p>\n<p><strong>RINGKASAN KILAT &amp; CATATAN TWK (FAVORIT BKN)</strong>\n* <strong>Pendiri &amp; Tahun:</strong> KH. Ahmad Dahlan (1912).\n* <strong>Kata Kunci Soal:</strong> Pendidikan, reformasi sosial, layanan sosial, persatuan.\n* <strong>Perbedaan Konsep:</strong> Muhammadiyah adalah organisasi Islam modern dengan fokus <strong>sosial dan pendidikan</strong>.\n* <strong>Jebakan TWK:</strong> Mengira fokus utama Muhammadiyah sejak awal adalah partai politik atau kongsi dagang/ekonomi.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 17, "g": "TWK · Nasionalisme 3", "t": "2. Indische Partij (25 Desember 1912)", "html": "<h3>Profil Singkat</h3>\n<p><strong>Indische Partij</strong> adalah salah satu organisasi politik paling berpengaruh dalam sejarah pergerakan nasional Indonesia. Didirikan pada <strong>25 Desember 1912</strong> oleh <strong>Tiga Serangkai</strong>, yaitu <strong>E.F.E. Douwes Dekker (Danudirdja Setiabudi)</strong>, <strong>Dr. Tjipto Mangunkusumo</strong>, dan <strong>Ki Hajar Dewantara (Suwardi Suryaningrat)</strong>. Indische Partij menjadi pelopor perjuangan politik melawan kolonialisme Belanda dan mempromosikan paham kebangsaan (<em>Indische Nationalisme</em>).</p>\n<h3>Tujuan Indische Partij dalam Perkembangan Nasionalisme</h3>\n<ol>\n<li><strong>Memperjuangkan Kemerdekaan dari Penjajahan Belanda:</strong> Menghapuskan kolonialisme Belanda dan mewujudkan negara Indonesia yang merdeka dan berdaulat.</li>\n<li><strong>Meningkatkan Kesadaran Nasional di Kalangan Rakyat:</strong> Menumbuhkan kesadaran akan pentingnya persatuan dan kemerdekaan di seluruh lapisan masyarakat lintas etnis dan agama.</li>\n<li><strong>Menegakkan Keadilan Sosial dan Politik:</strong> Memperjuangkan hak-hak rakyat pribumi yang terabaikan oleh kebijakan diskriminatif pemerintah kolonial.</li>\n<li><strong>Membentuk Identitas Nasional:</strong> Menyatukan berbagai kelompok etnis dan golongan sosial di Hindia Belanda menjadi satu identitas kebangsaan untuk melawan penjajah.</li>\n<li><strong>Membangun Kesadaran Politik dan Pendidikan:</strong> Meningkatkan pemahaman politik rakyat agar siap menghadapi tantangan menuju kemerdekaan.</li>\n</ol>\n<h3>Hambatan yang Dihadapi Indische Partij</h3>\n<ul>\n<li>Penindasan, pelarangan, dan pengawasan ketat dari pemerintah kolonial Belanda.</li>\n<li>Perbedaan pandangan internal di antara sebagian anggota.</li>\n<li>Kurangnya dukungan dari sebagian masyarakat pada masa awal karena gagasan kemerdekaan masih dianggap terlalu radikal.</li>\n<li>Terbatasnya akses media massa untuk menyebarkan ide perjuangan.</li>\n<li>Adanya politik adu domba (<em>devide et impera</em>) dari pemerintah Belanda.</li>\n</ul>\n<blockquote>\n<p><strong>INGAT!</strong>\n<strong>Indische Partij</strong> adalah <strong>organisasi politik modern pertama</strong> yang secara terbuka dan terang-terangan menuntut kemerdekaan Indonesia dari penjajahan Belanda.</p>\n<p><strong>RINGKASAN KILAT &amp; CATATAN TWK (FAVORIT BKN)</strong>\n* <strong>Pendiri &amp; Tanggal:</strong> 25 Desember 1912 oleh Douwes Dekker, Tjipto Mangunkusumo, dan Ki Hajar Dewantara.\n* <strong>Kata Kunci Soal:</strong> Kemerdekaan terbuka, partai politik pertama, kesadaran nasional, keadilan politik, identitas nasional.\n* <strong>Perbedaan Konsep:</strong> Indische Partij (organisasi politik radikal/non-kooperatif) ≠ Muhammadiyah (organisasi pendidikan &amp; sosial-keagamaan).\n* <strong>Jebakan TWK:</strong> Menyamakan tujuan dan strategi organisasi politik dengan organisasi sosial-budaya.</p>\n</blockquote>", "min": 2, "nc": 0}, {"id": 18, "g": "TWK · Nasionalisme 3", "t": "3. Partai Nasional Indonesia / PNI (4 Juli 1927)", "html": "<h3>Profil Singkat</h3>\n<p><strong>Partai Nasional Indonesia (PNI)</strong> didirikan pada <strong>4 Juli 1927</strong> oleh <strong>Ir. Soekarno</strong> bersama tokoh-tokoh pergerakan lainnya (seperti Cipto Mangunkusumo, Sartono, Iskaq Tjokrohadisuryo, Sunaryo, dan Budiarto). PNI menjadi kekuatan politik utama pada periode radikal yang berhaluan <strong>non-kooperatif</strong> dan berdikari (<em>self-help</em>).</p>\n<h3>Tujuan Utama PNI dalam Perkembangan Nasionalisme</h3>\n<ol>\n<li><strong>Menggagas Kemerdekaan Indonesia:</strong> Mencapai kemerdekaan Indonesia sepenuhnya dari penjajahan Belanda dan mendirikan negara berdaulat.</li>\n<li><strong>Membangun Kesadaran dan Identitas Nasional:</strong> Menyatukan berbagai kelompok etnis, agama, dan golongan sosial ke dalam satu identitas kebangsaan Indonesia.</li>\n<li><strong>Mendorong Reformasi Sosial dan Politik:</strong> Memperbaiki kondisi rakyat dan menghapuskan sistem kolonial yang diskriminatif.</li>\n<li><strong>Meningkatkan Pendidikan dan Kesadaran Politik:</strong> Mendidik rakyat secara politik agar siap berpartisipasi dalam pemerintahan sendiri.</li>\n<li><strong>Menggalang Persatuan Nasional:</strong> Mempersatukan seluruh elemen bangsa untuk melawan penjajahan secara kolektif.</li>\n<li><strong>Menetapkan Ideologi Nasionalis yang Kuat:</strong> Mengembangkan ideologi nasionalisme (Marhaenisme) sebagai landasan perjuangan kemerdekaan.</li>\n</ol>\n<blockquote>\n<p><strong>RINGKASAN KILAT &amp; CATATAN TWK</strong>\n* <strong>Pendiri &amp; Tanggal:</strong> 4 Juli 1927 oleh Ir. Soekarno dkk.\n* <strong>Fokus Utama:</strong> Perjuangan politik non-kooperatif, ideologi nasionalis, kemerdekaan penuh, dan persatuan nasional.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 19, "g": "TWK · Nasionalisme 3", "t": "4. Sumpah Pemuda (28 Oktober 1928)", "html": "<h3>Pengantar</h3>\n<p><strong>Sumpah Pemuda</strong> merupakan ikrar kebangsaan yang diucapkan pada <strong>28 Oktober 1928</strong> dalam <strong>Kongres Pemuda II</strong>. Peristiwa bersejarah ini menjadi tonggak lahirnya persatuan bangsa Indonesia yang melampaui sekat-sekat kedaerahan dan memperkuat semangat perjuangan menuju kemerdekaan.</p>\n<h3>Tujuan Sumpah Pemuda dalam Perkembangan Nasionalisme</h3>\n<ol>\n<li><strong>Menyatukan Berbagai Kelompok Etnis dan Daerah:</strong> Menciptakan rasa persatuan di antara beragam suku, bahasa, dan daerah di kepulauan Nusantara.</li>\n<li><strong>Membangun Identitas Nasional yang Kuat:</strong> Membentuk identitas kebangsaan yang melampaui batasan etnis, agama, dan kedaerahan (<em>Satu Tanah Air, Satu Bangsa, Satu Bahasa: Indonesia</em>).</li>\n<li><strong>Menggalang Dukungan untuk Kemerdekaan:</strong> Memobilisasi semangat perjuangan dan kesadaran politik di kalangan pemuda dan masyarakat luas.</li>\n<li><strong>Mengurangi Perpecahan dan Konflik Antardaerah:</strong> Menghapus sifat kedaerahan (provinsialisme) yang sebelumnya menghambat perjuangan melawan penjajah.</li>\n<li><strong>Mendorong Kesadaran Politik di Kalangan Pemuda:</strong> Menegaskan peran strategis generasi muda sebagai motor penggerak kemerdekaan.</li>\n<li><strong>Mengembangkan Sentimen Nasionalisme yang Konstruktif:</strong> Menumbuhkan semangat kebangsaan positif yang mendorong kerja sama lintas elemen masyarakat.</li>\n</ol>\n<blockquote>\n<p><strong>INGAT!</strong>\nSumpah Pemuda menjadi momentum lahirnya kesadaran persatuan bangsa melalui ikrar <strong>satu tanah air, satu bangsa, dan satu bahasa Indonesia</strong>.</p>\n<p><strong>CATATAN TWK</strong>\n* <strong>Kata Kunci Soal:</strong> Persatuan, identitas nasional, pemuda, Kongres Pemuda II (28 Oktober 1928).\n* <strong>Pengecoh TWK:</strong> Jangan tertukar antara momentum <strong>Sumpah Pemuda (1928)</strong> sebagai tonggak persatuan bangsa dengan <strong>Proklamasi Kemerdekaan (1945)</strong> sebagai tonggak berdirinya negara merdeka.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 20, "g": "TWK · Nasionalisme 3", "t": "5. Program 3A (Kebijakan Kontrol Kolonial)", "html": "<h3>Pengertian</h3>\n<p><strong>Program 3A</strong> dalam catatan ini merujuk pada kebijakan pemerintah kolonial Belanda untuk mengelola dan mengontrol masyarakat Indonesia melalui tiga pendekatan utama, yaitu <strong>Asimilasi, Akomodasi, dan Adaptasi</strong>. Meskipun tidak dirancang untuk mendukung nasionalisme, kebijakan ini turut memengaruhi dinamika kesadaran nasional bangsa Indonesia.</p>\n<h3>Tiga Strategi Utama Program 3A</h3>\n<ol>\n<li><strong>Asimilasi</strong>\n    Mengintegrasikan atau menyatukan masyarakat Indonesia ke dalam struktur kolonial Belanda dengan cara mengadopsi nilai-nilai, budaya, dan sistem pemerintahan Belanda.</li>\n<li><strong>Akomodasi</strong>\n    Menyesuaikan kebijakan kolonial dengan kondisi sosial dan budaya lokal agar lebih mudah diterima oleh masyarakat Indonesia.</li>\n<li><strong>Adaptasi</strong>\n    Mengadaptasi kebijakan kolonial agar lebih fleksibel dan selaras dengan perkembangan zaman serta perubahan kondisi sosial di Indonesia.</li>\n</ol>\n<blockquote>\n<p><strong>CATATAN TWK</strong>\n* <strong>Asimilasi</strong> = Integrasi ke dalam sistem/budaya kolonial.\n* <strong>Akomodasi</strong> = Penyesuaian kebijakan dengan kondisi sosial-budaya lokal.\n* <strong>Adaptasi</strong> = Fleksibilitas kebijakan mengikuti perubahan sosial dan zaman.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 21, "g": "TWK · Nasionalisme 3", "t": "6. Nasionalisme Masa Awal Kemerdekaan (1945–1950)", "html": "<h3>Peta Konsep Nasionalisme Awal Kemerdekaan</h3>\n<ol>\n<li><strong>Proklamasi Kemerdekaan sebagai Awal Perjuangan</strong><ul>\n<li>Proklamasi <strong>17 Agustus 1945</strong> bukanlah titik akhir perjuangan, melainkan titik awal mempertahankan kedaulatan bangsa.</li>\n<li>Memasuki era kepemimpinan Presiden Soekarno (Orde Lama), fokus diarahkan pada <em>nation and character building</em> (pembangunan karakter bangsa) yang <strong>anti-imperialisme, anti-kolonialisme, dan pro-perdamaian</strong>.</li>\n</ul>\n</li>\n<li><strong>Periode Awal Kemerdekaan / Revolusi Fisik (1945–1950)</strong><ul>\n<li>Dikenal sebagai masa <strong>Revolusi Fisik</strong>, ketika Indonesia harus menghadapi kekuatan asing (khususnya Belanda) yang ingin kembali menjajah Indonesia.</li>\n</ul>\n</li>\n<li><strong>Corak Nasionalisme Masa Awal Kemerdekaan</strong><ul>\n<li>Berfokus pada penguatan kedaulatan negara dan identitas nasional sebagai ideologi perjuangan anti-kolonialisme untuk mengusir penjajah dari bumi Indonesia.</li>\n</ul>\n</li>\n<li><strong>Upaya Mempertahankan Kemerdekaan</strong><ul>\n<li>Diwujudkan melalui pengorbanan jiwa dan raga atas nama Revolusi di berbagai daerah (perjuangan bersenjata dan diplomasi).</li>\n<li>Kedatangan pasukan Sekutu pada awalnya disambut secara netral oleh Indonesia, namun setelah diketahui diboncengi oleh <strong>NICA</strong> (pemerintahan sipil Hindia Belanda), timbul perlawanan rakyat di seluruh daerah.</li>\n</ul>\n</li>\n<li><strong>Integrasi dan Persatuan Nasional</strong><ul>\n<li>Tantangan paling kompleks pada awal kemerdekaan meliputi keberagaman etnis dan budaya, keterbatasan infrastruktur, perpecahan politik/ideologi, ketidakadilan sosial, serta ancaman militer asing.</li>\n</ul>\n</li>\n</ol>\n<blockquote>\n<p><strong>CATATAN TWK</strong>\n* <strong>Fokus Utama:</strong> Perjuangan fisik (1945–1950), penguatan kedaulatan, dan menjaga integrasi nasional.\n* <strong>Kata Kunci Soal:</strong> Revolusi fisik, NICA, <em>nation character building</em>, anti-kolonialisme, integrasi nasional.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 22, "g": "TWK · Nasionalisme 3", "t": "7. Nasionalisme Masa Orde Lama", "html": "<h3>Karakter &amp; Tujuan Nasionalisme Era Soekarno</h3>\n<p>Presiden Soekarno membangun karakter politik nasionalisme Indonesia yang bersifat <strong>anti-imperialisme, anti-kolonialisme, dan pro-perdamaian</strong>. Tujuannya adalah membangkitkan rasa percaya diri sebagai bangsa yang besar, bermartabat, dan sanggup berdiri di atas kaki sendiri (<em>Berdikari</em>) dalam menyelesaikan masalahnya.</p>\n<h3>Kondisi &amp; Kebijakan Utama</h3>\n<ul>\n<li><strong>Perlawanan terhadap Nekolim:</strong> Kebijakan politik luar negeri dan dalam negeri diarahkan untuk melenyapkan sisa-sisa kolonialisme dan imperialisme asing (Amerika Serikat dan Eropa Barat).</li>\n<li><strong>Konsep NASAKOM:</strong> Menyatukan tiga pilar kekuatan ideologi besar di Indonesia—<strong>Nasionalis, Agama, dan Komunis</strong>—untuk memperkuat persatuan nasional dan menangkal imperialisme Barat.</li>\n</ul>\n<h3>Dinamika, Tantangan, dan Akhir Orde Lama</h3>\n<ol>\n<li><strong>Pergeseran Makna Revolusi:</strong> Konsep nasionalisme dikaitkan dengan doktrin <em>\"revolusi belum selesai\"</em>.</li>\n<li><strong>Konflik Ideologi:</strong> Pertentangan ideologi yang tajam, terutama meningkatnya pengaruh komunisme (PKI) yang menggoyahkan keseimbangan politik dan kewibawaan pemerintah.</li>\n<li><strong>Krisis Multidimensi &amp; Tragedi 1965:</strong> Memburuknya kondisi ekonomi, ketegangan internasional, gerakan separatis daerah, dan kelemahan administrasi negara berpuncak pada tragedi <strong>Gerakan 30 September 1965 (G30S/PKI)</strong> yang mengakhiri era Orde Lama dan melahirkan Orde Baru.</li>\n</ol>\n<blockquote>\n<p><strong>CATATAN TWK</strong>\n* <strong>Ciri Nasionalisme Orde Lama:</strong> Anti-imperialisme, anti-kolonialisme, pro-perdamaian, dan <em>nation character building</em>.\n* <strong>Pilar Pemersatu:</strong> <strong>NASAKOM</strong> (Nasionalis, Agama, Komunis).\n* <strong>Akhir Periode:</strong> Tragedi G30S/PKI tahun 1965.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 23, "g": "TWK · Nasionalisme 3", "t": "8. Nasionalisme Masa Orde Baru (1966–1998)", "html": "<h3>1. Corak Nasionalisme Orde Baru</h3>\n<ul>\n<li><strong>Sentralisme Birokratik:</strong> Kebijakan dan arah nasionalisme dikendalikan secara terpusat oleh pemerintah pusat.</li>\n<li><strong>Nasionalisme Militeristik:</strong> Peran militer (ABRI) sangat dominan dalam menjaga stabilitas dan menanamkan nilai nasionalisme kepada masyarakat.</li>\n<li><strong><em>State-Oriented</em>, bukan <em>Nation-Oriented</em>:</strong> Loyalitas utama warga negara diarahkan kepada negara/pemerintah (<em>\"nasionalisme oleh dan untuk negara\"</em>), bukan kepada bangsa secara kritis dan partisipatif.</li>\n</ul>\n<h3>2. Penanaman Nasionalisme Melalui Pendidikan</h3>\n<ul>\n<li>Pemerintah memasukkan mata pelajaran <strong>Pendidikan Sejarah Perjuangan Bangsa (PSPB)</strong> ke dalam kurikulum sekolah berdasarkan Instruksi Presiden Soeharto.</li>\n<li>Tujuannya agar pelajaran sejarah tidak sekadar menjadi hafalan pengetahuan, melainkan sarana menanamkan nilai-nilai perjuangan bangsa dan rasa cinta tanah air kepada generasi muda.</li>\n</ul>\n<h3>3. Kebijakan Politik yang Sentralistik</h3>\n<ul>\n<li>Pemerintah memegang kontrol penuh atas kehidupan politik, organisasi kemasyarakatan, dan media massa.</li>\n<li>Ruang kebebasan berpendapat dan berekspresi dibatasi secara ketat demi menjaga stabilitas keamanan dan pembangunan nasional.</li>\n</ul>\n<h3>4. Dampak dan Tantangan Masa Orde Baru</h3>\n<ul>\n<li><strong>Praktik KKN &amp; Kesenjangan:</strong> Tumbuh suburnya korupsi, kolusi, dan nepotisme (KKN), kronisme kekuasaan, serta kesenjangan sosial-ekonomi yang memicu ketidakpuasan rakyat.</li>\n<li><strong>Keterbatasan Demokrasi:</strong> Ruang demokrasi menyempit, kebebasan pers dikekang, dan lemahnya pengawasan terhadap aparatur negara.</li>\n<li><strong>Tantangan Utama:</strong> Menjaga stabilitas politik, pengendalian sosial, isu pelanggaran HAM, serta pembatasan kebebasan politik dan media.</li>\n</ul>\n<blockquote>\n<p><strong>CATATAN TWK</strong>\n* <strong>Periode:</strong> 1966–1998.\n* <strong>Kata Kunci Soal:</strong> Sentralisme birokratik, nasionalisme militeristik, <em>state-oriented</em>, PSPB, stabilitas politik, KKN.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 24, "g": "TWK · Nasionalisme 3", "t": "9. Nasionalisme Masa Reformasi (1998–Sekarang)", "html": "<h3>1. Pembaruan Paham Nasionalisme</h3>\n<p>Masa Reformasi dimulai sejak <strong>1998</strong> dengan semangat pembaruan yang nyata untuk mewujudkan cita-cita nasional secara demokratis, terbuka, serta tetap menjaga jati diri dan identitas nasional bangsa Indonesia.</p>\n<h3>2. Tantangan Nasionalisme di Era Reformasi</h3>\n<ul>\n<li><strong>Individualisme &amp; Gaya Hidup Digital:</strong> Perkembangan teknologi gawai (<em>gadget</em>) dan media sosial cenderung mendorong sikap individualistis dan mengikis solidaritas sosial.</li>\n<li><strong>Percepatan Teknologi Global:</strong> Masyarakat dituntut melek teknologi dan ekonomi digital namun harus tetap berlandaskan nilai nasionalisme agar jati diri bangsa tidak tergerus (<em>kekumuhan nasionalisme</em>).</li>\n</ul>\n<h3>3. Tantangan Masyarakat Indonesia ke Depan</h3>\n<ul>\n<li><strong>Globalisasi Budaya Digital:</strong> Arus budaya dunia maya yang mengglobal menuntut kemandirian bangsa untuk tetap berdiri di atas kaki sendiri.</li>\n<li><strong>Pengakuan Politik &amp; Politik Pengakuan:</strong> Demokrasi masa depan harus menjamin hak setiap individu sekaligus menghormati hak aneka kelompok budaya agar dapat hidup berdampingan secara damai dan produktif dalam bingkai NKRI.</li>\n</ul>\n<blockquote>\n<p><strong>CATATAN TWK</strong>\n* <strong>Kata Kunci Soal:</strong> Reformasi (1998), pembaruan, teknologi digital, globalisasi, demokrasi, pengakuan politik.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 25, "g": "TWK · Nasionalisme 3", "t": "10. Nasionalisme Masa Pasca-Reformasi", "html": "<p>Setelah berakhirnya Orde Baru, nasionalisme Indonesia berkembang menjadi lebih kompleks dan multidimensional dengan tiga pilar fokus utama:</p>\n<h3>Tiga Fokus Utama Pasca-Reformasi</h3>\n<ol>\n<li><strong>Pembangunan Demokrasi</strong><ul>\n<li>Penerapan sistem demokrasi yang lebih terbuka dan partisipatif.</li>\n<li>Penyelenggaraan pemilihan umum (Pemilu) yang lebih bebas, jujur, adil, dan transparan.</li>\n<li>Pembentukan dan penguatan lembaga-lembaga negara yang demokratis.</li>\n</ul>\n</li>\n<li><strong>Desentralisasi (Otonomi Daerah)</strong><ul>\n<li>Pemberian kewenangan otonomi yang lebih luas kepada pemerintah daerah.</li>\n<li>Memperkuat kapasitas pemerintahan lokal serta mengakomodasi keragaman budaya dan potensi daerah dalam kerangka NKRI.</li>\n</ul>\n</li>\n<li><strong>Reformasi Sosial dan Ekonomi</strong><ul>\n<li>Pembaruan di sektor pendidikan, kesehatan, dan ekonomi untuk meningkatkan kesejahteraan rakyat serta mengurangi ketimpangan antarwilayah.</li>\n</ul>\n</li>\n</ol>\n<h3>Lima Tantangan Besar Nasionalisme Pasca-Reformasi</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">No</th>\n<th style=\"text-align: left;\">Tantangan Utama</th>\n<th style=\"text-align: left;\">Dampak terhadap Nasionalisme</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\"><strong>1</strong></td>\n<td style=\"text-align: left;\"><strong>Politisasi Etnis dan Agama</strong></td>\n<td style=\"text-align: left;\">Politik identitas memicu polarisasi sosial yang dapat memecah belah persatuan bangsa.</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\"><strong>2</strong></td>\n<td style=\"text-align: left;\"><strong>Ketimpangan Ekonomi dan Sosial</strong></td>\n<td style=\"text-align: left;\">Kesenjangan kesejahteraan memicu kecemburuan sosial dan melemahkan rasa keadilan nasional.</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\"><strong>3</strong></td>\n<td style=\"text-align: left;\"><strong>Kualitas Demokrasi &amp; Stabilitas Politik</strong></td>\n<td style=\"text-align: left;\">Tantangan menjaga demokrasi yang substantif, bebas korupsi, dan stabilitas pemerintahan yang berkelanjutan.</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\"><strong>4</strong></td>\n<td style=\"text-align: left;\"><strong>Separatisme, Ekstremisme, &amp; Radikalisme</strong></td>\n<td style=\"text-align: left;\">Gerakan pemisahan diri dan paham kekerasan mengancam keutuhan wilayah serta ideologi Pancasila.</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\"><strong>5</strong></td>\n<td style=\"text-align: left;\"><strong>Globalisasi dan Identitas Nasional</strong></td>\n<td style=\"text-align: left;\">Masuknya budaya dan nilai global secara masif dapat mengaburkan jati diri dan nilai kebangsaan generasi muda.</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>INGAT!</strong>\nNasionalisme pasca-reformasi menuntut keseimbangan antara <strong>kebebasan demokrasi, otonomi daerah, dan persatuan nasional</strong> di tengah tantangan global yang semakin kompleks.</p>\n<p><strong>CATATAN TWK (SERING KELUAR!)</strong>\n* <strong>Kata Kunci Soal:</strong> Demokrasi terbuka, desentralisasi (otonomi daerah), reformasi sosial-ekonomi, globalisasi, politik identitas.\n* <strong>Pengecoh TWK:</strong> <strong>Desentralisasi ≠ Federalisme</strong>. Indonesia tetap merupakan <strong>Negara Kesatuan</strong> (NKRI) yang menerapkan asas desentralisasi/otonomi daerah, bukan negara serikat/federal.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 26, "g": "TIU · Hafalan & Rumus", "t": "PERKALIAN 1–10 WAJIB HAFAL CPNS", "html": "<p>Perkalian dasar adalah kunci penting dalam mengerjakan soal TIU. Hafalkan tabel perkalian 1--10 agar menghitung lebih cepat dan akurat!</p>\n<h3>Tabel Perkalian 1--10</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">×</th>\n<th style=\"text-align: center;\">1</th>\n<th style=\"text-align: center;\">2</th>\n<th style=\"text-align: center;\">3</th>\n<th style=\"text-align: center;\">4</th>\n<th style=\"text-align: center;\">5</th>\n<th style=\"text-align: center;\">6</th>\n<th style=\"text-align: center;\">7</th>\n<th style=\"text-align: center;\">8</th>\n<th style=\"text-align: center;\">9</th>\n<th style=\"text-align: center;\">10</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\"><strong>1</strong></td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">5</td>\n<td style=\"text-align: center;\">6</td>\n<td style=\"text-align: center;\">7</td>\n<td style=\"text-align: center;\">8</td>\n<td style=\"text-align: center;\">9</td>\n<td style=\"text-align: center;\">10</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\"><strong>2</strong></td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">6</td>\n<td style=\"text-align: center;\">8</td>\n<td style=\"text-align: center;\">10</td>\n<td style=\"text-align: center;\">12</td>\n<td style=\"text-align: center;\">14</td>\n<td style=\"text-align: center;\">16</td>\n<td style=\"text-align: center;\">18</td>\n<td style=\"text-align: center;\">20</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\"><strong>3</strong></t h3>\n<ol>\n<li>\n<p><strong>Pola Perkalian 9</strong><br />\n<em>Trik:</em> Angka depan naik 1, angka belakang turun 1.</p>\n<ul>\n<li>9 × 1 = 09</li>\n<li>9 × 2 = 18</li>\n<li>9 × 3 = 27</li>\n<li>9 × 4 = 36</li>\n<li>9 × 5 = 45</li>\n<li>9 × 6 = 54</li>\n<li>9 × 7 = 63</li>\n<li>9 × 8 = 72</li>\n<li>9 × 9 = 81</li>\n<li>9 × 10 = 90</li>\n</ul>\n</li>\n<li>\n<p><strong>Pola Perkalian 5</strong><br />\n<em>Trik:</em> Hasilnya selalu berakhir dengan angka 0 atau 5.</p>\n<ul>\n<li>5 × 1 = 05</li>\n<li>5 × 2 = 10</li>\n<li>5 × 3 = 15</li>\n<li>5 × 4 = 20</li>\n<li>5 × 5 = 25</li>\n<li>5 × 6 = 30</li>\n<li>5 × 7 = 35</li>\n<li>5 × 8 = 40</li>\n<li>5 × 9 = 45</li>\n<li>5 × 10 = 50</li>\n</ul>\n</li>\n<li>\n<p><strong>Pola Perkalian Genap</strong><br />\n<em>Trik:</em> Perkalian dengan 2, 4, 6, 8, 10 hasilnya selalu bilangan genap.</p>\n<ul>\n<li><em>Contoh:</em><ul>\n<li>2 × 7 = 14</li>\n<li>4 × 7 = 28</li>\n<li>6 × 7 = 42</li>\n<li>8 × 7 = 56</li>\n<li>10 × 7 = 70</li>\n</ul>\n</li>\n</ul>\n</li>\n</ol>\n<blockquote>\n<p><strong>INGAT!</strong><br />\nHafal perkalian 1--10 = Hemat waktu = Lebih yakin jawab soal.</p>\n<p><strong>Saran Belajar:</strong>\n- Baca tabel setiap hari.\n- Tutup bagian hasil, lalu coba tulis sendiri.\n- Ulangi sampai hafal tanpa melihat!</p>\n<p><strong>Kunci Sukses:</strong> Sedikit demi sedikit, hafal pasti bisa! Semangat pejuang CPNS!</p>\n</blockquote>", "min": 2, "nc": 0}, {"id": 27, "g": "TIU · Hafalan & Rumus", "t": "PECAHAN ISTIMEWA WAJIB HAFAL CPNS", "html": "<p>Pecahan istimewa adalah pecahan yang sering muncul di soal TIU. Hafalkan bentuk pecahan, desimal, dan persennya agar lebih cepat dan akurat!</p>\n<h3>Level 1 (Wajib Hafal 100%)</h3>\n<p><em>Minimal hafal delapan pecahan dasar ini!</em></p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Pecahan</th>\n<th style=\"text-align: center;\">Desimal</th>\n<th style=\"text-align: center;\">Persen</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1/2</td>\n<td style=\"text-align: center;\">0,5</td>\n<td style=\"text-align: center;\">50%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">1/4</td>\n<td style=\"text-align: center;\">0,25</td>\n<td style=\"text-align: center;\">25%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">3/4</td>\n<td style=\"text-align: center;\">0,75</td>\n<td style=\"text-align: center;\">75%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">1/5</td>\n<td style=\"text-align: center;\">0,2</td>\n<td style=\"text-align: center;\">20%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">2/5</td>\n<td style=\"text-align: center;\">0,4</td>\n<td style=\"text-align: center;\">40%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">3/5</td>\n<td style=\"text-align: center;\">0,6</td>\n<td style=\"text-align: center;\">60%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">4/5</td>\n<td style=\"text-align: center;\">0,8</td>\n<td style=\"text-align: center;\">80%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">1/10</td>\n<td style=\"text-align: center;\">0,1</td>\n<td style=\"text-align: center;\">10%</td>\n</tr>\n</tbody>\n</table>\n<h3>Level 2 (Sering Keluar)</h3>\n<p><em>Sering muncul pada soal: Perbandingan, Rasio, Peluang, dan Aritmetika Sosial.</em></p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Pecahan</th>\n<th style=\"text-align: center;\">Desimal</th>\n<th style=\"text-align: center;\">Persen</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1/3</td>\n<td style=\"text-align: center;\">0,3333</td>\n<td style=\"text-align: center;\">33 1/3 %</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">2/3</td>\n<td style=\"text-align: center;\">0,6667</td>\n<td style=\"text-align: center;\">66 2/3 %</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">1/6</td>\n<td style=\"text-align: center;\">0,1667</td>\n<td style=\"text-align: center;\">16 2/3 %</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">5/6</td>\n<td style=\"text-align: center;\">0,8333</td>\n<td style=\"text-align: center;\">83 1/3 %</td>\n</tr>\n</tbody>\n</table>\n<h3>Level 3 (Bonus)</h3>\n<p><em>Sangat membantu mempercepat pengerjaan soal!</em></p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Pecahan</th>\n<th style=\"text-align: center;\">Desimal</th>\n<th style=\"text-align: center;\">Persen</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1/8</td>\n<td style=\"text-align: center;\">0,125</td>\n<td style=\"text-align: center;\">12,5%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">3/8</td>\n<td style=\"text-align: center;\">0,375</td>\n<td style=\"text-align: center;\">37,5%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">5/8</td>\n<td style=\"text-align: center;\">0,625</td>\n<td style=\"text-align: center;\">62,5%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">7/8</td>\n<td style=\"text-align: center;\">0,875</td>\n<td style=\"text-align: center;\">87,5%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">1/9</td>\n<td style=\"text-align: center;\">0,1111</td>\n<td style=\"text-align: center;\">11,11%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">2/9</td>\n<td style=\"text-align: center;\">0,2222</td>\n<td style=\"text-align: center;\">22,22%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">4/9</td>\n<td style=\"text-align: center;\">0,4444</td>\n<td style=\"text-align: center;\">44,44%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">5/9</td>\n<td style=\"text-align: center;\">0,5556</td>\n<td style=\"text-align: center;\">55,56%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">7/9</td>\n<td style=\"text-align: center;\">0,7778</td>\n<td style=\"text-align: center;\">77,78%</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">8/9</td>\n<td style=\"text-align: center;\">0,8889</td>\n<td style=\"text-align: center;\">88,89%</td>\n</tr>\n</tbody>\n</table>\n<h3>Tips &amp; Trik Mudah Hafal Pecahan Istimewa</h3>\n<ol>\n<li>\n<p><strong>Hafal Persentase Dulu</strong><br />\n    Otak lebih mudah mengenali persentase. Mengubah bentuk persen ke pecahan dan desimal jauh lebih mudah:</p>\n<ul>\n<li>50% =  50/100  = 0,5 =  1/2 </li>\n<li>20% =  20/100  = 0,2 =  1/5 </li>\n<li>75% =  75/100  = 0,75 =  3/4 </li>\n</ul>\n</li>\n<li>\n<p><strong>Kelompokkan Angka</strong></p>\n<ul>\n<li><strong>Per Empat (Naik 25%):</strong><ul>\n<li>1/4  = 25%</li>\n<li>2/4  = 50%</li>\n<li>3/4  = 75%</li>\n</ul>\n</li>\n<li><strong>Per Lima (Naik 20%):</strong><ul>\n<li>1/5  = 20%</li>\n<li>2/5  = 40%</li>\n<li>3/5  = 60%</li>\n<li>4/5  = 80%</li>\n</ul>\n</li>\n<li><strong>Per Delapan (Naik 25%, berakhiran ,5):</strong><ul>\n<li>1/8  = 12,5%</li>\n<li>3/8  = 37,5%</li>\n<li>5/8  = 62,5%</li>\n<li>7/8  = 87,5%</li>\n</ul>\n</li>\n</ul>\n</li>\n<li>\n<p><strong>Ingat Angka \"3\"</strong><br />\n    Mudah karena tinggal dikali dua:</p>\n<ul>\n<li>1/3  = 0,3333 = 33 1/3 %</li>\n<li>Dikali 2 →  2/3  = 0,6667 = 66 2/3 %</li>\n</ul>\n</li>\n<li>\n<p><strong>Pecahan Per Sembilan</strong><br />\n    Pembilang merupakan angka yang berulang pada bentuk desimalnya:</p>\n<ul>\n<li>1/9  = 0,1111</li>\n<li>2/9  = 0,2222</li>\n<li>3/9  = 0,3333</li>\n<li>4/9  = 0,4444</li>\n<li>5/9  = 0,5556</li>\n<li>6/9  = 0,6667</li>\n<li>7/9  = 0,7778</li>\n<li>8/9  = 0,8889</li>\n</ul>\n</li>\n<li>\n<p><strong>Patokan 100%</strong><br />\n    Gunakan 100% sebagai nilai utuh untuk mempermudah mencari selisih atau sisa bagian.</p>\n</li>\n</ol>\n<h3>Shortcut Cepat! (Rahasia CPNS)</h3>\n<p>Kalau melihat angka persen di soal, langsung ubah menjadi pecahan agar perhitungan lebih cepat:</p>\n<ul>\n<li>50% →  1/2 </li>\n<li>25% →  1/4 </li>\n<li>75% →  3/4 </li>\n<li>20% →  1/5 </li>\n<li>40% →  2/5 </li>\n<li>60% →  3/5 </li>\n<li>80% →  4/5 </li>\n<li>10% →  1/10 </li>\n<li>12,5% →  1/8 </li>\n<li>33 1/3 % →  1/3 </li>\n<li>66 2/3 % →  2/3 </li>\n</ul>\n<blockquote>\n<p><strong>Kunci Sukses:</strong> Hafal sedikit setiap hari, hasil besar menanti! Semangat pejuang CPNS!</p>\n</blockquote>", "min": 2, "nc": 0}, {"id": 28, "g": "TIU · Hafalan & Rumus", "t": "KUMPULAN RUMUS &amp; KONSEP DASAR TIU", "html": "<h3>1. Selisih Jarak</h3>\n<ul>\n<li><strong>Rumus Dasar:</strong>\n    Selisih Jarak = |Jarak  1 - Jarak  2|\n    <em>(Hasil selalu positif)</em></li>\n<li><strong>Tips Cepat:</strong><ul>\n<li>Selalu ubah ke satuan yang sama terlebih dahulu.</li>\n<li>Gunakan nilai mutlak (|…|) agar hasil tidak negatif.</li>\n<li>Perhatikan arah, tetapi fokus ke besaran jarak.</li>\n</ul>\n</li>\n<li><strong>Contoh:</strong><ul>\n<li>Kota A ke B = 120 km</li>\n<li>Kota C ke B = 75 km</li>\n<li>Selisih jarak A ke C = |120 - 75| = 45 km</li>\n</ul>\n</li>\n</ul>\n<h3>2. Selisih Waktu</h3>\n<ul>\n<li><strong>Rumus Dasar:</strong>\n    Selisih Waktu = Waktu Akhir - Waktu Awal\n    <em>(Jika menit/detik negatif, pinjam 1 satuan di atasnya.)</em></li>\n<li><strong>Contoh:</strong>\n    10:15 - 07:45 = 2 jam  30 menit</li>\n<li><strong>Cara Cepat:</strong><ul>\n<li>Hitung dari waktu awal ke waktu akhir (atau pinjam 1 jam = 60 menit):</li>\n<li>Menit: (60 + 15) - 45 = 30 menit</li>\n<li>Jam: (10 - 1) - 7 = 2 jam</li>\n<li>Total = 2 jam  30 menit</li>\n</ul>\n</li>\n</ul>\n<h3>3. Konversi Satuan (Wajib Hafal!)</h3>\n<ul>\n<li><strong>Panjang:</strong><ul>\n<li>1 km = 1.000 m</li>\n<li>1 m = 100 cm</li>\n<li>1 cm = 10 mm</li>\n</ul>\n</li>\n<li><strong>Berat:</strong><ul>\n<li>1 ton = 1.000 kg</li>\n<li>1 kg = 1.000 g</li>\n<li>1 g = 1.000 mg</li>\n</ul>\n</li>\n<li><strong>Waktu:</strong><ul>\n<li>1 jam = 60 menit</li>\n<li>1 menit = 60 detik</li>\n<li>1 jam = 3.600 detik</li>\n</ul>\n</li>\n<li><strong>Kecepatan:</strong><ul>\n<li>1 m/s = 3,6 km/jam</li>\n<li>1 km/jam =  5/18  m/s ≈ 0,2778 m/s</li>\n</ul>\n</li>\n<li><strong>Tips Cepat:</strong><ul>\n<li>Ingat kelipatan 10, 100, 1.000 untuk satuan panjang &amp; berat.</li>\n<li>Ingat kelipatan 60 untuk satuan waktu.</li>\n</ul>\n</li>\n</ul>\n<h3>4. Kecepatan, Jarak, dan Waktu</h3>\n<ul>\n<li><strong>Rumus Utama:</strong>\n    Kecepatan =  Jarak/Waktu \n    Jarak = Kecepatan × Waktu\n    Waktu =  Jarak/Kecepatan \n    <em>(Pastikan seluruh satuan sudah sama!)</em></li>\n<li><strong>Contoh Soal:</strong><br />\n    Mobil bergerak dengan kecepatan 60 km/jam selama 2,5 jam. Berapa jarak yang ditempuh?\n    Jarak = Kecepatan × Waktu = 60 × 2,5 = 150 km</li>\n</ul>\n<h3>5. Persentase &amp; Perbandingan Cepat</h3>\n<ul>\n<li><strong>Persentase Cepat</strong> <em>(Lebih cepat ubah persen ke pecahan!)</em>:<ul>\n<li>10% =  1/10 </li>\n<li>20% =  1/5 </li>\n<li>25% =  1/4 </li>\n<li>50% =  1/2 </li>\n<li>75% =  3/4 </li>\n</ul>\n</li>\n<li><strong>Perbandingan:</strong>\n    a : b =  a/b \n    Jika a : b = 3 : 5, maka total bagian = 3 + 5 = 8:\n    a =  3/8  × total\n    b =  5/8  × total</li>\n</ul>\n<h3>6. Average (Rata-Rata)</h3>\n<ul>\n<li><strong>Rumus:</strong>\n    Rata-rata =  Jumlah semua data/Banyak data </li>\n<li><strong>Contoh:</strong><ul>\n<li>Nilai: 70, 80, 90, 60, 100</li>\n<li>Jumlah = 400</li>\n<li>Rata-rata =  400/5  = 80</li>\n</ul>\n</li>\n<li><strong>Tips Cepat:</strong><ul>\n<li>Jumlahkan dulu semua angka, lalu bagi dengan banyaknya data.</li>\n<li>Jika ada nilai yang sama banyak, kalikan nilai dengan frekuensinya lalu bagi total data.</li>\n</ul>\n</li>\n</ul>\n<h3>7. FPB &amp; KPK (Ringkas)</h3>\n<ul>\n<li><strong>FPB (Faktor Persekutuan Terbesar):</strong><ul>\n<li>Cari faktor dari tiap angka, ambil faktor persekutuan yang terbesar.</li>\n<li><em>Contoh:</em> FPB dari 12 dan 18 = 6</li>\n</ul>\n</li>\n<li><strong>KPK (Kelipatan Persekutuan Terkecil):</strong><ul>\n<li><em>Cara cepat:</em>\nKPK(a, b) =  a × b/FPB(a, b) </li>\n<li><em>Contoh:</em> KPK dari 12 dan 18 =  12 × 18/6  = 36</li>\n</ul>\n</li>\n</ul>\n<h3>8. Pola Angka Cepat</h3>\n<ul>\n<li>Selisih tetap → <strong>Barisan Aritmetika</strong> (operasi + atau - konstan).</li>\n<li>Rasio tetap → <strong>Barisan Geometri</strong> (operasi × atau ÷ konstan).</li>\n<li>Perhatikan bilangan-bilangan faktor/kelipatan penting: 1, 2, 3, 4, 5, 6, 9, 10, 12, 15, 20, 25, 30, 50, 100 (sering muncul di soal FPB/KPK &amp; pecahan).</li>\n</ul>\n<h3>9. Prioritas Operasi (Urutan Hitung)</h3>\n<ol>\n<li>() Tanda Kurung</li>\n<li>× atau ÷ (Perkalian atau Pembagian)</li>\n<li>\n<ul>\n<li>atau - (Penjumlahan atau Pengurangan)</li>\n</ul>\n</li>\n</ol>\n<blockquote>\n<p><strong>Ingat ya!</strong> Kerjakan dari <strong>kiri ke kanan</strong> untuk operasi yang setingkat.</p>\n</blockquote>\n<h3>10. Tips Umum TIU</h3>\n<ul>\n<li>Baca soal dengan teliti.</li>\n<li>Coret informasi yang tidak perlu.</li>\n<li>Estimasi jawaban, pilih yang paling masuk akal.</li>\n<li>Hafal rumus, pahami pola, dan latihan rutin!</li>\n</ul>\n<blockquote>\n<p><strong>Kunci Sukses:</strong> Rumus dihafal, pola dipahami, soal ditaklukkan! Semangat pejuang CPNS!</p>\n</blockquote>", "min": 3, "nc": 0}];

const TH={TWK:[30,150,65],TIU:[35,175,80],TKP:[45,225,166]};

function home(){
  return `<div class="hero"><div class="row sp"><span class="pill"><i></i>SKD CPNS 2026</span>${tg()}</div><h1>Persiapan SKD<br>CPNS 2026</h1><p>Latihan soal, ujian, dan materi lengkap dengan ambang batas SKD.</p>
  <div class="hs"><span><b>${PK.length}</b> paket</span><span><b>110</b> soal / paket</span><span><b>${CH.length}</b> bab materi</span></div></div>
  <div class="tiles">
   <button class="tile" onclick="cfg.mode='latihan';go('setup')"><span class="ic">${I("edit",22)}</span><span><b>Latihan Soal</b><small>Jawaban langsung muncul</small></span></button>
   <button class="tile" onclick="cfg.mode='ujian';go('setup')"><span class="ic">${I("clock",22)}</span><span><b>Ujian</b><small>Kirim dulu, baru nilai</small></span></button>
   <button class="tile" onclick="go('materi')"><span class="ic">${I("book",22)}</span><span><b>Materi</b><small>${CH.length} bab belajar</small></span></button>
   <button class="tile" onclick="RD=0;go('read')"><span class="ic">${I("grid",22)}</span><span><b>Struktur SKD</b><small>Jenis tes & tahapan</small></span></button></div>
  <h2>Paket soal <span onclick="go('setup')">Pilih</span></h2>
  ${PK.map((p,i)=>`<button class="item" style="--c:${COL[i%4]}" onclick="cfg.pk=${i};go('setup')"><span class="ic">${I("edit")}</span><span><b>${p.n}</b><small>110 soal · TWK 30 · TIU 35 · TKP 45</small></span>${I("chev")}</button>`).join("")}
  <h2>Ambang batas SKD</h2><div class="card"><table class="st"><tr><th>Bagian</th><th>Soal</th><th>Nilai maks</th><th>Ambang</th></tr>${Object.keys(TH).map(k=>`<tr><td><b>${k}</b></td><td>${TH[k][0]}</td><td>${TH[k][1]}</td><td><b>${TH[k][2]}</b></td></tr>`).join("")}</table>
  <p class="mu" style="margin-top:8px">TWK & TIU: benar = 5, salah/kosong = 0. TKP: skor 1–5 tiap jawaban, kosong = 0.</p></div>${cr()}`;
}
function setup(){
  const n=pool().length,mins=Math.min(n,100);
  return `<div class="row sp"><h1>Pilih Soal</h1>${tg()}</div><p class="mu">Satu paket berisi 110 soal: TWK 30, TIU 35, TKP 45.</p>
  <h2>Paket</h2><div class="scroll">${PK.map((x,i)=>`<button class="pc ${i==cfg.pk?"on":""}" onclick="cfg.pk=${i};render()"><small>${x.qs.length} soal</small><b>${x.n}</b></button>`).join("")}</div>
  <h2>Bagian <span>${n} soal dipilih</span></h2><div class="slots">${Object.keys(SEC).map(k=>{const c=cnt(k);return `<button class="slot ${cfg.sel[k]&&c?"on":""}" ${c?"":"disabled"} onclick="cfg.sel.${k}=cfg.sel.${k}?0:1;render()"><b>${k}</b><small>${c} soal</small></button>`}).join("")}</div>
  <h2>Metode</h2><div class="seg"><button class="${cfg.mode=="latihan"?"on":""}" onclick="cfg.mode='latihan';render()"><b>Latihan</b><small>Jawaban langsung muncul</small></button><button class="${cfg.mode=="ujian"?"on":""}" onclick="cfg.mode='ujian';render()"><b>Ujian</b><small>Nilai setelah kirim</small></button></div>
  <div class="card row sp" style="margin-top:14px"><b>Acak urutan soal</b>${sw("shuf")}</div>
  ${cfg.mode=="ujian"?`<div class="card row sp"><div><b>Timer</b><p class="mu">${mins} menit</p></div>${sw("timer")}</div>`:""}
  <button class="cta" ${n?"":"disabled"} onclick="start()">Mulai ${cfg.mode=="ujian"?"Ujian":"Latihan"} ${I("arrow",18)}</button>${cr()}`;
}
function start(){
  const l=pool().slice();if(cfg.shuf)shuffle(l);if(S)clearInterval(S.t);
  S={l,i:0,a:{},nav:0,conf:"",f:"all",mode:cfg.mode,left:Math.min(l.length,100)*60};
  if(S.mode=="ujian"&&cfg.timer)S.t=setInterval(()=>{S.left--;const e=document.getElementById("tm");if(e)e.textContent=fmt(S.left);if(S.left<=0)finish()},1000);
  go("quiz");
}
function opts(q,a,rv){
  return "abcde".split("").filter(k=>q.o[k]).map(k=>{let c="";
    if(rv||(S.mode=="latihan"&&a)){const best=q.sc?q.sc[k]==5:(q.bonus?k===a:k===q.ans);if(best)c="ok";else if(k===a)c="bad"}else if(k===a)c="sel";
    return `<button class="opt ${c}" ${rv?"disabled":`onclick="pick('${k}')"`}><b>${k.toUpperCase()}</b><span>${q.o[k]}</span></button>`}).join("");
}
function exBox(q,a){
  const g=good(q,a);let h;
  if(!a)h="Tidak dijawab";else if(q.bonus)h="Soal bermasalah · dihitung benar";else if(q.sc)h=`Skor pilihanmu ${q.sc[a]}/5`;else h=g?"Benar!":"Salah";
  if(!q.bonus&&!g)h+=` · Terbaik: ${q.ans.toUpperCase()}`;
  return `<div class="ex ${q.bonus?"":g?"ok":"bad"}"><b>${h}</b>${q.ex?`<br>${q.ex}`:""}</div>`;
}
function quiz(){
  const q=S.l[S.i],a=S.a[q.n],L=S.l.length,last=S.i==L-1,prac=S.mode=="latihan",done=Object.keys(S.a).length;
  return `<div class="qh"><button class="ib" onclick="S.conf='exit';render()">${I("back")}</button><div class="qt"><b>Soal ${S.i+1}<span> / ${L}</span></b><small>${PK[cfg.pk].n} · ${prac?"Latihan":"Ujian"}</small></div>
   ${S.t?`<span class="tpill">${I("clock",14)}<span id="tm">${fmt(S.left)}</span></span>`:""}<button class="ib" onclick="S.nav=1;render()">${I("grid")}</button></div>
  <div class="bar"><i style="width:${done/L*100}%"></i></div>
  <div class="card"><span class="tag">${q.sec}</span>${q.t?`<span class="tag">${q.t}</span>`:""}${q.p?`<div class="pas">${q.p}</div>`:""}<p class="q">${q.q}</p>${opts(q,a)}${prac&&a?exBox(q,a):""}</div>
  <div class="nv"><button class="btn" ${S.i?"":"disabled"} onclick="S.i--;render();scrollTo(0,0)">← Sebelumnya</button>
  ${last?`<button class="btn" style="background:var(--g);color:var(--prt);border:0" onclick="${prac?"finish()":"S.conf='submit';render()"}">${prac?"Selesai":"Kirim"}</button>`:`<button class="btn" style="background:var(--g);color:var(--prt);border:0" onclick="S.i++;render();scrollTo(0,0)">Berikutnya →</button>`}</div>
  ${S.nav?`<div class="sheet" onclick="if(event.target==this){S.nav=0;render()}"><div><div class="row sp"><b>Daftar soal</b><button class="ib" onclick="S.nav=0;render()">${I("x")}</button></div>
   <div class="cal">${S.l.map((x,i)=>{const y=S.a[x.n];return `<button class="${i==S.i?"cur":""} ${y?"dn "+(prac?good(x,y)?"dk":"db":""):""}" onclick="S.i=${i};S.nav=0;render();scrollTo(0,0)">${i+1}</button>`}).join("")}</div>
   <button class="cta" style="margin-top:0" onclick="S.nav=0;${prac?"finish()":"S.conf='submit';render()"}">${prac?"Selesai & lihat hasil":"Kirim jawaban"}</button></div></div>`:""}
  ${S.conf?`<div class="modal"><div><b>${S.conf=="exit"?"Keluar dari sesi?":"Kirim jawaban?"}</b><p class="mu">${S.conf=="exit"?"Progres sesi ini akan hilang.":`${L-done} soal belum dijawab. Setelah dikirim, jawaban tidak bisa diubah.`}</p>
   <div class="row" style="margin-top:14px"><button class="btn" onclick="S.conf='';render()">Kembali</button><button class="btn" style="background:var(--g);color:var(--prt);border:0" onclick="${S.conf=="exit"?"clearInterval(S.t);go('setup')":"finish()"}">${S.conf=="exit"?"Keluar":"Kirim"}</button></div></div></div>`:""}`;
}
function pick(k){const q=S.l[S.i];if(S.mode=="latihan"&&S.a[q.n])return;S.a[q.n]=k;render()}
function finish(){clearInterval(S.t);S.conf="";S.nav=0;V="result";render();scrollTo(0,0)}
function result(){
  const st={};let P=0,M=0,B=0,K=0;
  S.l.forEach(q=>{const a=S.a[q.n],s=st[q.sec]=st[q.sec]||{p:0,m:0,b:0,s:0,k:0,t:0};s.t++;s.m+=5;M+=5;const p=pts(q,a);s.p+=p;P+=p;
    if(!a){s.k++;K++}else if(good(q,a)){s.b++;B++}else s.s++});
  const ks=Object.keys(st),full=k=>st[k].t==TH[k][0],all=ks.length==3&&ks.every(full),pass=all&&ks.every(k=>st[k].p>=TH[k][2]);
  const rv=S.l.filter(q=>{const a=S.a[q.n];return S.f=="all"||(S.f=="salah"&&a&&!good(q,a))||(S.f=="kosong"&&!a)});
  return `<div class="qh"><button class="ib" onclick="go('setup')">${I("back")}</button><div class="qt"><b>Hasil ${S.mode=="ujian"?"Ujian":"Latihan"}</b><small>${PK[cfg.pk].n}</small></div>${tg()}</div>
  <div class="card" style="text-align:center"><div class="ring" style="background:conic-gradient(var(--pr) ${P/M*360}deg,var(--bd) 0)"><div><b>${P}</b><span class="mu">dari ${M}</span></div></div>
   ${all?`<span class="${pass?"ok-b":"no-b"}">${pass?"Lulus ambang batas SKD":"Belum lulus ambang batas SKD"}</span>`:`<span class="mu">Ambang batas dinilai jika ketiga bagian dikerjakan penuh.</span>`}
   <p class="mu" style="margin-top:8px">${B} benar · ${S.l.length-B-K} salah · ${K} kosong</p></div>
  ${ks.map(k=>{const s=st[k],th=TH[k][2],f=full(k),mx=TH[k][1];return `<div class="card"><div class="row sp"><b>${SEC[k]}</b>${f?`<span class="${s.p>=th?"ok-b":"no-b"}">${s.p>=th?"Lulus":"Di bawah ambang"}</span>`:""}</div>
   <div class="row sp" style="margin:6px 0"><span><b style="font-size:22px">${s.p}</b> <span class="mu">/ ${f?mx:s.m}</span></span>${f?`<span class="mu">Ambang ${th}</span>`:""}</div>
   <div class="mini" style="height:8px"><i style="width:${s.p/(f?mx:s.m)*100}%"></i>${f?`<span class="mk" style="left:${th/mx*100}%"></span>`:""}</div>
   <p class="mu" style="margin-top:6px">${s.b} benar · ${s.s} salah · ${s.k} kosong</p></div>`}).join("")}
  <div class="row"><button class="btn" onclick="go('home')">Beranda</button><button class="btn" style="background:var(--g);color:var(--prt);border:0" onclick="start()">Ulangi</button></div>
  <h2>Pembahasan</h2><div class="chips">${[["all","Semua"],["salah","Salah"],["kosong","Kosong"]].map(([v,t])=>`<button class="chip ${S.f==v?"on":""}" onclick="S.f='${v}';render()">${t}</button>`).join("")}</div>
  ${rv.map(q=>{const a=S.a[q.n];return `<div class="card rv ${!a?"":good(q,a)?"ok":"bad"}"><span class="mu">No. ${q.n} · ${q.sec}</span>${q.p?`<div class="pas">${q.p}</div>`:""}<p class="q">${q.q}</p>${opts(q,a,1)}${exBox(q,a)}</div>`}).join("")||`<p class="mu" style="margin-top:12px">Tidak ada soal.</p>`}${cr()}`;
}
function materi(){
  const gs=[...new Set(CH.map(c=>c.g))];
  return `<div class="row sp"><h1>Materi</h1>${tg()}</div><p class="mu">Ringkasan materi TWK, TIU, dan struktur SKD.</p>`+gs.map((g,gi)=>`<h2>${g}</h2>`+CH.filter(c=>c.g==g).map(c=>`<button class="item" style="--c:${COL[gi%4]}" onclick="RD=${c.id};go('read')"><span class="ic">${I("book")}</span><span><b>${c.t}</b><small>${c.min} menit baca</small></span>${I("chev")}</button>`).join("")).join("")+cr();
}
function read(){
  const c=CH[RD];
  return `<div class="qh"><button class="ib" onclick="go('materi')">${I("back")}</button><div class="qt"><b>${c.t}</b><small>${c.g}</small></div>${tg()}</div>
  <div class="card md">${c.html}</div>
  <div class="nv"><button class="btn" ${RD?"":"disabled"} onclick="RD--;render();scrollTo(0,0)">← Bab sebelumnya</button><button class="btn" ${RD<CH.length-1?"":"disabled"} onclick="RD++;render();scrollTo(0,0)">Bab berikutnya →</button></div>${cr()}`;
}
const th0=mem.get("theme");if(th0)document.documentElement.dataset.theme=th0;
render();
</script></body></html>
