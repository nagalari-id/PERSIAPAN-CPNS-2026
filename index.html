encerminkan pentingnya menjaga dan melestarikan kekayaan kuliner tradisional sebagai bagian dari warisan budaya yang berharga."}, {"n": 2, "sec": "TWK", "t": "Integritas", "q": "Karena pengaruhnya yang besar, Hatta berkali-kali ditangkap dan diasingkan oleh pemerintah kolonial. Namun, perjuangannya tak pernah berhenti hingga menjadi sosok yang mendampingi Ir. Soekarno memproklamasikan kemerdekaan Indonesia pada 1945. Selain menjadi wakil presiden, Hatta juga sempat menjabat menteri luar negeri dan perdana menteri. Sikap integritas yang ditunjukkan Bung Hatta dalam cerita tersebut adalah ....", "o": {"a": "Keberanian Bung Hatta menerima risiko dalam melakukan perjuangan", "b": "Bung Hatta adalah seorang patriot yang memiliki pengaruh besar terhadap perjuangan bangsa", "c": "Keberhasilan Bung Hatta menjadi pendamping Ir. Soekarno memproklamasikan kemerdekaan", "d": "Kehebatan sosok Bung Hatta hingga menjadi Wakil Presiden dan Menteri Luar Negeri", "e": "Besarnya tanggung jawab Bung Hatta dalam memperjuangkan kemerdekaan"}, "ans": "a", "ex": "Sikap integritas dari cerita tersebut adalah keberanian Bung Hatta dalam menerima segala risiko perjuangan yang dilakukan. Hal ini dibuktikan dengan meskipun berulang kali ditangkap dan diasingkan, Bung Hatta tidak menyerah dan tetap terus melakukan perjuangan tanpa henti bahkan sampai menjadi Wakil Presiden. Hatta berintegritas \"berani\", yaitu mantap hati dan percaya diri, tidak gentar dalam menghadapi bahaya, kesulitan, dan sebagainya."}, {"n": 3, "sec": "TWK", "q": "Apakah OPEC hanya memperhatikan kepentingan ekonomi negara-negara anggotanya?", "o": {"a": "Ya, karena OPEC didirikan untuk meningkatkan kekayaan negara anggota", "b": "Tidak, karena OPEC juga memperhatikan kelestarian lingkungan", "c": "Ya, tetapi dengan syarat OPEC harus mempertahankan harga minyak dunia", "d": "Tidak, karena OPEC memiliki tanggung jawab global dalam pengelolaan energi", "e": "Tidak, karena OPEC juga harus mempertimbangkan kesejahteraan masyarakat dunia"}, "ans": "d", "ex": "OPEC tidak hanya memperhatikan kepentingan ekonomi negara-negara anggotanya tetapi juga memiliki tanggung jawab global dalam pengelolaan energi."}, {"n": 4, "sec": "TWK", "q": "Pasal UUD 1945 yang mengatur tentang lagu kebangsaan Indonesia Raya adalah...", "o": {"a": "Pasal 36", "b": "Pasal 36A", "c": "Pasal 36B", "d": "Pasal 36C", "e": "Pasal 35"}, "ans": "c", "ex": "Pasal UUD 1945 yang mengatur tentang lagu kebangsaan Indonesia Raya adalah Pasal 36B."}, {"n": 5, "sec": "TWK", "q": "Peran rakyat (sipil) dalam nasionalisme kewarganegaraan mencakup", "o": {"a": "Memimpin negara", "b": "Mengatur pemerintahan", "c": "Mengikuti wajib militer", "d": "Mengambil keputusan negara", "e": "Menyusun undang-undang"}, "ans": "c", "ex": "Peran rakyat (sipil) dalam nasionalisme kewarganegaraan mencakup mengikuti wajib militer dan menjalankan kewajiban sebagai warga negara."}, {"n": 6, "sec": "TWK", "t": "", "q": "Perubahan Undang Undang Dasar Negara Republik Indonesia dalam ilmu hukum disebut dengan istilah Amandemen Undang-Undang Dasar yang telah dilakukan sebanyak empat kali telah mempengaruhi secara substansial dan telah mengubah sistem ketatanegaraan Indonesia secara mendasar. Setelah Indonesia merdeka pada tahun 1945, sistem hukum yang berlaku tidak segera mengalami perubahan. Pada tahun 1950 sampai dengan tahun 1959, Indonesia menggunakan Undang-Undang Dasar Sementara 1950 sebagai dasar negaranya. UUDS tersebut dimulai pada 17 Agustus 1950 sampai dengan lahirnya dekrit Presiden pada 5 Juli 1959 yang dikeluarkan Presiden Soekarno. Pelaksanaan pada masa berlakunya Undang-undang Dasar Sementara ini berjalan kacau dan tidak menemukan jalan yang tepat dalam merancang konstitusi yang utuh. Hal yang menyebabkan demikian terjadi dipengaruhi beberapa kondisi, kecuali…", "o": {"a": "Banyaknya intervensi dan konsep dari partai politik yang garis idea nya berbeda", "b": "Terlalu banyak partai politik dalam negara Indonesia", "c": "Kabinet pemerintahan yang sering berganti", "d": "Badan konstituante yang bekerja dengan ego masing-masing dalam membawa kepentingan ideologi partai", "e": "Negara dengan partai politiknya yang terlalu stabil dalam politik"}, "ans": "e", "ex": "Kondisi yang bukan menjadi alasan kekacauan dari pelaksanaan UUDS, sehingga berlarut lama dilakukan adalah Stabilisasi Partai politik dalam negara. Sebaliknya, partai politik membawa misi ke dalam Badan Konstituante yang ditugaskan dalam memperbaiki/melaksanakan Konstitusi yang berlaku memiliki perbedaan dalam ide dan gagasan (tidak menemukan kesepakatan). Maka lahirlah Dekrit Presiden 5 juli 1959."}, {"n": 7, "sec": "TWK", "t": "Pilar Negara", "q": "Demokrasi Pancasila adalah sebuah konsep demokrasi yang memiliki landasan nilai dalam Pancasila, yaitu dasar negara Indonesia. Keunggulan yang dimiliki demokrasi Pancasila dalam mengambil keputusan adalah ....", "o": {"a": "Keputusan yang diambil mendahulukan kepentingan rakyat", "b": "Keputusan yang didapat diperoleh dari musyawarah untuk mufakat", "c": "Keputusan mewakili kepentingan umum dibandingkan kepentingan golongan", "d": "Keputusan diambil berdasarkan peraturan yang berlaku", "e": "Keputusan yang diambil merupakan hasil dari masukan para ahli"}, "ans": "b", "ex": "Musyawarah untuk mufakat mencerminkan keunggulan yang dimiliki demokrasi Pancasila sebab musyawarah untuk mufakat didapat dari hasil diskusi dan pertukaran pendapat untuk menghasilkan keputusan, di mana keputusan tersebut merupakan suara yang bulat yang telah disetujui oleh seluruh anggota musyawarah."}, {"n": 8, "sec": "TWK", "t": "", "q": "Gagasan utama paragraf di atas adalah ....", "o": {"a": "Indonesia memiliki keanekaragaman hayati yang luar biasa", "b": "Deforestasi menyebabkan hilangnya habitat alami", "c": "Perburuan liar mengancam kelangsungan hidup satwa langka", "d": "Perubahan iklim memperburuk kondisi lingkungan", "e": "Diperlukan upaya konservasi yang lebih intensif dan berkelanjutan"}, "ans": "e", "ex": "Gagasan utama adalah ide pokok yang menjadi inti dari sebuah paragraf. Dalam paragraf ekspositif, gagasan utama biasanya terletak di awal atau akhir paragraf dan didukung oleh kalimat-kalimat penjelas. Pada paragraf di atas, kalimat pertama menyatakan bahwa <i>\"Indonesia adalah negara kepulauan terbesar di dunia yang memiliki keanekaragaman hayati yang luar biasa,\"</i> namun kalimat ini hanya sebagai pengantar. Kalimat-kalimat berikutnya menjelaskan berbagai ancaman terhadap keanekaragaman hayati, seperti deforestasi, perburuan liar, dan perubahan iklim. Kalimat terakhir memberikan solusi, yaitu <i>\"diperlukan upaya konservasi yang lebih intensif dan berkelanjutan.\"</i>", "p": "<i>\"Indonesia adalah negara kepulauan terbesar di dunia yang memiliki keanekaragaman hayati yang luar biasa. Dari Sabang sampai Merauke, Indonesia memiliki berbagai jenis flora dan fauna yang tidak ditemukan di tempat lain. Namun, keanekaragaman hayati ini terancam oleh berbagai faktor, seperti deforestasi, perburuan liar, dan perubahan iklim. Deforestasi yang tidak terkendali menyebabkan hilangnya habitat alami bagi banyak spesies. Perburuan liar juga menjadi ancaman serius bagi kelangsungan hidup satwa-satwa langka. Selain itu, perubahan iklim yang semakin ekstrem memperburuk kondisi lingkungan, sehingga banyak spesies yang tidak mampu beradaptasi dan akhirnya punah. Oleh karena itu, diperlukan upaya konservasi yang lebih intensif dan berkelanjutan untuk melindungi keanekaragaman hayati Indonesia. Pemerintah, masyarakat, dan berbagai organisasi harus bekerja sama untuk menjaga dan melestarikan kekayaan alam ini demi generasi mendatang.\"</i>"}, {"n": 9, "sec": "TWK", "t": "", "q": "Suatu hari, Andre lupa memberitahu atasannya bahwa jadwal meeting dimajukan. Sehingga atasannya melewatkan rapat yang cukup penting terkait target perusahaan di tahun 2024. Menurut anda, apa yang sebaiknya Andre lakukan?", "o": {"a": "Mencari alasan yang dapat dipercaya oleh atasan agar Andre tidak kena marah", "b": "Mengakui kesalahan yang tidak sengaja diperbuat dan bertanggung jawab untuk tidak mengulanginya kembali", "c": "Menunduk diam karena memang kesalahan ia sepenuhnya", "d": "Menerima konsekuensi dari atasan dan meminta maaf atas kesalahan tersebut", "e": "Mengatakan bahwa lupa merupakan hal yang manusiawi"}, "ans": "b", "ex": "Wujud lain dari integritas adalah dengan mengakui kesalahan dan bertanggung jawab akan hal tersebut."}, {"n": 10, "sec": "TWK", "t": "", "q": "Berikut adalah beberapa manfaat dari bela negara, kecuali …", "o": {"a": "Membentuk jiwa kebersamaan dan solidaritas antar sesama rekan seperjuangan", "b": "Membentuk perilaku jujur, tegas, adil, tepat, dan kepedulian antar sesama", "c": "Menanamkan rasa kecintaan pada bangsa dan patriotisme sesuai dengan kemampuan diri", "d": "Meningkatkan martabat bangsa di hadapan dunia", "e": "Membentuk mental fisik yang tangguh"}, "ans": "d", "ex": "Meningkatkan martabat bangsa di hadapan dunia merupakan manfaat dari nasionalisme."}, {"n": 11, "sec": "TWK", "t": "", "q": "Saya memiliki seorang team leader yang belakangan sering datang terlambat. Karena alasan tertentu, ia seringkali tiba 10-15 menit melewati jam yang seharusnya. Sebagai anggota timnya, maka saya akan…", "o": {"a": "Menjadikan team leader tersebut sebagai contoh ideal dalam fleksibilitas dalam bekerja", "b": "Menyesuaikannya dan beranggapan bahwa anggota tim juga dapat melakukan hal yang sama", "c": "Memakluminya karena hanya terlambat 15 menit dan bukanlah hal yang harus dibesar- besarkan", "d": "Memilih untuk pulang lebih awal atau memakan waktu istirahat lebih lama agar adil", "e": "Mengikuti jam kerja semestinya, selalu tiba dan pulang tepat waktu untuk memotivasi lead tersebut agar lebih taat"}, "ans": "e", "ex": "Meskipun hanya telat 15 menit, melonggarkan aturan dapat menyebabkan penurunan kinerja. Ada baiknya kita tetap taat terhadap aturan jam kerja di perusahaan sebagai bentuk integritas “disiplin” dan “bertanggung jawab”."}, {"n": 12, "sec": "TWK", "t": "", "q": "Wawasan Nusantara dalam menjalankan fungsinya dengan menanamkan dan memupuk kecintaan terhadap tanah air Indonesia, sehingga merangsang warga negara Indonesia untuk bersikap ....", "o": {"a": "Peduli terhadap keadaan bangsa dan negara", "b": "Peduli terhadap ancaman, tantangan, hambatan, dan gangguan terhadap negara", "c": "Bersikap adil kepada seluruh warga negara", "d": "Rela berkorban untuk bangsa dan negaranya", "e": "Rela berkorban untuk kepentingan masyarakat"}, "ans": "d", "ex": "Wawasan Nusantara dalam menjalankan fungsinya dengan menanamkan dan memupuk kecintaan terhadap tanah air Indonesia bertujuan untuk merangsang warga negara Indonesia untuk bersikap <b>rela berkorban untuk bangsa dan negaranya</b>. Sikap ini mencerminkan semangat nasionalisme yang tinggi, di mana setiap warga negara siap untuk memberikan yang terbaik demi kemajuan dan kesejahteraan bangsa dan negara. Dengan menanamkan rasa cinta tanah air, Wawasan Nusantara mendorong warga negara untuk memiliki komitmen yang kuat dalam menjaga keutuhan dan kedaulatan Indonesia."}, {"n": 13, "sec": "TWK", "t": "", "q": "Seorang karyawan difasilitasi laptop dengan spek terbaik dari kantornya, untuk menunjang hasil pekerjaan yang maksimal. Ternyata karena satu dan lain hal, karyawan tersebut memiliki side job di bidang yang sama, dan menggunakan laptop tersebut dengan prioritas ke side jobnya, alih-alih untuk tugas utamanya. Apabila Anda menjadi rekan dari karyawan tersebut, maka sikap Anda adalah…", "o": {"a": "Bergabung dalam side job tersebut untuk lebih meningkatkan produktivitas", "b": "Merahasiakannya dari seluruh karyawan dan atasan di kantor agar situasi tetap kondusif", "c": "Mencari cara agar ia segera dikeluarkan dari perusahaan karena telah berbuat curang", "d": "Melaporkan hal tersebut kepada rekan-rekan lain agar mendapatkan sanksi sosial", "e": "Menegur rekan tersebut dan memintanya untuk menghentikan kecurangannya karena hal itu dapat merugikan perusahaan"}, "ans": "e", "ex": "Hal yang dilakukan karyawan tersebut adalah penyalahgunaan aset perusahaan untuk kepentingan pribadi sehingga penting untuk menghentikannya karena hal tersebut dapat merugikan perusahaan."}, {"n": 14, "sec": "TWK", "q": "Tujuan utama didirikannya OPEC adalah", "o": {"a": "menghimpun negara-negara produsen dan pengekspor minyak", "b": "memenuhi kebutuhan minyak bagi negara-negara anggota", "c": "menghemat penggalian sumber alam minyak", "d": "meningkatkan produksi minyak anggotanya", "e": "terjadinya persaingan antar anggotanya"}, "ans": "a", "ex": "OPEC didirikan untuk menghimpun negara-negara produsen dan pengekspor minyak guna mengkoordinasikan kebijakan produksi minyak."}, {"n": 15, "sec": "TWK", "t": "Bela Negara", "q": "Hal penting yang diatur dalam Undang-Undang Dasar NRI 1945 adalah keseimbangan antara hak dan kewajiban sebagai warga negara. Hal tersebut tercermin dalam UUD NRI 1945 Pasal 27 Ayat 3 berbunyi, <i>\"Setiap warga negara berhak dan wajib ikut serta dalam upaya pembelaan negara.\"</i> Keikutsertaan warga negara dalam upaya bela negara adalah sebagai berikut, <b>kecuali</b> ....", "o": {"a": "Pendidikan kewarganegaraan", "b": "Pelatihan dasar kemiliteran secara wajib", "c": "Pengabdian sebagai prajurit TNI secara sukarela atau secara wajib", "d": "Pengabdian sebagai abdi negara (ASN)", "e": "Pengabdian sesuai profesi"}, "ans": "d", "ex": "Keikutsertaan warga negara dalam upaya bela negara diselenggarakan melalui: 1. Pendidikan kewarganegaraan 2. Pelatihan dasar kemiliteran secara wajib 3. Pengabdian sebagai prajurit TNI secara sukarela atau secara wajib 4. Pengabdian sesuai dengan profesi"}, {"n": 16, "sec": "TWK", "t": "", "q": "Pengakuan terhadap keberagaman agama dan keyakinan di Indonesia adalah hal yang wajib dilakukan oleh warga negara karena merupakan pengamalan dari sila pertama Pancasila. Pengakuan terhadap keberagaman juga merupakan wujud dari semangat nasionalisme dalam mempersatukan keberagaman nasional. Semangat ini harus dilandasi oleh ....", "o": {"a": "Agama adalah nilai positif bagi seluruh warga negara dan keberadaannya sah", "b": "Agama dan kepercayaan adalah dua hal yang sama dan tertera di sila pertama", "c": "Setiap orang wajib dan berhak memilih agamanya dan kita harus menghargainya", "d": "Warga negara yang memiliki keberagaman agama menjadi keindahan tersendiri", "e": "Agama merupakan identitas yang menyangkut dengan Tuhan yang perlu dijamin"}, "ans": "c", "ex": "Salah satu prinsip nasionalisme adalah prinsip kebebasan (<i>liberty</i>) yang bermakna bahwa kebebasan dalam beragama, berpendapat, berserikat, dan berkumpul semestinya dihormati. Opsi C (<i>\"setiap orang wajib dan berhak memilih agamanya dan kita harus menghargainya\"</i>) adalah bentuk dari pelaksanaan prinsip kebebasan (<i>liberty</i>) dalam nasionalisme."}, {"n": 17, "sec": "TWK", "t": "Integritas", "q": "Anda adalah seorang karyawan di sebuah perusahaan. Saat jam pulang, ternyata pekerjaan Anda belum selesai dan harus diselesaikan hari itu juga. Pada saat yang bersamaan, Anda sudah berjanji kepada ibu Anda untuk mengantarnya kontrol ke Rumah Sakit. Sikap Anda adalah ....", "o": {"a": "Segera meminta izin kepada atasan untuk mengantar ibu Anda", "b": "Sesegera mungkin pulang untuk mengantar ibu Anda dan menyelesaikan pekerjaan di rumah", "c": "Menyelesaikan pekerjaan terlebih dahulu dan meminta ibu Anda menunggu", "d": "Meminta teman sekantor untuk menyelesaikan pekerjaan Anda", "e": "Menunda pekerjaan dan menyelesaikannya setelah selesai mengantar ibu Anda ke Rumah Sakit"}, "ans": "c", "ex": "Soal di atas adalah soal integritas yang mirip dengan soal Tes Karakteristik Pribadi. Nilai integritas yang harus ditunjukkan adalah mengorbankan kepentingan pribadi dan mendahulukan kepentingan pekerjaan. Di dalam narasi, kontrol ke rumah sakit bukanlah menjadi alasan darurat yang bisa digunakan untuk meninggalkan pekerjaan."}, {"n": 18, "sec": "TWK", "t": "Pilar Negara", "q": "Pasal 29 Ayat 2 berbunyi: <i>\"Negara menjamin kemerdekaan tiap-tiap penduduk untuk memeluk agamanya masing-masing dan beribadat menurut agama dan kepercayaannya itu.\"</i> Nilai praksis yang bisa dilakukan oleh pemerintah sesuai pasal tersebut adalah ....", "o": {"a": "Menghormati orang lain yang sedang melaksanakan peribadatan agamanya", "b": "Bersahabat dengan orang lain yang berbeda agama", "c": "Siap dan mau bekerja sama dengan semua orang tanpa membeda-bedakan agama", "d": "Siap dan mau menolong orang lain dalam kesusahan tanpa memandang agama yang dianutnya", "e": "Menyediakan tempat peribadatan bagi setiap agama"}, "ans": "e", "ex": "Nilai praksis berarti implementasi atau contoh penerapan. Di dalam soal, yang ditanyakan adalah penerapan Pasal 29 Ayat 2 yang bisa dilakukan oleh <b>pemerintah</b>. Perwujudan pemerintah dalam menjamin kebebasan beragama setiap warga negaranya, seperti: 1. Menyediakan sarana peribadatan bagi setiap agama; dan 2. Menetapkan hari besar keagamaan sebagai hari libur nasional."}, {"n": 19, "sec": "TWK", "t": "", "q": "Perjanjian New York adalah perjanjian antara pemerintah Indonesia dan Belanda yang ditandatangani pada 15 Agustus 1962. Secara garis besar, isi Perjanjian New York tahun 1962 memuat kesepakatan pemindahan kekuasaan atas Irian Barat. Kesepakatan tersebut dilatarbelakangi usaha Indonesia untuk merebut Irian Barat dari tangan Belanda melalui Operasi Trikora (Tri Komando Rakyat). Operasi militer ini dilaksanakan oleh Komando Mandala yang dipimpin Mayjen, Soeharto. Pada bulan Maret-Agustus 1962, Sekjen PBB U Thant kemudian mengutus diplomat Amerika Serikat, Ellsworth Bunker, untuk menengahi perselisihan Indonesia dengan Belanda tersebut. Pihak Amerika-lah yang kemudian menginisiasi Perjanjian New York atau New York Agreement. Perjanjian New York merupakan hasil perundingan Indonesia dan Belanda di Markas Besar PBB pada 15 Agustus 1962. Dalam perundingan tersebut, Indonesia diwakili oleh DDr. Subandrio, sedangkan Belanda diwakili oleh Van Roijen dan Schurmann. Sesuai dengan perjanjian tersebut, pemerintah Indonesia berkewajiban menyelenggarakan Pepera di Irian Barat sebelum akhir tahun 1969. Dalam penyelenggaraan Pepera, pihak Indonesia dan Belanda harus menerima apapun hasilnya. Pada 19 November 1969, Sidang Umum PBB ke-24 menerima hasil Pepera yang menyatakan bahwa masyarakat Irian Barat ingin tetap menjadi bagian dari Republik Indonesia. Sejak saat itu, Irian Barat kembali menjadi bagian dari Indonesia, baik secara de facto maupun de jure. Keterlibatan Amerika Serikat sebagai penengah dalam konflik Indonesia dan Belanda soal status Irian Barat menunjukkan bahwa.....", "o": {"a": "Amerika Serikat berusaha menarik simpati Indonesia dan Belanda guna mendapatkan dukungan dalam menghadapi Uni Soviet", "b": "Amerika Serikat prihatin dengan konflik yang berlarut larut antara Indonesia dan Belanda soal status kepemilikan Irian Barat", "c": "Hanya ingin ikut campur sehingga posisi Amerika Serikat sebagai negara adikuasa tetap mendapat dukungan politik yang kuat dari negara-negara yang sedang berkonflik", "d": "Sudah menjadi kewajiban bagi Amerika Serikat sebagai negara adikuasa untuk selalu ikut campur jika ada negara yang sedang berkonflik", "e": "Amerika serikat menjalankan fungsinya sebagai anggota tetap Dewan Keamanan PBB dalam menyelesaikan konflik antar negara"}, "ans": "b", "ex": "Terlibatnya AS dalam konflik Indonesia dan Belanda mengenai Irian Barat tak terlepas dari keprihatinan AS, sehingga menginisiasi dan mendesak Indonesia dan Belanda untuk kembali ke meja perundingan, perundingan itulah yg disebut perjanjian New York yang pada intinya meminta kedua belah pihak untuk sama-sama menahan diri dan menyepakati hasil kemerdekaan wilayah kedaulatan."}, {"n": 20, "sec": "TWK", "t": "", "q": "Anda bertanggung jawab untuk membuat konten promosi suatu produk. Namun, editing bukanlah hal yang Anda kuasai, sehingga selama proses berlangsung Anda seringkali mengalami kesulitan. Maka Anda …", "o": {"a": "Memilih mundur dari project tersebut daripada mengacaukan hasil promosi produk", "b": "Tetap lanjut mengerjakan meskipun dengan resiko mengecewakan perusahaan dan klien", "c": "Memberitahu atasan bahwa Anda memerlukan bantuan yang dapat memperlancar keseluruhan proses", "d": "Memberikan hasil yang ada sesuai skill yang Anda miliki dan berharap klien akan menerimanya", "e": "Memindahkan tanggung jawab kepada teman lain yang dirasa lebih mampu dalam hal editing"}, "ans": "c", "ex": "Integritas adalah kejujuran dalam dunia kerja, termasuk mengakui kelemahan. Ada baiknya untuk jujur apabila mengalami hambatan dalam melakukan suatu pekerjaan sehingga dengan bantuan dari rekan lain, hasil yang diperoleh akan tetap maksimal."}, {"n": 21, "sec": "TWK", "q": "Dalam kasus dugaan korupsi yang melibatkan penggeledahan oleh KPK, asas yang digunakan dalam penegakan hukum adalah ..", "o": {"a": "<i>Lex superior derogat legi inferior</i>", "b": "<i>Lex imperfect</i>", "c": "<i>Equality before the law</i>", "d": "<i>Lex posterior derogat legi priori</i>", "e": "<i>Lex specialis derogat legi generali</i>"}, "ans": "c", "ex": "Dalam penegakan hukum khusus tindakan korupsi menganut asas <i>Equality before the law</i>."}, {"n": 22, "sec": "TWK", "t": "Nasionalisme", "q": "Perhatikan poin-poin berikut:<br>1. Mengenal dan mempelajari budaya yang ada di Indonesia<br>2. Meyakini bangsa Indonesia adalah bangsa terbaik di atas bangsa lainnya<br>3. Mengenalkan adat dan budaya Indonesia di kalangan internasional<br>4. Memandang bahwa budaya Indonesia adalah budaya paling benar<br>5. Menghargai perbedaan adat dan budaya yang ada di Indonesia<br>Sikap nasionalisme ditunjukkan oleh nomor ....", "o": {"a": "1, 2, dan 3", "b": "2, 4, dan 5", "c": "1, 3, dan 5", "d": "2, 3, dan 4", "e": "3, 4, dan 5"}, "ans": "c", "ex": "Poin 2 dan 4 bukan merupakan sikap nasionalisme, karena nasionalisme di Indonesia adalah nasionalisme yang inklusif, yaitu nasionalisme yang tidak menganggap bangsa dan budayanya sebagai bangsa dan budaya yang paling baik dan paling benar sehingga merendahkan budaya dari negara lainnya."}, {"n": 23, "sec": "TWK", "t": "Bela Negara", "q": "Pada era globalisasi, tantangan bangsa Indonesia semakin kompleks dan datang dari berbagai lini, salah satunya ekonomi. Gempuran produk luar negeri tidak terkendali dan semakin banyak digandrungi generasi muda karena kualitasnya yang baik dengan harga yang lebih murah. Dampaknya, UKM dan produk-produk lokal mengalami penurunan penjualan. Anda adalah seorang pebisnis lokal. Upaya yang bisa Anda lakukan untuk ikut serta membantu negara dalam menghadapi tantangan tersebut adalah ....", "o": {"a": "Mencari modal usaha dengan berhutang untuk meningkatkan hasil produksi", "b": "Menggunakan alat-alat dalam negeri untuk meningkatkan hasil produksi", "c": "Menjadikan tetangga sekitar sebagai pekerja dengan upah yang layak", "d": "Meningkatkan inovasi dan kreativitas untuk meningkatkan daya saing produk", "e": "Menggunakan bahan-bahan impor agar kualitas produksi meningkat"}, "ans": "d", "ex": "Inti dari tantangan di dalam soal adalah produk-produk lokal yang kalah saing dengan produk luar negeri. Oleh sebab itu, jawaban terbaik adalah dengan meningkatkan inovasi dan kreativitas agar hasil produksi memiliki daya saing yang tinggi sehingga bisa membuat generasi muda lebih memilih produk dalam negeri."}, {"n": 24, "sec": "TWK", "t": "", "q": "Sistem pembagian kekuasaan negara Indonesia menurut UUD NRI Tahun 1945 menegaskan bahwa DPR merupakan pemegang kekuasaan legislasi. Namun demikian, dalam menjalankan tugasnya, DPR juga harus bekerja sama dengan eksekutif, terutama di dalam hal ....", "o": {"a": "Menentukan anggaran militer", "b": "Menentukan Kepala Kepolisian Republik Indonesia", "c": "Menetapkan rancangan undang-undang menjadi undang-undang", "d": "Melakukan <i>impeachment</i>", "e": "Menjalin kerja sama dengan negara lain"}, "ans": "c", "ex": "Menurut UUD NRI Tahun 1945, DPR memiliki kekuasaan legislasi, yang berarti mereka bertanggung jawab untuk membuat undang-undang. Namun, dalam proses ini, DPR harus bekerja sama dengan eksekutif (Presiden) untuk menetapkan rancangan undang-undang menjadi undang-undang. Hal ini diatur dalam Pasal 20 UUD 1945 yang menyatakan bahwa setiap rancangan undang-undang harus mendapat persetujuan bersama antara DPR dan Presiden."}, {"n": 25, "sec": "TWK", "q": "Ombudsman menilai penyelenggaraan pelayanan publik soal pembuatan e-KTP oleh Kementerian Dalam Negeri berlangsung lambat dan banyak persoalan. Pihaknya menemukan banyak kekacauan di berbagai daerah. Saat ini terjadi penurunan minat mengurus e-KTP yang disebabkan karena lambatnya pelayanan, sulitnya mengurus e-KTP, dan ditemukannya praktik percetakan KTP dengan biaya yang tidak resmi. Sulitnya beberapa daerah dalam pengurusan percetakan KTP merupakan pelanggaran terhadap sila...", "o": {"a": "Ketuhanan Yang Maha Esa", "b": "Kemanusiaan yang Adil dan Beradab", "c": "Persatuan Indonesia", "d": "Kerakyatan yang Dipimpin oleh Hikmat Kebijaksanaan dalam Permusyawaratan/Perwakilan", "e": "Keadilan Sosial bagi Seluruh Rakyat Indonesia"}, "ans": "e", "ex": "Pelayanan publik yang lambat dan pungutan tidak resmi mencederai sila ke-5, Keadilan Sosial bagi Seluruh Rakyat Indonesia."}, {"n": 26, "sec": "TWK", "q": "Menjadi manusia yang berintegritas menuntut kita untuk selalu ...", "o": {"a": "Percaya terhadap orang lain", "b": "Disiplin", "c": "Konsistensi", "d": "Perilaku jujur", "e": "Tanggung jawab"}, "ans": "d", "ex": "Menjadi manusia yang berintegritas menuntut kita untuk selalu perilaku jujur."}, {"n": 27, "sec": "TWK", "t": "Nasionalisme", "q": "Salah satu tantangan terbesar Indonesia yang berbentuk kepulauan dengan beraneka ragam adat dan budaya dalam melaksanakan pembangunan nasional adalah bahwa pembangunan nasional perlu memperhatikan ancaman konflik sosial di tengah masyarakat yang heterogen. Adanya perbedaan suku, ras, agama, dan antargolongan dapat dimanfaatkan oleh kelompok tertentu untuk menimbulkan gejolak SARA yang bisa menghambat pembangunan nasional. Adapun peran nasionalisme untuk mengatasi permasalahan tersebut adalah ....", "o": {"a": "Nasionalisme berperan menyatukan pendapat antardaerah sehingga pembangunan nasional bisa berjalan dengan lancar", "b": "Nasionalisme yang dilandasi cinta tanah air akan menciptakan persatuan dan bersama-sama berperan aktif dalam pembangunan nasional", "c": "Nasionalisme akan menghilangkan kedaerahan sehingga pembangunan nasional dapat berjalan sesuai instruksi pemerintah pusat", "d": "Nasionalisme akan melahirkan ekonomi yang kuat sebagai modal utama dalam pembangunan nasional", "e": "Nasionalisme dapat menyatukan pendapat antara pemerintah daerah dan pusat dalam mencapai pembangunan nasional"}, "ans": "b", "ex": "Nasionalisme merupakan sikap yang menitikberatkan pada persatuan dan kesatuan masyarakat demi kemajuan serta keutuhan bangsa. Sementara pembangunan nasional memerlukan peran serta masyarakat. Oleh sebab itu, hubungan keduanya adalah bahwa dengan nasionalisme masyarakat tidak akan terpecah dan bersatu serta bersama-sama memberikan kontribusi kepada pembangunan nasional."}, {"n": 28, "sec": "TWK", "t": "Nasionalisme", "q": "Jerman yang dikuasai oleh Nazi pimpinan Adolf Hitler adalah pemicu meletusnya Perang Dunia II pada 80 tahun yang lalu. Jerman ingin mencaplok sejumlah negara Eropa Timur dalam satu kekuasaan. Semuanya bermula dari sebuah hasrat nasionalisme yang disebut Pan-Jermanisme. Pan-Jermanisme (<i>German: Pangermanismus</i> atau <i>Alldeutschtum</i>) adalah gerakan yang bertujuan menyatukan politik semua orang yang berbahasa Jerman atau rumpun bahasa Jerman. Berdasarkan narasi tersebut, perbedaan antara Pan-Jermanisme dan Nasionalisme di Indonesia adalah ....", "o": {"a": "Nasionalisme di Indonesia bukan berdasarkan ras, namun justru menyatukan keberagaman dan perbedaan", "b": "Nasionalisme di Indonesia bersifat terbuka sehingga memungkinkan berubah sesuai kebutuhan dan perkembangan zaman", "c": "Nasionalisme di Indonesia lahir dari sejarah pergerakan kemerdekaan Indonesia yang dilandasi sikap cinta tanah air", "d": "Nasionalisme di Indonesia menjunjung tinggi adat dan budaya nenek moyang yang berbeda dengan adat dan budaya Jerman", "e": "Nasionalisme di Indonesia merupakan nasionalisme moderat yang cinta damai dan menolak peperangan dengan negara lain"}, "ans": "a", "ex": "Nasionalisme di Indonesia tidak berdasarkan ras dan justru berdasarkan Bhinneka Tunggal Ika, yaitu menyatukan keberagaman dan perbedaan dalam bingkai Pancasila dan NKRI. Hal inilah yang membedakan Nasionalisme di Indonesia dengan Nasionalisme Pan-Jermanisme."}, {"n": 29, "sec": "TWK", "t": "", "q": "Perhatikan pernyataan berikut!<br>1. Meningkatkan toleransi beragama<br>2. Menghargai perbedaan pendapat<br>3. Mengembangkan sikap dan suasana kekeluargaan<br>4. Mengembangkan sikap tenggang rasa dan tepa selira<br>5. Memberi bantuan secara adil dan merata<br>Berdasarkan pernyataan tersebut, yang merupakan implementasi nilai keadilan sosial dalam mewujudkan harmoni keberagaman adalah ....", "o": {"a": "1 dan 2", "b": "2 dan 5", "c": "3 dan 4", "d": "4 dan 5", "e": "3 dan 5"}, "ans": "e", "ex": "1. Implementasi Pancasila sila ke-1 2. Implementasi Pancasila sila ke-4 3. Implementasi Pancasila sila ke-5 4. Implementasi Pancasila sila ke-2 5. Implementasi Pancasila sila ke-5"}, {"n": 30, "sec": "TWK", "q": "Menurut KPK, berapa jumlah nilai yang membentuk konsep integritas nasional?", "o": {"a": "5 nilai", "b": "7 nilai", "c": "9 nilai", "d": "11 nilai", "e": "13 nilai"}, "ans": "c", "ex": "KPK mengkonsepsikan konsep integritas nasional dengan 9 nilai yang esensial untuk memerangi korupsi."}, {"n": 31, "sec": "TIU", "q": "1 dekade + 3 lustrum = …", "o": {"a": "20 tahun", "b": "25 tahun", "c": "30 tahun", "d": "35 tahun", "e": "40 tahun"}, "ans": "b", "ex": "1 dekade = 10 tahun, 3 lustrum = 3 × 5 = 15 tahun, jadi 10 + 15 = 25 tahun."}, {"n": 32, "sec": "TIU", "t": "Analitis", "q": "Setelah memastikan kemenangan suara rakyat untuk menduduki kursi legislatif, Komeng mengundang tim kampanye untuk makan siang bersama. Rigen, Ridwan, Pras, Bonar, Indra, Jui, dan Fajar duduk melingkar di meja bundar menghadapi hidangan yang sudah tersedia. Rigen duduk dua kursi terpisah dari Jui. Fajar duduk berhadapan dengan Indra. Jui duduk di antara Bonar dan Ridwan. Komeng dan Jui duduk tepat berhadapan. Pernyataan berikut mungkin benar, <b>kecuali</b> ....", "o": {"a": "Pras duduk di antara Komeng dan Indra", "b": "Rigen dan Ridwan duduk tepat berhadapan", "c": "Fajar duduk di antara Rigen dan Bonar", "d": "Indra diapit oleh Pras dan Ridwan", "e": "Ridwan terpisah dua kursi dari Rigen"}, "ans": "e", "ex": "Susunan posisi duduk melingkar (searah jarum jam): Komeng — Pras — Indra — Ridwan — Jui — Bonar — Fajar — Rigen Pernyataan yang salah adalah <i>Ridwan terpisah dua kursi dari Rigen</i>, karena sebenarnya Ridwan dan Rigen duduk tepat berhadapan (terpisah tiga kursi di kedua sisinya)."}, {"n": 33, "sec": "TIU", "t": "Analitis", "q": "Di sebuah pesta pernikahan, Dinda dan 7 teman lainnya duduk di sebuah meja bundar. Dinda duduk berhadapan langsung dengan Syifa. Raka duduk berhadapan dengan Adit. Adit diapit oleh Beni dan Dinda. Tina dan Intan duduk bersebelahan. Raka duduk di antara Syifa dan Intan. Wanda duduk berhadapan dengan Tina. Kue pernikahan tersebut dibagikan secara bergiliran dari satu orang ke orang berikutnya. Wanda akan menerima kue tersebut dari tangan ....", "o": {"a": "Beni atau Syifa", "b": "Adit atau Raka", "c": "Syifa atau Raka", "d": "Dinda atau Adit", "e": "Raka atau Intan"}, "ans": "a", "ex": "Susunan posisi duduk melingkar (searah jarum jam): Intan — Raka — Syifa — Wanda — Beni — Adit — Dinda — Tina Wanda duduk di antara Beni dan Syifa, sehingga ia akan menerima kue dari tangan <b>Beni atau Syifa</b>."}, {"n": 34, "sec": "TIU", "q": "2, 9, 4, 11, 6, 13, …, …", "o": {"a": "8 dan 15", "b": "9 dan 16", "c": "10 dan 17", "d": "11 dan 18", "e": "12 dan 19"}, "ans": "a", "ex": "Pola deret: +7, -5, +7, -5, +7. Setelah 13, angka selanjutnya adalah 13 - 5 = 8 dan 8 + 7 = 15."}, {"n": 35, "sec": "TIU", "t": "Silogisme", "q": "Semua buku yang berkualitas tinggi biasanya diterbitkan oleh penerbit ternama. Semua buku yang diterbitkan oleh penerbit ternama sering menjadi incaran para pembaca. Sebagian buku yang berkualitas tinggi mengusung tema pendidikan. Simpulan yang tepat adalah ....", "o": {"a": "Sebagian buku yang diterbitkan oleh penerbit ternama mengusung tema pendidikan", "b": "Semua buku yang menjadi incaran para pembaca adalah buku yang berkualitas tinggi", "c": "Sebagian buku yang mengusung tema pendidikan biasanya diterbitkan oleh penerbit ternama", "d": "Sebagian buku yang berkualitas tinggi mengusung tema pendidikan dan sering menjadi incaran para pembaca", "e": "Sebagian buku yang berkualitas tinggi sering menjadi incaran para pembaca dan biasanya diterbitkan oleh penerbit ternama"}, "ans": "d", "ex": "- Semua buku yang berkualitas tinggi biasanya diterbitkan oleh penerbit ternama. - Semua buku yang diterbitkan oleh penerbit ternama sering menjadi incaran para pembaca. - Sebagian buku yang berkualitas tinggi mengusung tema pendidikan. Maka, sebagian buku yang berkualitas tinggi mengusung tema pendidikan dan sering menjadi incaran para pembaca."}, {"n": 36, "sec": "TIU", "t": "Pola Barisan / Deret", "q": "4, ; 12, ; 20, ; 16, ; 80, ; 19, ; 240, ; 21, ; …, ; …", "o": {"a": "720, ; 22", "b": "720, ; 23", "c": "360, ; 22", "d": "480, ; 22", "e": "480, ; 23"}, "ans": "d", "ex": "Terdapat dua larik deret berselang-seling: - <b>Larik ganjil:</b> 4 xrightarrow{× 5} 20 xrightarrow{× 4} 80 xrightarrow{× 3} 240 xrightarrow{× 2} mathbf{480} - <b>Larik genap:</b> 12 xrightarrow{+4} 16 xrightarrow{+3} 19 xrightarrow{+2} 21 xrightarrow{+1} mathbf{22}"}, {"n": 37, "sec": "TIU", "t": "Analogi", "q": "BERLIAN : KARAT = .... : ....", "o": {"a": "Bensin : Galon", "b": "Doa : Ustadz", "c": "Siswa : Buku", "d": "Besi : Karat", "e": "Kayu : Pengrajin"}, "ans": "a", "ex": "Berlian satuannya adalah karat (sekitar 0,2 gram), sebagaimana bensin satuannya adalah galon."}, {"n": 38, "sec": "TIU", "t": "Silogisme", "q": "Para pendukung yang terdaftar kegiatan kampanye akbar Paslon 02 harus memakai baju berwarna biru muda. Setiap pendukung harus membawa balon bertuliskan <i>All in 02</i>. Ada pendukung yang terdaftar mengikuti kegiatan kampanye akbar Paslon 02 yang tidak memakai baju berwarna biru muda. Simpulan yang tepat adalah ....", "o": {"a": "Semua pendukung harus memakai baju berwarna biru muda dan membawa balon bertuliskan <i>All in 02</i>", "b": "Semua pendukung tidak memakai baju berwarna biru muda dan membawa balon bertuliskan <i>All in 02</i>", "c": "Tidak ada pendukung yang boleh mengikuti kampanye akbar Paslon 02, namun harus membawa balon bertuliskan <i>All in 02</i>", "d": "Ada pendukung yang membawa balon bertuliskan <i>All in 02</i> tidak boleh mengikuti kampanye akbar Paslon 02", "e": "Hanya sedikit pendukung yang mengikuti kampanye akbar Paslon 02 dan membawa balon bertuliskan <i>All in 02</i>"}, "ans": "d", "ex": "Para pendukung yang terdaftar kegiatan kampanye akbar Paslon 02 harus memakai baju berwarna biru muda. Sehingga, jika ada pendukung yang tidak memakai baju berwarna biru muda, maka mereka tidak boleh mengikuti kegiatan tersebut karena tidak memenuhi syarat."}, {"n": 39, "sec": "TIU", "t": "Soal Cerita", "q": "Berikut ini adalah daftar harga tiket perjalanan dari sebuah agen travel.<br>Jurusan Travel &nbsp;|&nbsp; Diskon &nbsp;|&nbsp; Harga Tiket<br>Jakarta - Bandung &nbsp;|&nbsp; 15% &nbsp;|&nbsp; Rp180.000,00<br>Jakarta - Semarang &nbsp;|&nbsp; 20% &nbsp;|&nbsp; Rp250.000,00<br>Jakarta - Surabaya &nbsp;|&nbsp; 30% &nbsp;|&nbsp; Rp400.000,00<br>Jakarta - Bali &nbsp;|&nbsp; 25% &nbsp;|&nbsp; Rp500.000,00<br>Jakarta - Yogyakarta &nbsp;|&nbsp; 35% &nbsp;|&nbsp; Rp350.000,00<br>Jika berdasarkan survei, tiket yang lebih murah cenderung meningkatkan minat pelanggan, jurusan manakah yang paling diminati di agen travel ini?", "o": {"a": "Jakarta - Bali", "b": "Jakarta - Yogyakarta", "c": "Jakarta - Bandung", "d": "Jakarta - Semarang", "e": "Jakarta - Surabaya"}, "ans": "c", "ex": "| Jurusan Travel | Diskon | Harga Tiket | Potongan Diskon | Harga Akhir | | :--- | :---: | :---: | :---: | :---: | | <b>Jakarta - Bandung</b> | 15% | Rp180.000,00 | Rp27.000,00 | <b>Rp153.000,00</b> | | Jakarta - Semarang | 20% | Rp250.000,00 | Rp50.000,00 | Rp200.000,00 | | Jakarta - Surabaya | 30% | Rp400.000,00 | Rp120.000,00 | Rp280.000,00 | | Jakarta - Bali | 25% | Rp500.000,00 | Rp125.000,00 | Rp375.000,00 | | Jakarta - Yogyakarta | 35% | Rp350.000,00 | Rp122.500,00 | Rp227.500,00 |"}, {"n": 40, "sec": "TIU", "t": "", "q": "Sebuah perusahaan memiliki 120 karyawan. Jumlah karyawan pria 2 kali lebih banyak daripada karyawan wanita. Bulan ini, perusahaan merekrut sejumlah karyawan baru sehingga perbandingan karyawan pria dan wanita berubah menjadi 3:2. Berapa jumlah karyawan wanita yang baru direkrut jika jumlah total karyawan sekarang 150 karyawan.", "o": {"a": "5", "b": "10", "c": "15", "d": "20", "e": "25"}, "ans": "d", "ex": "●Jumlah karyawan awal 120 ●Pria adalah 2/3 * 120 = 80 karyawan. ●Jumlah karyawan wanita adalah 120 - 80 = 40 karyawan. ●Perbandingan karyawan pria dan wanita baru adalah 3:2. Artinya, jumlah karyawan pria adalah 3/5 * total karyawan. ●Jumlah baru karyawan pria adalah 3/5 * 150 = 90 karyawan. ●Jumlah baru karyawan wanita adalah 150 - 90 = 60 karyawan. Jumlah karyawan wanita yang baru direkrut adalah 60-40 = 20 orang."}, {"n": 41, "sec": "TIU", "q": "Diketahui 2^m = 256 dan 3^n = 9. Manakah pernyataan di bawah ini yang benar?", "o": {"a": "m &gt; n", "b": "m &lt; n", "c": "m = n", "d": "m = 0", "e": "n = 0"}, "ans": "a", "ex": "Untuk 2^m = 256, kita tahu bahwa 2^8 = 256 sehingga m = 8. Untuk 3^n = 9, kita tahu bahwa 3^2 = 9 sehingga n = 2. Oleh karena itu, m &gt; n."}, {"n": 42, "sec": "TIU", "q": "TANGAN : SARUNG TANGAN = ... : ...", "o": {"a": "Kaki : Sepatu", "b": "Mata : Kacamata", "c": "Kepala : Topi", "d": "Telinga : Anting", "e": "Jari : Cincin"}, "ans": "a", "ex": "Tangan menggunakan sarung tangan seperti kaki menggunakan sepatu."}, {"n": 43, "sec": "TIU", "t": "Perbandingan", "q": "Suatu komunitas mendapatkan sumbangan yang jika dibagikan kepada 40 anggota, maka masing-masing anggota mendapatkan Rp800.000,00.<br>M &nbsp;|&nbsp; N<br>Banyak uang yang diperoleh masing-masing anggota jika sumbangan tersebut hanya dibagikan kepada 8 anggota &nbsp;|&nbsp; Rp5.000.000,00<br>Hubungan kuantitas M dan N yang tepat adalah ....", "o": {"a": "M = N", "b": "8M = 5N", "c": "5M = 8N", "d": "4M = 5N", "e": "5M = 4N"}, "ans": "e", "ex": "M = 40 × 800.000/8 = 40 × 100.000 = Rp4.000.000,00 N = Rp5.000.000,00 therefore M/N = 4.000.000/5.000.000 → M/N = 4/5 → 5M = 4N"}, {"n": 44, "sec": "TIU", "t": "Soal Cerita", "q": "Sebuah tangki air dapat diisi penuh dalam waktu 7 jam menggunakan 5 pipa air. Jika 2 pipa air tersebut tidak berfungsi, berapa waktu yang dibutuhkan untuk mengisi penuh tangki tersebut menggunakan pipa yang tersisa?", "o": {"a": "11 jam 10 menit", "b": "11 jam 20 menit", "c": "11 jam 30 menit", "d": "11 jam 40 menit", "e": "11 jam 50 menit"}, "ans": "d", "ex": "7 jam → 5 pipa X jam → 3 pipa (5 - 2 = 3 pipa) (Perbandingan berbalik nilai) 7/X = 3/5 → 3X = 35 → X = 35/3 = 11 2/3 jam → 11 jam dan 2/3 × 60 = 40 menit"}, {"n": 45, "sec": "TIU", "t": "", "q": "Negasi dari pernyataan \"Siswa dapat memilih mata pelajaran Seni atau mata pelajaran Olahraga\" adalah...", "o": {"a": "Siswa tidak dapat memilih mata pelajaran Seni dan tidak dapat memilih mata pelajaran Olahraga.", "b": "Siswa tidak dapat memilih mata pelajaran Seni dan dapat memilih mata pelajaran Olahraga", "c": "Siswa dapat memilih mata pelajaran Seni dan dapat memilih mata pelajaran Olahraga.", "d": "Jawaban salah semua.", "e": "Tidak benar bahwa siswa dapat memilih mata pelajaran Seni atau mata pelajaran Olahraga."}, "ans": "a", "ex": "P1: Siswa dapat memilih mata pelajaran Seni atau mata pelajaran Olahraga. Sesuai dengan aturan pengingkaran/negasi, maka pernyataan harus diingkari secara keseluruhan. Lebih lanjut, perhatikan penyelesaian berikut: Negasi dari pernyataan tersebut: Siswa tidak dapat memilih mata pelajaran Seni dan tidak dapat memilih mata pelajaran Olahraga Penjelasan Setiap Opsi: Jawaban A: Benar karena sesuai dengan petunjuk dan kata kunci. Jawaban B: Tidak benar karena mempertahankan kemungkinan memilih mata pelajaran Olahraga. Jawaban C: Tidak benar karena mempertahankan kemungkinan memilih mata pelajaran Seni. Jawaban D: Tidak benar karena ada salah satu jawaban yang tepat. Jawaban E: Tidak benar karena tidak mengandung negasi dari kalimat \"atau\"."}, {"n": 46, "sec": "TIU", "t": "Pola Barisan / Deret", "q": "48, ; 576, ; 72, ; 864, ; 108, ; 1.296, ; …, ; …, ; …", "o": {"a": "162, ; 1.954, ; 243", "b": "164, ; 1.944, ; 243", "c": "162, ; 1.944, ; 243", "d": "164, ; 1.954, ; 253", "e": "166, ; 1.954, ; 253"}, "ans": "c", "ex": "Pola bergantian antara perkalian × 12 dan pembagian : 8: 48 xrightarrow{× 12} 576 xrightarrow{: 8} 72 xrightarrow{× 12} 864 xrightarrow{: 8} 108 xrightarrow{× 12} 1.296 xrightarrow{: 8} mathbf{162} xrightarrow{× 12} mathbf{1.944} xrightarrow{: 8} mathbf{243}"}, {"n": 47, "sec": "TIU", "t": "Silogisme", "q": "Semua mahasiswa yang berprestasi mendapatkan beasiswa. Sebagian mahasiswa yang rajin belajar adalah mahasiswa yang berprestasi. Tidak ada mahasiswa yang tidak rajin belajar lulus tepat waktu. Semua mahasiswa yang lulus tepat waktu mendapatkan pekerjaan dengan cepat. Simpulan yang tepat adalah ....", "o": {"a": "Semua mahasiswa yang mendapatkan beasiswa pasti lulus tepat waktu", "b": "Sebagian mahasiswa yang rajin belajar mendapatkan pekerjaan dengan cepat", "c": "Mahasiswa yang tidak mendapatkan beasiswa tidak lulus tepat waktu", "d": "Mahasiswa yang mendapatkan pekerjaan dengan cepat adalah mahasiswa yang rajin belajar", "e": "Semua mahasiswa yang lulus tepat waktu pasti berprestasi"}, "ans": "b", "ex": "- Semua mahasiswa yang berprestasi mendapatkan beasiswa. - Sebagian mahasiswa yang rajin belajar adalah mahasiswa yang berprestasi. - Tidak ada mahasiswa yang tidak rajin belajar lulus tepat waktu (artinya semua yang lulus tepat waktu adalah mahasiswa yang rajin belajar, atau sebagian mahasiswa yang rajin belajar lulus tepat waktu). - Semua mahasiswa yang lulus tepat waktu mendapatkan pekerjaan dengan cepat. Maka, sebagian mahasiswa yang rajin belajar mendapatkan pekerjaan dengan cepat."}, {"n": 48, "sec": "TIU", "t": "Perbandingan &amp; Soal Cerita", "q": "Harga 2 kodi daster adalah Rp2.000.000,00.<br>X &nbsp;|&nbsp; Y<br>Harga 0,5 lusin daster &nbsp;|&nbsp; Rp399.000,00<br>Hubungan kuantitas X dan Y yang tepat adalah ....", "o": {"a": "X &gt; Y", "b": "X &lt; Y", "c": "X = Y", "d": "4X = 3Y", "e": "Hubungan X dan Y tidak dapat ditentukan"}, "ans": "b", "ex": "Ingat: 1 kodi = 20 buah, dan 1 lusin = 12 buah. Harga 1 daster = 2.000.000/2 × 20 = 2.000.000/40 = Rp50.000,00 X = Harga 1/2 lusin daster = 1/2 × 12 × 50.000 = 6 × 50.000 = Rp300.000,00 therefore X &lt; Y"}, {"n": 49, "sec": "TIU", "t": "Analogi", "q": "<i>Calon jama'ah haji Indonesia sedang menjalankan manasik di Asrama Haji.</i><br>Kalimat yang berpolakan sama dengan pola tersebut adalah ....", "o": {"a": "Nurul berpuasa sunnah di Bulan Sya'ban sebagai persiapan fisik dan mental untuk menyambut Ramadhan", "b": "Perwakilan Manajemen dan Mitra Pengemudi Grab Indonesia menyerahkan sapi yang memiliki berat 1 ton untuk kurban", "c": "Sekretaris Jenderal Kemendagri tidak pernah menyatakan kepada publik bahwa ASN yang berpenghasilan di bawah Rp7 juta berhak menerima zakat", "d": "Teuku Wisnu dan Arie Untung membangun Masjid Ash-Sholihin di Yokohama, Jepang", "e": "Ibu itu senantiasa mendoakan anaknya yang sedang sakit agar Allah SWT segera memberikannya kesembuhan"}, "ans": "d", "ex": "- <b>Soal:</b> Calon jama'ah haji Indonesia (S) sedang menjalankan (P) manasik (O) di Asrama Haji (K) - <b>A)</b> Nurul (S) berpuasa (P) sunnah (Pel) di Bulan Sya'ban sebagai persiapan fisik dan mental untuk menyambut Ramadhan (K) - <b>B)</b> Perwakilan Manajemen dan Mitra Pengemudi Grab Indonesia (S) menyerahkan (P) sapi (O) yang memiliki berat 1 ton (Pel) untuk kurban (K) - <b>C)</b> Sekretaris Jenderal Kemendagri (S) tidak pernah menyatakan (P) kepada publik (O) bahwa ASN yang berpenghasilan di bawah Rp7 juta berhak menerima zakat (Pel) - <b>D)</b> Teuku Wisnu dan Arie Untung (S) membangun (P) Masjid Ash-Sholihin (O) di Yokohama, Jepang (K) - <b>E)</b> Ibu itu (S) senantiasa mendoakan (P) anaknya (O) yang sedang sakit (Pel) agar Allah SWT segera memberikannya kesembuhan (K)"}, {"n": 50, "sec": "TIU", "t": "", "q": "…, 1003, 1005, …, 1009", "o": {"a": "1000, 1008", "b": "1002, 1006", "c": "1001, 1007", "d": "1002, 1007", "e": "1001, 1006"}, "ans": "c", "ex": "Deret diatas membentuk pola bilangan ganjil 1001, 1003, 1005, 1007, 1009 (pola bilangan ganjil, ditambah 2"}, {"n": 51, "sec": "TIU", "t": "", "q": "Ali menabung di Bank sebesar Rp2.000.000,00 dengan suku bunga tunggal 6% per tahun. Pada saat diambil uang Ali menjadi Rp2.080.000,00. Lama Ali menabung adalah bulan", "o": {"a": "6 bulan", "b": "7 bulan", "c": "8 bulan", "d": "9 bulan", "e": "10 bulan"}, "ans": "c", "ex": "Diketahu: • M = Rp2.000.000,00 • Mn = Rp2.080.000,00 • b = 6% per tahun Ditanyakan: n = ... bulan Besar bunga yang diperoleh Ali B = Mn – M B = Rp2.080.000,00 – Rp2.000.000,00 B = Rp80.000,00 Rumus bunga tunggal B = Rp80.000,00 n/12 × b × M = Rp80.000,00 n/12 × 6% × Rp2.000.000,00 = Rp80.000,00 n/12 x 6/100 × 200 = 8 n/12 × 6 × 2 = 8 n=8 Jadi lama Ali menabung adalah 8 bulan"}, {"n": 52, "sec": "TIU", "q": "Umur Lina dua tahun lebih tua daripada Lili. Lima tahun mendatang, umur Lili adalah dua kali umur Lina saat ini. Berapakah umur Lina dan Lili secara berurut?", "o": {"a": "5 dan 3", "b": "3 dan 1", "c": "4 dan 2", "d": "6 dan 4", "e": "8 dan 6"}, "ans": "b", "ex": "Lili = x, Lina = x + 2. x + 5 = 2(x + 2) → x = 1. Lina 3 dan Lili 1."}, {"n": 53, "sec": "TIU", "t": "Hitungan Dasar", "q": "Hasil dari 9,5 - 2/5 × 4,5 : 9 + 0,7 = …", "o": {"a": "9,7", "b": "10,0", "c": "10,2", "d": "10,4", "e": "10,7"}, "ans": "b", "ex": "9,5 - 2/5 × 4,5 : 9 + 0,7 = 9,5 - 9/5 : 9 + 0,7 = 9,5 - 1/5 + 0,7 = 9,5 - 0,2 + 0,7 = 10"}, {"n": 54, "sec": "TIU", "q": "Sebuah menara yang tingginya 50 meter difoto dalam ukuran kecil dengan skala 1:1000, kemudian foto tersebut diperbesar dengan skala 5:1, maka tinggi menara di foto terakhir adalah...", "o": {"a": "30", "b": "25", "c": "20", "d": "15", "e": "10"}, "ans": "b", "ex": "Foto 1:1000 → 50 m menjadi 0,05 m (5 cm). Diperbesar 5× → 25 cm."}, {"n": 55, "sec": "TIU", "q": "Sebagian toko pakaian buka pada pukul 11.00. Toko pakaian tidak buka pada pukul 11.00. Kesimpulannya adalah", "o": {"a": "Toko pakaian buka pada malam hari", "b": "Toko pakaian buka pada sore hari", "c": "Toko pakaian buka pada pukul 10.00", "d": "Tidak bisa disimpulkan", "e": "Toko pakaian buka pada pukul 12.00"}, "ans": "d", "ex": "Karena toko pakaian tidak buka pada pukul 11.00, tidak bisa disimpulkan kapan toko pakaian buka."}, {"n": 56, "sec": "TIU", "t": "", "q": "Tangkai : Kelopak : Bunga =", "o": {"a": "Tubuh : tangan : kepala", "b": "Tanah : laut : air", "c": "Tahun : bulan : hari", "d": "Pelepah : tangkai : daun . e. Langit : tanah : magma"}, "ans": "d", "ex": "Tangkai, kelopak, bunga adalah urutan dari pangkal hingga ujung (bunga). Maka secara analogi akan sama dengan pelepah, tangkai, daun. Pelepah = ujung sambungan daun dengan batang, ranting, cabang. 12. Gambar 13. Gambar"}, {"n": 57, "sec": "TIU", "t": "Perbandingan &amp; Soal Cerita", "q": "Perhatikan tabel berikut!<br>P &nbsp;|&nbsp; Q<br>A - 1/4 A &nbsp;|&nbsp; 5/8 B + A^2<br>Jika A = 1/4 dan B = 1/5 , maka hubungan kuantitas yang benar adalah ....", "o": {"a": "P &gt; Q", "b": "P &lt; Q", "c": "P = Q", "d": "16P = 5Q", "e": "5P = 16Q"}, "ans": "c", "ex": "P = A - 1/4 A = 1/4 - 1/4 ( 1/4 ) = 1/4 - 1/16 = 4 - 1/16 = 3/16 Q = 5/8 B + A^2 = 5/8 ( 1/5 ) + ( 1/4 )^2 = 1/8 + 1/16 = 2 + 1/16 = 3/16 therefore P = Q"}, {"n": 58, "sec": "TIU", "t": "Analitis", "q": "Susanti memiliki sebuah rak buku kecil yang terbagi atas lima tingkat. Tingkat pertama adalah yang teratas dan tingkat kelima adalah yang terbawah. Susanti menyimpan buku-buku pelajarannya ke dalam rak dengan aturan sebagai berikut:<br>1. Buku pelajaran Kimia dan Geografi diletakkan saling terpisah sejauh mungkin<br>2. Buku pelajaran Matematika disimpan tepat di atas buku pelajaran Biologi, sedangkan buku pelajaran Bahasa Indonesia diletakkan tepat di bawah buku Biologi<br>3. Buku pelajaran Ekonomi diletakkan di atas buku pelajaran Fisika dan Kimia, sedangkan buku pelajaran Fisika dan Kimia berada di atas buku pelajaran Matematika<br>Urutan buku dari tingkat tertinggi ke tingkat terendah adalah ....", "o": {"a": "Kimia, Fisika, Matematika, Ekonomi, dan Geografi", "b": "Ekonomi, Fisika, Matematika, Biologi, dan Geografi", "c": "Ekonomi, Bahasa Indonesia, Biologi, Geografi, dan Kimia", "d": "Geografi, Fisika, Matematika, Bahasa Indonesia, dan Kimia", "e": "Matematika, Geografi, Bahasa Indonesia, Biologi, dan Fisika"}, "ans": "b", "ex": "Urutan susunan rak buku dari tingkat paling atas ke paling bawah: - <b>Tingkat 1:</b> Ekonomi - <b>Tingkat 2:</b> Fisika, Kimia - <b>Tingkat 3:</b> Matematika - <b>Tingkat 4:</b> Biologi - <b>Tingkat 5:</b> Bahasa Indonesia, Geografi"}, {"n": 59, "sec": "TIU", "t": "Soal Cerita", "q": "Jika 3 mesin dapat menghasilkan 900 produk dalam 6 jam, berapa banyak produk yang bisa dihasilkan oleh 6 mesin dalam waktu 4 jam?", "o": {"a": "1.000 produk", "b": "1.200 produk", "c": "1.500 produk", "d": "1.800 produk", "e": "2.400 produk"}, "ans": "b", "ex": "3 mesin → 900 produk → 6 jam 6 mesin → X produk → 6 jam (Perbandingan senilai) 3/6 = 900/X → 1/2 = 900/X → X = 1.800 produk 6 mesin → 1.800 produk → 6 jam 6 mesin → Y produk → 4 jam (Perbandingan senilai) 1.800/Y = 6/4 → 300/Y = 1/4 → Y = 1.200 produk"}, {"n": 60, "sec": "TIU", "q": "Seorang penjual mengantar pesanan sebanyak 36 mangkuk bakso ke sebuah tempat. Si penjual hanya bisa membawa 9 mangkuk setiap kali pengantaran. Berapa kali si penjual harus mengantarkan seluruh pesanan?", "o": {"a": "2", "b": "3", "c": "4", "d": "5", "e": "6"}, "ans": "c", "ex": "36 ÷ 9 = 4 kali pengantaran."}, {"n": 61, "sec": "TIU", "q": "8 - 16 - 32 - 64 - 128 - … - …", "o": {"a": "144 - 288", "b": "160 - 320", "c": "192 - 384", "d": "224 - 448", "e": "256 - 512"}, "ans": "e", "ex": "Pola bilangan menggandakan angka sebelumnya: 8, 16, 32, 64, 128, 256, 512."}, {"n": 62, "sec": "TIU", "q": "Semua pasangan yang menikah di KUA adalah pasangan sah. Pasangan yang sah, pasti memiliki buku nikah. Maman dan Indah mempunyai buku nikah. Kesimpulannya...", "o": {"a": "Buku nikah Maman dan Indah palsu", "b": "Maman dan Indah tentu menikah di KUA", "c": "Maman dan Indah tidak menikah", "d": "Maman dan Indah belum tentu sah", "e": "Maman dan Indah pasangan yang tidak sah"}, "ans": "d", "ex": "Premis hanya menyatakan pasangan sah pasti punya buku nikah, bukan sebaliknya. Jadi status sah belum tentu."}, {"n": 63, "sec": "TIU", "t": "", "q": "“ Jika semua peserta Tes CPNS 2024 fokus dalam belajar SKD, maka mereka pasti Lulus Tes CPNS 2024” Konvers dari pernyataan tersebut yang benar adalah...", "o": {"a": "Jika ada peserta Tes CPNS 2024 yang tidak fokus dalam belajar SKD, maka mereka pasti Lulus Tes CPNS 2024", "b": "Jika semua peserta Tes CPNS 2024 tidak fokus dalam belajar SKD, maka mereka pasti Lulus Tes CPNS 2024", "c": "Jika mereka pasti Lulus Tes CPNS 2024, maka ada peserta Tes CPNS 2024 yang tidak fokus dalam belajar SKD", "d": "Jika mereka belum tentu Lulus Tes CPNS 2024, maka semua peserta Tes CPNS 2024 fokus dalam belajar SKD", "e": "Jika mereka pasti Lulus Tes CPNS 2024, maka semua peserta Tes CPNS 2024 fokus dalam belajar SKD"}, "ans": "e", "ex": "Soal tersebut adalah soal jenis Konversi untuk Jika-Maka. Untuk itu ada aturan terkait Pernyataan Konversi, yaitu : 1) Konvers dari Jika P maka Q adalah Jika Q maka Q Untuk itu konvers yang benar dari pernyataan “Jika semua peserta Tes CPNS 2024 fokus dalam belajar SKD, maka mereka pasti Lulus Tes CPNS 2024” adalah Jika mereka pasti Lulus Tes CPNS 2024, maka semua peserta Tes CPNS 2024 fokus dalam belajar SKD"}, {"n": 64, "sec": "TIU", "q": "Tentukan himpunan penyelesaian dari 2(x - 1) &gt; 3(x + 2)", "o": {"a": "x &gt; -8", "b": "x &lt; -8", "c": "x &gt; 8", "d": "x &lt; 8", "e": "x &gt; 4"}, "ans": "b", "ex": "Langkah penyelesaian: 2(x - 1) &gt; 3(x + 2) 2x - 2 &gt; 3x + 6 2x - 3x &gt; 6 + 2 -x &gt; 8 ⇒ x &lt; -8"}, {"n": 65, "sec": "TIU", "t": "Pola Barisan / Deret", "q": "2, ; 8, ; 5, ; 20, ; 16, ; 64, ; 59, ; …, ; …", "o": {"a": "118, ; 112", "b": "177, ; 171", "c": "177, ; 172", "d": "236, ; 231", "e": "236, ; 230"}, "ans": "e", "ex": "Pola bergantian antara perkalian × 4 dan pengurangan berurutan (-3, -4, -5, -6): 2 xrightarrow{× 4} 8 xrightarrow{-3} 5 xrightarrow{× 4} 20 xrightarrow{-4} 16 xrightarrow{× 4} 64 xrightarrow{-5} 59 xrightarrow{× 4} mathbf{236} xrightarrow{-6} mathbf{230}"}, {"n": 66, "sec": "TKP", "t": "", "q": "Sebagai makhluk sosial tentu sudah menjadi hal yang lumrah untuk dapat beradaptasi dan bersosialisasi dengan masyarakat lingkungan sekitar. Menurut saya, dalam menjalin sosialisasi bertetangga dan bermasyarakat seharusnya kita...", "o": {"a": "Memposisikan diri dengan kondisi yang ada", "b": "Bersosialisasi dan bermasyarakat seperlunya saja", "c": "Sebisa mungkin berperilaku berperan serta aktif dan positif", "d": "Pasif menunggu ajakan yang datang kepada saya", "e": "Menjadi diri sendiri sesuai dengan pribadi saya."}, "ans": "c", "ex": "Dalam bersosialisasi dan bermasyarakat, alangkah baiknya kita sebisa mungkin kita ikut berperan aktif dan positif, mampu memberikan hal yang bermanfaat, sebab tetangga adalah lingkungan terdekat kita setelah keluarga.", "sc": {"a": 4, "b": 3, "c": 5, "d": 1, "e": 2}}, {"n": 67, "sec": "TKP", "t": "Anti-Radikalisme", "q": "Sebagai mahasiswa yang peduli dengan dampak pemahaman radikalisme di media sosial, Anda memutuskan untuk aktif berpartisipasi dalam kegiatan sosial. Suatu hari, Anda mendapatkan informasi bahwa kelompok mahasiswa di kampus Anda berencana membuat sebuah proyek untuk menangkal pemahaman radikalisme. Sikap Anda adalah ....", "o": {"a": "Membantu mengembangkan konten positif yang secara khusus menggambarkan sikap antiradikalisme untuk memberikan pemahaman yang jelas tentang bahaya radikalisme dan terorisme", "b": "Ikut serta dalam kegiatan yang bertujuan meningkatkan pemahaman agama dan mengimplementasikannya dalam kehidupan sehari-hari, sehingga dapat membantu menyebarkan pesan toleransi dan perdamaian", "c": "Memberikan kontribusi dalam proyek yang bertujuan meningkatkan pemahaman Pancasila sebagai dasar negara, sehingga mendorong nilai-nilai kebangsaan dan pluralisme", "d": "Terlibat aktif dalam pembuatan konten positif dan perdamaian di media sosial dengan tujuan menyebarluaskan informasi yang mendukung dialog dan kerukunan antarlapisan masyarakat", "e": "Berpartisipasi dalam membuat konten yang mendukung semangat bela negara dengan fokus pada nilai-nilai patriotisme dan kecintaan terhadap negara"}, "ans": "a", "ex": "Opsi A mendapatkan skor tertinggi karena fokus pada pembuatan konten positif antiradikalisme yang secara langsung menangkal pemahaman radikalisme di media sosial. Pembuatan konten positif antiradikalisme juga dapat menjadi sarana edukasi yang efektif untuk memberikan wawasan kepada masyarakat luas tentang pentingnya menolak pemahaman yang ekstrem.", "sc": {"a": 5, "b": 2, "c": 1, "d": 3, "e": 4}}, {"n": 68, "sec": "TKP", "t": "Teknologi Informasi dan Komunikasi", "q": "Sebagai seorang manajer IT, Anda ingin memastikan keamanan data perusahaan tanpa menghambat produktivitas karyawan. Sikap Anda adalah ....", "o": {"a": "Meminta karyawan untuk menandatangani perjanjian kerahasiaan", "b": "Mengizinkan akses penuh ke semua data perusahaan bagi semua perangkat yang terhubung", "c": "Melakukan enkripsi pada semua data perusahaan yang diakses melalui perangkat pribadi", "d": "Membatasi akses ke data sensitif hanya untuk perangkat yang telah terdaftar dan memenuhi standar keamanan tertentu", "e": "Mengandalkan kesadaran pengguna sebagai garis pertahanan utama"}, "ans": "d", "ex": "Membatasi akses dan menerapkan standar keamanan yang ketat adalah cara yang paling efektif untuk melindungi data perusahaan.", "sc": {"a": 2, "b": 1, "c": 4, "d": 5, "e": 3}}, {"n": 69, "sec": "TKP", "t": "Teknologi Informasi dan Komunikasi", "q": "Sebuah perusahaan rintisan ingin memperkenalkan produk inovatifnya kepada pasar yang lebih luas. Langkah awal mereka seharusnya adalah ....", "o": {"a": "Membuat iklan televisi yang menarik untuk menjangkau audiens yang lebih besar", "b": "Membuat akun media sosial di semua platform yang populer dan aktif mengunggah konten-konten yang relevan", "c": "Membangun halaman web yang informatif dan mudah dinavigasi", "d": "Mengadakan lomba desain logo dengan hadiah menarik untuk meningkatkan <i>brand awareness</i>", "e": "Membangun dan menjalin kerja sama dengan <i>influencer</i> terkenal untuk mempromosikan produk mereka"}, "ans": "b", "ex": "Media sosial adalah langkah yang tepat untuk menjangkau audiens secara luas dengan biaya yang relatif terjangkau.", "sc": {"a": 2, "b": 5, "c": 3, "d": 1, "e": 4}}, {"n": 70, "sec": "TKP", "t": "", "q": "Beberapa kelompok masyarakat berencana menggelar parade sound system di jalan utama desa yang melibatkan masa dalam jumlah besar. Beberapa warga memprotes kegiatan ini karena suara yang dihasilkan merusak jendela rumah warga. Selain itu, parade melewati beberapa rumah yang dihuni oleh orang tua dengan gangguan kesehatan. Yang harus saya lakukan sebagai kepala desa adalah;", "o": {"a": "Tidak memberikan izin pelaksanaan parade.", "b": "Meminta bantuan aparat keamanan untuk ikut mengamankan parade.", "c": "Memberikan izin kegiatan hanya jika panitia berjanji akan mengganti properti warga yang rusak oleh suara parade.", "d": "Memindahkan warga yang sakit ke tempat aman selama parade diselenggarakan.", "e": "Memberikan izin jika peserta parade berjanji menyalakan sound system dengan suara pelan"}, "ans": "a", "ex": "Menolak memberikan izin bisa menjadi solusi untuk melindungi warga yang terganggu oleh suara parade. Ini menunjukkan tanggung jawab terhadap kesejahteraan masyarakat.", "sc": {"a": 5, "b": 2, "c": 3, "d": 4, "e": 1}}, {"n": 71, "sec": "TKP", "t": "Anti-Radikalisme", "q": "Anda adalah seorang pemimpin di masyarakat yang berkomitmen untuk mengatasi masalah radikalisme melalui pendekatan pencegahan. Menurut Anda, pencegahan tersebut dapat ditempuh dengan cara meningkatkan akses pendidikan berkualitas bagi masyarakat. Sikap Anda dalam mengimplementasikan strategi tersebut adalah ....", "o": {"a": "Membangun pusat pelatihan masyarakat yang fokus pada pemberdayaan dengan mengajarkan nilai-nilai demokrasi, pluralisme, dan toleransi", "b": "Menyusun daftar individu dari kelompok radikal dan menghentikan akses mereka ke institusi pendidikan", "c": "Menyelenggarakan <i>workshop</i> bagi guru untuk memahami dan mengintegrasikan materi tentang pencegahan radikalisme ke dalam kurikulum pendidikan formal", "d": "Memberikan program beasiswa bagi siswa dari latar belakang yang berisiko agar mereka dapat melanjutkan pendidikan tinggi", "e": "Menentukan batasan akses ke pendidikan berdasarkan pilihan politik atau pandangan tertentu sebagai tindakan preventif"}, "ans": "d", "ex": "Memberikan program beasiswa kepada siswa dari latar belakang yang berisiko memperlihatkan komitmen untuk meratakan kesempatan pendidikan dan mendorong kemajuan individu yang mungkin rentan terhadap pengaruh radikalisme. Beasiswa tersebut dapat menjadi sarana untuk membuka pintu bagi mereka yang mungkin kurang mampu untuk melanjutkan pendidikan tinggi, menciptakan lingkungan inklusif, dan membantu masyarakat secara keseluruhan dalam pencegahan radikalisme melalui pendekatan pendidikan yang positif.", "sc": {"a": 4, "b": 2, "c": 3, "d": 5, "e": 1}}, {"n": 72, "sec": "TKP", "t": "", "q": "Sebagai administrator sistem di sebuah perusahaan besar, Anda menerima laporan bahwa beberapa karyawan mengalami kesulitan mengakses server email perusahaan. Setelah investigasi lebih lanjut, Anda menemukan bahwa server email tersebut mengalami serangan phishing yang berhasil memengaruhi sejumlah akun karyawan. Tindakan yang paling tepat untuk Anda ambil adalah...", "o": {"a": "Memperingatkan seluruh karyawan untuk tidak membuka email yang mencurigakan dan mengganti kata sandi akun mereka.", "b": "Menyebarkan pemberitahuan kepada seluruh karyawan untuk memberikan informasi terkait serangan phishing dan cara mengidentifikasi email yang tidak aman.", "c": "Memutuskan sementara akses ke server email, menghapus email yang mencurigakan, dan melakukan pemulihan dari backup terakhir.", "d": "Melaporkan serangan phishing kepada pihak berwenang dan memberikan bukti elektronik yang ditemukan selama investigasi.", "e": "Menjalankan program pelatihan keamanan siber kepada seluruh karyawan untuk meningkatkan kesadaran mereka tentang ancaman phishing dan praktik keamanan email yang baik."}, "ans": "c", "ex": "", "sc": {"a": 3, "b": 2, "c": 5, "d": 4, "e": 1}}, {"n": 73, "sec": "TKP", "t": "Pelayanan Publik", "q": "Toni adalah seorang pegawai negeri yang baru saja dipromosikan sebagai kepala bagian pengembangan pegawai di kantor pemerintah. Ia mendapati dirinya dihadapkan pada tantangan baru dalam memberikan pelayanan publik yang lebih baik kepada masyarakat. Kantor tempat Toni bekerja menginisiasi program pendampingan dan pembinaan untuk pengembangan keterampilan para pegawai di bidang pelayanan publik. Sikap Toni seharusnya adalah ....", "o": {"a": "Menganggap bahwa kegiatan tersebut sebagai kegiatan yang baik dan meminta seluruh karyawan untuk mengikutinya agar pengalaman mereka di bidang pelayanan publik meningkat", "b": "Mengikuti program tersebut sebagai formalitas, karena program tersebut belum tentu bermanfaat bagi Toni yang sudah menjabat sebagai kepala bagian pengembangan pegawai", "c": "Mengikuti program tersebut dengan penuh perhatian terhadap materi yang disampaikan demi keterampilan dan pengetahuan dalam melayani masyarakat", "d": "Mengikuti program tersebut dan mempelajari sungguh-sungguh materi yang disampaikan oleh pemateri selama materi tersebut relevan", "e": "Segera mengosongkan jadwal pribadi demi bisa mengikuti program tersebut sebagai bagian dari kepatuhan terhadap perintah atasan"}, "ans": "c", "ex": "Sebagai seorang pemimpin di bidang pelayanan publik, Toni seharusnya mengambil sikap terbuka terhadap kesempatan untuk meningkatkan keterampilan dan pengetahuan dalam memberikan pelayanan yang lebih baik kepada masyarakat.", "sc": {"a": 1, "b": 2, "c": 5, "d": 4, "e": 3}}, {"n": 74, "sec": "TKP", "t": "Jejaring Kerja", "q": "Rudi, seorang direktur operasional di sebuah perusahaan rintisan, mendapati bahwa sebagian besar anggota tim pengembang perangkat lunak mulai menunjukkan tanda-tanda ketidakpuasan dan perasaan tidak dihargai. Beberapa karyawan bahkan menyuarakan keluhan mereka secara terbuka. Rudi menyadari bahwa kepuasan karyawan sangat penting untuk produktivitas dan kualitas hasil kerja timnya. Sikap Rudi seharusnya adalah ....", "o": {"a": "Segera menyusun rencana bisnis baru untuk meningkatkan produktivitas", "b": "Mengirimkan pesan atau surat elektronik kepada seluruh tim dan menegaskan bahwa perusahaan masih sangat menghargai kontribusi setiap karyawan", "c": "Mengadakan pertemuan kelompok untuk membahas keluhan karyawan dan mencari solusi bersama", "d": "Melibatkan tim dalam pembuatan kebijakan baru tanpa menilai dampak atau relevansinya terhadap keluhan yang disampaikan", "e": "Berupaya mengurangi tekanan dan meningkatkan kepuasan kerja anggota tim dengan cara mengurangi tanggung jawab pekerjaan setiap anggota tim"}, "ans": "c", "ex": "Opsi C tepat karena melibatkan pendekatan yang proaktif dan terbuka dalam menanggapi keluhan karyawan. Dengan mengadakan pertemuan kelompok untuk membahas keluhan dan mencari solusi bersama, Rudi dapat menciptakan ruang dialog yang positif antara pimpinan dan anggota tim. Pendekatan ini memungkinkan karyawan untuk menyampaikan perasaan mereka, serta memberikan kesempatan bagi manajemen untuk memahami lebih baik faktor-faktor yang dapat memengaruhi kepuasan kerja.", "sc": {"a": 1, "b": 2, "c": 5, "d": 3, "e": 4}}, {"n": 75, "sec": "TKP", "t": "", "q": "Pegawai yang tidak saya sukai secara personal dipindahkan ke divisi yang sama dengan saya. Pegawai tersebut menyapa saya dengan akrab tanpa menunjukkan kami memiliki rasa saling tidak suka. Maka saya;", "o": {"a": "Bersikap profesional dan menyapa dengan ramah.", "b": "Menjauh untuk menghindari konflik.", "c": "Berusaha bersikap ramah agar tidak menimbulkan perselisihan.", "d": "Menyapa dengan apa-adanya meski menunjukkan rasa tidak suka.", "e": "Diam dan membiarkannya melakukan apa yang dia mau."}, "ans": "a", "ex": "Ini adalah respons yang baik karena menunjukkan kedewasaan dan profesionalisme. Anda memisahkan perasaan pribadi Anda dari situasi kerja dan tetap bersikap ramah.", "sc": {"a": 5, "b": 2, "c": 4, "d": 3, "e": 1}}, {"n": 76, "sec": "TKP", "t": "", "q": "Anda bekerja dalam tim pengembangan perangkat lunak yang terdiri dari anggota yang memiliki berbagai tingkat pengalaman. Sebuah proyek kritis sedang berlangsung dan setiap anggota tim memiliki tanggung jawabnya masing-masing. Suatu hari, Anda mengetahui bahwa seorang anggota tim dengan pengalaman tinggi menyelesaikan tugasnya dengan sangat cepat, meninggalkan anggota tim lainnya yang lebih baru dan mungkin kesulitan. Bagaimana Anda akan menanggapi situasi ini?", "o": {"a": "Menyampaikan kekecewaan kepada anggota tim berpengalaman dan meminta mereka untuk membantu anggota tim lainnya.", "b": "Mengajukan pertanyaan terbuka dalam pertemuan tim untuk memahami apakah ada tantangan atau kebutuhan yang perlu didukung anggota tim berpengalaman.", "c": "Menyelesaikan tugas Anda sendiri dengan sebaik mungkin dan tidak memberi perhatian terhadap ketidakseimbangan distribusi pekerjaan di tim.", "d": "Membahas masalah ini secara pribadi dengan manajer tim untuk mencari solusi yang adil bagi semua anggota tim.", "e": "Memutuskan untuk menyelesaikan tugas anggota tim lain yang kesulitan untuk memastikan proyek berjalan lancar tanpa menimbulkan konflik."}, "ans": "b", "ex": "", "sc": {"a": 3, "b": 5, "c": 1, "d": 4, "e": 2}}, {"n": 77, "sec": "TKP", "t": "Sosial Budaya", "q": "Anda ditugaskan untuk memimpin proyek di sebuah desa terpencil. Di sana, Anda mengamati bahwa mayoritas penduduk memiliki kebiasaan makan bersama di balai desa setiap malam. Kebiasaan tersebut bertujuan untuk mempererat tali silaturahmi antarwarga. Sikap Anda adalah ....", "o": {"a": "Mengikuti kebiasaan warga dan makan bersama setiap malam", "b": "Mencoba menyesuaikan diri dengan kebiasaan warga, namun dengan batasan waktu tertentu", "c": "Mengajak warga makan bersama di tempat yang lebih modern, seperti restoran", "d": "Mengusulkan kegiatan lain yang lebih produktif selain makan bersama", "e": "Tetap berpegang pada rutinitas pribadi dan makan di penginapan"}, "ans": "b", "ex": "Dengan mencoba menyesuaikan diri secara bertahap, Anda menunjukkan rasa hormat terhadap budaya setempat, namun tetap memperhatikan efisiensi waktu dan tugas Anda sebagai pemimpin proyek.", "sc": {"a": 4, "b": 5, "c": 2, "d": 3, "e": 1}}, {"n": 78, "sec": "TKP", "t": "Anti-Radikalisme", "q": "Dinda adalah seorang konselor yang bekerja dengan seorang klien yang menunjukkan tanda-tanda kecenderungan radikalisme atau ekstremisme dalam pandangannya. Selama sesi konseling, klien tersebut menegaskan pandangannya yang radikal dan menolak untuk membuka diri terhadap pandangan yang berbeda. Dinda dihadapkan pada tantangan dalam membantu klien mengatasi masalahnya tanpa memaksakan pandangan atau menciptakan konfrontasi yang tidak perlu. Sikap Dinda seharusnya adalah ....", "o": {"a": "Memintanya untuk mengutarakan seluruh hal yang dirasakan dan Dinda mendengarkannya dengan baik", "b": "Terus berupaya memberi masukan-masukan agar pandangan klien bisa mengikuti pandangan Dinda yang modern", "c": "Mengajak klien untuk membuka diri terhadap pandangan yang berbeda dengan pendekatan yang empatik dan terbuka", "d": "Memberikan label kepada klien sebagai orang yang radikal dan mengambil tindakan yang sesuai", "e": "Menghindari konfrontasi dengan klien dengan mengakhiri konseling secepat mungkin"}, "ans": "c", "ex": "Meskipun klien teguh dalam pandangannya, mengajaknya untuk membuka diri terhadap pandangan yang berbeda dapat membuka pintu untuk dialog yang lebih mendalam dan pemahaman yang lebih baik tentang sumber-sumber radikalisme atau ekstremisme yang mungkin dialami klien. Dengan pendekatan yang empatik dan terbuka, Dinda dapat membantu klien mengeksplorasi dan memahami pandangannya secara lebih holistik, yang pada gilirannya dapat membantu dalam proses pemulihan.", "sc": {"a": 4, "b": 3, "c": 5, "d": 1, "e": 2}}, {"n": 79, "sec": "TKP", "t": "Teknologi Informasi dan Komunikasi", "q": "Sebuah perusahaan teknologi sedang mengembangkan aplikasi <i>mobile</i> baru. Tim pengembang mengalami kendala dalam tahap pengujian beta karena banyak pengguna yang melaporkan aplikasi sering <i>crash</i> dan tampilan antarmuka yang kurang <i>user-friendly</i>. Sebagai seorang <i>Quality Assurance</i> (QA) <i>Engineer</i>, sikap Anda adalah ....", "o": {"a": "Menyarankan untuk melakukan pengujian ulang secara menyeluruh dan memperbaiki <i>bug</i> atau kesalahan yang ditemukan", "b": "Meminta tim desain untuk melakukan redesain total aplikasi agar lebih menarik", "c": "Mengirimkan survei kepada pengguna untuk mengetahui lebih lanjut tentang masalah yang mereka hadapi", "d": "Menyampaikan bahwa tim pengembang harus bertanggung jawab penuh karena mereka kurang memperhatikan kualitas kode", "e": "Mengusulkan untuk mempercepat peluncuran aplikasi agar dapat bersaing dengan kompetitor"}, "ans": "a", "ex": "Melakukan pengujian ulang secara menyeluruh dan memperbaiki <i>bug</i> adalah langkah tepat dalam menjaga atau meningkatkan kualitas aplikasi demi kepuasan pengguna.", "sc": {"a": 5, "b": 2, "c": 4, "d": 1, "e": 3}}, {"n": 80, "sec": "TKP", "t": "Jejaring Kerja", "q": "Anda baru saja bergabung dalam sebuah proyek lintas departemen dan belum terlalu mengenal banyak orang. Proyek tersebut membutuhkan kolaborasi dengan banyak pihak dari berbagai divisi. Upaya Anda dalam memperluas jaringan kerja adalah ....", "o": {"a": "Menunggu dengan sabar hingga anggota tim lain mengajak Anda untuk berdiskusi atau bekerja sama dalam proyek", "b": "Menghubungi setiap anggota tim satu per satu untuk memperkenalkan diri dan membicarakan bagaimana Anda dapat berkolaborasi", "c": "Berkomunikasi hanya dengan atasan Anda untuk memastikan instruksi yang jelas dan menunggu arahan selanjutnya", "d": "Menghadiri semua pertemuan tim dan mendengarkan dengan saksama tanpa terlalu aktif berpartisipasi", "e": "Mengajukan diri untuk memimpin beberapa tugas dalam proyek, sehingga Anda memiliki kesempatan untuk bekerja sama dengan lebih banyak orang"}, "ans": "b", "ex": "Dengan memperkenalkan diri dan menunjukkan niat untuk bekerja sama, Anda membangun hubungan yang kuat dan menunjukkan bahwa Anda terbuka untuk kolaborasi.", "sc": {"a": 1, "b": 5, "c": 2, "d": 3, "e": 4}}, {"n": 81, "sec": "TKP", "t": "", "q": "Saya diberikan hadiah oleh perwakilan perusahaan yang telah saya audit. Saya merasa telah melakukan audit sesuai dengan ketentuan dan tidak memberikan perlakuan khusus kepada perusahaan tersebut. Karena itu saya;", "o": {"a": "Menolak karena khawatir dianggap memiliki konflik kepentingan.", "b": "Menerima dan menganggapnya sebagai hadiah.", "c": "Menolak dan menjelaskan bahwa hasil audit saya buat apa adanya.", "d": "Menerima karena khawatir merusak hubungan baik.", "e": "Menolak dan meminta perwakilan tersebut tidak perlu lagi memberi saya hadiah"}, "ans": "c", "ex": "Menolak hadiah sambil menegaskan bahwa hasil audit dibuat secara objektif menunjukkan kesadaran terhadap norma etika dan kepatuhan terhadap standar profesional.", "sc": {"a": 3, "b": 1, "c": 5, "d": 1, "e": 4}}, {"n": 82, "sec": "TKP", "t": "", "q": "Anda baru saja pindah dinas ke luar pulau, tepatnya di kota Bengkulu, karena ada tugas penting yang harus diselesaikan terkait masalah perusahaan. Saat ini, sedang berdinas di daerah tersebut, atasan Anda yang berada di pulau Jawa meminta Anda untuk membuat bahan presentasi yang menarik dan berbeda dari yang sebelumnya. Atasan Anda mempercayakan tugas ini kepada Anda karena mengetahui kemampuan Anda yang sangat paham dengan Teknologi Informasi dan Komunikasi. Materi presentasi yang Anda buat akan ditampilkan kepada klien perusahaan. Untuk memberikan presentasi yang menarik, langkah yang seharusnya Anda lakukan adalah...", "o": {"a": "Mempelajari lebih lanjut fitur presentasi terbaru agar dapat menyajikan materi yang terbaik.", "b": "Mencoba menggunakan fitur terbaru ketika Anda memiliki waktu luang.", "c": "Membuat materi presentasi sesuai dengan keinginan atasan.", "d": "Menyajikan kembali materi presentasi yang sudah pernah ditampilkan sebelumnya.", "e": "Mempelajari fitur-fitur terbaru untuk dapat mengajarkannya kepada rekan kerja yang lain."}, "ans": "a", "ex": "Pilihan A menjadi pilihan terbaik dalam situasi ini. Mempelajari lebih lanjut fitur presentasi terbaru akan membantu Anda menyajikan materi dengan cara yang inovatif dan menarik, sesuai dengan harapan atasan dan memberikan nilai tambah pada presentasi.", "sc": {"a": 5, "b": 3, "c": 2, "d": 1, "e": 4}}, {"n": 83, "sec": "TKP", "t": "Sosial Budaya", "q": "Sebuah desa di daerah pegunungan memiliki tradisi unik dalam menyambut musim panen, yaitu dengan menggelar tarian adat. Namun, seiring berjalannya waktu, minat generasi muda terhadap tarian adat tersebut semakin menurun. Sebagai seorang pemuda, sikap Anda adalah ....", "o": {"a": "Menyerahkan pelestarian tarian adat sepenuhnya kepada para sesepuh desa", "b": "Melarang generasi muda untuk mengikuti tren budaya modern agar mereka tetap melestarikan tarian adat", "c": "Menganggap tarian adat sebagai tradisi kuno yang tidak relevan dengan kehidupan modern", "d": "Mengubah gerakan tarian adat agar terlihat lebih modern dan menarik bagi generasi muda", "e": "Membentuk kelompok pemuda untuk mempelajari dan melestarikan tarian adat, serta mempromosikannya melalui media sosial"}, "ans": "e", "ex": "Dengan melibatkan generasi muda secara aktif, pelestarian budaya dapat dilakukan secara berkelanjutan dan relevan dengan zaman.", "sc": {"a": 3, "b": 2, "c": 1, "d": 4, "e": 5}}, {"n": 84, "sec": "TKP", "t": "Pelayanan Publik", "q": "Seorang pelanggan telah mengajukan keluhan tertulis kepada perusahaan penerbangan tentang pengalaman buruk yang ia alami selama penerbangan terakhir. Ia menyebutkan keterlambatan yang signifikan, ketidaknyamanan di dalam pesawat, dan kurangnya komunikasi dari pihak maskapai selama situasi tersebut. Menanggapi keluhan tersebut, sikap pihak perusahaan seharusnya adalah ....", "o": {"a": "Menyampaikan perihal faktor eksternal seperti cuaca buruk sebagai penyangkal tanggung jawabnya atas keterlambatan tersebut", "b": "Mengirimkan tanggapan singkat yang mengonfirmasi penerimaan keluhan tanpa komitmen nyata untuk perbaikan dan perubahan", "c": "Meminta maaf, memberikan penjelasan yang transparan, dan [menunjukkan] tanggung jawab", "d": "Menyatakan bahwa pengalaman penerbangan telah sesuai dengan standar internasional sehingga keluhan pelanggan tidak mendasar", "e": "Menyediakan kompensasi yang sesuai, seperti diskon untuk penerbangan berikutnya sebagai upaya minta maaf atas ketidaknyamanan yang dialami pelanggan"}, "ans": "c", "ex": "Sebagai perusahaan penerbangan, penting untuk mengakui keluhan pelanggan dengan penuh tanggung jawab, meminta maaf, dan memberikan penjelasan yang transparan. Memberikan kompensasi yang sesuai juga merupakan tindakan yang dapat mendemonstrasikan kepedulian perusahaan terhadap pengalaman pelanggan yang kurang memuaskan. Mengabaikan keluhan atau mencari alasan untuk membenarkan situasi tidak akan membantu membangun hubungan positif dengan pelanggan.", "sc": {"a": 2, "b": 1, "c": 5, "d": 3, "e": 4}}, {"n": 85, "sec": "TKP", "t": "Anti-Radikalisme", "q": "Anda bekerja di sebuah perusahaan swasta. Salah satu rekan kerja Anda sering menyampaikan pandangan-pandangan yang radikal dan intoleran dalam percakapan sehari-hari. Anda merasa khawatir jika pandangan tersebut dapat memengaruhi rekan kerja lainnya. Sikap Anda yang paling tepat adalah ....", "o": {"a": "Mengabaikan pandangan rekan kerja tersebut", "b": "Mencoba mendebatnya secara terbuka di depan rekan kerja lainnya", "c": "Melaporkan perilaku rekan kerja tersebut ke HRD", "d": "Mencoba mengajak rekan kerja tersebut berdiskusi secara privat", "e": "Menghindari kontak dengan rekan kerja tersebut"}, "ans": "d", "ex": "Diskusi pribadi memungkinkan Anda untuk menyampaikan kekhawatiran Anda secara terbuka dan jujur, tanpa melibatkan orang lain. Ini juga memberi kesempatan bagi rekan kerja Anda untuk menjelaskan pandangannya dan membuka ruang untuk saling memahami.", "sc": {"a": 1, "b": 2, "c": 4, "d": 5, "e": 3}}, {"n": 86, "sec": "TKP", "t": "Pelayanan Publik", "q": "Seorang pria datang ke kantor kecamatan untuk mengurus surat keterangan domisili yang akan digunakan untuk mendapatkan bantuan sosial. Ia terlihat sangat tergesa-gesa karena anaknya harus segera dirawat di rumah sakit. Namun, atasan Anda sudah menegaskan bahwa semua layanan harus diselesaikan berdasarkan antrean. Sikap Anda sebagai pegawai kecamatan adalah ....", "o": {"a": "Memintanya untuk tenang dan duduk di antrean, menunggu giliran sesuai aturan", "b": "Menghubungi atasan untuk meminta izin melayani pria tersebut lebih dahulu karena situasi darurat", "c": "Meminta izin kepada warga lain yang mengantre agar pria tersebut bisa dilayani terlebih dahulu", "d": "Segera melayani pria tersebut karena keadaannya mendesak dan menjelaskan situasinya kepada warga lain", "e": "Menyarankan pria tersebut untuk langsung menuju rumah sakit sambil mengurus surat keterangan di lain waktu"}, "ans": "d", "ex": "Anda harus mendahulukan keadaan darurat. Menjelaskan situasi kepada warga lain juga merupakan bentuk tanggung jawab agar tidak ada yang merasa dirugikan.", "sc": {"a": 1, "b": 4, "c": 3, "d": 5, "e": 2}}, {"n": 87, "sec": "TKP", "t": "Anti-Radikalisme", "q": "Anda bekerja di sebuah perusahaan yang memiliki kebijakan netralitas politik di lingkungan kantor. Namun, salah satu rekan kerja Anda terus-menerus mendoktrin dan mengajak rekan kerja lainnya untuk mendukung pasangan pilihannya pada pemilihan presiden. Sikapnya yang fanatik tersebut membuat beberapa karyawan merasa terganggu. Sikap Anda adalah ....", "o": {"a": "Membuat aturan yang melarang pembahasan terkait pemilihan presiden di lingkungan kantor untuk menghindari konflik antarkaryawan", "b": "Memintanya untuk hanya membahas hal tersebut saat jam istirahat atau saat jam kerja telah selesai saja", "c": "Membantunya mengajak karyawan lain untuk memilih pasangan tersebut pada saat pemilihan umum", "d": "Mengingatkannya agar tidak memaksakan ideologinya kepada kepercayaan yang dimiliki orang lain", "e": "Meyakinkannya untuk mengganti pilihannya pada pemilihan presiden karena ada pasangan lain yang lebih kompeten"}, "ans": "d", "ex": "Mengingatkan agar tidak memaksakan ideologinya dan menyuarakan netralitas politik lebih diutamakan dalam lingkungan kerja.", "sc": {"a": 4, "b": 3, "c": 1, "d": 5, "e": 2}}, {"n": 88, "sec": "TKP", "t": "Jejaring Kerja", "q": "Andi baru saja dipercaya sebagai manajer proyek. Beberapa anggota tim cenderung bekerja secara individual, sementara yang lainnya lebih suka bekerja dalam kelompok. Andi juga mengamati bahwa produktivitas tim belum optimal. Sikap Andi seharusnya adalah ..
