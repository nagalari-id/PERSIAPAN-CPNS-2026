hteraan rakyatnya. Seorang pemimpin daerah yang cerdas dan beretika, tentu akan membangun beragam infrastruktur publik. Pemimpin daerah yang telah membangun beragam infrastruktur bagi masyarakatnya akan memacu pertumbuhan ekonomi daerah. Simpulan yang tepat adalah ....", "o": {"a": "Pemimpin daerah yang berhasil mewujudkan pertumbuhan ekonomi daerahnya, tentu akan meningkatkan kesejahteraan rakyatnya", "b": "Pemimpin daerah yang berhasil mewujudkan pertumbuhan ekonomi daerahnya, tentu akan membangun beragam infrastruktur publik", "c": "Seorang pemimpin daerah yang cerdas dan beretika, tentu akan meningkatkan kesejahteraan rakyatnya", "d": "Seorang pemimpin daerah yang cerdas dan beretika akan memacu pertumbuhan ekonomi daerah", "e": "Pemimpin daerah yang telah membangun beragam infrastruktur bagi masyarakatnya, tentu akan meningkatkan kesejahteraan rakyatnya"}, "ans": "c", "ex": "Pernyataan-pernyataan tersebut setelah diurutkan adalah sebagai berikut: - Seorang pemimpin daerah yang cerdas dan beretika, tentu akan membangun beragam infrastruktur publik (p → q). - Pemimpin daerah yang telah membangun beragam infrastruktur bagi masyarakatnya akan memacu pertumbuhan ekonomi daerah (q → r). - Pemimpin daerah yang berhasil mewujudkan pertumbuhan ekonomi daerahnya, tentu akan meningkatkan kesejahteraan rakyatnya (r → s). Simpulan (p → s): <b>Seorang pemimpin daerah yang cerdas dan beretika, tentu akan meningkatkan kesejahteraan rakyatnya.</b>"}, {"n": 53, "sec": "TIU", "t": "Silogisme", "q": "Semua buah-buahan mengandung vitamin. Sebagian vitamin dari buah-buahan yang dikonsumsi oleh manusia diperlukan untuk daya tahan tubuh. Hari ini, daya tahan tubuh Wanda menurun. Simpulan yang tepat adalah ....", "o": {"a": "Wanda tidak mengonsumsi buah-buahan yang diperlukan untuk daya tahan tubuh", "b": "Wanda akan mengonsumsi berbagai jenis buah-buahan untuk mendapatkan vitamin sebab daya tahan tubuhnya sedang menurun", "c": "Jenis buah-buahan yang dikonsumsi oleh Wanda sebagai manusia mengandung semua vitamin yang diperlukan tubuh termasuk untuk daya tahan tubuh", "d": "Wanda mengonsumsi buah-buahan yang tidak dibutuhkan oleh tubuh", "e": "Wanda mengonsumsi vitamin dari berbagai buah-buahan demi menjaga daya tahan tubuh"}, "ans": "a", "ex": "Oleh karena hari ini daya tahan tubuh Wanda menurun, maka ia tidak mengonsumsi buah-buahan yang diperlukan untuk daya tahan tubuh."}, {"n": 54, "sec": "TIU", "q": "10u + 7 - 9v = 12 dan 9v - 35 = 26. Hubungan nilai u dan v yang tepat adalah...", "o": {"a": "u > v", "b": "u < v", "c": "u = v", "d": "u + v = 10", "e": "u = 0"}, "ans": "b", "ex": "9v = 61 → v ≈ 6,78, lalu 10u = 5 + 61 → u = 6,6. Jadi u < v."}, {"n": 55, "sec": "TIU", "t": "", "q": "Pengaspalan sebuah jalan sepanjang 5 km menghabiskan dana sebesar 3 M rupiah. Berapa dana yang dibutuhkan jika pemerintah ingin melakukan pengaspalan pada jalan yang panjangnya 6 km dan lebar 1,5 kali lebar jalan pertama. Dengan asumsi kualitas dan bahan yang digunakan sama dengan yang digunakan pada pengaspalan pertama.", "o": {"a": "3,5 M", "b": "4 M", "c": "4,4 M", "d": "5 M", "e": "5,4 M"}, "ans": "e", "ex": ""}, {"n": 56, "sec": "TIU", "t": "Hitungan Dasar", "q": "Hasil dari 17 1/2 : 7 + 20 × 2/5 - 2/5 = …", "o": {"a": "10 1/10", "b": "10 1/5", "c": "10 3/10", "d": "10 2/5", "e": "10 1/2"}, "ans": "a", "ex": "(17 1/2 : 7) + (20 × 2/5 ) - 2/5 = (17,5 : 7) + (4 × 2) - 2/5 = 2,5 + 8 - 0,4 = 10,1 = 10 1/10"}, {"n": 57, "sec": "TIU", "t": "Perbandingan &amp; Soal Cerita", "q": "Joko berprofesi sebagai tukang kayu. Saat ini, ia akan mengecat sebuah kerajinan tangan berupa papan catur. Dalam waktu 5 menit, ia mampu mengecat 25% dari papan catur berwarna hitam. Jika sebuah papan catur terdiri dari 64 kotak dengan jumlah warna hitam dan putih adalah sama, maka waktu yang dibutuhkan bagi Joko untuk mengecat keseluruhan papan catur tersebut adalah ....", "o": {"a": "20 menit", "b": "40 menit", "c": "50 menit", "d": "60 menit", "e": "80 menit"}, "ans": "b", "ex": "- Hitam 25% = 25/100 = 1/4 → 5 menit - Hitam 100% → 5 × 4 = 20 menit - Hitam + Putih → 20 × 2 = 40 menit"}, {"n": 58, "sec": "TIU", "t": "Silogisme", "q": "Tanaman tomat yang diberi pupuk secara teratur seharusnya tumbuh subur dan berbuah lebat. Namun, pada kenyataannya, tanaman tomat di kebun tersebut tidak tumbuh subur dan tidak berbuah lebat. Petani berasumsi bahwa tanaman tomat yang tumbuh subur dan berbuah lebat akan memberikan hasil panen yang baik. Simpulan yang tepat adalah ....", "o": {"a": "Tanaman tomat yang diberi pupuk akan tumbuh subur dan berbuah lebat", "b": "Tanaman tomat di kebun tersebut tidak diberi pupuk secara teratur", "c": "Tanaman tomat di kebun tersebut tidak akan menghasilkan panen yang baik", "d": "Tanaman tomat di kebun tersebut akan menghasilkan panen yang baik", "e": "Tanaman tomat yang berbuah lebat akan menghasilkan panen yang baik"}, "ans": "b", "ex": "Sesuai Modus Tollens (p → q, sim q, maka sim p), opsi B tepat. Oleh karena tanaman tomat di kebun tidak tumbuh subur, maka tanaman tersebut tidak diberi pupuk secara teratur."}, {"n": 59, "sec": "TIU", "t": "", "q": "Pak Satya membeli 2 keranjang papaya dan dijual kembali dengan harga Rp532.000. Jika mendapat untung 40%, berapa rupiah kah harga pembelian sekeranjang mangga tersebut?", "o": {"a": "Rp180.000", "b": "Rp190.000", "c": "Rp212.000", "d": "Rp380.000", "e": "Rp385.000"}, "ans": "b", "ex": "Modal 2 keranjang Rp380.000, jadi sekeranjang Rp190.000."}, {"n": 60, "sec": "TIU", "t": "Silogisme", "q": "Orang yang terlalu banyak bekerja pasti mudah lelah. Orang yang tidak mengatur waktu istirahatnya selalu kelelahan. Orang yang sering merasa kelelahan tentunya terlalu banyak bekerja. Simpulan yang tepat adalah ....", "o": {"a": "Orang yang terlalu banyak bekerja, pasti mudah lelah", "b": "Orang yang tidak mengatur waktu istirahatnya, pasti tidak mudah lelah", "c": "Orang yang mudah lelah, pasti tidak mengatur waktu istirahatnya", "d": "Orang yang tidak mengatur waktu istirahatnya, selalu kelelahan", "e": "Orang yang tidak mengatur waktu istirahatnya, pasti mudah lelah"}, "ans": "e", "ex": "Susunan silogisme baru: - Orang yang tidak mengatur waktu istirahatnya selalu kelelahan. - Orang yang sering merasa kelelahan tentunya terlalu banyak bekerja. - Orang yang terlalu banyak bekerja pasti mudah lelah. Simpulan: <b>Orang yang tidak mengatur waktu istirahatnya, pasti mudah lelah.</b>"}, {"n": 61, "sec": "TIU", "t": "Analogi", "q": "Metamorfosis terjadi pada serangga. Hubungan objek-objek yang setara dengan kalimat tersebut adalah ....", "o": {"a": "Regenerasi terjadi pada tumbuhan", "b": "Fotosintesis terjadi pada hewan", "c": "Pencangkokan terjadi pada burung", "d": "Pembuahan terjadi pada tumbuhan", "e": "Migrasi terjadi pada ikan"}, "ans": "d", "ex": "Metamorfosis pada serangga adalah proses perubahan bentuk selama siklus hidup, misalnya pada kupu-kupu yang mengalami tahapan larva hingga dewasa. Untuk mencari hubungan yang setara, kita harus menemukan proses yang khas atau penting pada kelompok organisme tertentu. Pembuahan adalah proses alami yang khas pada tumbuhan dalam reproduksi."}, {"n": 62, "sec": "TIU", "t": "Analogi", "q": "<i>Adik memakai baju yang longgar untuk acara pengajian.</i><br>Kalimat yang berpolakan sama dengan pola tersebut adalah ....", "o": {"a": "Ibu memasak sayur sop untuk keluarga di dapur", "b": "Ayah menyimpan dokumen penting di dalam brankas", "c": "Nada membawakannya bubur untuk sarapan", "d": "Siswa mengumpulkan makalah sebelum jam pelajaran dimulai", "e": "Petani itu mendapatkan bibit padi unggul dari pemerintah daerah"}, "ans": "c", "ex": "- <b>Soal:</b> Adik (S) memakai (P) baju (O) yang longgar (Pel) untuk acara pengajian (K) - <b>A)</b> Ibu (S) memasak (P) sayur sop (O) untuk keluarga (K) di dapur (K) - <b>B)</b> Ayah (S) menyimpan (P) dokumen penting (O) di dalam brankas (K) - <b>C)</b> Nada (S) membawakan (P) -nya (O) bubur (Pel) untuk sarapan (K) - <b>D)</b> Siswa (S) mengumpulkan (P) makalah (O) sebelum jam pelajaran dimulai (K) - <b>E)</b> Petani itu (S) mendapatkan (P) bibit padi unggul (O) dari pemerintah daerah (K)"}, {"n": 63, "sec": "TIU", "t": "", "q": "Seorang Dosen memberikan kebebasan kepada mahasiswanya untuk membuat empat artikel dari topik yang disediakan. Syarat yang diberikan ialah : • Mahasiswa memilih empat topik antara J, K, L, M, N, O, P, Q, dan R. • Antara topik L, M, dan O harus dipilih salah satu. • Topik N dan J harus dipilih bersamaan. • Topik P dan K harus besama O. • Topik Q harus bersama L. Jika seorang mahasiswa memilih tidak ingin memilih topik K dan R, ia harus mengerjakan artikel dengan topik …", "o": {"a": "J,L,N,Q", "b": "L,M,N,Q . c. J,M,P,Q", "d": "J,L,P,Q", "e": "J,M,N,Q"}, "ans": "a", "ex": "Jika memilih J maka harus dengan N, dan jika memilih Q harus bersama L. Maka jawaban yang mungkin hanyalah A."}, {"n": 64, "sec": "TIU", "t": "Analogi", "q": "Hubungan objek pada kalimat <i>\"Melati menyimpan air nira dan gula aren di dalam kendi\"</i> setara dengan ....", "o": {"a": "Tati mencampur tepung terigu dan ragi agar tercipta sebuah roti yang mengembang sempurna", "b": "Yanti membeli susu sapi dan keju mozarella dari pedagang keliling", "c": "Lesti sering mengonsumsi tempe dan tahu untuk menjaga kesehatan jantung", "d": "Muti membawakan jeruk dan salak sebagai buah tangan saat menjenguk teman yang sakit", "e": "Siti membagikan minyak goreng dan gula pasir untuk tetangga-tetangganya"}, "ans": "b", "ex": "Melati (S) menyimpan (P) air nira dan gula aren (O) di dalam kendi (K). Air nira merupakan bahan baku utama untuk pembuatan gula aren, sebagaimana susu sapi merupakan bahan baku utama untuk pembuatan keju mozarella."}, {"n": 65, "sec": "TIU", "q": "Suatu persegi panjang mempunyai luas 500 cm^2. Jika panjangnya bertambah 10% dan lebarnya berkurang 20% maka luasnya menjadi", "o": {"a": "400 cm^2", "b": "420 cm^2", "c": "430 cm^2", "d": "440 cm^2", "e": "450 cm^2"}, "ans": "d", "ex": "Luas baru = 1,1 × 0,8 × 500 = 440 cm²."}, {"n": 66, "sec": "TKP", "t": "", "q": "Andi adalah seorang mahasiswa baru di universitas yang terkenal dengan keberagaman etnis dan budaya. Dia tertarik untuk bergabung dengan salah satu organisasi mahasiswa yang aktif dalam mempromosikan kebudayaan daerah. Namun, Andi dihadapkan pada situasi di mana beberapa anggota organisasi lebih mementingkan kebudayaan dari daerah tertentu dan kurang membuka peluang bagi anggota dari daerah lain. Bagaimana Andi sebaiknya menanggapi keadaan ini?", "o": {"a": "Menarik diri dari organisasi karena merasa tidak diakui.", "b": "Mencoba untuk tetap berpartisipasi dan berbicara dengan anggota lain untuk mendapatkan dukungan.", "c": "Menyuarakan ketidakpuasannya secara terbuka di depan anggota organisasi.", "d": "Menjadi pasif dan hanya mengikuti arus tanpa menyampaikan keberatannya.", "e": "Menciptakan kelompok alternatif yang lebih inklusif dan terbuka untuk semua anggota."}, "ans": "e", "ex": "Menciptakan kelompok alternatif yang lebih inklusif dan terbuka untuk semua anggota, merupakan tindakan proaktif yang memungkinkan Andi untuk tetap terlibat dalam aktivitas yang menarik minatnya tanpa merasa terbatas oleh pembatasan kebudayaan dari kelompok awal. Ini menciptakan kesempatan untuk inklusi dan kerjasama lintas budaya.", "sc": {"a": 2, "b": 4, "c": 3, "d": 1, "e": 5}}, {"n": 67, "sec": "TKP", "t": "Sosial Budaya", "q": "Sebuah restoran global yang ingin membuka cabang di Indonesia sedang mempertimbangkan untuk menyesuaikan hidangan mereka dengan selera dan kebiasaan masyarakat lokal. Upaya yang sebaiknya dilakukan oleh restoran tersebut adalah ....", "o": {"a": "Segera mendatangi lembaga survei terbaik di Indonesia untuk meminta data kuliner favorit di tengah masyarakat", "b": "Menyesuaikan hidangan secara acak dengan harapan dapat sesuai dengan selera lidah orang Indonesia dan menarik minat pelanggan lokal", "c": "Melakukan riset pasar untuk memahami preferensi rasa dan kebiasaan makan lokal sebelum menyesuaikan menu dengan elemen lokal", "d": "Melakukan survei terhadap warga lokal dengan mendatangi lokasi sekitar daerah yang akan dibuka cabang restoran tersebut dengan cara membagikan beberapa makanan siap saji", "e": "Melakukan promosi dengan melibatkan selebriti yang bisa dibayar untuk membohongi publik tentang rasa menu hidangan restoran tersebut"}, "ans": "c", "ex": "Penting bagi restoran global untuk mempertimbangkan selera dan kebiasaan makan lokal agar hidangan mereka dapat diterima dengan baik oleh pasar tersebut. Melakukan riset pasar untuk memahami preferensi rasa dan kebiasaan makan lokal sebelum menyesuaikan menu dengan elemen lokal dapat membantu restoran menghasilkan hidangan yang sesuai dengan cita rasa lokal dan meningkatkan daya tarik masyarakat.", "sc": {"a": 2, "b": 3, "c": 5, "d": 4, "e": 1}}, {"n": 68, "sec": "TKP", "t": "", "q": "Kondisi yang penuh dengan kompetisi merupakan gambaran paling mendekati tentang situasi dalam divisi kerja saya. Setiap pegawai berlomba untuk dapat menyelesaikan pekerjaan sebaik mungkin. Dalam situasi ini seorang rekan kerja menanyakan kepada saya bagaimana saya dapat menyelesaikan pekerjaan dengan cepat. Respon saya adalah;", "o": {"a": "Menjawab apa adanya karena belum tentu rekan kerja dapat mengikuti.", "b": "Menjawab apa adanya karena jika tidak dijawab mungkin akan muncul persaingan yang lebih sulit.", "c": "Mengalihkan topik pembicaraan.", "d": "Menanyakan balik cara dia menyelesaikan pekerjaan.", "e": "Berbohong agar rekan tidak dapat mengikuti cara saya bekerja."}, "ans": "a", "ex": "Jawaban ini mencerminkan kejujuran dan realisme. Memberikan informasi yang sesuai dengan kemampuan rekan kerja dapat menciptakan lingkungan kerja yang lebih kooperatif.", "sc": {"a": 5, "b": 4, "c": 2, "d": 3, "e": 1}}, {"n": 69, "sec": "TKP", "t": "Pelayanan Publik", "q": "Seorang dokter yang memiliki izin usaha praktik swasta sedang merawat seorang pasien lansia dengan kondisi kesehatan komplikasi beberapa penyakit kronis. Setelah beberapa hari rawat jalan, sang dokter menyadari bahwa pasien tersebut menghadapi kesulitan keuangan dan tidak mampu membayar biaya pengobatan yang semakin tinggi. Sikap dokter seharusnya adalah ....", "o": {"a": "Menyusun rencana pembayaran yang bersifat fleksibel sesuai kemampuan finansial pasien dengan sistem pembayaran berjangka dan potongan biaya", "b": "Menyarankan agar pasien tersebut mencari bantuan ke lembaga amal atau program kesehatan sosial yang dapat memberikan dukungan keuangan", "c": "Menghentikan pengobatan dan merujuk pasien ke layanan kesehatan publik yang mungkin dapat memberikan perawatan lebih terjangkau atau gratis", "d": "Meminta pasien untuk mencari dukungan keuangan dari anggota keluarga atau masyarakat umum yang dapat membantu membayar biaya pengobatannya", "e": "Memberikan pengobatan gratis untuk pasien tersebut dan mencari sumber dana alternatif untuk menutupi biaya pengobatan"}, "ans": "a", "ex": "Menyusun rencana pembayaran yang bersifat fleksibel sesuai kemampuan finansial pasien dapat menjadi solusi yang adil dan beretika. Dengan demikian, pasien tetap mendapatkan perawatan yang diperlukan tanpa harus menghadapi beban keuangan yang tidak mampu ditanggung dalam waktu singkat.", "sc": {"a": 5, "b": 1, "c": 3, "d": 2, "e": 4}}, {"n": 70, "sec": "TKP", "t": "Pelayanan Publik", "q": "Dina, seorang petugas perpustakaan sekolah, sedang sibuk mengorganisir buku-buku baru. Tiba-tiba, seorang siswa datang dan meminta bantuan untuk mencari sebuah buku referensi. Namun, buku tersebut sudah dipinjam oleh siswa lain dan diperkirakan baru akan dikembalikan besok. Sikap Dina seharusnya adalah ....", "o": {"a": "Menjelaskan dengan sabar bahwa buku yang dimaksud sudah dipinjam oleh siswa lainnya", "b": "Menyalahkan siswa tersebut karena tidak mengecek ketersediaan buku sebelumnya", "c": "Mencarikan alternatif buku referensi yang serupa dan memberikan penjelasan kepada siswa tersebut", "d": "Memberikan penjelasan dan meminta siswa tersebut untuk datang kembali besok setelah buku tersebut dikembalikan", "e": "Meminta bantuan petugas perpustakaan lain untuk mencarikan buku tersebut di perpustakaan sekolah lain"}, "ans": "e", "ex": "Opsi E menunjukkan inisiatif yang tinggi untuk memenuhi kebutuhan siswa.", "sc": {"a": 2, "b": 1, "c": 4, "d": 3, "e": 5}}, {"n": 71, "sec": "TKP", "t": "Profesionalisme", "q": "Yusuf adalah seorang petugas di sebuah pabrik pengolahan makanan. Ia menemukan bahwa salah satu bahan baku yang akan digunakan dalam proses produksi tidak memiliki sertifikat halal. Padahal, produk yang dihasilkan oleh perusahaan tersebut mayoritas dikonsumsi oleh masyarakat yang sangat memperhatikan sertifikasi halal. Sikap Yusuf seharusnya adalah ....", "o": {"a": "Melaporkan temuan tersebut kepada atasan langsung dan meminta petunjuk lebih lanjut", "b": "Meminta kepada pemasok untuk segera mengganti bahan baku tersebut dengan yang sudah bersertifikat halal", "c": "Meneruskan penggunaan bahan baku tersebut karena mungkin hanya kesalahan administrasi dan tidak akan berdampak signifikan pada produk akhir", "d": "Menyembunyikan temuan tersebut agar tidak mengganggu proses produksi dan reputasi perusahaan", "e": "Membuang bahan baku tersebut dan mencari alternatif bahan baku lain yang lebih murah"}, "ans": "a", "ex": "Dengan melaporkan, Yusuf telah menunjukkan integritas dan tanggung jawab sebagai seorang karyawan. Pihak perusahaan dapat mengambil tindakan yang tepat untuk mengatasi masalah tersebut.", "sc": {"a": 5, "b": 4, "c": 1, "d": 2, "e": 3}}, {"n": 72, "sec": "TKP", "t": "Pelayanan Publik", "q": "Anda adalah seorang guru di sebuah sekolah dasar. Saat memberikan materi tentang sistem tata surya, seorang siswa bertanya, <i>\"Mengapa planet-planet tidak saling bertabrakan jika mereka terus bergerak mengelilingi matahari?\"</i> Respon Anda adalah ....", "o": {"a": "Menjelaskan bahwa planet-planet memiliki orbit yang berbeda-beda sehingga tidak mungkin saling bertabrakan", "b": "Menjelaskan konsep gravitasi dan gaya sentrifugal yang menjaga planet-planet tetap pada orbitnya", "c": "Memberikan analogi sederhana seperti mobil-mobilan di lintasan balap yang memiliki jalur masing-masing", "d": "Mendorong siswa untuk melakukan penelitian lebih lanjut mengenai topik tersebut dan mempresentasikan hasilnya di kelas", "e": "Mengatakan kepada siswa bahwa hal tersebut merupakan sebuah misteri alam semesta yang belum terpecahkan"}, "ans": "d", "ex": "Opsi tersebut akan mendorong siswa untuk berpikir kritis, melakukan penelitian, dan mengembangkan kemampuan presentasi.", "sc": {"a": 2, "b": 4, "c": 3, "d": 5, "e": 1}}, {"n": 73, "sec": "TKP", "t": "Sosial Budaya", "q": "Anda berada di dalam bus umum yang penuh sesak. Seorang lansia dengan kondisi fisik yang lemah dan tampak kelelahan hendak naik ke bus. Di antara kerumunan penumpang, tidak ada yang memberikan tempat duduk prioritas kepada lansia tersebut. Sikap Anda adalah ....", "o": {"a": "Menawarkan tempat duduk kepada lansia tersebut dan memberikan bantuan untuk duduk", "b": "Tetap berada di tempat Anda tanpa memberikan perhatian kepada lansia tersebut", "c": "Meminta kernet bus untuk memberikan tempat duduk prioritas kepada lansia", "d": "Meminta penumpang di sekitar lansia untuk memberikan tempat duduknya", "e": "Tetap fokus pada aktivitas pribadi Anda"}, "ans": "a", "ex": "Keberadaan tempat duduk prioritas dirancang untuk memberikan kenyamanan kepada orang-orang dengan kebutuhan khusus, seperti lansia. Memberikan tempat duduk kepada lansia adalah tindakan yang mencerminkan empati dan kepedulian terhadap sesama.", "sc": {"a": 5, "b": 2, "c": 3, "d": 4, "e": 1}}, {"n": 74, "sec": "TKP", "t": "Pelayanan Publik", "q": "Anda bekerja di sebuah restoran cepat saji. Seorang pelanggan datang dan mengeluhkan bahwa makanan yang ia pesan tidak sesuai dengan deskripsi di menu. Ia marah dan mengancam akan memberikan penilaian buruk di media sosial. Sikap Anda adalah ....", "o": {"a": "Segera memanggil manajer untuk membantu menyelesaikan masalah tersebut", "b": "Membenarkan klaim pelanggan dan segera membuatkan makanan pengganti", "c": "Menjelaskan bahwa ada kesalahan dalam persepsi pelanggan terhadap makanan yang dipesan", "d": "Meminta maaf atas ketidaknyamanan yang dialami pelanggan dan menawarkan minuman atau makanan gratis sebagai bentuk permintaan maaf", "e": "Menjelaskan kepada pelanggan tersebut bahwa pihak restoran tidak bertanggung jawab atas kesalahan persepsi pelanggan"}, "ans": "a", "ex": "Memanggil manajer adalah langkah yang tepat karena manajer memiliki wewenang dan pengalaman untuk menangani situasi yang lebih kompleks. Selain itu, dengan melibatkan manajer, pelanggan akan merasa bahwa masalahnya ditangani dengan serius.", "sc": {"a": 5, "b": 2, "c": 3, "d": 4, "e": 1}}, {"n": 75, "sec": "TKP", "t": "Profesionalisme", "q": "Seorang guru bahasa Inggris di sebuah sekolah menengah atas menemukan bahwa salah satu siswinya, Sarah, terus-menerus membolos pelajaran dan sering terlambat datang ke sekolah. Guru tersebut pun mencatat bahwa hal tersebut dapat memengaruhi kinerja akademis Sarah dan juga dapat berdampak pada disiplin kelas secara keseluruhan. Langkah terbaik yang sebaiknya diambil oleh guru tersebut adalah ....", "o": {"a": "Memberikan hukuman indisipliner kepada Sarah sebagai peringatan agar ia tidak mengulangi perilaku tersebut di masa yang akan datang", "b": "Memilih fokus untuk memberikan perhatian lebih kepada siswa-siswi yang rajin hadir dan bersemangat dalam belajar Bahasa Inggris", "c": "Memanggil orang tua Sarah untuk membicarakan masalah tersebut dan mencari solusi bersama", "d": "Memberikan peringatan kepada Sarah dan memberikan kesempatan kedua untuk mengubah perilakunya", "e": "Melaporkan kejadian tersebut kepada kepala sekolah untuk diambil langkah lebih lanjut"}, "ans": "c", "ex": "Sebagai seorang guru, penting untuk menciptakan lingkungan yang kondusif untuk pembelajaran dan pertumbuhan siswa. Memanggil orang tua atau wali siswa yang bersangkutan untuk mencari solusi bersama merupakan langkah yang paling 1, "c": 2, "d": 1, "e": 2}}, {"n": 86, "sec": "TKP", "t": "", "q": "Saya adalah pramuniaga baru di sebuah toko baju. Di hari pertama kerja, seorang pengunjung meminta masukan tentang set baju yang mungkin cocok dipakai. Saya belum memiliki banyak pemahaman tentang baju, karena itu saya;", "o": {"a": "Meminta maaf karena tidak dapat memberikan saran.", "b": "Meminta pengunjung menunggu pramuniaga lain yang lebih senior", "c": "Memberi saran secara acak sambil tetap terlihat meyakinkan.", "d": "Menyarankan pengunjung mencoba set baju yang dipajang pada manekin.", "e": "Menyarankan pengunjung memilih baju dengan harga tertinggi."}, "ans": "d", "ex": "Ini adalah pilihan yang baik karena memberikan pengunjung opsi konkret dan mungkin memberikan inspirasi untuk mencoba sesuatu yang mereka tidak pertimbangkan sebelumnya. Selain itu, umumnya set pakaian yang dipajang di manekin umumnya adalah set terbaik yang dianggap dapat menarik minat pembeli.", "sc": {"a": 3, "b": 4, "c": 2, "d": 5, "e": 1}}, {"n": 87, "sec": "TKP", "t": "Anti-Radikalisme", "q": "Di suatu daerah, muncul kelompok separatis yang sering melakukan aksi protes dan serangan terhadap fasilitas pemerintah serta warga setempat. Mereka menuntut kemerdekaan dari NKRI dan menggunakan kekerasan serta propaganda untuk mencapai tujuan tersebut. Sebagai seorang pejabat pemerintah daerah yang bertanggung jawab atas keamanan dan kesejahteraan masyarakat, sikap Anda adalah ....", "o": {"a": "Memahami bahwa mereka muncul karena kurangnya perhatian pemerintah terhadap daerah tersebut", "b": "Mengusulkan dialog dan negosiasi antara pemerintah dan kelompok separatis untuk menemukan solusi damai", "c": "Menganggap bahwa tindakan kelompok tersebut adalah bagian dari kebebasan berpendapat yang harus dihormati dalam demokrasi", "d": "Menyatakan bahwa tindakan kelompok tersebut merupakan ancaman terhadap kedaulatan negara dan harus dihentikan dengan segala cara", "e": "Menolak penggunaan kekerasan oleh kedua pihak dan mendorong solusi damai yang mengutamakan keselamatan warga"}, "ans": "e", "ex": "Pendekatan yang menolak kekerasan dari kedua belah pihak dan mengutamakan keselamatan warga adalah pilihan yang paling bijak. Hal tersebut menunjukkan komitmen terhadap penyelesaian damai tanpa memperburuk konflik yang ada.", "sc": {"a": 2, "b": 4, "c": 1, "d": 3, "e": 5}}, {"n": 88, "sec": "TKP", "t": "Jejaring Kerja", "q": "Beberapa karyawan Reno mulai menunjukkan tanda-tanda kelelahan dan stres akibat beban kerja yang tinggi. Jika kondisi tersebut berlanjut, produktivitas tim akan menurun. Sikap Reno sebagai seorang manajer seharusnya adalah ....", "o": {"a": "Menambah jumlah jam kerja karyawan untuk segera menyelesaikan proyek yang sedang berjalan", "b": "Memberikan bonus kepada karyawan yang berhasil menyelesaikan tugas dengan cepat", "c": "Mengadakan rapat untuk membahas masalah tersebut dan mencari solusi bersama dengan karyawan", "d": "Meminta karyawan untuk bekerja lebih keras agar target perusahaan dapat tercapai", "e": "Menetapkan target yang lebih tinggi untuk memotivasi karyawan agar bekerja lebih giat"}, "ans": "c", "ex": "Dengan mengadakan rapat, Reno dapat mendengarkan keluhan dan masukan karyawan, mengidentifikasi penyebab utama kelelahan dan stres, membuat solusi bersama, dan menciptakan suasana kerja yang lebih kolaboratif.", "sc": {"a": 1, "b": 2, "c": 5, "d": 3, "e": 4}}, {"n": 89, "sec": "TKP", "t": "Profesionalisme", "q": "Dalam persiapan ulang tahun kantor, Anda dan tim panitia sedang membahas konsep acara dengan atasan Anda. Atasan mengusulkan untuk mengundang artis terkenal dari ibu kota agar acara menjadi meriah dan menarik banyak tamu yang hadir. Namun, Anda dan beberapa anggota panitia merasa bahwa rencana tersebut tidak sesuai dengan anggaran dan visi acara yang ingin diciptakan. Sebagai gantinya, Anda mengusulkan untuk menampilkan bakat-bakat dari dalam perusahaan, terutama pegawai yang memiliki bakat menyanyi. Langkah Anda dalam meyakinkan atasan Anda tentang ide tersebut adalah ....", "o": {"a": "Meminta atasan Anda untuk mengambil langkah-langkah penghematan anggaran dengan mengurangi biaya yang tidak perlu, termasuk mengundang artis dari luar", "b": "Membuktikan kepada atasan bahwa banyak pegawai di kantor memiliki bakat menyanyi yang luar biasa dan dapat memberikan pertunjukan yang memukau bagi para tamu", "c": "Segera membuat pengumuman bahwa barang siapa di antara karyawan yang mampu menyanyi dengan baik saat acara ulang tahun kantor akan mendapatkan bonus besar", "d": "Mencoba meminta atasan untuk lebih mengenal anggotanya secara personal, termasuk mengetahui bakat dan minat mereka, sehingga atasan dapat lebih memahami keinginan untuk menampilkan bakat internal", "e": "Mengusulkan ide untuk mengadakan kompetisi singkat di kantor guna menentukan pegawai yang akan tampil di acara ulang tahun kantor, sehingga memberikan kesempatan kepada semua pegawai untuk menunjukkan bakat mereka"}, "ans": "b", "ex": "Anda harus dapat menggunakan pendekatan yang memperhatikan efisiensi keuangan dan juga memberikan kesempatan bagi pegawai untuk berpartisipasi aktif dalam acara kantor.", "sc": {"a": 2, "b": 5, "c": 1, "d": 4, "e": 3}}, {"n": 90, "sec": "TKP", "t": "", "q": "Hampir setiap hari, sebagian besar rekan kerja kantor Anda selalu pulang lebih malam dari jam kerja yang seharusnya untuk menyelesaikan pekerjaan yang belum tuntas. Menghadapi situasi tersebut, bagaimana tindakan Anda?", "o": {"a": "Memaklumi tindakan teman-teman karena pekerjaan mereka memang belum selesai.", "b": "Melambat-lambatkan pekerjaan saya agar tidak cepat selesai, sehingga saya juga bisa pulang lebih lama dari jam kantor, padahal sebenarnya saya bisa bekerja dengan lebih cepat.", "c": "Ikut lembur karena tidak ingin dianggap karyawan yang malas karena pulang kerja lebih awal dari teman-teman.", "d": "Tetap mengikuti jam kantor yang berlaku sehingga pulang sesuai jam kerja, dengan cara bekerja secara efektif agar pekerjaan selesai tepat waktu.", "e": "Tidak akan melakukannya agar saya mempertahankan citra sebagai pegawai yang disiplin dan tepat waktu di mata atasan."}, "ans": "d", "ex": "", "sc": {"a": 3, "b": 1, "c": 2, "d": 5, "e": 4}}, {"n": 91, "sec": "TKP", "t": "", "q": "Atasan saya menggelar pesta akhir tahun sebagai bentuk apresiasi atas kinerja kami selama satu tahun terakhir. Pesta diadakan di klub yang tidak sesuai dengan nilai agama yang saya anut. Menyikapi hal ini saya;", "o": {"a": "Minta maaf tidak dapat hadir tanpa perlu memberikan alasan.", "b": "Beralasan memiliki agenda lain sehingga tidak dapat menghadiri pesta.", "c": "Diam-diam tidak hadir.", "d": "Meminta pesta diadakan di tempat lain.", "e": "Meminta maaf tidak dapat hadir karena masalah kepercayaan"}, "ans": "e", "ex": "Pilihan ini memberikan alasan yang cukup kuat dan jujur, meski mungkin bisa memunculkan pertanyaan lebih lanjut.", "sc": {"a": 3, "b": 2, "c": 1, "d": 3, "e": 5}}, {"n": 92, "sec": "TKP", "t": "", "q": "Seorang warga melakukan komplain kepada sebuah perusahaan telekomunikasi karena memasang tiang di depan pagar rumahnya. Warga tersebut menuntut agar tiang digeser beberapa meter. Sebagai customer service perusahaan telekomunikasi saya akan:", "o": {"a": "Mengabaikan gugatan", "b": "Segera memindahkan tiang sesuai tuntutan warga.", "c": "Meminta maaf dan mencatat gugatan.", "d": "Meneruskan gugatan kepada atasan.", "e": "Meminta warga membuat gugatan secara tertulis."}, "ans": "d", "ex": "Meneruskan gugatan kepada atasan perlu dilakukan mengingat batasan kewenangan yang dimiliki oleh customer service.", "sc": {"a": 2, "b": 1, "c": 4, "d": 5, "e": 3}}, {"n": 93, "sec": "TKP", "t": "Jejaring Kerja", "q": "Budi adalah seorang karyawan baru di perusahaan yang sangat menjunjung tinggi nilai-nilai kolaborasi. Budi yang sebelumnya bekerja di perusahaan dengan budaya individualis merasa kesulitan untuk menyesuaikan diri dengan lingkungan kerja yang baru. Sikap Budi seharusnya adalah ....", "o": {"a": "Tetap mempertahankan gaya kerjanya yang lama di awal-awal kepindahan dan akan mengikuti proses penyesuaian nilai-nilai baru dengan seiring waktu", "b": "Meminta perusahaan untuk memberikan waktu yang cukup untuk beradaptasi dengan budaya kerja yang baru", "c": "Mengamati perilaku rekan-rekannya dan mencoba meniru cara mereka berinteraksi dan bekerja sama", "d": "Meminta kepada atasannya untuk dipindahkan ke departemen yang lebih sesuai dengan gaya kerjanya", "e": "Mengikuti program pelatihan yang disediakan perusahaan untuk meningkatkan kemampuan kolaborasinya"}, "ans": "e", "ex": "Pelatihan akan memberikan Budi pengetahuan dan keterampilan yang dibutuhkan untuk bekerja sama dalam tim.", "sc": {"a": 3, "b": 2, "c": 4, "d": 1, "e": 5}}, {"n": 94, "sec": "TKP", "t": "Pelayanan Publik", "q": "Saat Anda sedang berada di kantor dan sedang melayani pengunjung, tiba-tiba sekelompok pemuda masuk ke dalam kantor Anda. Mereka terlihat panik dan mengatakan bahwa mereka sedang dikejar oleh sekelompok warga yang marah karena diduga melakukan tindak kriminal di sekitar daerah kantor Anda. Keadaan tersebut membuat pengunjung yang sedang berada di kantor pun menjadi panik. Sikap Anda adalah ....", "o": {"a": "Menyampaikan pesan kepada pengunjung dan staf untuk tetap tenang, sementara Anda mencoba menghubungi pihak keamanan setempat", "b": "Menghadapi kelompok pemuda secara langsung untuk mengetahui keadaan mereka dan memutuskan tindakan berdasarkan penilaian Anda", "c": "Membujuk kelompok pemuda untuk meninggalkan kantor dengan damai tanpa menimbulkan kekacauan atau meminta mereka untuk bersembunyi di salah satu ruang kantor", "d": "Segera mencoba menenangkan situasi dan menemukan solusi yang tepat agar kasus tersebut cepat berlalu", "e": "Mencoba meredakan ketegangan antara kelompok pemuda dan pengunjung lainnya dengan memberikan penjelasan sambil mengarahkan mereka ke pintu keluar"}, "ans": "a", "ex": "Dalam situasi darurat seperti ini, yang terpenting adalah memastikan keselamatan semua orang di sekitar. Menghubungi pihak keamanan atau polisi setempat adalah langkah yang tepat untuk mengamankan situasi dan melindungi semua pihak yang terlibat. Menyampaikan pesan untuk tetap tenang kepada pengunjung dan staf juga sangat penting untuk mencegah terjadinya kepanikan lebih lanjut. Mengizinkan kelompok pemuda untuk bersembunyi di dalam kantor bisa membahayakan keselamatan orang lain dan sebaiknya dihindari.", "sc": {"a": 5, "b": 3, "c": 2, "d": 4, "e": 1}}, {"n": 95, "sec": "TKP", "t": "", "q": "Tahun pemilu mengakibatkan perbedaan pandangan politik di desa saya terlihat semakin jelas. Polarisasi ini tidak hanya berimbas pada diskusi politik, namun juga merambat dan berubah menjadi permasalahan sosial. Beberapa anggota masyarakat bahkan secara terang-terangan menjauhi warga yang memiliki pilihan politik berbeda. Kondisi ini diperparah dengan kampanye beberapa calon legislatif yang ikut memperkeruh suasana. Sebagai kepala desa, yang sebaiknya saya lakukan adalah;", "o": {"a": "Mengadakan pertemuan yang melibatkan tokoh dari semua kubu.", "b": "Membiarkan saja karena keadaan akan kembali seperti semula setelah tahun politik berakhir.", "c": "Melarang semua calon berkampanye di sini agar masalah tidak semakin rumit.", "d": "Meminta bantuan aparat untuk mencegah agar kondisi tidak berubah anarkis.", "e": "Mewajibkan siapa pun yang ingin berkampanye di desa untuk menyampaikan pesan perdamaian."}, "ans": "a", "ex": "Ini adalah langkah yang paling tepat untuk dilakukan. Pertemuan ini bertujuan untuk mendiskusikan masalah yang ada dan mencari solusi bersama. Tokoh-tokoh dari semua kubu harus dilibatkan agar semua pihak merasa didengar dan diwakili. Pertemuan ini juga harus dilakukan secara terbuka dan transparan agar masyarakat dapat melihat bahwa pemerintah desa berkomitmen untuk menyelesaikan masalah ini.", "sc": {"a": 5, "b": 1, "c": 2, "d": 4, "e": 3}}, {"n": 96, "sec": "TKP", "t": "", "q": "Seorang atasan meminta Anda melaporkan hasil proyek yang telah direncanakan sebulan sebelumnya. Atasan menyarankan penggunaan laptop atau komputer dengan Prosesor i9, mengingat kemajuan Teknologi Informasi dan Komunikasi saat ini. Namun, karena laptop Anda rusak dan hanya tersedia notebook dengan sistem operasi dan perangkat lunak yang belum dikuasai. Bagaimana anda menyikapi ini?", "o": {"a": "Anda akan menyusun laporan secara manual dan meminta teman untuk mengetikkannya di notebook.", "b": "Berupaya secepat mungkin agar laptop yang dimiliki dapat digunakan untuk membuat laporan.", "c": "Meminta bantuan dari teman yang dapat mengoperasikan notebook untuk membuat laporan dengan cepat.", "d": "Anda akan mencoba menggunakan notebook untuk mengerjakan laporan sambil mencari panduannya di internet.", "e": "Menunda pembuatan laporan karena kendala kerusakan laptop."}, "ans": "d", "ex": "", "sc": {"a": 2, "b": 4, "c": 3, "d": 5, "e": 1}}, {"n": 97, "sec": "TKP", "t": "Profesionalisme", "q": "Sekarang adalah pukul 13.00 dan waktu istirahat masih tersisa 15 menit. Anda baru saja selesai makan siang di kantin kantor. Tiba-tiba, atasan menghubungi melalui telepon dan memberikan tugas mendesak yang harus segera Anda selesaikan dalam waktu singkat. Sikap Anda adalah ....", "o": {"a": "Meminta atasan untuk mengirimkan rincian tugas melalui email sehingga bisa Anda pelajari terlebih dahulu sambil menikmati sisa waktu istirahat", "b": "Menyelesaikan sisa waktu istirahat terlebih dahulu, kemudian mulai mengerjakan tugas setelah jam istirahat berakhir", "c": "Memberitahu atasan bahwa waktu istirahat masih tersisa 15 menit dan Anda akan mulai mengerjakan tugas setelahnya", "d": "Segera kembali ke ruang kerja dan mulai mengerjakan tugas tanpa menyelesaikan sisa waktu istirahat", "e": "Meminta rekan kerja yang sedang di kantor untuk mulai mengerjakan tugas tersebut dan akan dilanjutkan setelah Anda kembali ke ruang kerja"}, "ans": "d", "ex": "Keputusan tersebut menunjukkan dedikasi dan kepatuhan yang tinggi terhadap tanggung jawab kerja.", "sc": {"a": 4, "b": 3, "c": 1, "d": 5, "e": 2}}, {"n": 98, "sec": "TKP", "t": "", "q": "Persaingan antar tim di dalam kantor sangat sengit. Ketika memberikan saran kepada eselon 1, usulan dari tim Anda dianggap kurang baik dan kurang solutif dibandingkan dengan tim lain. Dalam menghadapi situasi ini, sikap Anda adalah...", "o": {"a": "Menganalisis ulang usulan dari tim Anda untuk mencari potensi perbaikan dan merumuskan strategi agar usulan selanjutnya lebih baik.", "b": "Menjadikan pengalaman ini sebagai kesempatan untuk melakukan evaluasi diri dan tim, kemudian mengidentifikasi area yang perlu diperbaiki untuk meningkatkan kualitas usulan di masa mendatang.", "c": "Menyampaikan kepada anggota tim tentang hasil evaluasi dan bersama-sama merencanakan langkah-langkah perbaikan agar usulan tim lebih diterima di masa depan.", "d": "Membuka jalur komunikasi dengan tim lain untuk berbagi pengetahuan dan memahami lebih lanjut tentang pendekatan yang mereka gunakan.", "e": "Menetapkan sikap positif dan tetap fokus pada perbaikan, tanpa menyalahkan anggota tim atau tim lainnya."}, "ans": "e", "ex": "", "sc": {"a": 2, "b": 3, "c": 4, "d": 1, "e": 5}}, {"n": 99, "sec": "TKP", "t": "Pelayanan Publik", "q": "Seorang pelanggan yang telah melakukan pembelian produk elektronik secara daring merasa kecewa karena barang yang dipesan tidak sesuai dengan deskripsi. Pelanggan memesan sebuah ponsel <i>iPhone 16 Pro Max Original</i>, tetapi yang dikirim adalah <i>iPhone HDC</i> atau replika dengan sistem operasi Android. Sikap pihak toko atau penjual tersebut seharusnya adalah ....", "o": {"a": "Segera mengklaim bahwa informasi yang diberikan pada deskripsi berasal dari pihak ketiga dan barang yang sudah dibeli tidak bisa ditukar atau dikembalikan", "b": "Menganggap bahwa keluhan tersebut sebagai risiko bisnis dan segera memberikannya kompensasi berupa diskon untuk pembelian selanjutnya", "c": "Menerima keluhan pelanggan, menyelidiki perbedaan yang disebutkan, dan memberikan solusi yang memuaskan", "d": "Meminta bukti <i>unboxing</i> dan menggantinya dengan produk original setelah terverifikasi", "e": "Segera mengirimkan produk original yang diminta oleh pelanggan dengan mensyaratkan biaya ongkos kirim ditanggung pelanggan"}, "ans": "d", "ex": "Toko <i>online</i> seharusnya merespons keluhan pelanggan dengan serius, terutama terkait dengan ketidaksesuaian produk dengan deskripsi yang diberikan. Menerima keluhan, menyelidiki dengan cermat, dan memberikan solusi yang memuaskan adalah tindakan yang dapat membangun kepercayaan pelanggan. Meminta bukti <i>unboxing</i> dan menggantinya dengan produk original setelah terverifikasi adalah tindakan yang tepat.", "sc": {"a": 1, "b": 2, "c": 4, "d": 5, "e": 3}}, {"n": 100, "sec": "TKP", "t": "Profesionalisme", "q": "Seorang arsitek sedang bekerja pada proyek pembangunan gedung tinggi. Selama tahap perencanaan, arsitek tersebut menemukan potensi risiko keamanan struktural yang dapat memengaruhi keselamatan penghuni gedung di masa yang akan datang. Sikap arsitek seharusnya dalam menangani temuan tersebut adalah ....", "o": {"a": "Menyampaikan temuan langsung kepada pihak berwenang tanpa melibatkan klien agar proses rekonstruksi menjadi lebih cepat", "b": "Memberi tahu klien tentang risiko yang ditemukan dan memberikan rekomendasi perbaikan dan perubahan", "c": "Melakukan perbaikan tanpa memberi tahu klien karena menganggapnya sebagai tanggung jawab pribadi sebagai seorang arsitek profesional", "d": "Berusaha meyakinkan diri bahwa temuan tersebut tidak mendasar dan proses pembangunan bisa segera diwujudkan sesuai rencana awal", "e": "Segera meminta kelonggaran waktu kepada atasan karena perbaikan terhadap konstruksi yang sedang Anda rancang membutuhkan waktu lebih lama"}, "ans": "b", "ex": "Sebagai seorang profesional, arsitek memiliki kewajiban etis dan moral untuk melibatkan klien dalam keputusan yang berkaitan dengan keselamatan bangunan.", "sc": {"a": 4, "b": 5, "c": 3, "d": 1, "e": 2}}, {"n": 101, "sec": "TKP", "t": "", "q": "Seorang warga bernama Meri menghubungi pemadam kebakaran untuk menyelamatkan kucing peliharaannya yang terjatuh ke sumur. Dalam satu bulan Meri sudah berkali-kali menghubungi pemadam kebakaran untuk alasan yang sama. Sebagai pemadam kebakaran saya;", "o": {"a": "Merasa dipermainkan dan tidak akan datang jika Meri melakukan pemanggilan darurat.", "b": "Mengingatkan Meri untuk tidak mempermainkan petugas pemadam kebakaran.", "c": "Bersabar dan tetap menjalankan tugas sebagaimana mestinya.", "d": "Datang, melakukan evakuasi kucing dan memberi saran Meri agar memasukkan kucingnya ke dalam kandang.", "e": "Menganggap sebagai bagian dari tugas."}, "ans": "d", "ex": "", "sc": {"a": 1, "b": 2, "c": 4, "d": 5, "e": 3}}, {"n": 102, "sec": "TKP", "t": "Sosial Budaya", "q": "Anda diundang ke acara pernikahan teman dekat. Namun, Anda baru saja mengalami putus cinta yang cukup menyakitkan dan merasa tidak ingin bersosialisasi. Anda khawatir akan merasa sedih dan tidak nyaman jika harus menghadiri acara tersebut. Sikap Anda adalah ....", "o": {"a": "Menghadiri acara pernikahan tersebut dan berusaha untuk menikmati momen bersama teman-teman lainnya", "b": "Mengirimkan ucapan selamat dan hadiah pernikahan melalui pesan atau kurir", "c": "Mencari alasan yang masuk akal untuk menolak undangan tersebut", "d": "Menghadiri acara pernikahan tersebut dengan membawa teman dekat yang bisa diajak curhat", "e": "Menghadiri acara pernikahan tersebut tetapi hanya sebentar dan segera pulang"}, "ans": "d", "ex": "Membawa teman dekat bisa menjadi pilihan yang baik untuk mendapatkan dukungan emosional. Namun, pastikan kehadiran teman Anda tidak mengganggu acara pernikahan.", "sc": {"a": 3, "b": 2, "c": 1, "d": 5, "e": 4}}, {"n": 103, "sec": "TKP", "t": "Pelayanan Publik", "q": "Sebagai seorang petugas layanan pelanggan di sebuah perusahaan telekomunikasi, Anda menerima keluhan dari seorang pelanggan mengenai tagihan bulanan yang jauh lebih tinggi dari biasanya. Namun, Anda tidak memiliki akses langsung ke sistem untuk memeriksa rincian tagihan tersebut. Sikap Anda adalah ....", "o": {"a": "Meminta pelanggan tersebut untuk mengulangi keluhannya dengan lebih detail", "b": "Menjelaskan kepada pelanggan bahwa tagihan tersebut sudah benar dan tidak ada kesalahan", "c": "Menyarankan pelanggan untuk menghubungi bagian keuangan secara langsung", "d": "Mencari tahu nomor telepon bagian keuangan dan memberikannya kepada pelanggan", "e": "Meminta pelanggan untuk mengirimkan email berisi keluhan dan bukti pembayaran"}, "ans": "e", "ex": "Opsi E memungkinkan Anda untuk menindaklanjuti masalah dengan lebih baik dan memberikan informasi yang akurat kepada pelanggan.", "sc": {"a": 2, "b": 1, "c": 3, "d": 4, "e": 5}}, {"n": 104, "sec": "TKP", "t": "Pelayanan Publik", "q": "Anda bekerja di sebuah pusat perbelanjaan yang sering ramai pengunjung. Sebagai seorang staf di bagian informasi, Anda sering mendapati pengunjung yang kebingungan mencari lokasi toko atau area tertentu. Solusi yang dapat Anda berikan untuk meningkatkan efisiensi dalam memberikan informasi kepada para pengunjung adalah ....", "o": {"a": "Mengusulkan untuk membatasi jumlah pengunjung yang masuk ke pusat perbelanjaan pada satu waktu", "b": "Menggunakan pengeras suara untuk memberikan pengumuman informasi kepada seluruh pengunjung", "c": "Tetap memberikan informasi secara langsung kepada setiap pengunjung yang bertanya seperti biasanya", "d": "Mengimplementasikan papan informasi interaktif yang dapat membantu pengunjung mencari lokasi dengan lebih mandiri", "e": "Mengusulkan agar pusat perbelanjaan merekrut lebih banyak karyawan di bagian informasi dan layanan"}, "ans": "b", "ex": "Sejauh ini, teknologi pengeras suara masih menjadi yang terbaik dalam penyampaian informasi secara cepat di tempat-tempat umum atau fasilitas publik.", "sc": {"a": 2, "b": 5, "c": 3, "d": 4, "e": 1}}, {"n": 105, "sec": "TKP", "t": "", "q": "Ibu Ani, seorang guru di sekolah dasar perkotaan, menghadapi tantangan dalam mendidik anak- anak yang tumbuh di era digital. Anak-anak lebih cenderung menghabiskan waktu di perangkat elektronik daripada membaca buku atau bermain di luar ruangan. Ibu Ani ingin menciptakan program pendidikan yang menarik dan mendidik untuk mengatasi dampak negatif teknologi terhadap perkembangan anak-anak. Bagaimana Ibu Ani sebaiknya menghadapi perubahan budaya ini dalam pendidikan?", "o": {"a": "Menghapus penggunaan teknologi dari kurikulum untuk mendorong anak-anak lebih fokus pada aktivitas tradisional.", "b": "Menciptakan program pendidikan yang menggabungkan teknologi dengan pembelajaran kreatif dan interaktif.", "c": "Menyuarakan ketidaksetujuan terhadap penggunaan teknologi dalam pendidikan dan meminta dukungan dari rekan-rekan guru.", "d": "Meningkatkan penilaian pada mata pelajaran tradisional untuk mengurangi ketergantungan anak-anak pada teknologi.", "e": "Menciptakan aturan sekolah yang melarang penggunaan perangkat elektronik di luar kegiatan belajar."}, "ans": "b", "ex": "", "sc": {"a": 1, "b": 5, "c": 2, "d": 3, "e": 4}}, {"n": 106, "sec": "TKP", "t": "Jejaring Kerja", "q": "Hendra merupakan seorang konsultan pemasaran digital yang ingin memperluas jejaring bisnisnya. Ia telah mengatur pertemuan dengan beberapa calon klien baru yang belum pernah bertemu dengannya. Sebagai seorang profesional di industri pemasaran digital, sikap yang paling tepat bagi Hendra adalah ....", "o": {"a": "Mengajukan pertanyaan yang tepat untuk memahami kebutuhan dan tujuan pemasaran digital calon klien", "b": "Datang lebih awal ke lokasi pertemuan agar terlihat menghormati calon klien dan lebih disiplin", "c": "Memilih untuk fokus hanya pada pertemuan dengan klien yang sudah menjadi mitra bisnisnya sebelumnya", "d": "Membicarakan berbagai proyek sukses yang pernah ia tangani sebagai bahan pertimbangan dan berharap dapat menambah kepercayaan klien", "e": "Memilih tempat pertemuan strategis dan berani mengeluarkan biaya lebih untuk membayar makanan dan minuman klien di rumah makan ternama"}, "ans": "a", "ex": "Opsi A memungkinkannya untuk menyusun solusi yang sesuai dengan kebutuhan calon klien dan membangun hubungan yang positif. Pada dasarnya konsep kemitraan adalah saling membantu dalam menyelesaikan masalah dan pastinya menguntungkan kedua belah pihak.", "sc": {"a": 5, "b": 3, "c": 1, "d": 4, "e": 2}}, {"n": 107, "sec": "TKP", "t": "Jejaring Kerja", "q": "Sebagai ketua OSIS, Bayu diminta untuk memimpin sebuah proyek penghijauan di lingkungan sekolah. Proyek tersebut melibatkan seluruh siswa, guru, dan warga sekitar. Minimnya dana dan keterbatasan waktu menjadi tantangan utama proyek. Sikap Bayu seharusnya adalah ....", "o": {"a": "Menurunkan target proyek dan hanya fokus pada area-area yang mudah dijangkau", "b": "Membuat proposal proyek yang meyakinkan untuk diajukan kepada berbagai pihak, seperti pemerintah daerah dan perusahaan swasta", "c": "Meminta sumbangan wajib kepada seluruh siswa dengan nominal sukarela untuk memenuhi kebutuhan dana", "d": "Mengadakan lomba desain taman untuk melibatkan seluruh siswa dan mendapatkan ide-ide kreatif", "e": "Mencari sponsor dari perusahaan-perusahaan yang peduli lingkungan tanpa [mengganggu aktivitas sekolah]"}, "ans": "b", "ex": "Dengan proposal yang baik, Bayu dapat meyakinkan berbagai pihak untuk mendukung proyeknya, baik dari segi dana maupun sumber daya lainnya.", "sc": {"a": 2, "b": 5, "c": 1, "d": 4, "e": 3}}, {"n": 108, "sec": "TKP", "t": "", "q": "Lukman adalah seorang dokter muda yang praktik di sebuah rumah sakit ternama di kota Bengkulu. Sudah 10 tahun berpraktik sebagai dokter di rumah sakit tersebut, Lukman saat ini memiliki inisiatif untuk memberikan usulan kepada pimpinan rumah sakit terkait pengurangan penggunaan kertas sebagai media pengumpulan rekam medis pasien. Lukman merasa keberatan dengan penggunaan kertas yang masih cukup banyak, terutama karena jumlah pasien yang banyak diobati setiap harinya. Oleh karena itu, Lukman mengusulkan penggantian media pengumpulan rekam medis pasien dengan menggunakan surat elektronik. Sebagai pimpinan rumah sakit, sikap Anda adalah...", "o": {"a": "Mendukung penerapan metode tersebut karena akan memudahkan dokter untuk mengakses rekam medis pasien", "b": "Membantu mengurangi penumpukan kertas rekam medis di ruang dokter.", "c": "Merasa terbantu jika harus mengirimkan rekam medis pasien kepada sesama dokter secara cepat.", "d": "tidak perlu menggunakan ide tersebut, karena semuanya telah berjalan lancar", "e": "Menganggap usulan tersebut tidak perlu diimplementasikan dan mempertahankan penggunaan kertas."}, "ans": "a", "ex": "", "sc": {"a": 5, "b": 3, "c": 4, "d": 2, "e": 1}}, {"n": 109, "sec": "TKP", "t": "Anti-Radikalisme", "q": "Di sebuah sekolah, terdapat peningkatan kasus intoleransi di kalangan siswa. Bu Dewi, sebagai wakil kepala sekolah bidang kesiswaan, ingin mengambil langkah preventif untuk mencegah berkembangnya paham radikalisme. Upaya Bu Dewi seharusnya adalah ....", "o": {"a": "Mengadakan seminar tentang toleransi antaragama dengan mengundang tokoh agama setempat", "b": "Membentuk kelompok siswa khusus yang bertugas mengawasi dan melaporkan tindakan intoleransi", "c": "Meningkatkan pengawasan terhadap aktivitas siswa di media sosial untuk mencegah penyebaran konten radikal", "d": "Mengembangkan kurikulum yang mengintegrasikan nilai-nilai toleransi dan keberagaman dalam semua mata pelajaran", "e": "Menjalin kerja sama dengan lembaga anti-radikalisme untuk mengadakan pelatihan bagi guru dan siswa"}, "ans": "d", "ex": "Dengan mengintegrasikan nilai-nilai toleransi dan keberagaman ke dalam kurikulum, sekolah dapat membentuk karakter siswa sejak dini dan membangun budaya sekolah yang inklusif. Pendekatan ini lebih mendalam dan berkelanjutan dibandingkan pilihan lainnya.", "sc": {"a": 3, "b": 2, "c": 1, "d": 5, "e": 4}}, {"n": 110, "sec": "TKP", "t": "", "q": "Negara Kesatuan Republik Indonesia ( NKRI ) merupakan negara dengan beragam latar belakang budaya, ras, kepercayaan, bahasa, dan suku. Apabila setiap warga negara bersikap intoleran, pastilah keharmonisan tidak akan tercipta. Salah satunya yakni keharmonisan antar umat beragama. Jika rasa saling menghargai dan menghormati memudar, hubungan antar masyarakat akan kacau balau dan pemerintahan tidak akan baik-baik saja. Agar hal tersebut tidak terjadi, semua umat beragama sebaiknya ….", "o": {"a": "Memperbaiki ideologi yang ada dengan yang baru", "b": "Mempelajari agama dengan lebih serius", "c": "Menciptakan sebuah hukum agama untuk semua umat", "d": "Mengedepankan sikap saling menghormati", "e": "Menghayati semua ajaran yang ada di negara kita"}, "ans": "d", "ex": "Setiap umat beragama alangkah baiknya mengedepankan sikap toleransi, saling menghargai dan menghormati, ini merupakan cara terbaik yang bisa dilakukan agar tercipta suatu sikap yang toleran antar pemeluk agama satu sama lain", "sc": {"a": 1, "b": 4, "c": 2, "d": 5, "e": 3}}]}],CH=[{"id": 0, "g": "Info · Seleksi CPNS", "t": "Struktur &amp; Tahapan SKD", "html": "<p>Soal CPNS utama pada tahap Seleksi Kompetensi Dasar (SKD) terbagi menjadi 3 jenis tes dengan total 110 soal dan waktu pengerjaan 100 menit:</p>\n<h3>Tes Wawasan Kebangsaan (TWK) — 30 Soal</h3>\n<p>Mengukur pemahaman dan pengamalan nilai kebangsaan:</p>\n<ul>\n<li>Nasionalisme</li>\n<li>Integritas</li>\n<li>Bela Negara</li>\n<li>Pilar Negara (Pancasila, UUD 1945, NKRI, dan Bhinneka Tunggal Ika)</li>\n<li>Bahasa Negara (penggunaan bahasa Indonesia yang baik dan benar)</li>\n</ul>\n<h3>Tes Intelegensia Umum (TIU) — 35 Soal</h3>\n<p>Mengukur kemampuan kognitif dan penalaran dasar:</p>\n<ul>\n<li>Kemampuan Verbal: analogi, silogisme, dan penalaran analitis</li>\n<li>Kemampuan Numerik: berhitung cepat, deret angka, perbandingan kuantitatif, dan soal cerita</li>\n<li>Kemampuan Figural: analogi gambar, ketidaksamaan gambar, dan serial gambar</li>\n</ul>\n<h3>Tes Karakteristik Pribadi (TKP) — 45 Soal</h3>\n<p>Mengukur sikap kerja dan perilaku dalam konteks kepegawaian:</p>\n<ul>\n<li>Pelayanan Publik</li>\n<li>Jejaring Kerja</li>\n<li>Sosial Budaya</li>\n<li>Teknologi Informasi dan Komunikasi (TIK)</li>\n<li>Profesionalisme</li>\n<li>Anti Radikalisme</li>\n</ul>\n<p>(Catatan: Selain SKD, peserta yang lolos umumnya menghadapi Seleksi Kompetensi Bidang (SKB) dengan materi soal yang disesuaikan dengan formasi atau jabatan yang dilamar).</p>", "min": 1, "nc": 0}, {"id": 1, "g": "TWK · Nasionalisme 1–2", "t": "1. Makna Nasionalisme", "html": "<h3>Apa itu Nasionalisme?</h3>\n<ul>\n<li><strong>Menurut KBBI:</strong> Nasionalisme adalah paham atau ajaran untuk mencintai bangsa dan negara sendiri.</li>\n<li><strong>Secara Etimologi:</strong> Berasal dari kata <em>\"nasional\"</em> dan <em>\"isme\"</em>, yaitu paham kebangsaan yang mengandung makna kesadaran dan semangat cinta tanah air, memiliki kebanggaan, kesetiaan sebagai bangsa, memelihara kehormatan bangsa, serta memiliki rasa solidaritas setanah air, persatuan, dan kesatuan.</li>\n</ul>\n<h3>Unsur Penting Nasionalisme</h3>\n<ol>\n<li><strong>Kesatuan dan Persatuan</strong>\n    Mengutamakan persatuan bangsa di atas kepentingan individu atau kelompok, serta menjaga solidaritas dan kebersamaan tanpa memandang perbedaan suku, agama, ras, dan golongan.</li>\n<li><strong>Kemandirian Bangsa</strong>\n    Menjaga kedaulatan negara dan mengupayakan kemajuan bangsa melalui usaha sendiri. Mendorong kemandirian dalam segala aspek (ekonomi, politik, dan teknologi) untuk mengurangi ketergantungan pada pihak luar.</li>\n<li><strong>Identitas Nasional</strong>\n    Menghargai dan melestarikan budaya serta nilai-nilai nasional, termasuk mempromosikan budaya lokal di kancah global tanpa mengesampingkan perkembangan modern.</li>\n<li><strong>Kepedulian Sosial</strong>\n    Mengutamakan kesejahteraan masyarakat serta berpartisipasi aktif dalam pembangunan nasional.</li>\n</ol>\n<blockquote>\n<p><strong>INGAT!</strong>\nNasionalisme adalah kesadaran dan semangat cinta tanah air yang membentuk persatuan, kemandirian, identitas, dan kepedulian sosial sebagai bangsa.</p>\n<p><strong>CATATAN TWK</strong>\n* <strong>Kata kunci:</strong> Cinta tanah air, kebanggaan, kesetiaan, kehormatan, solidaritas, persatuan, kesatuan.\n* Nasionalisme bukan hanya cinta tanah air, tetapi juga <strong>kesadaran dan semangat kebangsaan</strong>. Sering keluar dalam soal TWK dalam bentuk studi kasus perilaku atau sikap nasionalis.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 2, "g": "TWK · Nasionalisme 1–2", "t": "2. Identitas Nasional", "html": "<h3>Pengertian Identitas Nasional</h3>\n<p>Secara umum, identitas adalah ciri-ciri, jati diri, atau tanda yang melekat pada seseorang atau sesuatu untuk membedakannya dengan yang lain. <strong>Identitas nasional</strong> adalah kepribadian nasional atau jati diri nasional yang dimiliki suatu bangsa yang membedakan bangsa satu dengan bangsa lainnya.</p>\n<p>Identitas nasional negara Indonesia dirumuskan dalam <strong>UUD 1945 Pasal 35 sampai 36B</strong> (serta pasal terkait dasar dan bentuk negara), meliputi Bendera Indonesia, Bahasa Indonesia, Lambang Negara Indonesia, Semboyan Bangsa Indonesia, Lagu Kebangsaan Indonesia, Dasar Falsafah Negara, Konstitusi Negara Indonesia, dan Bentuk Negara Indonesia.</p>\n<h3>Tiga Unsur Identitas Nasional</h3>\n<ol>\n<li><strong>Identitas Fundamental</strong>\n    Identitas kebangsaan yang bersifat pokok dan memiliki peran sangat penting dalam kehidupan berbangsa dan bernegara. Identitas ini meliputi dasar negara, falsafah, dan ideologi, yaitu <strong>Pancasila</strong>.</li>\n<li><strong>Identitas Instrumental</strong>\n    Identitas yang berfungsi sebagai alat atau media yang diatur dalam <strong>UUD 1945</strong>, meliputi:<ul>\n<li>Bendera Negara: Sang Merah Putih</li>\n<li>Lambang Negara: Garuda Pancasila</li>\n<li>Lagu Kebangsaan: Indonesia Raya</li>\n<li>Semboyan Negara: Bhinneka Tunggal Ika</li>\n<li>Bahasa Negara: Bahasa Indonesia</li>\n</ul>\n</li>\n<li><strong>Identitas Alamiah</strong>\n    Identitas yang bersifat alami, yaitu keadaan atau unsur yang telah ada dan terbentuk secara alami sejak lama. Identitas ini merujuk pada kondisi geografis Indonesia sebagai <strong>negara kepulauan</strong> dengan ribuan adat istiadat dan berbagai suku bangsa di dalamnya.</li>\n</ol>\n<blockquote>\n<p><strong>INGAT!</strong>\nIdentitas nasional adalah jati diri bangsa yang membedakan Indonesia dengan bangsa lain, menjadi dasar persatuan, arah pembangunan, dan kekuatan bangsa.</p>\n<p><strong>CATATAN TWK</strong>\n* Identitas nasional terdiri dari: <strong>Fundamental, Instrumental, dan Alamiah</strong>.\n* <strong>Pancasila</strong> = Identitas Fundamental.\n* <strong>UUD 1945, Bendera, Bahasa, Lambang, Semboyan (Bhinneka Tunggal Ika), Lagu Kebangsaan</strong> = Identitas Instrumental.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 3, "g": "TWK · Nasionalisme 1–2", "t": "3. Faktor Pendorong Nasionalisme", "html": "<p>Semangat nasionalisme bangsa Indonesia dipengaruhi oleh dua kelompok faktor utama:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Faktor Internal (Dari Dalam Bangsa Indonesia)</th>\n<th style=\"text-align: left;\">Faktor Eksternal (Dari Luar Bangsa Indonesia)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>1. Adanya kesamaan nasib:</strong> Penderitaan dan keterjajahan menimbulkan rasa senasib sepenanggungan untuk mengusir penjajah.</td>\n<td style=\"text-align: left;\"><strong>1. Masuknya bangsa Barat:</strong> Penjajahan bangsa Barat menimbulkan penderitaan rakyat dan membangkitkan semangat perlawanan.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>2. Keinginan hidup merdeka:</strong> Dorongan untuk bebas dari belenggu penjajahan melahirkan jiwa nasionalisme yang kuat.</td>\n<td style=\"text-align: left;\"><strong>2. Pengaruh kebangkitan India:</strong> Perjuangan bangsa India melawan Inggris menginspirasi bahwa penjajah bisa dilawan dengan persatuan.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>3. Kenangan masa kejayaan:</strong> Mengingat kejayaan kerajaan-kerajaan Nusantara (seperti Sriwijaya dan Majapahit) menumbuhkan rasa bangga untuk bangkit kembali.</td>\n<td style=\"text-align: left;\"><strong>3. Gerakan kebangsaan Filipina:</strong> Perjuangan melawan Spanyol di bawah pimpinan <strong>Jose Rizal</strong> memberi pelajaran tentang pentingnya pendidikan dan persatuan.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>4. Penyebaran ajaran kebangsaan:</strong> Melalui organisasi, pendidikan, dan media cetak, kesadaran nasional menyebar luas.</td>\n<td style=\"text-align: left;\"><strong>4. Gerakan nasionalis rakyat Cina:</strong> Perjuangan tokoh seperti <strong>Sun Yat Sen</strong> dalam mengusir kekuasaan asing memberi contoh semangat perjuangan rakyat.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>5. Pergerakan tokoh nasional:</strong> Tokoh-tokoh seperti R.A. Kartini, dr. Sutomo, Budi Utomo, dan lainnya menginspirasi rakyat untuk bersatu.</td>\n<td style=\"text-align: left;\"><strong>5. Pergerakan Turki Muda:</strong> Gerakan di bawah pimpinan <strong>Mustafa Kemal Pasha</strong> yang berhasil mengusir kekuasaan asing memberi inspirasi bagi Indonesia.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>6. Nilai-nilai luhur bangsa:</strong> Gotong royong, toleransi, musyawarah, dan persatuan memperkuat semangat kebangsaan.</td>\n<td style=\"text-align: left;\"><strong>6. Pergerakan nasionalisme dunia:</strong> Ide nasionalisme di Eropa, Asia, dan Afrika memengaruhi pemikiran para pelajar Indonesia di luar negeri.</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>CATATAN TWK</strong>\n* <strong>Faktor pendorong nasionalisme</strong> = faktor yang membangkitkan semangat kebangsaan dan persatuan.\n* Sering muncul dalam soal TWK untuk membedakan mana yang termasuk <strong>faktor internal</strong> dan <strong>faktor eksternal</strong>.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 4, "g": "TWK · Nasionalisme 1–2", "t": "4. Prinsip-Prinsip Nasionalisme", "html": "<ol>\n<li><strong>Prinsip Kesatuan (<em>Unity</em>)</strong><ul>\n<li>Nasionalisme menuntut adanya hasrat untuk bersatu secara mutlak. Tanpa kesatuan, sebuah bangsa hanyalah kumpulan individu yang mencari keamanan.</li>\n<li><em>Dimensi:</em> Kesadaran kolektif untuk bersatu sebagai satu bangsa.</li>\n<li><em>Konteks Indonesia:</em> Kesadaran untuk merdeka sebagai bangsa yang utuh (\"Kemerdekaan ialah hak segala bangsa\").</li>\n</ul>\n</li>\n<li><strong>Prinsip Kebebasan (<em>Liberty</em>)</strong><ul>\n<li>Kesadaran yang lahir dari keinginan untuk merdeka dan bebas dari dominasi pihak asing maupun penindasan internal.</li>\n<li><em>Dimensi:</em> Kebebasan dari penjajahan bangsa lain dan penindasan hak asasi.</li>\n<li><em>Konteks Indonesia:</em> Pembukaan UUD 1945 Alinea I (penjajahan di atas dunia harus dihapuskan).</li>\n</ul>\n</li>\n<li><strong>Prinsip Kesamaan (<em>Equality</em>)</strong><ul>\n<li>Nasionalisme menolak hierarki kasta atau kelas yang kaku. Setiap anggota bangsa memiliki kedudukan yang setara di hadapan hukum dan negara.</li>\n<li><em>Dimensi:</em> Kesamaan di hadapan hukum (<em>Equality before the law</em>).</li>\n<li><em>Konteks Indonesia:</em> Sila ke-5 Pancasila (Keadilan Sosial) dan <strong>Pasal 27 Ayat (1) UUD 1945</strong> (<em>\"Segala warga negara bersamaan kedudukannya di dalam hukum dan pemerintahan...\"</em>).</li>\n</ul>\n</li>\n<li><strong>Prinsip Kepribadian (<em>Personality / Individuality</em>)</strong><ul>\n<li>Nasionalisme menuntut adanya identitas khas yang membedakan suatu bangsa dengan bangsa lainnya.</li>\n<li><em>Dimensi:</em> Budaya, bahasa, sejarah, dan karakter nasional.</li>\n<li><em>Konteks Indonesia:</em> Konsep <strong>Trisakti Bung Karno</strong> (<em>Berkepribadian dalam kebudayaan</em> serta <em>Berdikari dalam ekonomi</em>) dan Pancasila sebagai jati diri bangsa.</li>\n</ul>\n</li>\n<li><strong>Prinsip Kepahlawanan (<em>Heroism / Achievement</em>)</strong><ul>\n<li>Nasionalisme menuntut pengorbanan, dedikasi, dan prestasi nyata demi kemajuan dan kehormatan bangsa.</li>\n<li><em>Dimensi:</em> Sikap ksatria sejati (<em>True Knight</em>) yang rela berkorban untuk negara.</li>\n<li><em>Konteks Indonesia:</em> Semangat juang pahlawan dan kontribusi aktif warga negara dalam membangun bangsa.</li>\n</ul>\n</li>\n</ol>\n<blockquote>\n<p><strong>CATATAN TWK</strong>\n* <strong>Kesatuan</strong> = Persatuan yang mutlak.\n* <strong>Kebebasan</strong> = Merdeka dari penjajahan &amp; penindasan.\n* <strong>Kesamaan</strong> = Semua setara di hadapan hukum.\n* <strong>Kepribadian</strong> = Memiliki jati diri bangsa.\n* <strong>Kepahlawanan</strong> = Berjuang &amp; berkorban untuk kemajuan bangsa.</p>\n</blockquote>", "min": 2, "nc": 0}, {"id": 5, "g": "TWK · Nasionalisme 1–2", "t": "5. Jenis-Jenis Nasionalisme", "html": "<h3>Dua Bentuk Utama Berdasarkan Dasar Keanggotaan</h3>\n<ol>\n<li><strong>Nasionalisme Kewarganegaraan (<em>Civic Nationalism</em>)</strong><ul>\n<li><strong>Dasar:</strong> Rasa terikat sebagai warga negara yang memiliki hak dan kewajiban politik yang sama di bawah konstitusi.</li>\n<li><strong>Ciri Utama:</strong> Bersifat <strong>inklusif</strong>, kosmopolitan, dan ras/etnis tidak menjadi syarat utama selama individu memiliki status kewarganegaraan (<em>citizens</em>) dan patuh pada konstitusi.</li>\n<li><strong>Contoh:</strong> Amerika Serikat, Prancis.</li>\n</ul>\n</li>\n<li><strong>Nasionalisme Etnis (<em>Ethnic Nationalism</em>)</strong><ul>\n<li><strong>Dasar:</strong> Garis keturunan, warisan darah, bahasa, atau budaya yang diwariskan secara turun-temurun.</li>\n<li><strong>Ciri Utama:</strong> Bersifat <strong>eksklusif</strong>. Keanggotaan bangsa ditentukan oleh asal-usul leluhur, bukan dipilih.</li>\n<li><strong>Contoh:</strong> Jerman pada era pra-Perang Dunia II, Jepang secara historis, atau gerakan separatis berbasis etnis/klan.</li>\n</ul>\n</li>\n</ol>\n<h3>Ragam Jenis Nasionalisme Lainnya</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Jenis Nasionalisme</th>\n<th style=\"text-align: left;\">Penjelasan Singkat</th>\n<th style=\"text-align: left;\">Fokus Utama</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Nasionalisme Kewarganegaraan (<em>Civic</em>)</strong></td>\n<td style=\"text-align: left;\">Negara dipandang sebagai persekutuan politik warga negara yang tunduk pada hukum dan konstitusi yang sama.</td>\n<td style=\"text-align: left;\">Keterikatan dengan budaya konstitusional dan hak warga negara.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Nasionalisme Budaya</strong></td>\n<td style=\"text-align: left;\">Bangsa dipersatukan oleh budaya bersama (bahasa, tradisi, nilai historis) yang diwariskan antar-generasi.</td>\n<td style=\"text-align: left;\">Pelestarian tradisi, seni, dan bahasa nasional.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Nasionalisme Agama</strong></td>\n<td style=\"text-align: left;\">Loyalitas terhadap negara bersumber dari persamaan agama, dan hukum negara sering berlandaskan ajaran agama.</td>\n<td style=\"text-align: left;\">Doktrin teologis sebagai pemersatu bangsa.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Nasionalisme Kenegaraan</strong></td>\n<td style=\"text-align: left;\">Negara menjadi pusat identitas utama di atas segala golongan, sering dipadukan dengan mobilisasi politik yang kuat.</td>\n<td style=\"text-align: left;\">Loyalitas total pada institusi dan kedaulatan negara.</td>\n</tr>\n</tbody>\n</table>", "min": 1, "nc": 0}, {"id": 6, "g": "TWK · Nasionalisme 1–2", "t": "6. Nasionalisme Sempit vs Nasionalisme Luas &amp; Nasionalisme Pancasila", "html": "<h3>Perbandingan Nasionalisme Sempit dan Nasionalisme Luas</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Aspek</th>\n<th style=\"text-align: left;\">Nasionalisme Sempit (<em>Chauvinisme</em>)</th>\n<th style=\"text-align: left;\">Nasionalisme Luas</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Ruang Lingkup</strong></td>\n<td style=\"text-align: left;\">Terbatas hanya pada kepentingan bangsa sendiri.</td>\n<td style=\"text-align: left;\">Terbuka, sehat, dan menghargai bangsa lain.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Sikap terhadap Bangsa Lain</strong></td>\n<td style=\"text-align: left;\">Cenderung merendahkan, menganggap bangsa sendiri paling unggul, atau menjajah bangsa lain.</td>\n<td style=\"text-align: left;\">Menghormati kesetaraan dan martabat bangsa lain.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Prinsip Utama</strong></td>\n<td style=\"text-align: left;\">Egoisme nasional, kepentingan sendiri, fanatisme berlebihan.</td>\n<td style=\"text-align: left;\">Kemanusiaan, kerja sama, dan perdamaian.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Dampak</strong></td>\n<td style=\"text-align: left;\">Konflik internasional, permusuhan, dan penjajahan.</td>\n<td style=\"text-align: left;\">Persatuan, kerja sama internasional, dan perdamaian dunia.</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Contoh Historis</strong></td>\n<td style=\"text-align: left;\">Nazi Jerman (<em>Deutschland über alles</em>), Kekaisaran Jepang (<em>Hakko Ichiu</em>).</td>\n<td style=\"text-align: left;\">Gerakan kemerdekaan Indonesia, semangat PBB, kerja sama ASEAN.</td>\n</tr>\n</tbody>\n</table>\n<h3>Nasionalisme Pancasila</h3>\n<p>Nasionalisme Pancasila adalah pandangan kejiwaan manusia Indonesia terhadap bangsa dan tanah airnya yang berlandaskan nilai-nilai Pancasila:</p>\n<ul>\n<li><strong>Jalan Tengah:</strong> Mengambil sisi positif <em>Civic Nationalism</em> (bersatu karena cita-cita Proklamasi 1945, bukan karena satu ras) dan menghargai <em>Cultural Nationalism</em> (keberagaman budaya daerah sebagai kekayaan nasional).</li>\n<li><strong>Berketuhanan:</strong> Tidak absolut pada kesatuan satu agama, melainkan berdasarkan persamaan nilai ketuhanan dan toleransi.</li>\n<li><strong>Humanis:</strong> Menolak chauvinisme. Sila ke-2 (<em>Kemanusiaan yang Adil dan Beradab</em>) menjadi roh agar nasionalisme Indonesia tidak agresif terhadap bangsa lain.</li>\n<li><strong>Kutipan Ir. Soekarno:</strong> <em>\"Nasionalisme kita bukanlah nasionalisme yang mengecualikan. Nasionalisme kita adalah nasionalisme yang tumbuh di taman sari internasionalisme.\"</em></li>\n</ul>", "min": 1, "nc": 0}, {"id": 7, "g": "TWK · Nasionalisme 1–2", "t": "7. Tujuan Nasionalisme &amp; Ciri Nasionalisme Pancasila", "html": "<h3>Tujuan Nasionalisme (Tahapan Mewujudkan Sikap Nasionalisme)</h3>\n<ol>\n<li>Menumbuhkan semangat rasa cinta bertanah air dan berbangsa.</li>\n<li>Membangun dan mempererat tali persaudaraan antarsesama anggota masyarakat.</li>\n<li>Memberi keharusan adanya solidaritas moral antarsesama warga bangsa.</li>\n<li>Menjaga tanah air dan bangsa dari serangan musuh, baik dari luar maupun dari dalam negeri.</li>\n<li>Berupaya menghilangkan etnosentrisme atau tuntutan berlebihan dari warga negara kepada pemerintah.</li>\n<li>Membangun hubungan yang rukun dan harmonis antarsesama dalam masyarakat.</li>\n</ol>\n<h3>Ciri-Ciri Nasionalisme Pancasila</h3>\n<ul>\n<li>Dilandasi oleh nilai-nilai luhur Pancasila.</li>\n<li>Menempatkan persatuan, kesatuan, kepentingan, serta keselamatan bangsa dan negara di atas kepentingan pribadi atau golongan.</li>\n<li>Memiliki sikap rela berkorban demi kepentingan bangsa dan negara.</li>\n<li>Bangga sebagai bangsa Indonesia dan bertanah air Indonesia <strong>tanpa merendahkan bangsa lain</strong>.</li>\n<li>Mengakui persamaan derajat, persamaan hak, dan kewajiban antara sesama manusia dan sesama bangsa.</li>\n<li>Menumbuhkan sikap saling menghargai perbedaan dan bersikap toleran.</li>\n</ul>", "min": 1, "nc": 0}, {"id": 8, "g": "TWK · Nasionalisme 1–2", "t": "8. Sikap yang Bertentangan dengan Nasionalisme", "html": "<p>Terdapat tujuh sikap berbahaya yang bertentangan dengan nilai nasionalisme dan dapat memecah belah persatuan bangsa:</p>\n<ol>\n<li><strong>Egoisme:</strong> Sikap mementingkan diri sendiri di atas kepentingan bersama.</li>\n<li><strong>Chauvinisme:</strong> Paham atau ajaran cinta tanah air yang berlebihan hingga memandang remeh bangsa lain dan mengunggulkan bangsanya sendiri secara membabi buta.</li>\n<li><strong>Ekstremisme:</strong> Sikap keras mempertahankan pendirian dengan menghalalkan segala cara untuk mencapai tujuan tertentu.</li>\n<li><strong>Terorisme:</strong> Tindakan sistematis yang menggunakan kekerasan/ancaman untuk menciptakan kepanikan, keresahan, dan suasana tidak aman dalam masyarakat.</li>\n<li><strong>Primordialisme:</strong> Sikap berpegang teguh dan mementingkan daerah, suku, agama, ras, atau golongan sendiri secara sempit.</li>\n<li><strong>Etnosentrisme:</strong> Menjadikan budayanya sendiri sebagai standar penilaian budaya lain dan menganggap budayanya sebagai budaya yang paling baik/benar.</li>\n<li><strong>Separatisme:</strong> Gerakan yang dilakukan oleh individu, kelompok, atau golongan untuk memisahkan diri dari NKRI guna mendirikan negara sendiri.</li>\n</ol>\n<blockquote>\n<p><strong>CATATAN TWK (SERING KELUAR!)</strong>\n* <strong>Perbedaan Konsep:</strong> Chauvinisme (cinta tanah air berlebihan/merendahkan bangsa lain) ≠ Nasionalisme (cinta tanah air yang wajar dan menghargai bangsa lain).\n* <strong>Jebakan TWK:</strong> Menganggap sikap membela suku/daerah sendiri sebagai yang paling benar adalah <strong>Etnosentrisme/Primordialisme</strong>, bukan nasionalisme.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 9, "g": "TWK · Nasionalisme 1–2", "t": "9. Sikap-Sikap Nasionalisme di Berbagai Bidang", "html": "<h3>A. Nasionalisme Bidang Politik</h3>\n<p>Menekankan pentingnya kedaulatan negara, demokrasi, dan partisipasi aktif warga negara:</p>\n<ol>\n<li><strong>Partisipasi dalam Pemilu:</strong> Menggunakan hak pilih dengan bijak untuk memilih pemimpin yang bertanggung jawab.</li>\n<li><strong>Menghormati Konstitusi:</strong> Menjunjung tinggi UUD 1945, Pancasila, dan hukum yang berlaku sebagai pedoman hidup bernegara.</li>\n<li><strong>Menghormati Lambang-Lambang Negara:</strong> Menghormati bendera Merah Putih, lagu kebangsaan Indonesia Raya, dan lambang Garuda Pancasila (misalnya mengikuti upacara dengan khidmat dan berdiri tegak saat lagu kebangsaan dinyanyikan).</li>\n<li><strong>Politik Bebas Aktif:</strong> Mendukung peran Indonesia dalam menjaga perdamaian dunia melalui jalur diplomasi dan penyelesaian damai.</li>\n</ol>\n<h3>B. Nasionalisme Bidang Ekonomi</h3>\n<p>Berfokus pada penguatan kemandirian ekonomi nasional dan mengurangi ketergantungan asing:</p>\n<ol>\n<li><strong>Menggunakan Produk Lokal:</strong> Lebih memilih dan bangga membeli produk buatan dalam negeri untuk mendorong pertumbuhan industri nasional.</li>\n<li><strong>Pembangunan UMKM:</strong> Mendukung Usaha Mikro, Kecil, dan Menengah sebagai tulang punggung perekonomian rakyat.</li>\n<li><strong>Pembangunan Infrastruktur Mandiri:</strong> Mengoptimalkan sumber daya dalam negeri dan membatasi ketergantungan pada pihak asing.</li>\n</ol>\n<h3>C. Nasionalisme Bidang Sosial</h3>\n<p>Menekankan solidaritas dan kepedulian antarsesama warga negara tanpa diskriminasi SARA:</p>\n<ol>\n<li><strong>Gotong Royong:</strong> Bekerja sama membersihkan lingkungan, membangun fasilitas umum, atau membantu korban bencana alam.</li>\n<li><strong>Menghormati Perbedaan:</strong> Bekerja sama tanpa memandang latar belakang suku, agama, ras, maupun golongan.</li>\n<li><strong>Menumbuhkan Toleransi dan Pluralisme:</strong> Menerima dan menghargai perbedaan pendapat, budaya, keyakinan, dan kebiasaan.</li>\n<li><strong>Menghindarkan Diri dari Sikap Negatif:</strong> Menjauhi chauvinisme, ekstremisme, primordialisme, etnosentrisme, dan individualisme.</li>\n<li><strong>Berperan Aktif dalam Organisasi Sosial:</strong> Berpartisipasi dalam lembaga kemasyarakatan yang memperjuangkan keadilan dan kesejahteraan rakyat.</li>\n</ol>\n<h3>D. Nasionalisme Bidang Budaya</h3>\n<p>Menekankan pelestarian kebudayaan nasional di tengah arus globalisasi:</p>\n<ol>\n<li><strong>Melestarikan Budaya dan Bahasa Lokal:</strong> Aktif mempromosikan batik, tarian daerah, musik tradisional, bahasa daerah, dan upacara adat.</li>\n<li><strong>Menghargai Karya Seni dalam Negeri:</strong> Mendukung film, musik, sastra, dan karya seniman lokal.</li>\n<li><strong>Bahasa Indonesia sebagai Pemersatu:</strong> Menggunakan Bahasa Indonesia secara aktif dan baik dalam komunikasi sehari-hari sambil tetap menghargai bahasa daerah dan bahasa asing.</li>\n</ol>", "min": 2, "nc": 0}, {"id": 10, "g": "TWK · Nasionalisme 1–2", "t": "10. Peran &amp; Ancaman Nasionalisme dalam Masyarakat Multikultural", "html": "<p>Dalam masyarakat majemuk bersemboyan <em>Bhinneka Tunggal Ika</em>, nasionalisme menghadapi berbagai ancaman:</p>\n<ul>\n<li><strong>Ancaman Internal:</strong><ol>\n<li>Sentimen agama</li>\n<li>Sentimen etnis/kesukuan</li>\n<li>Ketidakmerataan keadilan</li>\n<li>Praktik demokrasi yang tidak sehat</li>\n<li>Dampak salah urus negara (korupsi, penyalahgunaan wewenang)</li>\n</ol>\n</li>\n<li><strong>Ancaman Eksternal:</strong><ul>\n<li>Arus globalisasi yang memengaruhi aspek sosial, budaya, ekonomi, dan politik secara masif.</li>\n</ul>\n</li>\n</ul>\n<blockquote>\n<p><strong>CATATAN TWK</strong>\n* <strong>Perbedaan Konsep:</strong> <strong>Nasionalisme</strong> = semangat dan tindakan untuk memajukan serta menjaga persatuan bangsa; <strong>Patriotisme</strong> = sikap rela berkorban dan cinta tanah air yang pantang menyerah.</p>\n</blockquote>", "min": 1, "nc": 0}, {"id": 11, "g": "TWK · Nasionalisme 1–2", "t": "11. Nasionalisme dalam Hubungan Internasional", "html": "<h3>Landasan Konstitusional &amp; Ideologis</h3>\n<ul>\n<li><strong>UUD 1945:</strong><ul>\n<li><em>Pembukaan Alinea I:</em> <em>\"Bahwa sesungguhnya kemerdekaan itu ialah hak segala bangsa...\"</em></li>\n<li><em>Pembukaan Alinea IV:</em> <em>\"...ikut melaksanakan ketertiban dunia yang berdasarkan kemerdekaan, perdamaian abadi, dan keadilan sosial.\"</em></li>\n</ul>\n</li>\n<li><strong>Pancasila:</strong><ul>\n<li><em>Sila ke-2 (Kemanusiaan):</em> Menjunjung tinggi persamaan derajat antarbangsa.</li>\n<li><em>Sila ke-3 (Persatuan):</em> Menempatkan kepentingan nasional secara cerdas sebagai bagian dari komunitas dunia (<em>\"Nation and Internationalism\"</em> — Soekarno).</li>\n</ul>\n</li>\n</ul>\n<h3>Prinsip Politik Luar Negeri \"Bebas Aktif\"</h3>\n<ul>\n<li><strong>Bebas:</strong> Indonesia tidak memihak atau terikat pada blok kekuatan mana pun, serta tidak menjadi boneka/proksi negara lain dalam menentukan sikap.</li>\n<li><strong>Aktif:</strong> Indonesia tidak pasif, melainkan proaktif memberikan sumbangsih nyata bagi penyelesaian konflik dan perdamaian dunia.</li>\n</ul>\n<h3>Empat Bidang Implementasi Internasional</h3>\n<ol>\n<li><strong>Bidang Politik &amp; Perdamaian (Diplomasi Berdaulat)</strong><ul>\n<li><strong>Inisiator KAA 1955:</strong> Menggalang solidaritas Asia-Afrika untuk melawan kolonialisme.</li>\n<li><strong>Pasukan Garuda (Kontingen Garuda):</strong> Mengirim pasukan penjaga perdamaian PBB ke wilayah konflik (Lebanon, Kongo, Sudan, dll.).</li>\n<li><strong>Presidensi G20 (2022):</strong> Memimpin forum ekonomi global di tengah ketegangan geopolitik dunia.</li>\n</ul>\n</li>\n<li><strong>Bidang Ekonomi (Kemandirian &amp; Hilirisasi)</strong><ul>\n<li><strong>Kebijakan Hilirisasi:</strong> Larangan ekspor bijih nikel mentah untuk meningkatkan nilai tambah melalui pembangunan <em>smelter</em> di dalam negeri.</li>\n<li><strong>Penggunaan Mata Uang Lokal (<em>Local Currency Settlement / LCS</em>):</strong> Kerja sama transaksi dengan negara mitra (Tiongkok, Jepang, Malaysia, dll.) menggunakan Rupiah dan mata uang mitra untuk mengurangi ketergantungan pada Dolar AS.</li>\n</ul>\n</li>\n<li><strong>Bidang Kedaulatan Wilayah (Ketegasan Hukum)</strong><ul>\n<li><strong>Deklarasi Djuanda (1957) hingga UNCLOS (1982):</strong> Perjuangan diplomasi agar laut antarpulau diakui sebagai wilayah kedaulatan mutlak NKRI (Wawasan Nusantara).</li>\n<li><strong>Sikap Tegas di Laut Natuna Utara:</strong> Menolak klaim sepihak <em>\"Nine Dash Line\"</em> Tiongkok berlandaskan hukum laut internasional UNCLOS 1982.</li>\n</ul>\n</li>\n<li><strong>Bidang Kemanusiaan (Solidaritas Tanpa Batas)</strong><ul>\n<li><strong>Dukungan terhadap Palestina:</strong> Konsistensi Indonesia menolak membuka hubungan diplomatik dengan Israel selama penjajahan atas Palestina masih berlangsung (amanat Pembukaan UUD 1945 Alinea I).</li>\n<li><strong>Bantuan Kemanusiaan Rohingya:</strong> Aktif memberikan bantuan kemanusiaan dan diplomasi di tingkat ASEAN terkait krisis Myanmar.</li>\n</ul>\n</li>\n</ol>", "min": 2, "nc": 0}, {"id": 12, "g": "TWK · Nasionalisme 1–2", "t": "12. Tantangan Nasionalisme Era Globalisasi", "html": "<ol>\n<li><strong>Pengaruh Budaya Asing</strong>\n    Masuknya budaya luar melalui media sosial, film, dan musik dapat menggerus identitas nasional generasi muda jika tidak diimbangi dengan pelestarian budaya lokal.</li>\n<li><strong>Globalisasi Ekonomi</strong>\n    Kompetisi pasar bebas membanjiri pasar dengan produk impor murah yang mengancam industri dalam negeri apabila masyarakat tidak mencintai produk lokal.</li>\n<li><strong>Teknologi dan Media Sosial</strong>\n    Kebebasan berekspresi tanpa tanggung jawab memicu penyebaran berita bohong (<em>hoaks</em>) dan ujaran kebencian yang mengancam persatuan bangsa.</li>\n</ol>\n<blockquote>\n<p><strong>CATATAN TWK</strong>\n* <strong>Perbedaan Konsep:</strong> <strong>Globalisasi</strong> (proses mendunianya informasi, ekonomi, dan interaksi antarnegara) ≠ <strong>Globalisme</strong> (paham yang menghendaki hilangnya batas-batas kedaulatan negara).\n* <strong>Jebakan TWK:</strong> Hindari opsi jawaban yang bersikap ekstrem (seperti menutup diri sepenuhnya dari pergaulan dunia atau menerima seluruh budaya asing tanpa filter).</p>\n</blockquote>", "min": 1, "nc":
