</style></head><body><div id="app"></div>
<script>
const PK=[{"id": 1, "n": "Paket Soal 1", "qs": [{"n": 1, "sec": "TWK", "t": "Pilar Negara", "q": "Wakil Gubernur Jawa Barat, Uu Ruzhanul Ulum baru saja meluncurkan program pendidikan karakter berupa Ajengan Masuk Sekolah (AMS) yang bertujuan untuk meningkatkan keimanan dan ketakwaan peserta didik agar memiliki moral, akhlak yang baik, serta mampu untuk menciptakan kerukunan dan sikap toleran. Program tersebut sejalan dengan instruksi pemerintah pusat khususnya dalam fokus pendidikan karakter generasi muda bangsa Indonesia. Kebijakan pemerintah tersebut dilandasi oleh nilai Pancasila yaitu nilai ....", "o": {"a": "Ketuhanan dan kemanusiaan", "b": "Persatuan dan kerakyatan", "c": "Kemanusiaan dan keadilan", "d": "Ketuhanan dan persatuan", "e": "Persatuan dan keadilan"}, "ans": "d", "ex": "Di dalam soal terdapat kata kunci yaitu <i>meningkatkan keimanan dan ketakwaan</i> sebagai nilai Ketuhanan. Sementara <i>menciptakan kerukunan dan sikap toleran</i> merupakan nilai Persatuan."}, {"n": 2, "sec": "TWK", "t": "", "q": "Setiap warga negara memiliki kewajiban yang sama dalam masalah pembelaan negara sebagai wujud kecintaan pada tanah air yang sudah memberikan kehidupan padanya. Berikut ini merupakan alasan tentang pentingnya upaya pembelaan negara dilakukan oleh setiap warga negara Indonesia, <b>kecuali</b> ....", "o": {"a": "Untuk menjaga keutuhan wilayah negara", "b": "Untuk mempertahankan negara dari berbagai ancaman", "c": "Merupakan hak sekaligus kewajiban setiap warga negara", "d": "Merupakan kegiatan untuk memperoleh kehormatan dari negara", "e": "Negara dan bangsa Indonesia dihormati oleh masyarakat internasional"}, "ans": "d", "ex": "Pembelaan negara adalah kewajiban yang dilakukan oleh setiap warga negara untuk menjaga keutuhan wilayah negara, mempertahankan negara dari berbagai ancaman, dan memastikan bahwa negara dan bangsa Indonesia dihormati oleh masyarakat internasional. Pembelaan negara bukanlah kegiatan untuk memperoleh kehormatan dari negara, tetapi lebih kepada tanggung jawab dan hak setiap warga negara dalam melindungi dan mempertahankan negara dari ancaman dan bahaya."}, {"n": 3, "sec": "TWK", "q": "Metode efektif yang digunakan KPK untuk menangkap koruptor adalah ....", "o": {"a": "Survei lembaga negara", "b": "Sosialisasi antikorupsi", "c": "Operasi tangkap tangan", "d": "Regulasi hukum", "e": "Pendidikan antikorupsi"}, "ans": "c", "ex": "Metode efektif yang digunakan KPK untuk menangkap koruptor adalah operasi tangkap tangan."}, {"n": 4, "sec": "TWK", "t": "", "q": "Sistem pembagian kekuasaan negara Indonesia menurut UUD NRI Tahun 1945 menegaskan bahwa Presiden merupakan pemegang kekuasaan tertinggi dalam pemerintahan. Namun demikian, dalam menjalankan tugasnya di bidang tertentu, Presiden masih harus mendapat persetujuan DPR. Kondisi seperti itu ditujukan untuk ....", "o": {"a": "Mendapatkan pertimbangan dan arahan dari legislatif", "b": "Terjadinya <i>check and balance</i> dalam menjalankan kekuasaan", "c": "Terjadinya kerja sama antara eksekutif dan legislatif", "d": "Menjadikan terwujudnya kesamaan kedudukan DPR dan Presiden", "e": "Memperoleh kepercayaan terhadap warga negara dalam menentukan arah kebijakan"}, "ans": "b", "ex": "Sistem pembagian kekuasaan di Indonesia dirancang untuk memastikan adanya mekanisme <i>check and balance</i> antara lembaga eksekutif (Presiden) dan legislatif (DPR). Hal ini bertujuan untuk mencegah terjadinya penyalahgunaan kekuasaan oleh salah satu pihak dan memastikan bahwa setiap keputusan penting, terutama yang berkaitan dengan kebijakan publik dan anggaran, mendapat persetujuan dari kedua lembaga tersebut. Dengan demikian, sistem ini membantu menjaga keseimbangan kekuasaan dan mendorong transparansi serta akuntabilitas dalam pemerintahan."}, {"n": 5, "sec": "TWK", "t": "", "q": "Yang bukan merupakan Indikator nilai yakin pada Pancasila sebagai ideologi bangsa adalah …", "o": {"a": "Menjadi pedoman hidup bangsa Indonesia untuk menjaga keutuhan negara", "b": "senantiasa mengembangkan nilai-nilai Pancasila", "c": "mengamalkan Pancasila dalam kehidupan sehari-hari", "d": "menjadikan Pancasila sebagai pemersatu bangsa dan negara Indonesia", "e": "setia pada Pancasila dan meyakini sebagai dasar Negara Kesatuan Republik Indonesia"}, "ans": "a", "ex": "Indikator nilai yakin pada Pancasila sebagai ideologi bangsa meliputi memahami nilai-nilai dalam Pancasila, senantiasa mengembangkan nilai-nilai Pancasila, mengamalkan Pancasila dalam kehidupan sehari-hari, menjadikan Pancasila sebagai pemersatu bangsa dan negara Indonesia, dan setia pada Pancasila dan meyakini sebagai dasar Negara Kesatuan Republik Indonesia."}, {"n": 6, "sec": "TWK", "t": "Bahasa Indonesia", "q": "Berikut merupakan penulisan gelar yang benar adalah ....", "o": {"a": "prof. Dr. Muhammad Bahanudin, S.H., M.Hum.", "b": "Prof. Dr. Muhammad Bahanudin S.H., M.Hum.", "c": "Prof. Dr. Muhammad Bahanudin, S.H. M.Hum.", "d": "Prof. Dr. Muhammad Bahanudin, S.H., M.Hum.", "e": "Prof. Dr Muhammad Bahanudin, S.H., M.Hum."}, "ans": "d", "ex": "Aturan penulisan gelar adalah sebagai berikut: 1. Cara penulisan gelar bisa di belakang maupun di depan nama. 2. Setiap unsur singkatan gelar harus diawali huruf kapital (kecuali untuk gelar tertentu seperti dokter yang ditulis dr.) dan diakhiri tanda titik. 3. Menggunakan tanda koma (,) sebagai pemisah antara nama orang dengan nama gelar dan diikuti spasi. Sebagai contoh: Andika Fau, S.E. 4. Memakai tanda koma (,) untuk memisahkan satu gelar dengan gelar lain yang ditulis setelah nama orang dan diikuti spasi. Sedangkan deretan gelar sebelum nama orang tidak perlu dipisahkan dengan tanda koma. Contohnya: Prof. Andika Fau, S.E., M.H. 5. Gelar singkatan harus menggunakan tanda titik (.) untuk menghubungkan satu huruf dengan huruf lainnya."}, {"n": 7, "sec": "TWK", "t": "", "q": "Generasi milenial memiliki potensi besar untuk berkontribusi dalam upaya bela negara. Berikut adalah contoh kontribusi atau upaya bela negara yang dapat dilakukan oleh generasi milenial, kecuali…", "o": {"a": "Membangun startup atau proyek inovatif untuk memecahkan masalah sosial dan ekonomi di tingkat lokal atau nasional", "b": "Terlibat dalam kegiatan sosial dan kemanusiaan untuk membantu mereka yang membutuhkan", "c": "Mengambil peran dalam meningkatkan tingkat literasi dan pendidikan di komunitas", "d": "Mendorong penggunaan produk dan jasa lokal untuk mendukung pertumbuhan ekonomi di tingkat lokal", "e": "Berkontribusi dan ikut aktif dalam gerakan separatisme"}, "ans": "e", "ex": "Upaya bela negara yang dapat dilakukan oleh generasi milenial dapat meliputi aspek pemberdayaan ekonomi lokal, pendidikan dan literasi, partisipasi dalam program sosial, inovasi dan teknologi, dan perlindungan lingkungan."}, {"n": 8, "sec": "TWK", "q": "Mahkamah Konstitusi memiliki peran penting dalam sistem ketatanegaraan Indonesia, salah satunya adalah menguji undang-undang terhadap UUD 1945. Keputusan Mahkamah Konstitusi bersifat final dan mengikat, yang berarti...", "o": {"a": "Tidak dapat diajukan banding", "b": "Dapat diajukan banding", "c": "Dapat direvisi oleh Presiden", "d": "Dapat ditinjau ulang oleh DPR", "e": "Dapat direvisi oleh Mahkamah Agung"}, "ans": "a", "ex": "Keputusan Mahkamah Konstitusi bersifat final dan mengikat, artinya tidak dapat diajukan banding atau kasasi."}, {"n": 9, "sec": "TWK", "t": "", "q": "Ines bertanggung jawab untuk menghubungi talent untuk mempromosikan produk perusahaannya. Deadline yang semakin dekat membuat tim marketing terlihat stres karena produk yang akan digunakan untuk kebutuhan shoot belum lengkap. Melihat kondisi tersebut, Ines sebaiknya…", "o": {"a": "Beranggapan bahwa itu bukanlah tugas dan tanggung jawab dia", "b": "Merasa tenang karena telah mendapatkan dan menghubungi talent untuk promosi produk tersebut", "c": "Ikut panik karena deadline yang diberikan sangat mepet", "d": "Menanyakan kepada tim marketing apakah ada yang bisa dibantunya", "e": "Menyemangati tim agar lebih sigap dalam mempersiapkan produk yang akan digunakan"}, "ans": "d", "ex": "Saling mendukung dan membantu juga merupakan salah satu bentuk integritas. Ines dapat menanyakan kepada tim marketing apakah ada hal lain yang bisa dibantunya."}, {"n": 10, "sec": "TWK", "t": "", "q": "Setelah kemerdekaan Indonesia pada 17 Agustus 2017, pada 12 September 1945 dibentuklah pemerintahan pertama di Indonesia, dengan dibentuknya Kabinet Presidensial, yang dipimpin oleh Presiden Soekarno dan Wakil Presiden Mohammad Hatta. Pemerintahan Indonesia saat ini berbentuk pemerintahan Sistem Presidensial, dimana menteri pada Kabinet ditunjuk oleh Presiden dan dengan kekuasaan besar di Presiden Sukarno. Situasi ini ditentang oleh kalangan Sosialis di KNIP (Komite Nasional Indonesia Pusat), yang dipimpin oleh Sutan Syahrir. Maka dilakukan perubahan sistem pemerintahan yang pertama di negara Indonesia, sistem pemerintahan presidensial diubah menjadi sistem pemerintahan parlementer. Apa yang melatar belakangi secara yuridis dalam sejarah bangsa atas terjadinya perubahan tersebut ….", "o": {"a": "Perubahan ini dilatar belakangi adanya tentangan dari beberapa anggota KNIP, yang dipimpin Sutan Syahrir", "b": "Adanya anggapan sistem ini mengarah ke autokrasi dan diktatorisme oleh kekuasaan Presiden", "c": "Dikeluarkannya Maklumat Wakil Presiden tanggal 16 Oktober 1945 dan Maklumat Pemerintah tanggal 14 November 1945", "d": "Sistem politik ini dijadikan Propaganda NICA (warga sipil hindia belanda)", "e": "Adanya petisi tentang perubahan sistem pemerintahan dari KNIP sebelum diubahnya menjadi badan legislatif pada masa itu. Dan menyerahkan petisi itu yang disetujui oleh 50 anggota KNIP kepada Ir.Soekarno sebagai presidenNegara dengan partai politiknya yang terlalu stabil dalam politik"}, "ans": "c", "ex": "Pemahaman secara yuridis, Ketetapan bersifat hukum. Maklumat yang dikeluarkan oleh wakil presiden tentang perizinan pembentukan partai politik dan maklumat presiden tentang perubahan sistem pemerintah menjadi parlementer."}, {"n": 11, "sec": "TWK", "t": "", "q": "Perhatikan pernyataan berikut ini! 1. Menyelesaikan sengketa antar negara 2. Merekomendasikan dan memilih Hakim Mahkamah Internasional 3. Berwenang menjatuhkan sanksi baik berupa sanksi ekonomi maupun militer 4. Menyetujui anggaran PBB 5. Merekomendasikan calon anggota negara baru Tugas dan fungsi Dewan Keamanan PBB (Perserikatan Bangsa Bangsa) ditunjukkan nomor.....", "o": {"a": "1, 2, dan 3", "b": "Indonesia menjalankan hasil perjanjian New York yang meminta Belanda untuk segera meninggalkan Irian Barat", "c": "3, 4, dan 5", "d": "2, 3, dan 5", "e": "2, 3, dan 4"}, "ans": "d", "ex": "Berdasarkan Piagam PBB, fungsi dan wewenang Dewan Keamanan PBB adalah: 1. Untuk menjaga perdamaian dan keamanan internasional sesuai dengan prinsip-prinsip dan tujuan Perserikatan Bangsa-Bangsa; 2. Untuk menyelidiki setiap perselisihan atau situasi yang dapat menyebabkan gesekan internasional; 3. Untuk merekomendasikan metode-metode untuk menyesuaikan perselisihan atau syarat-syarat penyelesaian; merumuskan rencana-rencana untuk pembentukan suatu sistem untuk mengatur persenjataan; 4. Untuk menentukan adanya ancaman terhadap perdamaian atau tindakan agresi dan merekomendasikan tindakan apa yang harus diambil; 5. Untuk meminta Anggota untuk menerapkan sanksi ekonomi dan tindakan lain yang tidak melibatkan penggunaan kekuatan untuk mencegah atau menghentikan agresi; 6. Untuk mengambil tindakan militer terhadap penyerang; untuk merekomendasikan penerimaan anggota baru; 7. Untuk menjalankan fungsi perwalian Perserikatan Bangsa-Bangsa di \"bidang-bidang strategis\"; 8. Untuk merekomendasikan kepada Majelis Umum penunjukan Sekretaris Jenderal dan, bersama dengan Majelis, untuk memilih para Hakim Mahkamah Internasional."}, {"n": 12, "sec": "TWK", "t": "Pilar Negara", "q": "Dewasa ini, kasus diskriminasi dan rasisme sering terjadi terutama terhadap kaum minoritas. Tidak jarang, kasus tersebut diikuti dengan perundungan hingga persekusi yang dilakukan oleh warga sekitar karena adanya provokasi dari oknum yang tidak bertanggung jawab. Berdasarkan narasi tersebut, nilai Pancasila yang dilanggar adalah ....", "o": {"a": "Nilai Ketuhanan", "b": "Nilai Kemanusiaan", "c": "Nilai Persatuan", "d": "Nilai Musyawarah Mufakat", "e": "Nilai Keadilan"}, "ans": "b", "ex": "Kasus diskriminasi dan rasisme yang disertai perundungan (<i>bullying</i>) dan persekusi adalah pelanggaran sila kedua. Diskriminasi dan rasisme melanggar nilai-nilai kemanusiaan di mana pada hakikatnya manusia harus diperlakukan sama sebab memiliki derajat dan hak yang sama sebagai makhluk ciptaan Tuhan."}, {"n": 13, "sec": "TWK", "t": "", "q": "China meminta Indonesia menghentikan pengeboran minyak dan gas alam di wilayah maritim di Laut China Selatan, yang diklaim kedua negara milik mereka. Masalah tersebut sudah terjadi sejak lama tanpa jalan keluar. Indonesia mengatakan ujung selatan Laut China Selatan adalah Zona Ekonomi Eksklusif milik kedaulatan Republik Indonesia di bawah Konvensi PBB tentang Hukum Laut, dan pada 2017 menamai wilayah itu Laut Natuna Utara. China keberatan dengan perubahan nama itu dan bersikeras bahwa jalur air tersebut berada dalam klaim teritorialnya yang luas di Laut China Selatan, yang ditandai dengan \"sembilan garis putus-putus\" berbentuk U.Namun, batasan ini tidak memiliki dasar hukum menurut Pengadilan Arbitrase Permanen di Den Haag pada tahun 2016. Sikap yang sebaiknya ditunjukkan Indonesia dan China guna meredam ketegangan di antara kedua belah pihak negara ialah .....", "o": {"a": "Membagi dua wilayah Laut Natuna Utara berdasarkan isi perjanjian UNCLOS 1982 antara Indonesia dan China", "b": "Indonesia menjalankan hasil perjanjian New York yang meminta Belanda untuk segera meninggalkan Irian Barat", "c": "Kedua belah pihak semestinya sama-sama menahan diri dan konsisten mematuhi hukum- hukum Internasional yang sudah dibuat sebelumnya terkait batas-batas dan kepemilikan Laut Natuna Utara", "d": "Kedua belah pihak bersama sama mengajukan gugatan ke Mahkamah Internasional terkait sengketa laut natuna utara sehingga akan diperoleh putusan, negara mana yang sesungguhnya menjadi pemilik Laut Natuna Utara", "e": "Meminta bantuan Dewan Keamanan PBB untuk menjadi penengah sengketa Laut Natuna Utara antara Indonesia dan China, sekaligus meminta agar Dewan Keamanan PBB memberikan status quo kepada laut natuna utara"}, "ans": "c", "ex": "Semestinya kedua belah pihak konsisten menjalankan perjanjian UNCLOS 1982 dan putusan pengadilan arbitrase 2016, karena di dalam kedua regulasi hukum Internasional tersebut sudah diatur batas-batas wilayah perairan negara-negara yang memiliki wilayah laut di dunia."}, {"n": 14, "sec": "TWK", "t": "", "q": "Pemberontakan PRRI/Permesta adalah peristiwa separatis berupa gerakan revolusi oposisi pemerintahan Indonesia pascakemerdekaan yang tidak puas terhadap pusat karena mengistimewakan Jawa dalam pembangunan daerah. Contoh sikap pemerintah saat ini untuk menghindari timbulnya konflik semacam itu adalah ....", "o": {"a": "Pemberian bantuan sosial secara merata di seluruh Indonesia", "b": "Komitmen pembangunan tanah Papua yang sempat tertinggal", "c": "Pembangunan IKN sebagai simbol kemajuan bangsa dan perkembangan ekonomi", "d": "Kebijakan strategis pembangunan inklusif yang dicanangkan pemerintah", "e": "Pembangunan Sirkuit Mandalika sebagai sebuah Kawasan Ekonomi Khusus (KEK)"}, "ans": "d", "ex": "Kebijakan strategis ekonomi inklusif yang dicanangkan pemerintah bertujuan untuk memastikan bahwa semua daerah di Indonesia mendapatkan perhatian yang sama dalam pembangunan ekonomi. Hal ini penting untuk menghindari ketimpangan pembangunan yang dapat memicu ketidakpuasan dan potensi konflik seperti yang terjadi pada pemberontakan PRRI/Permesta. Dengan kebijakan yang inklusif, pemerintah berusaha untuk merangkul semua daerah dan memastikan bahwa manfaat pembangunan dirasakan secara merata oleh seluruh masyarakat Indonesia."}, {"n": 15, "sec": "TWK", "t": "", "q": "(“Di tepi kota metropolitan yang gemerlap, terdapat kawasan pemukiman miskin yang dihuni oleh berbagai keluarga kurang mampu. Salah satu warganya adalah seorang ibu rumah tangga bernama Siti. Meskipun hidup dalam keterbatasan, Siti memiliki semangat untuk memberikan masa depan yang lebih baik bagi anak-anaknya.” Ide pokok paragraf di atas adalah...", "o": {"a": "Realitas kemiskinan di kawasan pemukiman miskin.", "b": "Upaya Siti dalam mencari pekerjaan serabutan.", "c": "Kolaborasi Siti dengan sesama warga.", "d": "Program pemberdayaan masyarakat setempat.", "e": "Mimpi dan harapan Siti untuk anak-anaknya."}, "ans": "e", "ex": "Paragraf tersebut menyoroti mimpi dan harapan Siti sebagai warga kawasan pemukiman miskin untuk memberikan masa depan yang lebih baik bagi anak-anaknya. Ide pokok yang dominan adalah mimpi dan harapan Siti dalam menghadapi realitas kemiskinan."}, {"n": 16, "sec": "TWK", "q": "Polemik empat pilar kebangsaan yang digagas Taufik Kiemas mengalami problematika terhadap kedudukan", "o": {"a": "Pancasila", "b": "UUD 1945", "c": "NKRI", "d": "Bhinneka Tunggal Ika", "e": "Sistem Peradilan Nasional"}, "ans": "a", "ex": "Polemik empat pilar kebangsaan yang digagas Taufik Kiemas mengalami problematika terhadap kedudukan Pancasila."}, {"n": 17, "sec": "TWK", "t": "", "q": "Dasar hukum bela negara menurut UUD 1945 tertuang pada pasal 30 ayat (1) yang berbunyi …", "o": {"a": "Semua warga negara berhak dan wajib ikut serta dalam usaha pertahanan dan pembelaan negara", "b": "Setiap warga negara berhak dan wajib ikut serta dalam upaya pembelaan negara", "c": "Tiap-tiap warga negara berhak dan wajib ikut serta dalam usaha pertahanan dan keamanan negara", "d": "Setiap warga negara wajib ikut dalam upaya pembelaan negara sesuai dengan ketentuan peraturan perundang-undangan", "e": "Mengatur tata cara penyelenggaraan pertahanan negara yang dilakukan oleh TNI maupun oleh seluruh komponen bangsa"}, "ans": "c", "ex": "Pasal 30 ayat (1) berbunyi “tiap-tiap warga negara berhak dan wajib ikut serta dalam usaha pertahanan dan keamanan negara”."}, {"n": 18, "sec": "TWK", "t": "", "q": "Kalimat berikut yang merupakan fakta adalah ....", "o": {"a": "Banjir yang terjadi di Jakarta tak sehebat yang terjadi di Malang", "b": "Berdasarkan rilis BMG kelas I Juanda, kondisi berawan hingga hujan masih akan turun mewarnai langit Surabaya", "c": "Terhambatnya penurunan tinggi air di ruas jalan Tenggelis kemungkinan disebabkan oleh tersumbatnya air", "d": "Aksi pendemo di Tugu Monas masih terjadi", "e": "Saya yakin tahun ini ekspor beras bisa mencapai 1.000 Ton"}, "ans": "d", "ex": "Ciri-ciri kalimat fakta adalah sebagai berikut: 1. Bersifat objektif, kalimat disajikan berdasarkan penalaran (logis) 2. Dilengkapi data autentik berupa angka dan bukti tentang objek 3. Umumnya berisi jawaban atas pertanyaan <i>apa, siapa, kapan, di mana,</i> dan <i>berapa</i> 4. Acuan peristiwa terjadi pada masa lampau dan sekarang"}, {"n": 19, "sec": "TWK", "t": "", "q": "Berikut ini yang merupakan contoh pengingkaran kewajiban berkaitan dengan Pancasila khususnya keadilan sosial bagi seluruh rakyat Indonesia dalam kehidupan sehari-hari adalah ....", "o": {"a": "Menempatkan kepentingan individu di atas kepentingan golongan dan bangsa", "b": "Tidak mengakui persamaan derajat, hak, dan kewajiban setiap manusia tanpa membeda-bedakan suku, keturunan, agama, jenis kelamin, dan sebagainya", "c": "Mengembangkan sikap intoleransi antarumat beragama dalam kehidupan sehari-hari dalam masyarakat", "d": "Tidak memberikan kepercayaan kepada wakil-wakil rakyat yang telah terpilih untuk melaksanakan musyawarah dan menjalankan tugas sebaik-baiknya", "e": "Tidak menghormati dan melanggar hak orang lain"}, "ans": "e", "ex": "- <b>A)</b> Implementasi Pancasila sila ke-3 - <b>B)</b> Implementasi Pancasila sila ke-2 - <b>C)</b> Implementasi Pancasila sila ke-1 - <b>D)</b> Implementasi Pancasila sila ke-4 - <b>E)</b> Implementasi Pancasila sila ke-5"}, {"n": 20, "sec": "TWK", "t": "Bela Negara", "q": "Netralitas pegawai Aparatur Sipil Negara (ASN) dalam masa Pemilihan Umum (Pemilu) menjadi fokus perbincangan yang sensitif di masyarakat. Masyarakat berharap ASN terbebas dari intervensi politik praktis. Dalam pemilu, ASN memiliki asas netralitas yang diamanatkan dalam Undang-Undang No. 5/2014 tentang ASN. Adapun wujud netralitas ASN dalam hal bela negara bisa ditunjukkan dengan ....", "o": {"a": "Menggunakan hak pilih sesuai dengan kepentingan pribadi", "b": "Mengutamakan memilih calon yang pernah berkiprah di pemerintahan", "c": "Memilih tanpa berpihak dari segala bentuk pengaruh mana pun dan kepentingan siapa pun", "d": "Tidak memilih satu pasangan pun karena harus netral dalam pemilu", "e": "Menggunakan hak pilih untuk menggugurkan kewajiban sebagai abdi negara"}, "ans": "c", "ex": "ASN memiliki asas netralitas yang diamanatkan dalam Undang-Undang No. 5/2014 tentang ASN. Dalam aturan tersebut termaktub bahwa ASN dilarang menjadi anggota dan/atau pengurus partai politik. ASN pun diamanatkan untuk tidak berpihak dari segala bentuk pengaruh mana pun dan tidak memihak kepada kepentingan siapa pun."}, {"n": 21, "sec": "TWK", "q": "Peristiwa tawuran pelajar sering kali disebabkan oleh rendahnya ....", "o": {"a": "Rasa cinta tanah air", "b": "Kesadaran terhadap hukum", "c": "Pemahaman bela negara", "d": "Nilai dan norma dalam pergaulan", "e": "Rasa solidaritas"}, "ans": "d", "ex": "Tawuran pelajar sering terjadi karena memudarnya nilai dan norma dalam pergaulan yang menyebabkan perilaku anarkis."}, {"n": 22, "sec": "TWK", "t": "", "q": "Histori Pertempuran 15 Januari 1962 merupakan peristiwa bersejarah bagi bangsa Indonesia. Pada saat itu terjadi pertempuran yang tidak seimbang yang dikenal dengan pertempuran di laut Aru antara Angkatan Laut Indonesia dengan Tentara Belanda. Peristiwa ini sangat heroik dimana kekuatan TNI AL saat itu tidak seimbang dengan kekuatan Tentara Belanda. Pada saat TNI AL sedang melakukan patroli di sekitar perairan kepulauan Aru dengan menggunakan kapal KRI Harimau, KRI Macan Tutul, dan KRI Macan Kumbang. Ketiga kapal KRI itu berpapasan dengan kapal perang Belanda dan pesawat tempurnya sehingga terjadi penyerangan terhadap ketiga kapal tersebut. Ketika ada perintah dari Komodor Yos Sudarso untuk kembali dan berbelok namun KRI Macan Tutul macet dan berputar sebaliknya sehingga Belanda mengira KRI Macan Tutul menyerang mereka. Penyebab peristiwa terjadinya operasi patroli yang dilakukan di laut Aru oleh TNI AL dilatar belakangi oleh.....", "o": {"a": "Angkatan laut Indonesia yang kurang memperhitungkan jumlah kekuatan musuh di laut Aru sebelum kapal perang Indonesia berlayar", "b": "Indonesia menjalankan hasil perjanjian New York yang meminta Belanda untuk segera meninggalkan Irian Barat", "c": "Belanda mengingkari hasil perundingan KMB yang memicu kemarahan dari Indonesia", "d": "Serangan Laut dan Udara yang dilakukan Belanda secara mendadak yang menyebabkan KRI Macan Tutul kehilangan keseimbangan", "e": "Pihak Indonesia yang tidak mau diajak berunding dengan Belanda terkait status kepemilikan Irian Barat"}, "ans": "c", "ex": "Penyebab pertempuran laut aru lebih disebabkan karena Belanda ingkar terhadap hasil perundingan KMB (Konferensi Meja Bundar), dimana Belanda terkesan mengulur waktu padahal dalam perjanjian KMB status kepemilikan Irian Barat akan dibicarakan 1 tahun setelah perundingan KMB tapi nyatanya tidak. Akibatnya Indonesia melakukan operasi militer yang dikenal dengan operasi mandala untuk merebut Irian Barat yg menyebabkan insiden di laut Aru."}, {"n": 23, "sec": "TWK", "q": "Undang-undang yang terkait dengan Pertahanan Negara adalah...", "o": {"a": "Undang-Undang No. 56 tahun 1999", "b": "Undang-Undang No. 3 tahun 2002", "c": "Undang-Undang No. 20 tahun 1982", "d": "Undang-Undang No. 29 tahun 1954", "e": "Undang-Undang No. 54 tahun 1999"}, "ans": "b", "ex": "Undang-Undang yang membahas mengenai Pertahanan Negara ialah Undang-Undang No. 3 tahun 2002."}, {"n": 24, "sec": "TWK", "t": "Bahasa Indonesia", "q": "Berikut yang <b>tidak</b> termasuk kalimat fakta adalah ....", "o": {"a": "Salah satu daerah penghasil beras terbesar di Pulau Jawa adalah Jawa Barat", "b": "Sekitar 70% penduduk Indonesia mengonsumsi beras sebagai sumber makanan pokok", "c": "Sagu dikonsumsi oleh masyarakat di wilayah Papua dan sebagian Maluku", "d": "Warga Papua sepertinya banyak yang menempuh pendidikan di luar pulaunya", "e": "BPS (2021) menyebut telah terjadi 5.787 korban bunuh diri maupun percobaan bunuh diri"}, "ans": "d", "ex": "Sesuai dengan namanya, kalimat fakta berarti mengandung suatu hal yang bersifat fakta. Ciri-ciri kalimat fakta adalah bersifat objektif, menggambarkan sesuatu yang benar terjadi secara nyata, memiliki bukti kebenaran yang dapat dipertanggungjawabkan, memiliki data pendukung yang akurat seperti keterangan waktu, tempat, atau pelaku dari suatu peristiwa, dan tidak memihak atau merujuk pada sesuatu yang bersifat perorangan atau subjektif. Kata <i>\"sepertinya\"</i> pada opsi D menunjukkan opini/dugaan."}, {"n": 25, "sec": "TWK", "q": "Yang bukan termasuk lembaga antikorupsi nonpemerintah adalah", "o": {"a": "Imparsial", "b": "KPK", "c": "Indonesia Legal Roundtable", "d": "Transparency International Indonesia", "e": "LBH Jakarta"}, "ans": "b", "ex": "KPK merupakan lembaga pemerintah yang bertugas memberantas korupsi, sementara pilihan lainnya adalah lembaga nonpemerintah."}, {"n": 26, "sec": "TWK", "q": "Tata urutan peraturan perundang-undangan dari UUD 1945 sampai peraturan desa mencerminkan integritas dalam aspek", "o": {"a": "Asas kepastian hukum", "b": "Asas keterbukaan", "c": "Asas tertib penyelenggara negara", "d": "Asas efisiensi", "e": "Asas akuntabilitas"}, "ans": "c", "ex": "Tata urutan peraturan perundang-undangan mencerminkan asas tertib penyelenggara negara."}, {"n": 27, "sec": "TWK", "t": "Integritas", "q": "Sebagai seorang ASN, nilai integritas sangatlah dibutuhkan dalam berbagai kondisi dan situasi. Meski demikian, menjaga nilai integritas tidaklah mudah terlebih ketika fasilitas penunjang dalam pekerjaan tidak memadai. Berikut yang mencerminkan sikap integritas bagi ASN ketika fasilitas penunjang tidak memadai adalah ....", "o": {"a": "Melaporkan kepada atasan agar segera diberikan fasilitas yang memadai", "b": "Tetap melaksanakan fungsi dan tugas sebaik mungkin dengan fasilitas yang ada", "c": "Bekerja seperti biasa dengan sesekali membisikkan tentang fasilitas yang kurang memadai kepada atasan", "d": "Bekerja dengan menyesuaikan kondisi fasilitas yang ada", "e": "Memberikan pelayanan seadanya dengan fasilitas yang ada"}, "ans": "b", "ex": "Integritas tidak akan terpengaruh dalam situasi dan kondisi apa pun. Dengan demikian, sikap integritas sesuai narasi adalah dengan tetap bekerja melaksanakan tugas dan fungsi dengan sebaik mungkin, ikhlas, dan penuh tanggung jawab meskipun fasilitas kurang memadai."}, {"n": 28, "sec": "TWK", "t": "", "q": "Pasal 34 ayat 1 UUD 1945 berbunyi: <i>\"Fakir miskin dan anak-anak terlantar dipelihara oleh negara.\"</i> Nilai integritas yang terkandung dalam pasal tersebut adalah ....", "o": {"a": "Negara memiliki kepedulian yang tinggi dalam memberikan keadilan sosial terutama kepada anak-anak terlantar", "b": "Tanggung jawab seluruh warga negara terhadap kehidupan fakir miskin dan anak-anak terlantar", "c": "Negara berkewajiban memberikan bantuan sosial secara adil dan merata di berbagai daerah yang ada di Indonesia", "d": "Negara memiliki kewajiban moral dan hukum untuk melindungi dan memenuhi kebutuhan dasar warganya", "e": "Seluruh warga negara memiliki kewajiban dan tanggung jawab terhadap pemenuhan kebutuhan fakir miskin"}, "ans": "d", "ex": "Pasal 34 ayat 1 UUD 1945 menyatakan bahwa <i>\"Fakir miskin dan anak-anak terlantar dipelihara oleh negara.\"</i> Nilai integritas yang terkandung dalam pasal tersebut adalah <b>Negara memiliki kewajiban moral dan hukum untuk melindungi dan memenuhi kebutuhan dasar warganya</b>. Pasal ini menegaskan bahwa negara bertanggung jawab untuk memastikan kesejahteraan sosial bagi fakir miskin dan anak-anak terlantar, yang mencakup pemenuhan kebutuhan dasar mereka tanpa diskriminasi."}, {"n": 29, "sec": "TWK", "t": "", "q": "Pertikaian sering muncul di wilayah perbatasan antara negara-negara. Salah satunya adalah ketegangan antara Indonesia dan Malaysia yang akhirnya diputuskan oleh Mahkamah Internasional pada tahun 2002, menyebabkan Indonesia kehilangan hak atas wilayah yang mencakup pulau...", "o": {"a": "Sebatik dan Ligitan", "b": "Sipadan dan Ligitan", "c": "Ligitan dan Sepadan", "d": "Sipadan dan Sebatik", "e": "Sebatik dan Ligatan"}, "ans": "b", "ex": "Konflik antara Indonesia dan Malaysia yang diselesaikan oleh Mahkamah Internasional pada tahun 2002 mengakibatkan Indonesia kehilangan wilayah, yaitu pulau Sipadan dan Ligitan."}, {"n": 30, "sec": "TWK", "q": "Penulisan nama dan gelar yang benar adalah...", "o": {"a": "Ir. Bambang Sugiharto, M.B.A.", "b": "H. Ahmad Fauzan S.Pd.", "c": "Dr. Siti Maryam", "d": "M. Reza Anwar, S.Kom.", "e": "Budi Santoso, S.T., M.T."}, "ans": "d", "ex": "Penulisan gelar yang benar harus menggunakan tanda koma (,) dan titik (.) untuk gelar akademik."}, {"n": 31, "sec": "TIU", "q": "Semua penderita penyakit lambung tidak boleh memakan makanan yang pedas. Tono mengidap penyakit lambung. Kesimpulannya adalah", "o": {"a": "Tono boleh memakan makanan yang pedas", "b": "Tono tidak mengidap penyakit lambung", "c": "Tono suka memakan makanan yang tidak pedas", "d": "Tono tidak boleh memakan makanan yang manis", "e": "Tono tidak boleh memakan makanan yang pedas"}, "ans": "e", "ex": "Karena semua penderita penyakit lambung tidak boleh memakan makanan yang pedas dan Tono mengidap penyakit lambung, maka Tono tidak boleh memakan makanan yang pedas."}, {"n": 32, "sec": "TIU", "q": "Hana agak kurang tinggi dibandingkan Lina, Wati sama tingginya dengan Lina tetapi kalah tinggi dibandingkan Dina, sedangkan Dina lebih tinggi daripada Lina tetapi lebih rendah dibandingkan Rina yang lebih tinggi dibandingkan Anya. Yang paling pendek adalah...", "o": {"a": "Dina", "b": "Rina", "c": "Hana", "d": "Wati", "e": "Lina"}, "ans": "c", "ex": "Hana &lt; Lina = Wati &lt; Dina &lt; Rina &gt; Anya. Jadi, yang paling pendek adalah Hana."}, {"n": 33, "sec": "TIU", "t": "", "q": "1056, 552, 1122, 600, 1190, 650, 1260, ........ , ........", "o": {"a": "700, 1299", "b": "704, 1330", "c": "702, 1330", "d": "702, 1332", "e": "700, 1332"}, "ans": "d", "ex": "Deret angka diatas mempunyai dua pola bilangan, yaitu : Pola Pertama : 1056, 1122, 1190, 1260 ( +66, +68, +70), maka pola berikutnya +72 yaitu 1332 Pola Kedua : 552, 600, 650 (+48, +50), maka pola berikutnya +52, yaitu , diperoleh dari 650+52."}, {"n": 34, "sec": "TIU", "q": "5, 10, 20, …, 80", "o": {"a": "30", "b": "40", "c": "50", "d": "60", "e": "70"}, "ans": "b", "ex": "Pola adalah setiap bilangan dikali 2: 5, 10, 20, 40, 80."}, {"n": 35, "sec": "TIU", "t": "Perbandingan &amp; Soal Cerita", "q": "Sebuah tongkat dengan panjang 1,5 m berdiri tegak lurus dengan tanah. Panjang bayangan tongkat tersebut adalah 2,5 m. Pada waktu dan tempat yang sama, tinggi sebuah tiang yang panjang bayangannya 18 m adalah ....", "o": {"a": "10,53 m", "b": "35,00 m", "c": "10,80 m", "d": "12,50 m", "e": "30,00 m"}, "ans": "c", "ex": "| Benda | Panjang Benda | Panjang Bayangan | | :--- | :---: | :---: | | Tongkat | 1,5 m | 2,5 m | | Tiang | X m | 18 m | 1,5/X = 2,5/18 → 15/X = 25/18 → 3/X = 5/18 → 5X = 54 → X = 54/5 = 10,8 m"}, {"n": 36, "sec": "TIU", "q": "Diketahui lamanya belajar mandiri siswa sebanding dengan nilai ujian. Jika siswa dengan nilai ujian 80 melakukan belajar mandiri 10 jam/hari, maka lamanya belajar mandiri siswa dengan nilai 50 adalah", "o": {"a": "6,25 jam/hari", "b": "8 jam/hari", "c": "5 jam/hari", "d": "6 jam/hari", "e": "4 jam/hari"}, "ans": "a", "ex": "80 : 10 = 50 : x → x = 50 × 10 ÷ 80 = 6,25 jam/hari."}, {"n": 37, "sec": "TIU", "t": "Perbandingan", "q": "Sebuah toko selalu menjual barang dagangannya dengan mengambil keuntungan sebesar 20%.<br>A &nbsp;|&nbsp; B<br>Harga beli suatu barang di toko tersebut jika harga jualnya Rp360.000,00 &nbsp;|&nbsp; Rp288.000,00<br>Hubungan kuantitas A dan B yang tepat adalah ....", "o": {"a": "A &lt; B", "b": "A &gt; B", "c": "A = B", "d": "A = B + Rp72.000,00", "e": "Hubungan A dan B tidak bisa ditentukan"}, "ans": "b", "ex": "A = 100/100 + 20 × 360.000 = Rp300.000,00 B = Rp288.000,00 therefore A &gt; B"}, {"n": 38, "sec": "TIU", "t": "Perbandingan &amp; Soal Cerita", "q": "Budi merupakan seorang barista di sebuah warung kopi kekinian dengan menu minuman favorit kopi susu gula aren. Takaran kopi susu yang biasa ia gunakan untuk satu <i>cup</i> besar adalah 4 bagian kopi, 5 bagian susu, dan 2 bagian gula aren. Malam ini, Budi membuat kopi susu gula aren untuk sebuah <i>cup</i> kecil dengan mencampur 1/4 bagian susu. Takaran kopi dan gula aren agar kopi tersebut memiliki cita rasa yang sama dengan <i>cup</i> besar secara berurutan adalah ....", "o": {"a": "0,5 dan 0,25", "b": "0,4 dan 0,2", "c": "0,3 dan 0,15", "d": "0,2 dan 0,1", "e": "0,1 dan 0,05"}, "ans": "d", "ex": "Perbandingan Kopi : Susu : Gula Aren = 4 : 5 : 2 = x : 1/4 : y 4/x = 5/1/4 → 5x = 1 → x = 1/5 = 0,2 5/1/4 = 2/y → 5y = 1/2 → y = 1/10 = 0,1"}, {"n": 39, "sec": "TIU", "t": "Analogi", "q": "<i>Tim Ganjar-Mahfud dan Anies-Muhaimin membongkar kecurangan pemilu.</i><br>Kalimat yang berpolakan sama dengan pola tersebut adalah ....", "o": {"a": "Dewan Pengawas KPK menjatuhkan sanksi yang berat terhadap 90 pegawai yang melakukan pungli", "b": "Menteri Pertahanan itu mengungkapkan kegembiraannya memenangi pemilihan presiden dalam satu putaran kepada Tim Kampanye Nasional Prabowo-Gibran", "c": "KAI menghapus sebagian jadwal perjalanan Argo Parahyangan demi mengerek okupansi Whoosh", "d": "Presiden Joko Widodo tak kunjung mengajukan nama pengganti ketua KPK ke DPR", "e": "Kebakaran pabrik smelter nikel milik PT Indonesia Tsingshan Stainless Steel menelan banyak korban"}, "ans": "e", "ex": "- <b>Soal:</b> Tim Ganjar-Mahfud dan Anies-Muhaimin (S) membongkar (P) kecurangan pemilu (O) - <b>A)</b> Dewan Pengawas KPK (S) menjatuhkan (P) sanksi (O) yang berat (Pel) terhadap 90 pegawai yang melakukan pungli (K) - <b>B)</b> Menteri Pertahanan itu (S) mengungkapkan (P) kegembiraannya (O) memenangi pemilihan presiden dalam satu putaran (Pel) kepada Tim Kampanye Nasional Prabowo-Gibran (K) - <b>C)</b> KAI (S) menghapus (P) sebagian jadwal perjalanan Argo Parahyangan (O) demi mengerek okupansi Whoosh (K) - <b>D)</b> Presiden Joko Widodo (S) tak kunjung mengajukan (P) nama pengganti ketua KPK (O) ke DPR (K) - <b>E)</b> Kebakaran pabrik smelter nikel milik PT Indonesia Tsingshan Stainless Steel (S) menelan (P) banyak korban (O)"}, {"n": 40, "sec": "TIU", "t": "", "q": "Radi meminjam uang di bank untuk usahanya. Bank tersebut menerapkan sistem anuitas bulanan untuk pinjaman tersebut. Jika besaran anuitas Rp750.000,00 dan bunga periode ke-5 yang dibayar radi sebesar Rp515.000,00 maka besar angsuran periode ke-5 adalah?", "o": {"a": "Rp185.000", "b": "Rp415.000", "c": "Rp600.000", "d": "Rp515.000", "e": "Rp235.000"}, "ans": "e", "ex": "Anuitas adalah nilai konstan yang merupakan jumlah dari angsuran dan bunga. Jadi, anuitas pinjaman tersebut sebesar 750.000 - 515.000 = 235.000"}, {"n": 41, "sec": "TIU", "t": "Pola Barisan / Deret", "q": "10.080, ; 5.040, ; 1.680, ; 420, ; 84, ; …, ; …", "o": {"a": "14, ; 7", "b": "14, ; 2", "c": "21, ; 3", "d": "42, ; 6", "e": "42, ; 7"}, "ans": "b", "ex": "Pola pembagian berurutan (:2, :3, :4, :5, :6, :7): 10.080 xrightarrow{:2} 5.040 xrightarrow{:3} 1.680 xrightarrow{:4} 420 xrightarrow{:5} 84 xrightarrow{:6} mathbf{14} xrightarrow{:7} mathbf{2}"}, {"n": 42, "sec": "TIU", "q": "2400, 1200, 400, 100, 20, …", "o": {"a": "15", "b": "10", "c": "5", "d": "3,33", "e": "1"}, "ans": "d", "ex": "2400 ÷ 2 = 1200, ÷ 3 = 400, ÷ 4 = 100, ÷ 5 = 20, ÷ 6 ≈ 3,33."}, {"n": 43, "sec": "TIU", "t": "", "q": "-38, ..., -30, ..., ..., -18", "o": {"a": "-38, -30, -22", "b": "-34, -26, -22", "c": "-37, -28, -22", "d": "-34, -26, -24", "e": "-37, -26, -22"}, "ans": "b", "ex": "-Pola barisan diatas adalah pola bilangan aritmatika (adalah pola yang memiliki beda/jarak hitung selalu sama). Dimana setiap langkah selalu +4 -38, -34, -30,-26 , -22, -18"}, {"n": 44, "sec": "TIU", "t": "Perbandingan &amp; Soal Cerita", "q": "Keliling suatu persegi panjang 28 cm.<br>A &nbsp;|&nbsp; B<br>50 cm^2 &nbsp;|&nbsp; Luas persegi panjang tersebut jika panjangnya 2 cm lebih dari lebarnya<br>Hubungan kuantitas A dan B yang tepat adalah ....", "o": {"a": "A &gt; B", "b": "A &lt; B", "c": "A = B", "d": "A = B - 2", "e": "Hubungan A dan B tidak dapat ditentukan"}, "ans": "a", "ex": "P = L + 2 K = 2(P + L) Rightarrow 28 = 2(L + 2 + L) Rightarrow 14 = 2L + 2 Rightarrow 12 = 2L Rightarrow L = 6 cm Maka P = 6 + 2 = 8 cm, sehingga B = P × L = 8 × 6 = 48 cm^2. therefore A &gt; B"}, {"n": 45, "sec": "TIU", "t": "Silogisme", "q": "Jika banyak warga di suatu negara melakukan protes kepada Badan Pengawas Pemilu, maka proses pemilu di negara tersebut telah mengalami kecurangan. Jika kecurangan terjadi pada pemilu, maka sistem demokrasi di negara tersebut sedang tidak baik-baik saja. Hingga saat ini, sistem demokrasi di negara tersebut dalam kondisi sangat baik. Simpulan yang tepat adalah ....", "o": {"a": "Kecurangan berupa penggelembungan suara pemilu tidak berhasil dibuktikan oleh siapa pun", "b": "Warga di negara tersebut tidak melakukan protes kepada Badan Pengawas Pemilu", "c": "Proses pemilu di negara tersebut berasas langsung, umum, bebas, rahasia, jujur, dan adil", "d": "Ada warga di negara tersebut yang melakukan protes kepada Badan Pengawas Pemilu", "e": "Negara tersebut tidak menerapkan sistem dinasti yang haus kekuasaan"}, "ans": "b", "ex": "- Premis 1: p → q (Jika warga protes ke Bawaslu, maka pemilu curang) - Premis 2: q → r (Jika pemilu curang, maka sistem demokrasi tidak baik-baik saja) - Premis 3: sim r (Sistem demokrasi dalam kondisi sangat baik) Dengan menerapkan silogisme dan Modus Tollens, disimpulkan sim p: <b>Warga di negara tersebut tidak melakukan protes kepada Badan Pengawas Pemilu.</b>"}, {"n": 46, "sec": "TIU", "t": "", "q": "Kakek Ara meninggal saat Ara berusia 4 tahun. Saat itu usia Ibu Ara setengah dari usia kakeknya. Sementara saat ini, usia Ara adalah setengah dari usia ibunya. Jika kakek Ara meninggal di usia 60 tahun, sudah berapa tahun kakek Ara meninggal dunia.", "o": {"a": "12 tahun", "b": "14 tahun", "c": "16 tahun . d. 20 tahun", "e": "22 tahun"}, "ans": "e", "ex": ""}, {"n": 47, "sec": "TIU", "t": "Hitung Cepat", "q": "9,125 - 3 1/8 + 4 1/4 × 1/17 : 1/2 = …", "o": {"a": "7", "b": "8", "c": "9", "d": "10", "e": "11"}, "ans": "a", "ex": "9,125 - 3 1/8 + 4 1/4 × 1/17 : 1/2 = 9,125 - 3,125 + 17/4 × 2/17 × 2/1 = 6 + 1 = 7"}, {"n": 48, "sec": "TIU", "t": "Analogi", "q": "Negara-negara Arab dikenal dengan minyaknya. Hubungan objek-objek yang setara dengan kalimat tersebut adalah ....", "o": {"a": "Negara-negara Afrika dikenal dengan satwa liarnya", "b": "Negara-negara Asia Tenggara dikenal dengan rempah-rempahnya", "c": "Negara-negara Amerika Latin dikenal dengan karnavalnya", "d": "Negara-negara Eropa Timur dikenal dengan sejarah komunisnya", "e": "Negara-negara Skandinavia dikenal dengan kesejahteraan sosialnya"}, "ans": "e", "ex": "Negara-negara Skandinavia (Swedia, Norwegia, Denmark, Finlandia, dan Islandia) sering menduduki peringkat teratas dalam laporan indeks kebahagiaan dunia, yang menunjukkan bahwa warganya memiliki kualitas hidup yang tinggi. Ini mencerminkan kesejahteraan sosial yang baik dan sistem yang mendukung kehidupan masyarakat."}, {"n": 49, "sec": "TIU", "t": "", "q": "Omset penjualan buku fiksi bulan ini turun 30% dibanding bulan lalu. Sedangkan penjualan buku nonfiksi naik sebesar 20%. Ini bukan berita baik karena buku fiksi memberikan keuntungan 10% sementara buku nonfiksi hanya 5%. Jika omset penjualan bulan lalu untuk buku fiksi adalah Rp 6.600.000 dan buku non fiksi Rp 3.200.000,- berapa total keuntungan bulan ini.", "o": {"a": "453.000", "b": "542.000", "c": "654.000", "d": "753.000", "e": "823.000"}, "ans": "c", "ex": "● Keuntungan bulan ini ; =[[70% x 6.600.000] x 10%] + [[120% x 3.200.000] x 5%] = 462.000 + 192.000 = 654.000"}, {"n": 50, "sec": "TIU", "q": "9600, 4800, 1600, 400, 80, …", "o": {"a": "10", "b": "12", "c": "13,33", "d": "15", "e": "20"}, "ans": "c", "ex": "9600 ÷ 2, ÷ 3, ÷ 4, ÷ 5, lalu ÷ 6: 80 ÷ 6 ≈ 13,33."}, {"n": 51, "sec": "TIU", "t": "", "q": "Distributor telur omega mengeluarkan modal untuk dua kuintal telur ayam seharga Rp1.360.000. Dengan adanya isu telur busuk yang beredar dipasaran yang beredar di pasaran, harga jual telur adalah Rp6.000 per kg. Saat ini penjual hanya mampu terjual ¾ - nya saja. Berapa kerugian yang ditanggung penjual?", "o": {"a": "Rp180.000", "b": "Rp480.000", "c": "Rp840.000", "d": "Rp120.000", "e": "Rp932.000"}, "ans": "d", "ex": "Harga beli = ¾ × Rp 1.360.000 = Rp 1.020.000 Harga jual = ¾ × 200 kg × Rp 6.000 = Rp 900.000 Kerugian = Rp 1.020.000 – Rp 900.000 = Rp 120.000"}, {"n": 52, "sec": "TIU", "t": "", "q": "1016, 1000, 2032, 1250, ..., 1500, 8128, ...", "o": {"a": "4064, 1750", "b": "4054, 1850", "c": "4064, 1850", "d": "4054, 1750", "e": "4444, 1780"}, "ans": "a", "ex": "Deret diatas merupakan deret dengan dua pola : Pola Pertama : 1016, 2032, ..., 8128 yaitu deret yang diperoleh dari tiap suku dikali 2, artinya kita akan memperoleh 20324x2 = 4064 Pola kedua : 1000, 1250, 1500, …. yaitu deret yang diperoleh dari tiap suku ditambah 250 artinya kita akan memperoleh 1500+250 = 1750."}, {"n": 53, "sec": "TIU", "t": "Hitungan Dasar", "q": "Hasil dari sqrt[3]{343} + 4 2/3 × 3/4 : 87,5% = …", "o": {"a": "8", "b": "9", "c": "10", "d": "11", "e": "12"}, "ans": "d", "ex": "sqrt[3]{343} + 4 2/3 × 3/4 : 87,5% = 7 + 14/3 × 3/4 : 7/8 = 7 + 14/3 × 3/4 × 8/7 = 7 + 4 = 11"}, {"n": 54, "sec": "TIU", "q": "Semua siswa harus hadir. Sebagian siswa terlambat. Kesimpulannya...", "o": {"a": "Semua siswa tidak hadir", "b": "Semua siswa terlambat", "c": "Sebagian siswa tidak hadir", "d": "Sebagian siswa hadir dan terlambat", "e": "Semua siswa hadir dan tidak terlambat"}, "ans": "d", "ex": "Kesimpulannya adalah sebagian siswa hadir dan terlambat."}, {"n": 55, "sec": "TIU", "q": "4, 8, 16, 32, …, 128", "o": {"a": "40", "b": "48", "c": "64", "d": "80", "e": "100"}, "ans": "c", "ex": "Pola adalah setiap bilangan dikali 2: 4, 8, 16, 32, 64, 128."}, {"n": 56, "sec": "TIU", "q": "9, 18, 27, 36, …, 54", "o": {"a": "40", "b": "42", "c": "45", "d": "48", "e": "50"}, "ans": "c", "ex": "Pola adalah setiap bilangan bertambah dengan 9: 9, 18, 27, 36, 45, 54."}, {"n": 57, "sec": "TIU", "t": "Analitis", "q": "Rute perjalanan searah kereta api sebagai berikut:<br>1. Dari A bisa ke B dan C<br>2. Dari B bisa ke D dan E<br>3. Dari C bisa ke D dan F<br>4. Dari D bisa ke A, B, dan F<br>5. Dari E hanya bisa ke G<br>6. Dari F bisa ke C dan G<br>7. Dari G bisa ke D dan F<br>Pernyataan berikut yang tepat adalah ....", "o": {"a": "Untuk bergerak dari A menuju E memiliki 2 jalur", "b": "Untuk bergerak dari B menuju G memiliki 2 jalur", "c": "Untuk bergerak dari G menuju A memiliki 2 jalur", "d": "Untuk bergerak dari C menuju G memiliki 2 jalur", "e": "Untuk bergerak dari B menuju F memiliki 2 jalur"}, "ans": "c", "ex": "Setelah menggambar alur secara lengkap, terlihat bahwa untuk bergerak dari G menuju A memiliki 2 jalur, yaitu G - D - A dan G - F - C - D - A. Perhatikan juga dalam kasus ini, perjalanan atau rute hanya searah, artinya jika bisa dari A ke B, maka belum tentu bisa dari B ke A."}, {"n": 58, "sec": "TIU", "t": "Perbandingan", "q": "Budi mengendarai mobil dengan kecepatan rata-rata 80 km/jam dan membutuhkan 4 liter bahan bakar untuk menempuh jarak 40 km.<br>P &nbsp;|&nbsp; Q<br>Bahan bakar yang dibutuhkan oleh Budi jika ia menggunakan mobil dengan kecepatan rata-rata yang sama hingga menempuh jarak 60 km. &nbsp;|&nbsp; 6,5 liter bahan bakar<br>Hubungan kuantitas P dan Q yang tepat adalah ....", "o": {"a": "P = Q - 0,5 liter", "b": "P = Q - 1 liter", "c": "P = Q", "d": "P = Q + 1 liter", "e": "P = Q + 0,5 liter"}, "ans": "a", "ex": "40 km → 4 liter 60 km → P liter (Perbandingan senilai) 40/60 = 4/P → 4/6 = 4/P → 1/6 = 1/P → P = 6 therefore P = Q - 0,5 liter"}, {"n": 59, "sec": "TIU", "q": "K, L, L, M, N, N, O, P, P, ..., ...", "o": {"a": "Q dan Q", "b": "Q dan R", "c": "R dan Q", "d": "R dan R", "e": "S dan S"}, "ans": "b", "ex": "Pola: K, L L, M, N N, O, P P, lalu Q, R R. Dua huruf berikutnya adalah Q dan R."}, {"n": 60, "sec": "TIU", "t": "Analitis", "q": "Andi sedang mempersiapkan acara ulang tahunnya dengan urutan berikut:<br>1. Andi harus membeli kue ulang tahun sebelum menghias ruangan<br>2. Andi hanya akan meniup lilin jika kue sudah diletakkan di atas meja<br>3. Andi akan membagikan undangan setelah ruangan selesai dihias, tetapi sebelum membeli kado untuk teman-temannya<br>Jika kado untuk teman-teman dibeli sebelum kue diletakkan di atas meja, maka ....", "o": {"a": "Yang dilakukan kedua adalah membeli kado", "b": "Yang dilakukan ketiga adalah menghias ruangan", "c": "Yang dilakukan kelima adalah meniup lilin", "d": "Yang dilakukan ketiga adalah membagikan undangan", "e": "Yang dilakukan keempat adalah meletakkan kue di atas meja"}, "ans": "d", "ex": "Urutan mempersiapkan acara ulang tahun Andi adalah sebagai berikut: 1. Membeli kue 2. Menghias ruangan 3. Membagikan undangan 4. Membeli kado 5. Meletakkan kue di atas meja 6. Meniup lilin"}, {"n": 61, "sec": "TIU", "q": "0,4 × {(6 1/3 × 12) - (100 : 2 2/3 )} =", "o": {"a": "4,8", "b": "5,6", "c": "15,4", "d": "7,2", "e": "6,8"}, "ans": "c", "ex": "(19/3 × 12) − (100 ÷ 8/3) = 76 − 37,5 = 38,5; × 0,4 = 15,4."}, {"n": 62, "sec": "TIU", "t": "", "q": "Teleskop : Astronomer = Palet : ….", "o": {"a": "Pembaca", "b": "Pelukis", "c": "Pasien", "d": "Tentara", "e": "Pengrajin"}, "ans": "b", "ex": "Teleskop digunakan oleh astronomer Palet digunakan oleh pelukis."}, {"n": 63, "sec": "TIU", "t": "Perbandingan", "q": "Perhatikan tabel berikut!<br>X &nbsp;|&nbsp; Y<br>- 3/7 + 4 × 5 + 1 3/7 &nbsp;|&nbsp; 17 + 6 : ( 1/5 - 4/5 )<br>Hubungan kuantitas X dan Y yang tepat adalah ....", "o": {"a": "X = Y", "b": "X = 2Y", "c": "X = 3Y", "d": "Y = 2X", "e": "Y = 3X"}, "ans": "c", "ex": "X = - 3/7 + 4 × 5 + 1 3/7 = 1 3/7 - 3/7 + 4 × 5 = 1 + 20 = 21 Y = 17 + 6 : ( 1/5 - 4/5 ) = 17 + 6 : (- 3/5 ) = 17 + 6 × (- 5/3 ) = 17 - 10 = 7 therefore X/Y = 21/7 → X/Y = 3/1 → X = 3Y"}, {"n": 64, "sec": "TIU", "t": "", "q": "Jika A adalah suatu kejadian dan P(A) adalah peluang terjadinya A, maka besarnya frekuensi harapan kejadian A dalam n kali percobaan dirumuskan...", "o": {"a": "F= P(A) x n", "b": "F= P(A) x n-1", "c": "F= P(A) / n", "d": "F= n / P(A)", "e": "F= P(A) + n"}, "ans": "a", "ex": "Percobaan dapat dirumuskan menjadi F= P(A) x n"}, {"n": 65, "sec": "TIU", "t": "Analitis", "q": "Dalam suatu ujian <i>tryout</i> SKD, nilai Reva lebih tinggi daripada Rafi. Nilai Rasya lebih tinggi daripada Reva. Ridho mendapat nilai lebih rendah dibandingkan dengan Reva, tetapi lebih tinggi daripada Rafi. Rusli mendapat nilai tertinggi. Jika ada siswa tambahan, yaitu Romi dan nilainya di antara Reva dan Ridho, maka siswa yang menempati urutan tertinggi keempat adalah ....", "o": {"a": "Romi", "b": "Reva", "c": "Rafi", "d": "Rasya", "e": "Ridho"}, "ans": "a", "ex": "Urutannya dari tertinggi ke terendah: (1) Rusli &gt; (2) Rasya &gt; (3) Reva &gt; (4) Romi &gt; (5) Ridho &gt; (6) Rafi Jadi, urutan tertinggi keempat adalah <b>Romi</b>."}, {"n": 66, "sec": "TKP", "t": "", "q": "Serangan siber mengakibatkan tim saya kehilangan hasil pekerjaan yang dalam waktu dekat harus segera diserahkan kepada klien. Menghadapi kondisi darurat ini yang harus kami lakukan adalah;", "o": {"a": "Membangun kekompakan dan bersama mengerjakan kembali pekerjaan yang hilang.", "b": "Mencari pelaku serangan siber.", "c": "Meminta maaf kepada klien dan memintanya memaklumi keadaan kami.", "d": "Tetap tenang dan pelan-pelan memperbaiki pekerjaan yang hilang.", "e": "Melaporkan serangan siber kepada aparat penegak hukum."}, "ans": "a", "ex": "Langkah ini paling penting untuk mendapatkan kembali hasil pekerjaan dengan cepat. Kekompakan tim dapat meningkatkan efisiensi dan memungkinkan pemulihan yang lebih cepat.", "sc": {"a": 5, "b": 1, "c": 2, "d": 4, "e": 3}}, {"n": 67, "sec": "TKP", "t": "Profesionalisme", "q": "Seorang pengacara yang bekerja di sebuah firma hukum ternama mendapati bahwa kliennya, seorang pebisnis sukses, telah memberikan kesaksian palsu dalam persidangan yang melibatkan sengketa bisnis. Pengacara tahu bahwa kesaksian palsu tersebut dapat membantu klien memenangkan kasus. Namun, hal tersebut akan melanggar etika profesi hukum. Sikap pengacara tersebut seharusnya adalah ....", "o": {"a": "Membimbing klien untuk terus mempertahankan kesaksian palsu demi keuntungan hukum dan kesuksesan kasus", "b": "Menarik diri dari perwakilan klien dan memberi tahu kantor hukum tentang alasan pengunduran diri karena tidak ingin melanggar kode etik", "c": "Menyampaikan kesaksian palsu kepada pengadilan tanpa memberi tahu klien tentang konsekuensinya", "d": "Mengajukan permohonan kepada pengadilan untuk menarik kembali kesaksian klien tersebut karena berkaitan dengan kode etik yang harus dipatuhi bersama", "e": "Memberi tahu klien tentang ketidakpatuhan etika dan merencanakan strategi hukum yang lebih jujur untuk mempertahankan kasus"}, "ans": "e", "ex": "Sebagai seorang pengacara, menjaga integritas profesi dan kejujuran dalam persidangan sangat penting. Oleh karena itu, opsi E merupakan langkah yang paling etis dan solutif.", "sc": {"a": 1, "b": 4, "c": 2, "d": 3, "e": 5}}, {"n": 68, "sec": "TKP", "t": "Profesionalisme", "q": "Seorang pegawai negeri sipil (PNS) mendapatkan kesempatan mengikuti program studi lanjut dengan biaya ditanggung negara. Namun, PNS tersebut diwajibkan untuk menandatangani perjanjian yang menyatakan bahwa selama masa studi, ia tidak akan menerima tunjangan kinerja. Sikap yang paling tepat adalah ....", "o": {"a": "Menerima penugasan dan fokus pada studi, sambil mencari informasi mengenai peluang beasiswa tambahan", "b": "Menerima penugasan dan fokus pada studi, serta aktif berpartisipasi dalam kegiatan akademik", "c": "Menolak penugasan studi lanjut karena merasa dirugikan dengan pemotongan tunjangan", "d": "Menerima penugasan dan berusaha mencari pekerjaan sampingan untuk menambah penghasilan", "e": "Menerima penugasan dan fokus pada studi, namun secara diam-diam tetap melakukan pekerjaan tambahan"}, "ans": "b", "ex": "Dengan fokus pada studi dan aktif berpartisipasi dalam kegiatan akademik, PNS tersebut tidak hanya meningkatkan kompetensinya, tetapi juga menunjukkan dedikasi terhadap tugas dan tanggung jawabnya.", "sc": {"a": 4, "b": 5, "c": 1, "d": 2, "e": 3}}, {"n": 69, "sec": "TKP", "t": "Sosial Budaya", "q": "Di sebuah kompleks perumahan, terjadi konflik antara warga yang memelihara anjing dengan warga yang memiliki keyakinan tertentu yang mengharamkan keberadaan anjing di dalam rumah. Beberapa warga mengusulkan agar diadakan peraturan tertulis mengenai pemeliharaan hewan peliharaan. Sikap Andi sebagai ketua RT adalah ....", "o": {"a": "Menolak usulan tersebut karena terlalu membatasi hak individu untuk memelihara hewan peliharaan", "b": "Menerima usulan tersebut dan segera membuat peraturan yang tegas", "c": "Menerima usulan tersebut dan membentuk tim kecil untuk merumuskan peraturan yang mengakomodasi semua kepentingan", "d": "Menunda pengambilan keputusan hingga menemukan solusi yang memuaskan semua pihak", "e": "Menyerahkan sepenuhnya [kepada pihak yang] berwenang karena [masalah tersebut] sulit untuk diselesaikan di tingkat RT"}, "ans": "c", "ex": "Membentuk tim kecil merupakan langkah yang tepat karena melibatkan partisipasi warga dalam mencari solusi. Namun, perlu diperhatikan agar tim kecil yang dibentuk benar-benar representatif dari semua kelompok warga.", "sc": {"a": 2, "b": 3, "c": 5, "d": 4, "e": 1}}, {"n": 70, "sec": "TKP", "t": "Profesionalisme", "q": "Anda merupakan seorang manajer di sebuah perusahaan teknologi yang sedang mempersiapkan acara <i>gala dinner</i> untuk merayakan pencapaian besar. Anda telah memesan pakaian khusus untuk acara tersebut. Akan tetapi saat pengambilan pakaian, pihak penjahit memberi tahu bahwa ada keterlambatan dan pakaian tersebut tidak selesai terjahit tepat waktu. Anda pun menyadari bahwa acara <i>gala dinner</i> tidak dapat ditunda dan Anda wajib hadir dengan pakaian khusus. Sikap Anda adalah ....", "o": {"a": "Meminta salah seorang karyawan di tim Anda untuk berkorban memberikan baju khususnya kepada Anda dan Anda memberinya sedikit kompensasi", "b": "Melaporkan keterlambatan penjahit kepada atasan dan meminta solusi dari atasan Anda", "c": "Mengenakan pakaian formal lain yang Anda miliki untuk menggantikan pakaian khusus tersebut", "d": "Meminta rekan kerja dengan ukuran serupa untuk meminjamkan pakaian khusus mereka", "e": "Menunda kehadiran Anda di acara tersebut sampai pakaian khusus Anda selesai dijahit"}, "ans": "d", "ex": "Opsi D mencerminkan sikap fleksibel dan kemampuan mencari solusi cepat dengan memanfaatkan sumber daya yang tersedia di sekitar Anda tanpa merugikan bawahan.", "sc": {"a": 4, "b": 1, "c": 3, "d": 5, "e": 2}}, {"n": 71, "sec": "TKP", "t": "Teknologi Informasi dan Komunikasi", "q": "Anda adalah seorang teknisi IT di sebuah rumah sakit. Saat melakukan pemeliharaan server, Anda menemukan sebuah file yang berisi data pasien yang seharusnya bersifat rahasia. Sikap Anda adalah ....", "o": {"a": "Menyalin file tersebut ke perangkat pribadi untuk dianalisis lebih lanjut", "b": "Memberitahu dokter yang bertanggung jawab atas pasien tersebut", "c": "Segera menghapus file tersebut dari server untuk melindungi kerahasiaan data pasien", "d": "Melaporkan temuan tersebut kepada kepala departemen IT dan tim keamanan informasi", "e": "Menyalin data tersebut ke folder khusus, meng snya adalah ....", "o": {"a": "Menunggu pelanggan tersebut sampai di meja pelayanan dan melayaninya dengan cepat agar bisa segera pulang", "b": "Segera mendekati pelanggan lansia tersebut untuk membantunya membawa tas dan memberikan tempat duduk", "c": "Menanyakan apakah pelanggan lansia tersebut membutuhkan bantuan tambahan sebelum dilayani", "d": "Memanggil satpam agar membantu pelanggan lansia tersebut untuk mengantarkannya ke meja pelayanan", "e": "Meminta pelanggan lain untuk lebih bersabar menunggu giliran mengingat kondisi lansia tersebut"}, "ans": "b", "ex": "Sebagai petugas, Ali seharusnya proaktif membantu pelanggan yang membutuhkan, terutama yang memiliki keterbatasan fisik. Dengan cara ini, Ali menunjukkan kepedulian dan memberikan pelayanan prima.", "sc": {"a": 2, "b": 5, "c": 4, "d": 3, "e": 1}}, {"n": 89, "sec": "TKP", "t": "Sosial Budaya", "q": "Musyawarah desa diadakan untuk membahas pembangunan jalan desa. Pak Ahmad menyuarakan pendapat agar pembangunan jalan didahulukan daripada pembangunan gedung pertemuan desa. Namun, Pak Budi berpendapat sebaliknya. Perdebatan semakin memanas ketika mereka saling mempertahankan pendapatnya. Sikap Pak Ahmad seharusnya adalah ....", "o": {"a": "Mendesak agar usulannya tentang pembangunan jalan disetujui karena dianggap lebih mendesak", "b": "Menghentikan perdebatan dan meminta keputusan akhir diserahkan kepada kepala desa", "c": "Menjelaskan secara rasional alasan mengapa pembangunan jalan lebih prioritas, disertai data dan fakta yang relevan", "d": "Mengucapkan bahwa setiap pendapat berhak untuk didengar, namun tetap mempertahankan pendapat awalnya", "e": "Meminta maaf kepada warga desa karena telah menimbulkan perdebatan yang tidak perlu"}, "ans": "c", "ex": "Kita harus mampu meyakinkan orang lain dengan argumen yang logis dan data yang akurat.", "sc": {"a": 1, "b": 3, "c": 5, "d": 4, "e": 2}}, {"n": 90, "sec": "TKP", "t": "Sosial Budaya", "q": "Sebuah universitas di Negara A merencanakan pertukaran mahasiswa d  "b", "ex": "Opsi B (audit keamanan dan pembaruan/patching perangkat lunak yang rentan) tepat dalam upaya mengatasi masalah keamanan data secara komprehensif.", "sc": {"a": 1, "b": 5, "c": 3, "d": 4, "e": 2}}, {"n": 92, "sec": "TKP", "t": "Sosial Budaya", "q": "Sebuah universitas ingin menyelenggarakan Acara Budaya Internasional untuk merayakan keberagaman di antara mahasiswa-mahasiswanya yang berasal dari mancanegara. Namun, pihak universitas menyadari adanya perbedaan budaya dan kepercayaan di antara mahasiswa. Tindakan yang sebaiknya dilakukan oleh pihak universitas adalah ....", "o": {"a": "Menunda acara untuk sementara sebagai upaya menghindari potensi konflik budaya antarmahasiswa di universitas tersebut", "b": "Tetap menyelenggarakan acara sebagaimana jadwal yang telah direncanakan dan berharap seluruh mahasiswa dan sivitas akademika dapat berhadir", "c": "Menggunakan acara untuk mengenalkan kebudayaan mayoritas kepada mahasiswa dengan latar belakang budaya yang berbeda", "d": "Mengadakan acara terpisah untuk memperingati setiap kebudayaan yang ada di universitas tersebut agar potensi konflik terkendali", "e": "Mengadakan pertemuan dengan perwakilan mahasiswa untuk mendiskusikan dan memperhatikan keberagaman budaya dalam perencanaan acara"}, "ans": "e", "ex": "Universitas dapat menciptakan acara internasional yang sukses dengan mempertimbangkan perbedaan budaya di antara mahasiswa. Salah satu pendekatan yang baik adalah mengadakan pertemuan dengan perwakilan mahasiswa untuk mendiskusikan dan memperhatikan keberagaman budaya dalam perencanaan acara. Hal ini dapat membantu universitas mengakomodasi berbagai kebutuhan dan preferensi budaya mahasiswa.", "sc": {"a": 2, "b": 3, "c": 1, "d": 4, "e": 5}}, {"n": 93, "sec": "TKP", "t": "", "q": "Pak Joko, kepala desa di sebuah desa yang terletak di pegunungan, ingin meningkatkan kesadaran lingkungan di komunitasnya. Dia merencanakan kegiatan pembersihan sungai dan penanaman pohon bersama warga desa. Namun, beberapa war akan sangat bermanfaat bagi karier Anda", "b": "Meminta bantuan dokter senior untuk menangani pasien tersebut sementara Anda mengikuti konferensi", "c": "Menunda konferensi dan fokus pada penanganan pasien terlebih dahulu", "d": "Mencoba mencari solusi kompromi, misalnya mengikuti sebagian sesi konferensi secara daring", "e": "Meminta rumah sakit untuk mencarikan dokter spesialis dari luar untuk menangani pasien tersebut"}, "ans": "d", "ex": "Dengan mengikuti sebagian sesi konferensi secara daring, Anda masih bisa mendapatkan manfaat dari konferensi tanpa mengabaikan tanggung jawab sebagai dokter.", "sc": {"a": 1, "b": 2, "c": 4, "d": 5, "e": 3}}, {"n": 97, "sec": "TKP", "t": "", "q": "Anda bekerja sebagai administrator jaringan di sebuah perguruan tinggi yang memiliki banyak siswa, dosen, dan staf. Sistem manajemen pembelajaran daring (LMS) di perguruan tinggi tersebut mengalami peningkatan penggunaan yang signifikan. Beberapa mahasiswa melaporkan kesulitan mengakses materi pembelajaran secara daring. Tindakan pertama yang akan Anda ambil sebagai administrator jaringan adalah...", "o": {"a": "Mengirim pemberitahuan umum kepada seluruh pengguna LMS untuk memberitahu mereka bahwa sedang terjadi masalah dan memberikan perkiraan waktu pemulihan.", "b": "Memeriksa log server LMS untuk mengidentifikasi akar penyebab masalah dan mencoba memperbaikinya secepat mungkin.", "c": "Membuat salinan cadangan dari materi pembelajaran online yang terdampak dan memberikan akses alternatif untuk mahasiswa.", "d": "Menyelenggarakan sesi pelatihan online bagi pengguna LMS untuk membantu mereka mengatasi masalah teknis secara mandiri.", "e": "Menghubungi penyedia layanan LMS untuk mendapatkan dukungan teknis dan mempercepat pemulihan sistem secara menyeluruh."}, "ans": "b", "ex": "", "sc": {"a": 1, "b": 5, "c": 2, "d": 3, "e": 4}}, {"n": 98, "sec": "TKP", "t": "Anti-Radikalisme", "q": "Di sebuah komunitas <i>online</i> yang Anda ikuti, muncul diskusi hangat mengenai kebijakan pemerintah terkait pembatasan aktivitas keagamaan tertentu. Bambang, rekan Anda, mulai menyebarkan pandangan yang mengkritik keras kebijakan tersebut. Ia bahkan menyerukan agar semua anggota komunitas ikut serta dalam aksi unjuk rasa besar-besaran. Sikap Anda adalah ....", "o": {"a": "Mengajak Bambang untuk berdiskusi secara lebih mendalam mengenai dampak positif dan negatif dari kebijakan tersebut", "b": "Menyampaikan pendapat Anda secara terbuka di komunitas <i>online</i> bahwa aksi unjuk rasa bukanlah solusi yang tepat", "c": "Menyetujui ajakannya karena pembatasan aktivitas keagamaan merupakan bentuk pelanggaran hak asasi manusia", "d": "Mengikuti aksi unjuk rasa tersebut secara diam-diam agar tidak diketahui oleh orang lain", "e": "Menghindari diskusi mengenai topik tersebut agar tidak terjadi perpecahan di dalam komunitas"}, "ans": "a", "ex": "Opsi A mengajak berdiskusi secara mendalam untuk memahami pandangan lain sambil mencari solusi yang lebih tepat, tanpa langsung menyetujui atau menolak ajakan tersebut.", "sc": {"a": 5, "b": 4, "c": 2, "d": 1, "e": 3}}, {"n": 99, "sec": "TKP", "t": "Sosial Budaya", "q": "Anda diundang untuk menghadiri pertemuan bisnis internasional. Dalam acara tersebut, para peserta diminta untuk mengenakan pakaian tradisional negara masing-masing. Namun, Anda merasa tidak percaya diri mengenakan pakaian tradisional karena khawatir tidak sesuai dengan suasana formal acara. Sikap Anda adalah ....", "o": {"a": "Meneliti lebih dalam tentang sejarah dan simbolisme pakaian tradisional yang akan dikenakan untuk meningkatkan pemahaman dan rasa percaya diri", "b": "Memilih mengenakan setelan formal internasional yang lebih umum daripada harus mengenakan pakaian tradisional negara masing-masing", "c": "Mengusulkan kepada panitia untuk mengenakan pakaian modern dengan elemen tradisional demi menjaga keseimbangan antara formalitas dan budaya", "d": "Meminta izin kepada perusahaan untuk mengenakan pakaian yang lebih formal sesuai dengan standar internasional", "e": "Mengenakan pakaian tradisional, tetapi dengan sedikit modifikasi agar terlihat lebih modern dan sesuai dengan acara"}, "ans": "a", "ex": "Dengan memahami nilai budaya dan sejarah, Anda dapat merasa lebih percaya diri dan bangga mengenakan pakaian tersebut, sekaligus menunjukkan penghormatan terhadap budaya Anda.", "sc": {"a": 5, "b": 1, "c": 3, "d": 2, "e": 4}}, {"n": 100, "sec": "TKP", "t": "Jejaring Kerja", "q": "Sebuah tim proyek terdiri dari tiga orang, yaitu seorang desainer grafis, seorang programmer, dan seorang penulis konten. Mereka sering berdebat mengenai konsep desain, fungsionalitas aplikasi, dan pemilihan kata yang tepat. Langkah tim seharusnya adalah ....", "o": {"a": "Mengadakan voting untuk menentukan keputusan akhir pada setiap masalah yang muncul", "b": "Menunjuk salah satu anggota tim sebagai pemimpin untuk mengambil keputusan final", "c": "Membentuk kelompok kerja kecil untuk membahas setiap masalah secara terpisah dan kemudian menyatukan hasil diskusi", "d": "Mengadakan sesi <i>brainstorming</i> secara rutin untuk menghasilkan ide-ide baru dan solusi inovatif", "e": "Mengundang seorang fasilitator eksternal untuk membantu tim mengelola konflik dan meningkatkan kerja sama"}, "ans": "e", "ex": "Harus ada edukasi atau pembinaan tim dalam mengelola konflik dan kerja sama.", "sc": {"a": 1, "b": 2, "c": 3, "d": 4, "e": 5}}, {"n": 101, "sec": "TKP", "t": "Profesionalisme", "q": "Sebuah desa di daerah pegunungan sedang mengalami krisis air bersih akibat penebangan hutan yang terus-menerus. Tindakan Anda sebagai lurah adalah ....", "o": {"a": "Membangun bendungan besar untuk menampung air hujan", "b": "Meminta pemerintah untuk menyediakan pasokan air bersih dari daerah lain", "c": "Melakukan reboisasi dan menggalakkan penggunaan teknologi hemat air", "d": "[Memindahkan warga ke] daerah yang memiliki sumber air yang lebih memadai", "e": "[Menindak pihak yang] melakukan penebangan hutan dan menuntut ganti [rugi]"}, "ans": "c", "ex": "Reboisasi adalah solusi jangka panjang yang efektif untuk menjaga kelestarian hutan dan ketersediaan air. Penggunaan teknologi hemat air juga membantu mengurangi konsumsi air.", "sc": {"a": 4, "b": 3, "c": 5, "d": 1, "e": 2}}, {"n": 102, "sec": "TKP", "t": "Sosial Budaya", "q": "Seorang kepala departemen di sebuah perusahaan memiliki tim yang terdiri dari anggota dengan beragam latar belakang budaya. Upaya kepala departemen tersebut dalam memastikan terciptanya lingkungan kerja inklusif dan kolaboratif di antara anggota tim adalah ....", "o": {"a": "Mengharuskan semua anggota tim untuk mengikuti norma dan kebiasaan mayoritas tanpa memperhatikan perbedaan budaya mereka sendiri", "b": "Menyelenggarakan acara-acara sosial yang menghargai dan merayakan berbagai budaya yang ada di dalam tim", "c": "Menghindari topik atau kebijakan yang berkaitan dengan keberagaman budaya agar tidak menimbulkan konflik yang lebih jauh", "d": "Memilih hanya anggota tim dengan latar belakang budaya yang serupa untuk meminimalkan perbedaan", "e": "Mengabaikan perbedaan budaya dan fokus pada pencapaian tujuan tugas tanpa memperhatikan keberagaman tim"}, "ans": "b", "ex": "Untuk menciptakan lingkungan kerja inklusif dan kolaboratif di antara tim dengan beragam latar belakang budaya, kepala departemen sebaiknya menyelenggarakan acara-acara sosial yang menghargai dan merayakan berbagai budaya yang ada di dalam tim. Ini membantu membangun rasa saling pengertian dan kerja sama di antara anggota tim.", "sc": {"a": 1, "b": 5, "c": 2, "d": 1, "e": 3}}, {"n": 103, "sec": "TKP", "t": "", "q": "Bu Anggun adalah seorang dosen mata kuliah pendidikan kewarganegaraan dan pancasila Universitas K. Hari itu, beliau membahas kasus radikalisme yang mengarah kepada tindak terorisme. Beliau menerangkan jika hal tersebut sangat tidak patut untuk ditiru karena merugikan bangsa sendiri. Bu anggun memiliki gagasan untuk mengadakan kajian terorisme yang bertujuan untuk menekan angka peningkatan paham tersebut. Menurut anda, kegiatan yang paling tepat untuk mengembangkan kajian tersebut adalah ….", "o": {"a": "Mengetahui terlebih dahulu apa saja yang dilakukan oleh teroris, lalu merumuskannya ke dalam satu kesimpulan dan ditindaklanjuti bersama dengan anggota tim", "b": "Merumuskan strategi nasional dalam penanganan terorisme", "c": "Mengundang salah satu narapidana atau mantan narapidana yang pernah ditangkap karena kasus terorisme dan merumuskan kajian tersebut dari informasinya", "d": "Menyusun kerangka sendiri berdasarkan informasi yang diterima dari seluruh pihak termasuk dengan mengundang dosen di universitas lain secara bersama untuk merumuskannya dari sisi teori dan pelaku terorisme dari sisi praktik", "e": "Mengambil indikator dari literatur yang sudah ada lalu mengembangkannya dalam bentuk kajian-kajian ilmiah yang tidak dapat dibantah sesuai dengan metodologi perhitungan yang dominan"}, "ans": "b", "ex": "Kajian terorisme ataupun radikalisme sangat efektif apabila dilakukan dengan merumuskan strategi nasional pencegahan radikalisme, memahami perkembangan konsep pencegahannya serta melakukan studi perbandingan penanganan kasus tersebut. Ketiga hal ini sangat efektif dilakukan menyesuaikan dengan bagaimana cara radikalisme itu berkembang menyusup di masyarakat yang dapat memaparkan siapa saja, termasuk kaum intelektual sekalipun", "sc": {"a": 2, "b": 5, "c": 4, "d": 3, "e": 1}}, {"n": 104, "sec": "TKP", "t": "", "q": "Sebagai administrator jaringan di sebuah perusahaan, Anda menerima laporan bahwa beberapa karyawan mengalami serangan ransomware yang mengenkripsi file-filenya. Setelah investigasi lebih lanjut, Anda menemukan bahwa serangan tersebut dimulai dari lampiran email yang terlihat sah. Tindakan pertama yang harus Anda ambil adalah...", "o": {"a": "Memutus sementara koneksi internet perusahaan untuk mencegah penyebaran lebih lanjut dari ransomware.", "b": "Mengisolasi sistem yang terinfeksi dan mencoba untuk mendekripsi file yang terkena dampak.", "c": "Memberikan peringatan kepada seluruh karyawan untuk tidak membuka email yang mencurigakan dan melaporkan insiden tersebut kepada pihak berwenang.", "d": "Mengidentifikasi sumber serangan dengan bekerja sama dengan penyedia layanan keamanan siber dan melacak pergerakan ransomware di jaringan.", "e": "Mengembalikan data dari backup yang aman dan memperbarui kebijakan keamanan email perusahaan untuk meminimalkan risiko serangan ransomware di masa depan."}, "ans": "a", "ex": "", "sc": {"a": 5, "b": 2, "c": 1, "d": 4, "e": 3}}, {"n": 105, "sec": "TKP", "t": "", "q": "Anda bekerja dalam sebuah tim pemasaran di perusahaan yang sedang mempersiapkan peluncuran produk baru. Sebagai anggota tim, setiap orang bertanggung jawab atas bagian pekerjaan masing- masing. Suatu hari sebelum presentasi peluncuran, Anda menyadari bahwa satu anggota tim tidak sepenuhnya mempersiapkan materi presentasi mereka, dan ini dapat berdampak negatif pada keseluruhan tim. Bagaimana Anda akan menanggapi situasi ini?", "o": {"a": "Mengabaikan dan membiarkan anggota tim tersebut mengatasi masalahnya sendiri.", "b": "Menjadi langsung konfrontatif dengan anggota tim tersebut dan menyampaikan kekecewaan Anda.", "c": "Mencoba memberikan bantuan atau saran kepada anggota tim tersebut secara pribadi.", "d": "Melaporkan masalah ini kepada atasan atau manajer tim tanpa memberitahu anggota tim terlebih dahulu.", "e": "Meningkatkan upaya Anda sendiri untuk menutupi kekurangan anggota tim dan memastikan presentasi berjalan dengan baik."}, "ans": "c", "ex": "Pilihan C menjadi pilihan terbaik dalam situasi ini karena mencerminkan sikap kolaboratif dan membantu anggota tim yang menghadapi masalah, sehingga dapat meningkatkan persiapan dan hasil presentasi secara keseluruhan.", "sc": {"a": 2, "b": 1, "c": 5, "d": 4, "e": 3}}, {"n": 106, "sec": "TKP", "t": "Pelayanan Publik", "q": "Anda adalah seorang petugas loket pengaduan di sebuah rumah sakit. Seorang pasien mengeluhkan bahwa antrean untuk mendapatkan pelayanan dokter spesialis sangat panjang. Sikap Anda adalah ....", "o": {"a": "Meminta pasien untuk bersabar karena jumlah pasien yang ingin berobat memang banyak", "b": "Menjelaskan bahwa jadwal dokter spesialis sudah padat dan menyarankan pasien untuk datang kembali di lain waktu", "c": "Memeriksa jadwal dokter spesialis, menawarkan alternatif waktu yang mungkin lebih cepat, dan menginformasikan prosedur pendaftaran yang benar", "d": "Mengarahkan pasien untuk menghubungi bagian pendaftaran untuk mendapatkan informasi lebih lanjut", "e": "Merasa bahwa sistem pendaftaran masih kurang efisien dan telah menjadi penyebab antrean panjang"}, "ans": "c", "ex": "Opsi C tepat, karena memberikan informasi yang akurat, solusi alternatif, dan panduan yang jelas.", "sc": {"a": 2, "b": 3, "c": 5, "d": 4, "e": 1}}, {"n": 107, "sec": "TKP", "t": "", "q": "Seorang rekan kerja mengajukan komplain ke atasan menuntut saya dipindahkan ke divisi lain. Dia mempermasalahkan masalah pribadi saya yang tidak ada kaitannya dengan pekerjaan. Sikap saya;", "o": {"a": "Mengikuti keputusan atasan.", "b": "Menjelaskan kepada atasan bahwa masalah pribadi tidak mempengaruhi kinerja saya.", "c": "Melakukan gugatan balik dan meminta atasan memindahkan rekan kerja ke divisi lain.", "d": "Menjaga jarak dengan rekan kerja.", "e": "Biasa saja dan tetap bekerja secara profesional."}, "ans": "e", "ex": "Ini adalah pendekatan yang paling bijaksana. Tetap fokus pada pekerjaan dan tetap profesional dapat membantu Anda mengatasi situasi ini tanpa menciptakan lebih banyak konflik.", "sc": {"a": 3, "b": 4, "c": 1, "d": 2, "e": 5}}, {"n": 108, "sec": "TKP", "t": "Anti-Radikalisme", "q": "Sebagai seorang kepala desa di wilayah yang rawan konflik antarsuku, Anda mengamati adanya peningkatan aktivitas kelompok yang memprovokasi perselisihan antarkomunitas. Anak-anak muda mulai terpengaruh oleh provokasi tersebut. Upaya Anda dalam mencegah eskalasi konflik adalah ....", "o": {"a": "Mengadakan pertemuan dengan tokoh masyarakat dan tokoh agama untuk membahas upaya pencegahan konflik", "b": "Mengusulkan program pembinaan pemuda yang berfokus pada persatuan, kerja sama, dan pemahaman antarbudaya", "c": "Menggunakan akun media sosial desa untuk mengedukasi warga tentang pentingnya menjaga kerukunan antarsuku", "d": "Membentuk kelompok kerja masyarakat yang bertugas memantau dan melaporkan potensi konflik antarwarga", "e": "Melaporkan situasi tersebut kepada pihak berwenang dan meminta mereka untuk meningkatkan pengamanan di desa"}, "ans": "b", "ex": "Mengusulkan program pembinaan pemuda yang fokus pada persatuan dan pemahaman antarbudaya adalah solusi jangka panjang yang dapat mengurangi risiko konflik di masa depan dengan memperkuat kerukunan dan toleransi antargenerasi muda.", "sc": {"a": 4, "b": 5, "c": 2, "d": 3, "e": 1}}, {"n": 109, "sec": "TKP", "t": "Jejaring Kerja", "q": "Saat sedang berkonsentrasi penuh dalam mengerjakan suatu proyek penting di kantor, salah satu rekan kerja Anda mendekati Anda untuk meminta bantuan. Ia sudah sangat sering meminta bantuan dan Anda akan menyanggupinya jika senggang. Kali ini, ia meminta tolong karena ia kesulitan memahami beberapa konsep yang terkait dengan tugasnya. Sikap Anda adalah ....", "o": {"a": "Dengan bahasa yang lembut menjelaskan kesibukan Anda dan menyarankannya untuk mencari rekan kerja lain yang mungkin lebih senggang", "b": "Segera membantunya dengan memberikan batasan waktu agar Anda bisa kembali bekerja pada proyek utama Anda", "c": "Memberi tahu bahwa sikapnya telah memberatkan orang lain dan menyarankannya untuk meningkatkan pemahamannya sendiri", "d": "Akan segera membantunya dengan membuat syarat bahwa ia akan bersedia membantu kerjaan Anda setelah urusannya selesai", "e": "Membantunya setelah Anda selesai mengerjakan tugas Anda terlebih dahulu"}, "ans": "e", "ex": "Proyek utama harus diselesaikan terlebih dahulu sebelum memberikan bantuan kepada rekan kerja yang meminta. Hal ini menunjukkan tanggung jawab terhadap pekerjaan utama sambil tetap bersedia memberikan bantuan kepada rekan kerja, sehingga menjaga keseimbangan antara kerja sama tim dan penyelesaian tugas individu yang mendesak.", "sc": {"a": 3, "b": 2, "c": 4, "d": 1, "e": 5}}, {"n": 110, "sec": "TKP", "t": "Anti-Radikalisme", "q": "Anda bekerja di sebuah kota kecil yang selama ini dikenal sebagai lingkungan yang aman dan damai. Namun, belakangan ini, muncul berita tentang peningkatan aktivitas kriminal di sekitar wilayah tersebut. Salah satu tetangga Anda yang sebelumnya tidak pernah terlibat dalam kegiatan mencurigakan tiba-tiba terlihat sering berinteraksi dengan orang-orang yang tidak dikenal. Beberapa warga pun melaporkan adanya kejadian mencurigakan di sekitar rumahnya. Sikap Anda adalah ....", "o": {"a": "Segera melapor ke pihak berwajib tentang aktivitas mencurigakan yang terjadi di lingkungan Anda untuk mencegah potensi tindakan kriminal", "b": "Berdiskusi dengan aparat desa atau pihak berwenang setempat untuk memberikan informasi dan mencari tahu apakah langkah-langkah keamanan dapat ditingkatkan", "c": "Mencoba menghubungi tetangga Anda secara langsung dan membicarakan perubahan perilaku mereka serta menanyakan apakah mereka memerlukan bantuan atau dukungan", "d": "Memilih untuk melanjutkan aktivitas sehari-hari dengan menganggap bahwa ada alasan tersembunyi di balik perubahan perilaku tetangga tersebut", "e": "Mengajak warga setempat untuk tidak terlalu khawatir dan menghindari melibatkan diri dalam urusan tetangga serta menganggap bahwa hal tersebut adalah masalah pribadi mereka"}, "ans": "c", "ex": "Opsi C mencerminkan sikap empatik dan proaktif. Dengan berbicara secara langsung, Anda dapat menciptakan ruang untuk membahas perubahan-perubahan yang terjadi, mengungkapkan kepedulian, dan menawarkan dukungan jika diperlukan. Pendekatan ini tidak hanya menciptakan komunikasi yang terbuka, tetapi juga dapat membantu memahami lebih baik konteks perubahan perilaku yang terjadi serta menjaga keamanan dan kenyamanan bersama di lingkungan tersebut.", "sc": {"a": 4, "b": 3, "c": 5, "d": 2, "e": 1}}]}, {"id": 2, "n": "Paket Soal 2", "qs": [{"n": 1, "sec": "TWK", "t": "", "q": "Cerita: \"Menggali Kekayaan Kuliner Nusantara” Di sebuah desa kecil yang jauh dari hiruk-pikuk perkotaan, hiduplah seorang ibu rumah tangga bernama Ibu Siti. Meskipun sederhana, Ibu Siti memiliki kegemaran yang unik, yaitu mengumpulkan resep-resep masakan tradisional Nusantara dari berbagai daerah. Ibu Siti menjalani kehidupan sehari-hari dengan penuh cinta dan semangat. Suaminya, Pak Ahmad, dan anak-anaknya selalu mendukung hobinya tersebut. Mereka merasakan kebahagiaan ketika menikmati hidangan-hidangan lezat hasil kreasi Ibu Siti. Tidak puas hanya berbagi kelezatan di dalam keluarga, Ibu Siti kemudian memutuskan untuk membuka warung makan kecil di pinggir desanya. Warungnya menyajikan aneka hidangan tradisional Nusantara, mulai dari nasi uduk Betawi hingga sate Padang. Ibu Siti berharap dapat memperkenalkan kekayaan kuliner Indonesia kepada lebih banyak orang. Warung Ibu Siti pun menjadi pusat kuliner di desanya. Bukan hanya warga setempat yang menikmati, tetapi juga wisatawan yang penasaran dengan kelezatan masakan khas Nusantara. Keberhasilan Ibu Siti membuktikan bahwa ketekunan, dukungan keluarga, dan cinta terhadap tradisi dapat membawa keberhasilan, sekaligus melestarikan kekayaan kuliner negeri ini. Nilai Moral pada cerita di atas adalah...", "o": {"a": "Kecemerlangan dalam teknik bermain catur.", "b": "Pentingnya menjaga dan melestarikan kekayaan kuliner tradisional.", "c": "Perlunya dukungan dan semangat keluarga.", "d": "Arti penting memiliki rival dalam mencapai tujuan.", "e": "Kebutuhan akan strategi yang unik dalam bermain catur."}, "ans": "b", "ex": "Cerita ini menyoroti nilai moral tentang keberhasilan Ibu Siti dalam melestarikan kekayaan kuliner tradisional Nusantara. Ibu Siti mampu menggali dan memperkenalkan kelezatan masakan khas Indonesia kepada lebih banyak orang, sehingga dapat dinikmati oleh generasi mendatang. Ini m
